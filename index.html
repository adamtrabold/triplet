    /* The press frame itself still changes only ink, field and the pop --
       the text column's own final width/truncation is a FLIP concern now
       (flipVisitToFinal()), not a mid-drag reservation. */
    .location-card.vs-live .delete-btn { transition: opacity 80ms linear; }
    .location-card.vs-xhide .delete-btn { opacity: 0; pointer-events: none; }
    /* S2: touch presses are delayed 80ms (createCard()), so the bare
       :active pseudo-class must not paint the press instantly. */
    .location-card:not(.highlighted):not(.active):active { background: var(--paper); }
    .location-card.is-visited:not(.highlighted):not(.active):active { background: var(--paper-filed); }

    .sg-star {
      position: absolute;
      width: var(--s3);                    /* 12 = .row-star */
      height: var(--s3);
      overflow: visible;
      pointer-events: none;
    }
    /* Graphite: --ink-2 through a grain filter (feTurbulence alpha
       speckle + a 0.35px displacement wobble) with a pressure taper per
       stroke. Ink: the approved printed star, --figure-deep. */
    /* The sketch leans -7deg, as a hand does; the ink lands upright over
       it. The lean also keeps a half-drawn star (a Λ, then a Λ with a
       crossbar) from sitting on the type's baseline and reading as a letter. */
    .sg-star .sg-pencil { color: var(--ink-2); fill: currentColor;
                      transform-box: fill-box; transform-origin: 50% 55%; transform: rotate(-12deg); }
    .sg-star .sg-ink { color: var(--star); fill: currentColor; stroke: var(--star-deep); stroke-width: 1.5px; paint-order: stroke; stroke-linejoin: round; opacity: 0;
                   transform-box: fill-box; transform-origin: 50% 55%; }
    .sg-spread { opacity: 0; transform-box: fill-box; transform-origin: 50% 55%; }
    .sg-smudge, .sg-ghost { fill: var(--ink-2); }
    .sg-inkg { opacity: 0; }
    .sg-star.inked .sg-ink { opacity: 1; }
    /* Round 5: the COMMIT is shown by PRESSURE, not speed. Before 56px the
       sketch is light graphite (85%); the frame the finger crosses 56 every
       stroke -- drawn and still to come -- goes over harder: ~1.4x wider
       (a 0.7-unit stroke on the capsule), full opacity, darker graphite
       and denser grain. Backed off before 56, it goes light again. */
    .sg-star .sg-pencil { opacity: 0.85; }
    .sg-star.sg-press .sg-pencil { opacity: 1; color: color-mix(in srgb, var(--ink-2) 55%, var(--ink)); stroke: currentColor; stroke-width: 0.7; stroke-linejoin: round; }
    .location-card.highlighted .sg-star.sg-press .sg-pencil { color: var(--paper); }
    .sg-star.inked .sg-pencil { opacity: 0; }
    .sg-crumb {
      position: absolute; width: 1.5px; height: 1.5px; border-radius: 1px;
      background: var(--ink-2); pointer-events: none;
    }
    .location-card.highlighted .sg-pencil { color: var(--paper); }
    .location-card.highlighted .sg-ink { color: var(--star); stroke: none; }   /* the landed ink is the row's orange star */
    .location-card.highlighted .sg-smudge,
    .location-card.highlighted .sg-ghost { fill: var(--paper); }
    .location-card.highlighted .sg-crumb { background: var(--paper); }

    /* Popup (owner: "it probably shouldn't be drawn in the card since the
       outline is already there... just the fade/pop"). Star: the fill fades
       into the outline over 100ms while the whole star plays the row's
       spin-stamp (STAR_POP's table and easings, 380ms from the tap). The
       outline goes on the frame the fill is full -- under full ink, mid-spin.
       Unstar: the fill fades off the outline over 240ms while the star lifts
       with the row's erase pop (1.12x, no twist) -- no rub, no dust. Both
       once per tap (popupInkId / popupRubId); the rest state is the plain
       glyph, same pixels. Reduced motion: no scale, no rotation -- the state
       just lands. */
    .popup-star .sgp { overflow: visible; }
    .popup-star .sgp .sg-ink { transform-box: fill-box; transform-origin: 50% 55%; }
    .popup-star .sgp-in .sg-ink  { animation: sgpPress 380ms linear; }
    .popup-star .sgp-in .sgp-fill { animation: sgpOn 100ms linear backwards; }
    .popup-star .sgp-in .sgp-hollow { animation: sgpOff 1ms linear 100ms forwards; }
    .popup-star .sgp-out .sg-ink { animation: sgpLift 240ms linear; }
    .popup-star .sgp-out .sgp-fill { animation: sgpOff 240ms cubic-bezier(.4,0,.6,1) forwards; }   /* the ink that fades is the orange that was there (.tag-star-anim) */
    .popup-star .tag-star-anim .sgp-hollow { color: var(--ink); stroke: none; }
    @keyframes sgpOff    { to { opacity: 0; } }
    @keyframes sgpOn     { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sgpPress  { 0% { transform: rotate(-20deg) scale(1); animation-timing-function: cubic-bezier(.2,.9,.3,1); } 34% { transform: rotate(6deg) scale(1.4); animation-timing-function: cubic-bezier(.6,0,.85,.45); } 65% { transform: rotate(-2deg) scale(0.95); animation-timing-function: cubic-bezier(.4,0,.3,1); } 100% { transform: rotate(0deg) scale(1); } }
    @keyframes sgpLift   { 0% { transform: scale(1); animation-timing-function: cubic-bezier(.2,.9,.3,1); } 35% { transform: scale(1.12); animation-timing-function: cubic-bezier(.5,0,.4,1); } 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .popup-star .sgp .sg-ink,
      .popup-star .sgp .sgp-fill { animation: none; }
      .popup-star .sgp-in .sgp-hollow { animation: none; opacity: 0; }
      .popup-star .sgp-out .sgp-fill { animation: none; opacity: 0; }
    }
  </style>

  <div id="error" role="alert" tabindex="0" title="Tap to dismiss" aria-keyshortcuts="Enter Escape">
    <p id="errorText"></p>
  </div>

  <div id="authStatus">
    <span class="status-dot"></span>
    <span id="authUserEmail"></span>
    <button id="logoutBtn">Sign out</button>
  </div>

  <!-- The sign-in sheet: one markup, three forms (showAuthModal(origin)); the words are set there. -->
  <div id="authModal">
    <div id="authModalContent" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
      <div id="authModalHead">
        <h2 id="authModalTitle">Sign in</h2>
      </div>
      <div id="authModalBody">
        <p id="authModalLine">You need to sign in to make changes. Anyone can view places and plans.</p>
        <input type="email" id="authEmailInput" placeholder="Email" autocomplete="email">
        <input type="password" id="authPasswordInput" placeholder="Password" autocomplete="current-password">
        <button id="loginBtn">Sign in</button>
        <button id="cancelAuthBtn" class="secondary">Cancel</button>
        <p id="authError" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <!-- One slot, two states (design/signin-button/handoff.md): signed out the sign-in badge,
       signed in the account badge. setAccountBadge() owns its content, classes and name; it stays
       hidden (no .show) while a stored session is still being confirmed. -->
  <button id="accountBtn" aria-label="Account" aria-haspopup="true" aria-expanded="false">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
  </button>
  <!-- Its keyboard focus ring: a sibling (the button's mask would clip a ring drawn on it), shown
       by #accountBtn:focus-visible + #accountFocus. Must stay directly after #accountBtn. -->
  <div id="accountFocus" aria-hidden="true">
    <svg width="50" height="50" viewBox="0 0 50 50"><g transform="translate(25 25) scale(1.16) translate(-25 -25)">
      <polygon class="ring-halo"/><polygon class="ring-ink"/>
    </g></svg>
  </div>

  <div id="accountDropdown">
    <div class="user-email" id="dropdownUserEmail"></div>
    <button id="dropdownLogoutBtn">Sign out</button>
  </div>

  <!-- The add badge (bottom-left, rides the sheet's edge). An SVG, not a text character:
       `line-height: 0` on a 1.75rem "+" was doing optical-centering work that breaks across
       platforms. The + is the icon system's (#i-plus, THE-SYSTEM.md "Line marks"): 14px across,
       a 2px stroke, in its own 28 box, 1:1. The same string as setAddBtnGlyph(), so the first
       paint matches. -->
  <button id="floatingAddBtn" aria-label="Add a place" aria-expanded="false" aria-controls="addForm">
    <svg class="sys-plus" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg>
  </button>
  <!-- Its keyboard focus ring: a sibling (the button's mask would clip a ring drawn on it), shown
       by #floatingAddBtn:focus-visible + #addFocus. Must stay directly after #floatingAddBtn. -->
  <div id="addFocus" aria-hidden="true">
    <svg width="60" height="60" viewBox="0 0 60 60"><g transform="translate(30 30) scale(1.16) translate(-30 -30)">

  <script>
    const SUPABASE_URL = 'https://jgvckilmltimabfdvaly.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_TiO_hACvlsn4mfFazsHTlg_i9BnzCfr';

    // Initialize Supabase client with auth support
    const { createClient } = supabase;
    // PLAYGROUND: signed out, the app is a playground (owner: "play
    // shouldn't live at its own url -- it should be the experience pre-sign
    // in"). Each table is read once from the real database, then every read
    // and write runs against that in-memory copy -- nothing is ever written
    // back, and a reload starts fresh. Signed out there is no session, so a
    // stray write would go out anonymous and RLS would refuse it. The mode is
    // fixed at boot from supabase-js's stored session (its default storage
    // key); signing in or out reloads into the other mode.
    const AUTH_STORAGE_KEY = 'sb-' + new URL(SUPABASE_URL).hostname.split('.')[0] + '-auth-token';
    const PLAYGROUND = (() => { try { return !localStorage.getItem(AUTH_STORAGE_KEY); } catch (e) { return true; } })();
    const realSupabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
    const supabaseClient = PLAYGROUND ? createPlaygroundClient(realSupabaseClient) : realSupabaseClient;
    // A sign-in in another tab reaches this one too (supabase-js broadcasts it): boot again as the real app.
    // This tab's own sign-in (login() in flight) reloads itself, after writing the hop marker; and
    // with no session stored (storage blocked) a reload would only boot the playground again.
    if (PLAYGROUND) realSupabaseClient.auth.onAuthStateChange(event => { if (event === 'SIGNED_IN' && !loginInFlight && sessionStored()) location.reload(); });

    // Mimics the slice of supabase-js the app uses: from(t).select/insert/
    // update/upsert/delete with order/eq/in, awaited for { data, error };
    // auth answers as a signed-in guest so every control works.
    function createPlaygroundClient(real) {
      const tables = {};   // name -> Promise<{ rows } | { error }>
      const load = name => tables[name] || (tables[name] = real.from(name).select('*')
        .then(({ data, error }) => error ? (delete tables[name], { error }) : { rows: data || [] }));
      const clone = v => JSON.parse(JSON.stringify(v));
      const newId = rows => rows.length && rows.every(r => typeof r.id === 'number')
        ? Math.max(...rows.map(r => r.id)) + 1
        : (crypto.randomUUID ? crypto.randomUUID() : 'pg-' + Date.now() + '-' + Math.random().toString(16).slice(2));
      const pick = (row, cols) => {
        if (!cols || cols.trim() === '*') return row;
        const out = {};
        cols.split(',').map(c => c.trim()).filter(Boolean).forEach(c => { out[c] = c in row ? row[c] : null; });
        return out;
      };
      function query(name) {
        const q = { op: 'select', cols: '*', payload: null, filters: [], order: null };
        const matches = r => q.filters.every(f => f(r));
        async function run() {
          const t = await load(name);
          if (t.error) return { data: null, error: t.error };
          const rows = t.rows;
          const now = new Date().toISOString();
          if (q.op === 'select') {
            let out = rows.filter(matches);
            if (q.order) {
              const { col, asc } = q.order;
              out = out.slice().sort((a, b) => (a[col] < b[col] ? -1 : a[col] > b[col] ? 1 : 0) * (asc ? 1 : -1));
            }
            return { data: clone(out.map(r => pick(r, q.cols))), error: null };
          }
          if (q.op === 'insert' || q.op === 'upsert') {
            clone(q.payload).forEach(row => {
              const i = q.op === 'upsert' && row.id != null ? rows.findIndex(r => r.id === row.id) : -1;
              if (i >= 0) { Object.assign(rows[i], row); return; }
              rows.push({ created_at: now, ...row, id: row.id != null ? row.id : newId(rows) });
            });
          } else if (q.op === 'update') {
            rows.filter(matches).forEach(r => Object.assign(r, clone(q.payload)));
          } else if (q.op === 'delete') {
            t.rows = rows.filter(r => !matches(r));
          }
          return { data: null, error: null };
        }
        const api = {
          select(cols) { q.cols = cols || '*'; return api; },
          insert(rows) { q.op = 'insert'; q.payload = rows; return api; },
          upsert(rows) { q.op = 'upsert'; q.payload = Array.isArray(rows) ? rows : [rows]; return api; },
          update(patch) { q.op = 'update'; q.payload = patch; return api; },
          delete() { q.op = 'delete'; return api; },
          eq(col, v) { q.filters.push(r => r[col] === v); return api; },
          in(col, vs) { q.filters.push(r => vs.includes(r[col])); return api; },
          order(col, opts) { q.order = { col, asc: !opts || opts.ascending !== false }; return api; },
          then(res, rej) { return run().then(res, rej); }
        };
        return api;
      }
      const guest = { id: 'playground', email: 'Playground' };
      return {
        from: query,
        auth: {
          getSession: async () => ({ data: { session: { user: guest } }, error: null }),
          signInWithPassword: creds => real.auth.signInWithPassword(creds),   // the real sign-in; login() then reloads into the real app
          signOut: async () => ({ error: null }),
          onAuthStateChange: () => ({ data: { subscription: { unsubscribe() {} } } })
        }
      };
    }

    let currentUser = null;

    // =========================================================================
    // CATEGORY INKS  (sourced from the WPA park-poster series: Zion
    // rust/slate/gold/olive, Bryce plum/lavender, Yellowstone teal)
    //
    // These are GLYPH / FILL / RULE colours only. They are never text --
    // every category LABEL renders in --ink-2. That is not a stylistic
    // preference, it is forced: requiring all 13 to clear 4.5:1 on --paper
    // caps luminance at 0.147, which collapses the value ladder that stops
    // the palette reading as one mush. (The old palette failed exactly that
    // way: bar/area were ~1 degree apart in hue at near-identical value.)
    //
    // Separation rule (since the 2026-10-07 re-inks; re-checked 2026-10-30 for the
    // categories migration): every ink is >= 3:1 against --paper so a glyph,
    // chip dot or marker rim reads as a non-text UI component (WCAG 1.4.11),
    // and every PAIR is >= ~13 apart in CIEDE2000 (closest pair cafe/street
    // 13.2; the four 2026-10-30 inks are each >= 14.8 from every other ink and
    // >= 34.8 from --star / --star-deep). The older 55-pair value/hue ladder no
    // longer describes the palette (it already failed restaurant/cafe and
    // restaurant/street) and is retired.
    // Source: design/icon-system/categories-design-calls.md (branch
    // claude/elegant-galileo-1c5ntm).
    //
    // The star (--figure, keyline --figure-deep) is the orange family now;
    // no category sits in it (restaurant ΔE >= 32, attraction >= 35 from the
    // star; orange-figure.json -- its #EE7434 row is the brand orange).
    // =========================================================================
    // Key order = the locked list's order (design/icon-system/categories.md), shapes last:
    // the chips, the category sort (categoryRank()) and the add tag's TYPE menu all read it.
    const CATEGORY_COLORS = {
      restaurant:   '#7A2436',   // wine (2026-10-07; was burnt orange #AC5019 -- orange is the star now) 8.30:1
      cafe:         '#6E4C22',   // Zion olive-brown          6.51:1  H  33.2  S .528
      bar:          '#3D5A7A',   // McKinley blue             6.02:1  H 211.5  S .333
      venue:        '#AF4B82',   // Bryce sunset rose         4.26:1  (2026-10-30)
      museum:       '#523875',   // Grand Canyon dusk violet  8.12:1  (2026-10-30)
      landmark:     '#4889A8',   // Crater Lake blue          3.27:1  (2026-10-30)
      attraction:   '#547326',   // moss, park-poster foliage (2026-10-07; was gold #A68018, too close to the star) 4.59:1
      park:         '#3F925B',   // Yosemite meadow green     3.23:1  (2026-10-30)
      nature:       '#1E3A2B',   // Yellowstone spruce       10.44:1  H 147.9  S .318
      shopping:     '#8A7AA8',   // Bryce lavender            3.26:1  H 260.9  S .209
      hotel:        '#2E2433',   // Bryce deep plum          12.50:1  H 280.0  S .172
      neighborhood: '#328177',   // Yellowstone teal          3.90:1  H 172.4  S .441  (was `district`)
      street:       '#5E2C17'    // Zion deep rust            9.58:1  H  17.7  S .607
    };
    // The one label map: chips, row meta, the tag's TYPE stamp and the add tag's TYPE menu.
    const CATEGORY_LABELS = {
      restaurant: 'Restaurant', cafe: 'Café', bar: 'Bar', venue: 'Venue', museum: 'Museum',
      landmark: 'Landmark', attraction: 'Attraction', park: 'Park', nature: 'Nature',
      shopping: 'Shopping', hotel: 'Hotel', neighborhood: 'Neighborhood', street: 'Street'
    };
    // An unknown key isn't a category: the label grey (= --ink-2; markers need a literal) + the dot.
    const CATEGORY_FALLBACK_INK = '#5A564C';
    const isCategory = c => Object.prototype.hasOwnProperty.call(CATEGORY_COLORS, c);
    const categoryLabel = c => CATEGORY_LABELS[c] || String(c || '');
    const categoryGlyphId = c => isCategory(c) ? c : 'dot';

    // (The per-city accent -- CITY_PALETTES / applyCityPalette() -- was
    // removed 2026-10-07: "cities shouldn't have their own color". The
    // accent is the fixed --figure / --figure-deep in :root.)
    
    // `countrycodes` is Nominatim's HARD filter -- results outside these countries
    // are not returned at all. It is a comma-separated list, deliberately, so that
    // contiguous cross-border travel areas (Copenhagen/Malmo) stay searchable.
    // `viewbox` is Nominatim's SOFT ranking hint (lonMin,latMin,lonMax,latMax) --
    // it biases ordering, it does not exclude. It is a geocoding hint ONLY; map
    // framing comes from the declared center/zoom, or from fitVisible().
    const CITIES = {
      la:         { label: 'LA',         center: [34.0522, -118.2437], zoom: 11,
                    geocodeSuffix: 'Los Angeles, CA', countrycodes: 'us',
                    viewbox: '-118.668,33.704,-118.155,34.337' },
      reykjavik:  { label: 'Reykjavík',  center: [64.1466,  -21.9426], zoom: 11,
                    geocodeSuffix: 'Iceland',         countrycodes: 'is',
                    viewbox: '-22.700,63.900,-21.200,64.300' },
      copenhagen: { label: 'Copenhagen', center: [55.6761,   12.5683], zoom: 12,
                    geocodeSuffix: 'København',       countrycodes: 'dk,se',
                    viewbox: '12.450,55.610,12.700,55.750' },
      malmo:      { label: 'Malmö',      center: [55.6050,   13.0038], zoom: 12,
                    geocodeSuffix: 'Malmö',           countrycodes: 'se,dk',
                    viewbox: '12.900,55.530,13.120,55.650' },
      stockholm:  { label: 'Stockholm',  center: [59.3293,   18.0686], zoom: 11,
                    geocodeSuffix: 'Stockholm',       countrycodes: 'se',
                    viewbox: '17.850,59.250,18.220,59.420' }
    };

    // Captured before fetchCities() ever merges runtime rows in -- the
    // permanent, never-delete set for cleanupOrphanCities().
    const SEED_CITY_IDS = new Set(Object.keys(CITIES));

    const DEFAULT_CITY = 'la';
    const ALL_CITIES   = '__all__';   // explicit, persisted sentinel for "all cities"
    const CITY_STORAGE_KEY = 'triplet.citySelection';

    let citySelection = DEFAULT_CITY; // 'la' | … | ALL_CITIES — what the selector shows
    let activeCity    = DEFAULT_CITY; // ALWAYS a real CITIES key — authoring/viewport context

    let map;
    let userLocationMarker = null;
    let locations = [];
    let neighborhoodShapes = [];
    // The category chips. Cities are never a filter (add-tag-jam phase 1: "go to" and "hide"
    // came apart): going to a city only moves the map and scrolls the list; hiddenCities hides.
    let filters = { categories: {} };
    // Per viewer (localStorage HIDDEN_CITIES_KEY): the city ids whose places are folded away in
    // the list and off the map. Empty = none hidden. A plan's stops always show, hidden or not.
    const HIDDEN_CITIES_KEY = 'triplet.hiddenCities';
    let hiddenCities = new Set();
    let placesLoaded = false;   // the boot read has landed (places, shapes, cities, plans)
    Object.keys(CATEGORY_COLORS).forEach(cat => filters.categories[cat] = true);

    // ---- reconciler state (Phase 0) -----------------------------------------
    const markersById = new Map();   // id → { marker, signature, loc }
    const clusterMarkersById = new Map();   // stable cluster id → L.Marker, present only while visible
    const cardsById   = new Map();   // id → { el, signature }
    const shapeCardsById = new Map();   // id → { el, signature } -- neighborhood_shapes' list-panel counterpart to cardsById
    let highlightedId = null;
    let lastPayloadDigest = null;

    // ---- neighborhood shape state (Phase 3) ----------------------------------
    // Presence-tracking only, not a signature diff: shapes are added rarely
    // (through the add-shape flow below) and never edited in place, so there
    // is no churn here for a full reconciler to protect against.
    const neighborhoodLayersById = new Map();   // id → L.Layer, present only while visible
    const shapeStarMarkersById = new Map();     // id → L.Marker: a starred shape's map star (syncNeighborhoodLayers)
    const shapeVisitMarkersById = new Map();    // id → { marker, sig }: a visited shape's sticker (syncShapeStars)

    // ---- shapes in the row / popup / flag machinery ----------------------------
    // Owner (2026-10-02): "Every category should have the same information and
    // capabilities." A district/street row is the same row as a pin's (createCard /
    // renderCard, the Pencil Star, the visit stamp, the popup), so that machinery
    // addresses every row by ONE key: a pin's uuid, or 'shape:<id>' for a shape
    // (shape ids are numbers). A row item is a pin as-is, or a shape dressed as one
    // (shapeRowItem): name = label, category = type, notes = note, lat/lng = its
    // centroid (the Nearest distance, as sortShapes() orders it), dir = the point
    // Get Directions and its map star use (shapeAnchor()).
    const SHAPE_KEY = 'shape:';
    const shapeKey = id => SHAPE_KEY + id;
    const isShapeKey = k => typeof k === 'string' && k.startsWith(SHAPE_KEY);
    const shapeIdOf = k => Number(String(k).slice(SHAPE_KEY.length));
    function shapeRowItem(nb) {
      const c = shapeCentroid(nb) || [0, 0];
      return { ...nb, id: shapeKey(nb.id), shapeId: nb.id, name: nb.label, category: nb.type, notes: nb.note, address: null,
        lat: c[0], lng: c[1], dir: shapeAnchor(nb), visited: !!nb.visited, starred: !!nb.starred };
    }
    function rowItem(key) {
      if (isShapeKey(key)) { const nb = neighborhoodShapes.find(n => n.id === shapeIdOf(key)); return nb ? shapeRowItem(nb) : null; }
      return locations.find(l => l.id === key) || null;
    }
    function rowKey(el) {
      const s = el && el.getAttribute && el.getAttribute('data-shape-id');
      return s != null ? shapeKey(s) : (el && el.getAttribute ? el.getAttribute('data-id') : null);
    }
    function rowEntry(key) { return isShapeKey(key) ? shapeCardsById.get(shapeIdOf(key)) : cardsById.get(key); }
    // A point ON the shape, for Get Directions and the map star: a street's middle
    // vertex; a district's vertex centroid when it lies inside the outline, else the
    // vertex nearest to it (a concave or ring-shaped district).
    function shapeAnchor(nb) {
      const g = nb.geometry || [];
      if (!g.length) return null;
      if (nb.type === 'street') {
        // halfway along its length (a 2-vertex street's middle vertex would be an end)
        const k = Math.cos(g[0][0] * Math.PI / 180), seg = [];
        let total = 0;
        for (let i = 1; i < g.length; i++) { const d = Math.hypot(g[i][0] - g[i - 1][0], (g[i][1] - g[i - 1][1]) * k); seg.push(d); total += d; }
        let left = total / 2;
        for (let i = 0; i < seg.length; i++) {
          if (left <= seg[i] && seg[i] > 0) { const t = left / seg[i]; return [g[i][0] + (g[i + 1][0] - g[i][0]) * t, g[i][1] + (g[i + 1][1] - g[i][1]) * t]; }
          left -= seg[i];
        }
        return g[g.length - 1];
      }
      const c = shapeCentroid(nb);
      let inside = false;
      for (let i = 0, j = g.length - 1; i < g.length; j = i++) {
        const [yi, xi] = g[i], [yj, xj] = g[j];
        if ((yi > c[0]) !== (yj > c[0]) && c[1] < (xj - xi) * (c[0] - yi) / (yj - yi) + xi) inside = !inside;
      }
      if (inside) return c;

      const m = badgeMotion = { kind: 'hold' };
      m.timer = setTimeout(finishArrival, ARRIVAL.CAP_MS);
      bootLoadDone.then(() => setTimeout(() => { if (badgeMotion === m) playStrike(); }, ARRIVAL.BEAT_MS));
    }
    // A tap during the hold or the Strike (it means "account", and it's true), or the cap: one frame.
    function finishArrival() {
      if (!badgeMotion || badgeMotion.kind === 'dry') return;
      stopBadgeMotion();
      setAccountBadge('account', true);
    }

    // ---- the dry-up: signing out ----
    function playDryUp(done) {
      stopBadgeMotion();
      const b = accountBtnEl(), m = badgeMotion = { kind: 'dry' };
      // The first frame: the signed-out drawing under a full ink layer (k = 0) -- nothing visibly changes.
      b.classList.add('swap', 'signin');
      b.innerHTML = signinBadgeSvg({ t: 1, dry: 0 });
      m.anim = b.animate(null, { duration: DRY.MS });   // the clock
      const tick = () => {
        if (badgeMotion !== m) return;
        const ms = m.anim.currentTime == null ? 0 : m.anim.currentTime;
        if (m.anim.playState === 'finished' || ms >= DRY.MS) {
          stopBadgeMotion();
          setAccountBadge('signin', true);   // label, popup role and the plain badge together
          done(); return;
        }
        const s = Math.min(1, Math.max(0, (ms - DRY.SNAP_FROM) / (DRY.MS - DRY.SNAP_FROM)));
        const k = (1 - DRY.SNAP_GAIN) * dryEaseThr(Math.min(1, ms / DRY.THR_MS)) + DRY.SNAP_GAIN * s * s;
        b.innerHTML = signinBadgeSvg({ t: 1 - k, dry: k });
        m.raf = requestAnimationFrame(tick);
      };
      tick();
    }
    // The dropdown's close (orange -> navy, today's 150ms) finishes first: a dry-up that started on a
    // half-orange face would jump colour on its first frame.
    function afterBadgeSettles(fn) {
      const b = accountBtnEl(); let done = false, timer = 0;
      const go = () => { if (done) return; done = true; b.removeEventListener('transitionend', onEnd); clearTimeout(timer); fn(); };
      const onEnd = e => { if (e.target === b && e.propertyName === 'background-color') go(); };
      b.addEventListener('transitionend', onEnd);
      timer = setTimeout(go, ACCOUNT_BTN_FADE_MS);
    }

    // ---- land where you were (job 8): the hop marker carries the view both ways ----
    function writeAuthHop(dir) {
      try {
        let view = null;
        if (map) {
          const c = map.getCenter(), p = tagOpenNow() ? map._popup.getLatLng() : null;
          view = { lat: c.lat, lng: c.lng, zoom: map.getZoom(), tag: openTagKey(), at: p ? [p.lat, p.lng] : null };
        }
        sessionStorage.setItem(AUTH_HOP_KEY, JSON.stringify({ dir, view }));
      } catch (e) { /* no marker: no Strike, the default view */ }
    }
    function clearAuthHop() { try { sessionStorage.removeItem(AUTH_HOP_KEY); } catch (e) {} }
    // After the boot load: the view without animation, then the tag through the normal open path.
    // A place that doesn't exist in this mode's data (added in the playground) just isn't reopened.
    function restoreHopView(view) {
      if (!view || !map || !isFinite(view.lat) || !isFinite(view.lng) || !isFinite(view.zoom)) return;
      map.setView([view.lat, view.lng], view.zoom, { animate: false });
      syncMarkerGlyphZoom();
      syncNeighborhoodLayers();
      if (view.tag == null || !rowItem(view.tag)) return;
      // The normal open path (openPopupOnArrival(), as a list tap): a pin opens only once it is solo
      // (at the saved zoom if it is solo there, else SOLO_MIN_ZOOM), a shape once its layer exists (its min zoom). Already there (the usual case:
      // the tag was open at this view) it opens at once; otherwise the map steps in, without animation.
      if (isShapeKey(view.tag)) {
        const sid = shapeIdOf(view.tag), nb = neighborhoodShapes.find(n => n.id === sid);
        if (!nb) return;
        const center = view.at ? L.latLng(view.at) : L.latLngBounds(nb.geometry).getCenter();
        const zoom = Math.max(map.getZoom(), neighborhoodMinZoom(nb));
        openPopupOnArrival(center, zoom, () => neighborhoodLayersById.get(sid), () => map.setView(center, zoom, { animate: false }));
      } else {
        const loc = locations.find(l => l.id === view.tag);
        if (!loc) return;
        const center = [loc.lat, loc.lng];
        // Land on the same spot: keep the saved zoom when the pin is on its own there (a tag can be
        // open below SOLO_MIN_ZOOM on a pin with no neighbours); step in only when it could cluster.
        // "On its own" must survive the tag's own pan: the cluster grid is pixel-aligned, so a pin that
        // is solo in this exact view can join a neighbour's cell once the map moves. So: no other
        // listed place within one cell (clusterCellPxForZoom()) on either axis, which no pan can merge.
        const z = map.getZoom(), p = map.project(center, z), cell = clusterCellPxForZoom(z);
        const solo = z >= SOLO_MIN_ZOOM || !visibleLocations().some(o => {
          if (o.id === loc.id) return false;
          const q = map.project([o.lat, o.lng], z);
          return Math.abs(q.x - p.x) < cell && Math.abs(q.y - p.y) < cell;
        });
        openPopupOnArrival(center, solo ? map.getZoom() : SOLO_MIN_ZOOM,
          () => { const en = markersById.get(loc.id); return en && en.marker; },
          () => focusMap(center, { atLeast: SOLO_MIN_ZOOM }, { animate: false }));
      }
    }

    // Auth functions
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      currentUser = session?.user || null;
      updateAuthUI();
      return currentUser !== null;
    }

    function updateAuthUI() {
      const dropdownUserEmail = document.getElementById('dropdownUserEmail');

      if (typeof refreshTags === 'function' && map) refreshTags();
      // Signed out shows the sign-in badge, everywhere: the playground (its guest user is only
      // there so every control works), or real mode with no user. No dropdown while signed out.
      if (PLAYGROUND || !currentUser) {
        dropdownUserEmail.textContent = '';
        hideAccountDropdown();
        if (!badgeMotion) setAccountBadge('signin');
        return;
      }
      dropdownUserEmail.textContent = currentUser.email;
      if (loginInFlight || badgeMotion) return;   // the in-place sign-in / the arrival ends on the account badge itself
      if (arrivalPending) { arrivalPending = false; startArrival(); return; }
      setAccountBadge('account');
    }

    function setAccountExpanded(open) {
      const b = accountBtnEl();
      if (accountBadge === 'account') b.setAttribute('aria-expanded', String(open));
    }

    function toggleAccountDropdown() {
      const dropdown = document.getElementById('accountDropdown');
      const open = !dropdown.classList.contains('show');
      dropdown.classList.toggle('show', open);
      accountBtnEl().classList.toggle('active', open);
      setAccountExpanded(open);
    }

    function hideAccountDropdown() {
      const dropdown = document.getElementById('accountDropdown');
      dropdown.classList.remove('show');
      accountBtnEl().classList.remove('active');
      setAccountExpanded(false);
    }

    // The badge: signed out it opens the sheet; signed in, the dropdown. A tap during the arrival
    // finishes it at once and acts as the account badge; during sign-out it's ignored.
    function onAccountBtnClick() {
      if (signOutInFlight || (badgeMotion && badgeMotion.kind === 'dry')) return;
      if (badgeMotion) { finishArrival(); toggleAccountDropdown(); return; }
      if (accountBadge === 'signin') { showAuthModal(PLAYGROUND ? 'play' : 'badge'); return; }
      toggleAccountDropdown();
    }

    // ---- the sign-in sheet ----
    // origin: 'play' (the playground's badge), 'badge' (real mode's badge: no line), 'edit' (an
    // edit or the tag's slip while signed out). Only its words change; its look is today's.
    function showAuthModal(origin = 'edit') {
      if (PLAYGROUND) origin = 'play';
      const line = document.getElementById('authModalLine');
      line.textContent = origin in SHEET_LINE ? SHEET_LINE[origin] : SHEET_LINE.edit;
      line.hidden = !line.textContent;
      document.getElementById('cancelAuthBtn').textContent = origin === 'play' ? 'Keep playing' : 'Cancel';
      authReturnFocus = origin === 'edit' ? document.activeElement : accountBtnEl();
      hideAuthError();
      document.getElementById('authModal').classList.add('show');
      document.getElementById('authEmailInput').focus();   // iOS can offer saved passwords
    }

    // Back out: Cancel / Keep playing, the scrim, or Esc -- never while a request is out (a success
    // reloads anyway, so offering to back out then would be a lie). The fields are cleared; focus
    // goes back where it came from.
    function hideAuthModal() {
      if (loginInFlight) return;
      const modal = document.getElementById('authModal');
      const wasOpen = modal.classList.contains('show');
      modal.classList.remove('show');
      document.getElementById('authEmailInput').value = '';
      document.getElementById('authPasswordInput').value = '';
      hideAuthError();
      const f = authReturnFocus; authReturnFocus = null;
      if (wasOpen && f && f.isConnected && f !== document.body && typeof f.focus === 'function') f.focus({ preventScroll: true });
    }

    function showAuthError(msg) {
      const e = document.getElementById('authError');
      e.textContent = msg;
    }
    function hideAuthError() {
      const e = document.getElementById('authError');
      e.textContent = '';
    }

    // Busy: "Signing in...", both buttons off, the fields read-only (the focused one blurred, so its
    // focus underline goes); ending busy returns everything to rest in one frame.
    function setSignInBusy(on) {
      loginInFlight = on;
      const btn = document.getElementById('loginBtn'), email = document.getElementById('authEmailInput'), pw = document.getElementById('authPasswordInput');
      document.getElementById('authModalContent').classList.toggle('busy', on);
      btn.disabled = on; document.getElementById('cancelAuthBtn').disabled = on;
      btn.textContent = on ? 'Signing in…' : 'Sign in';
      email.readOnly = pw.readOnly = on;
      if (on && (document.activeElement === email || document.activeElement === pw)) document.activeElement.blur();
    }

    // Plain words, never the raw server message.
    function signInErrorText(res) {
      if (res.timedOut) return SIGNIN_ERR.OFFLINE;
      const e = res.error || {}, msg = String(e.message || ''), st = e.status;
      if (st === 429 || e.code === 'over_request_rate_limit' || /rate limit|too many/i.test(msg)) return SIGNIN_ERR.TOO_MANY;
      if (e.code === 'invalid_credentials' || /invalid login credentials/i.test(msg)) return SIGNIN_ERR.WRONG;
      if (e.name === 'AuthRetryableFetchError' || e instanceof TypeError || st === 0 || /failed to fetch|network|load failed/i.test(msg)) return SIGNIN_ERR.OFFLINE;
      return SIGNIN_ERR.OTHER;
    }
    function sessionStored() { try { return !!localStorage.getItem(AUTH_STORAGE_KEY); } catch (e) { return false; } }

    async function login() {
      if (loginInFlight) return;   // a double tap submits once
      const emailEl = document.getElementById('authEmailInput'), pwEl = document.getElementById('authPasswordInput');
      const email = emailEl.value, password = pwEl.value;

      if (!email || !password) {
        showAuthError(SIGNIN_ERR.EMPTY);
        (email ? pwEl : emailEl).focus();
        return;
      }

      hideAuthError();
      setSignInBusy(true);
      // The marker goes down BEFORE the request: the playground's own SIGNED_IN listener can reload
      // before this continues (it skips while loginInFlight, but a late answer after the timeout
      // still reloads -- then with no marker, so no Strike).
      if (PLAYGROUND) writeAuthHop('in');
      let res;
      try {
        res = await Promise.race([
          supabaseClient.auth.signInWithPassword({ email, password }),
          new Promise(r => setTimeout(() => r({ timedOut: true }), SIGNIN_TIMEOUT_MS))
        ]);
      } catch (e) { res = { error: e }; }
      res = res || { error: {} };

      let msg = res.timedOut || res.error ? signInErrorText(res) : null;
      // Signed in, but the browser won't keep the session: a reload would boot into the playground
      // again and look like nothing happened (a silent loop). Say so instead.
      if (!msg && !sessionStored()) msg = SIGNIN_ERR.STORAGE;
      if (msg) {
        clearAuthHop();
        setSignInBusy(false);
        showAuthError(msg);
        if (msg === SIGNIN_ERR.WRONG) pwEl.value = '';   // the email is kept: a mistyped password costs one field
        pwEl.focus();
        return;
      }
      if (PLAYGROUND) { location.reload(); return; }   // the session is stored: boot again as the real app (busy until then)

      // Real mode, signed out (rare): success happens in place, and the Strike plays at once.
      // The slot stays the sign-in badge until the Strike: a hold keeps updateAuthUI() (here and from
      // the SIGNED_IN event) off it, and the Strike's end swaps to the account badge.
      badgeMotion = { kind: 'hold' };
      setSignInBusy(false);
      currentUser = res.data && res.data.user || currentUser;
      hideAuthModal();
      updateAuthUI();          // the email, the tags
      playStrike();
    }

    // Sign out (this device only: a global sign-out would quietly drop every other device into the
    // playground). The dropdown stays open, "Signing out...", until the call returns; on success it
    // closes, the badge settles to navy, the ink dries off, and the page reloads into the playground.
    async function logout() {
      if (PLAYGROUND || signOutInFlight) return;   // signed out there is no dropdown
      const item = document.getElementById('dropdownLogoutBtn');
      signOutInFlight = true;
      item.disabled = true; item.textContent = 'Signing out…';
      let error = null;
      try { ({ error } = await supabaseClient.auth.signOut({ scope: 'local' })); } catch (e) { error = e; }
      if (error) {
        signOutInFlight = false;
        item.disabled = false; item.textContent = 'Sign out';
        showError('Couldn’t sign out. Try again.', 'signout');
        return;
      }
      item.disabled = false; item.textContent = 'Sign out';
      currentUser = null;
      hideAccountDropdown();
      writeAuthHop('out');
      if (prefersReducedMotion()) { setAccountBadge('signin'); location.reload(); return; }
      afterBadgeSettles(() => playDryUp(() => location.reload()));
    }

    async function requireAuth() {
      if (!currentUser) {
        await showAuthModal('edit');
        return false;
      }
      return true;
    }

    // Visited/starred writes in flight (toggleLocationFlag()). While any is
    // pending, a fetch -- the 10s poll or another write's refetch -- must
    // not paint server rows over the optimistic screen: that repainted a
    // just-removed star for ~230ms when the owner tapped twice. The fetch
    // still runs; its rows are simply not applied. The last write to
    // settle refetches once, which reconciles everything.
    let flagWritesInFlight = 0;

    // Explicit column list: created_at is ordered by server-side but never
    // rendered, so it is deliberately not selected. PostgREST allows ordering
    // on an unselected column.
    async function doFetchLocations() {
      try {
        // The tag's short address (short_address, else address_details) --
        // columns that may not exist yet: a missing-column error retries
        // without them for the rest of the session (shortAddressColumnsMissing).
        const base = 'id,name,address,category,lat,lng,notes,visited,starred,city';
        const read = cols => supabaseClient.from('locations').select(cols).order('created_at', { ascending: false });
        let { data, error } = await read(shortAddressColumnsMissing ? base : base + ',short_address,address_details');
        if (error && !shortAddressColumnsMissing && isMissingShortAddressColumn(error)) {
          shortAddressColumnsMissing = true;
          ({ data, error } = await read(base));
        }

        if (error) throw error;
        if (flagWritesInFlight > 0) return;   // see flagWritesInFlight
        const rows = data || [];
        const digest = payloadDigest(rows);
        locations = rows;
        // No-op render: an unchanged payload must not touch the DOM or the map.
        if (digest !== lastPayloadDigest) {
          lastPayloadDigest = digest;
          updateUI();
        }
        hideError('locations');
      } catch (err) {
        showReadProblem(err, 'locations');
      }
    }

    // In-flight guard: overlapping polls would otherwise race each other.
    function fetchLocations() {
      if (fetchPromise) return fetchPromise;
      fetchPromise = doFetchLocations().finally(() => { fetchPromise = null; });
      return fetchPromise;
    }

    // After a mutation we need a read that STARTED after the write, so an
    // already-in-flight request is awaited first and then a fresh one is issued.
    async function refetchLocations() {
      if (fetchPromise) { try { await fetchPromise; } catch (e) { /* reported already */ } }
      return fetchLocations();
    }

    // Shapes carry visited / starred like pins (2026-10-02), so they are polled
    // with the pins (pollTick) and the other phone's marks arrive; the same
    // in-flight guard, the same flagWritesInFlight hold and the same no-op
    // render on an unchanged payload as doFetchLocations().
    let shapesFetchPromise = null;
    let lastShapesDigest = null;
    async function doFetchNeighborhoodShapes() {
      try {
        const { data, error } = await supabaseClient
          .from('neighborhood_shapes')
          .select('id,city,type,label,color,note,min_zoom,geometry,visited,starred');
        if (error) throw error;
        if (flagWritesInFlight > 0) return;   // see flagWritesInFlight
        const rows = data || [];
        const digest = JSON.stringify(rows);
        neighborhoodShapes = rows;
        if (digest !== lastShapesDigest) {
          lastShapesDigest = digest;
          updateUI();   // refreshes the list count/cards too, not just the map layers
        }
        hideError('shapes');
      } catch (err) {
        showReadProblem(err, 'shapes');
      }
    }
    function fetchNeighborhoodShapes() {
      if (shapesFetchPromise) return shapesFetchPromise;
      shapesFetchPromise = doFetchNeighborhoodShapes().finally(() => { shapesFetchPromise = null; });
      return shapesFetchPromise;
    }
    // A read that STARTED after the write (see refetchLocations()).
    async function refetchNeighborhoodShapes() {
      if (shapesFetchPromise) { try { await shapesFetchPromise; } catch (e) { /* reported already */ } }
      return fetchNeighborhoodShapes();
    }

    function payloadDigest(rows) {
      return rows.map(r => `${r.id}:${markerSignature(r)}`).join('~');
    }

    // Owner (2026-10-01): the banner never shows a raw message. A write that fails for want of
    // a connection (a fetch TypeError: Chromium "Failed to fetch", Safari "Load failed", or the
    // browser offline) says "Couldn't save. Check your connection." and goes after 6s; a write
    // the RLS policy refuses says who can edit and stays until tapped. Either way the row has
    // already rolled back.
    const BANNER_WRITE_MS = 6000;
    const errText = err => `${(err && err.message) || err || ''} ${(err && err.code) || ''}`;
    const isNetworkError = err => (typeof navigator !== 'undefined' && navigator.onLine === false) || err instanceof TypeError ||
      /failed to fetch|load failed|networkerror|network request failed/i.test(errText(err));
    const isRLSError = err => /row-level security|policy|42501/i.test(errText(err));
    function showWriteError(err, what, source = 'mutation') {
      if (isRLSError(err)) { showError(`Only Adam and Erica can edit ${what}.`, source); return; }
      showError(isNetworkError(err) ? 'Couldn’t save. Check your connection.' : 'Couldn’t save. Try again.', source, { autoHideMs: BANNER_WRITE_MS });
    }
    // A failed read (load or poll) keeps what's on screen and says so in the navy info band;
    // the next good read of that source, or the browser's `online` event, clears it.
    function showReadProblem(err, source) {
      showInfo(isNetworkError(err) ? 'Offline. Showing what’s loaded.' : 'Couldn’t load. Showing what’s loaded.', source);
    }

    // The short-address columns (address_details, short_address; migration
    // 20261005000000_add_short_address.sql) may not exist yet: index.html
    // deploys on push, possibly before the migration runs. PostgREST then
    // refuses the whole insert (PGRST204 "Could not find the '...' column"),
    // so addLocation() retries once without them and stops sending them for
    // the rest of the session; the read (doFetchLocations()) does the same.
    // The tag shows short_address (tagAddress()).
    const SHORT_ADDRESS_COLUMNS = ['address_details', 'short_address'];
    let shortAddressColumnsMissing = false;

    function isMissingShortAddressColumn(error) {
      if (!error) return false;
      const text = `${error.code || ''} ${error.message || ''} ${error.details || ''}`;
      return (error.code === 'PGRST204' || error.code === '42703' || /column/i.test(text))
        && SHORT_ADDRESS_COLUMNS.some(c => text.includes(c));
    }

    function withoutShortAddress(loc) {
      const rest = { ...loc };
      SHORT_ADDRESS_COLUMNS.forEach(c => delete rest[c]);
      return rest;
    }

    // The fields addLocation() stores for a Nominatim `address` object; {} when
    // there are none, so a caller can always spread it into the row.
    function shortAddressFields(details, placeName) {
      if (!details || typeof details !== 'object' || !Object.keys(details).length) return {};
      return { address_details: details, short_address: deriveShortAddress(details, placeName) || null };
    }

    // true when the row is in (the add tag keeps its draft and prints its error line otherwise)
    async function addLocation(loc) {
      if (!await requireAuth()) return false;

      try {
        const hasShort = SHORT_ADDRESS_COLUMNS.some(c => c in loc);
        let { error } = await supabaseClient
          .from('locations')
          .insert([shortAddressColumnsMissing ? withoutShortAddress(loc) : loc]);

        if (error && hasShort && !shortAddressColumnsMissing && isMissingShortAddressColumn(error)) {
          shortAddressColumnsMissing = true;
          console.warn('locations short-address columns missing; saved without them.', error.message);
          ({ error } = await supabaseClient.from('locations').insert([withoutShortAddress(loc)]));
        }

        if (error) throw error;
        revealCity(loc.city);   // a place added into a hidden city shows that city, or it would vanish on ADD
        await refetchLocations();
        hideError('mutation');
        return true;
      } catch (err) {
        showWriteError(err, 'places');
        return false;
      }
    }
    function revealCity(cityId) {   // true when it showed the city
      if (!hiddenCities.has(cityId)) return false;
      hiddenCities.delete(cityId); persistHiddenCities(); updateUI();
      return true;
    }

    async function addNeighborhoodShape(shape) {
      if (!await requireAuth()) return false;

      try {
        const { error } = await supabaseClient
          .from('neighborhood_shapes')
          .insert([shape]);

        if (error) throw error;
        revealCity(shape.city);
        await refetchNeighborhoodShapes();
        hideError('mutation');
        return true;
      } catch (err) {
        showWriteError(err, 'places');
        return false;
      }
    }

    async function deleteLocation(id) {
      if (!await requireAuth()) return;

      try {
        const { error } = await supabaseClient
          .from('locations')
          .delete()
          .eq('id', id);

        if (error) throw error;
        await refetchLocations();
        hideError('mutation');
        cleanupOrphanCities();
      } catch (err) {
        showWriteError(err, 'places');
      }
    }

    async function deleteNeighborhoodShape(id) {
      if (!await requireAuth()) return;

      try {
        const { error } = await supabaseClient
          .from('neighborhood_shapes')
          .delete()
          .eq('id', id);

        if (error) throw error;
        await refetchNeighborhoodShapes();
        hideError('mutation');
        cleanupOrphanCities();
      } catch (err) {
        showWriteError(err, 'places');
      }
    }

    // Visited and starred are both one-tap popup toggles, so they share
    // one writer. OPTIMISTIC: the local row flips and updateUI() re-renders
    // the popup, list row and marker at once; the write follows. On
    // failure the flip is reverted. The refetch after a successful write
    // returns the state already on screen, so every signature matches and
    // nothing re-renders (no flicker). The target value is written, not
    // "!current" server-side, so a quick double-tap lands where the
    // screen says it did.
    function setLocationFlag(id, field, value) {
      // Re-rendering replaces the popup's HTML; keep keyboard/VoiceOver
      // focus on the control that was just used.
      const focused = document.activeElement;
      const refocus = focused && focused.matches && focused.matches('.popup-star, .popup-visited')
        ? `.${focused.classList[0]}[data-id="${CSS.escape(id)}"]` : null;
      if (isShapeKey(id)) { const sid = shapeIdOf(id); neighborhoodShapes = neighborhoodShapes.map(n => n.id === sid ? { ...n, [field]: value } : n); }
      else locations = locations.map(l => l.id === id ? { ...l, [field]: value } : l);
      // Visited changed ANYWHERE (a row swipe, the tag, a rollback) while this place's tag is open:
      // the tag stamps (or lifts) once, as if pressed there (owner 2026-10-08: "when i have a tag
      // open that is unvisited, if i mark it visited in the list, the animation on the tag marking it
      // visited should still run"). Driven by the state change, never by the row's gesture code
      // (CLAUDE.md, animation separation). A tag tap has already set the same flag -- no double.
      // The flag is consumed by the re-render below and cleared after it, so the poll or a later
      // re-render never replays it. Reduced motion: the CSS drops both animations.
      if (field === 'visited' && openTagKey() === id) { if (value) popupStampId = id; else popupUnstampId = id; }
      updateUI();
      if (field === 'visited') { popupStampId = null; popupUnstampId = null; }
      if (refocus) {
        const btn = document.querySelector(`.leaflet-popup ${refocus}`);
        if (btn) btn.focus({ preventScroll: true });
      }
    }

    // `id` is a row key (rowItem()): a pin's uuid, or 'shape:<id>' for a
    // district/street, written to neighborhood_shapes the same way.
    async function toggleLocationFlag(id, field) {
      if (!await requireAuth()) return;
      const loc = rowItem(id);
      if (!loc) return;
      const next = !loc[field];
      const shape = isShapeKey(id);

      setLocationFlag(id, field, next);
      flagWritesInFlight++;
      try {
        const { error } = await supabaseClient
          .from(shape ? 'neighborhood_shapes' : 'locations')
          .update({ [field]: next })
          .eq('id', shape ? shapeIdOf(id) : id);

        if (error) throw error;
        hideError('mutation');
      } catch (err) {
        // Rollback is per write: only this tap's flip is undone.
        setLocationFlag(id, field, !next);
        showWriteError(err, 'places');
      } finally {
        flagWritesInFlight--;
      }
      // Only the last write to settle reconciles with the server -- see
      // flagWritesInFlight. One visible change per tap, nothing after.
      if (flagWritesInFlight === 0) await Promise.all([refetchLocations(), refetchNeighborhoodShapes()]);
    }

    // The single Nominatim call site. A city is configured in exactly one place
    // (CITIES); the place search passes only the map's view (currentSearchCityConfig()).
    // NOTE: no User-Agent header — it is a forbidden header name for fetch and
    // browsers drop it silently, so the old ones never did anything.
    // `cfg` is usually a CITIES entry, but detectCityContext()'s "unknown
    // region" fallback (see below) passes a partial cfg with only `viewbox`
    // + `bounded` set. new URLSearchParams({...}) stringifies a missing
    // field as the literal string "undefined" if it's included unconditionally
    // -- every optional field below is therefore set only when present,
    // never passed as an object key that might be undefined.
    async function nominatim(query, cfg, opts = {}) {
      const params = new URLSearchParams({
        format: 'json',
        q: cfg.geocodeSuffix ? `${query}, ${cfg.geocodeSuffix}` : query,
        limit: String(opts.limit || 1)
      });
      if (cfg.countrycodes) params.set('countrycodes', cfg.countrycodes);   // HARD filter — comma list, see CITIES
      if (cfg.viewbox) params.set('viewbox', cfg.viewbox);                  // SOFT ranking hint only
      if (cfg.bounded) params.set('bounded', '1');                          // HARD filter to viewbox — only set by the unscoped-region fallback
      if (opts.addressdetails) params.set('addressdetails', '1');
      if (opts.polygonGeojson) params.set('polygon_geojson', '1');
      params.set('accept-language', 'en');   // names, towns and countries in English, not the local language

      const init = {};
      if (opts.timeout) init.signal = AbortSignal.timeout(opts.timeout);
      lastNominatimAt = performance.now();
      const response = await fetch(`https://nominatim.openstreetmap.org/search?${params}`, init);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    // ---- short address ---------------------------------------------------------
    // Owner (2026-10-05), choosing a stored short form over trimming the full
    // string: "#1 since there's a directions button". Why it matters:
    // "sometimes the address *does* matter at a glance, if something has
    // multiple locations or something". So: "street + number · area", enough to
    // tell WHICH branch / WHERE, never a postal address (Directions navigates).
    // Input is a Nominatim `address` object (addressdetails=1); it is stored
    // raw in locations.address_details so the rules below can be re-run later.
    // DUPLICATED PORT (no build step): tools/short-address-backfill.html has a
    // verbatim copy of SHORT_ADDR_* and deriveShortAddress() -- change both.
    // Rules (docs/shipped.md "Short address"):
    //   street: the first road-level key; house_number joins it ("Laugavegur 12";
    //     number first in SHORT_ADDR_NUMBER_FIRST countries: "4800 Hollywood
    //     Blvd"). Dropped when the place's own name already contains the road
    //     (a street pin, "Davidshallsgatan 10 Malmö").
    //   area: the first of SHORT_ADDR_AREA_KEYS that is not an administrative
    //     unit ("Norra innerstadens stadsdelsområde", "Malmö kommun"), not the
    //     road, and not contained in the place's name. suburb comes first: it is
    //     the level people know (Vesterbro, Södermalm, Möllevången); the finer
    //     neighbourhood/quarter names (Humleby, Den Gule By) are the fallback.
    //     Settlement keys come last, so a place outside a city still says where
    //     (Reykjanesbær).
    //   The POI's own name key (amenity, shop, tourism...) is never read.
    // Returns '' when nothing useful is left (stored as NULL).
    const SHORT_ADDR_ROAD_KEYS = ['road', 'pedestrian', 'square', 'footway', 'path', 'cycleway', 'place'];
    const SHORT_ADDR_AREA_KEYS = ['suburb', 'borough', 'city_district', 'quarter', 'neighbourhood', 'district',
                                  'village', 'town', 'hamlet', 'city', 'municipality'];
    const SHORT_ADDR_ADMIN_RE = /stadsdelsområde|stadsdel\b|bydel\b|municipality|kommun|county|\bregion\b/i;
    const SHORT_ADDR_NUMBER_FIRST = new Set(['us', 'ca', 'gb', 'ie', 'au', 'nz', 'fr', 'lu']);

    function shortAddrWords(s) {
      return ' ' + String(s || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
        .replace(/[^\p{L}\p{N}]+/gu, ' ').trim() + ' ';
    }

    function deriveShortAddress(details, placeName) {
      if (!details || typeof details !== 'object') return '';
      const nameWords = shortAddrWords(placeName);
      const inName = part => nameWords.trim() !== '' && nameWords.includes(shortAddrWords(part));
      const roadKey = SHORT_ADDR_ROAD_KEYS.find(k => details[k]);
      const road = roadKey ? String(details[roadKey]).trim() : '';
      let street = '';
      if (road && !inName(road)) {
        const num = details.house_number ? String(details.house_number).trim() : '';
        street = !num ? road
          : SHORT_ADDR_NUMBER_FIRST.has(String(details.country_code || '').toLowerCase()) ? `${num} ${road}` : `${road} ${num}`;
      }
      let area = '';
      for (const k of SHORT_ADDR_AREA_KEYS) {
        const v = details[k] ? String(details[k]).trim() : '';
        if (!v || SHORT_ADDR_ADMIN_RE.test(v) || inName(v)) continue;
        if (road && shortAddrWords(v) === shortAddrWords(road)) continue;
        area = v;
        break;
      }
      return [street, area].filter(Boolean).join(' · ');
    }

    // ---- widen on miss --------------------------------------------------------
    // A trip's places aren't all in the current city (day trips, other towns,
    // another country), but the scoped search above can never return them:
    // the city suffix is part of `q` and `countrycodes` is a hard filter.
    // Owner decision (2026-09-29): search the current city first, exactly as
    // before, and only when that finds NOTHING run one wider search -- no
    // suffix, no countrycodes, the same viewbox as a SOFT bias (never
    // bounded). Filing is untouched. See design/trip-location-model/.
    // Nominatim's usage policy is at most 1 request/s, so the widened call
    // waits until NOMINATIM_SPACING_MS after the previous request started.
    const NOMINATIM_SPACING_MS = 1000;
    let lastNominatimAt = 0;

    // Null when there is nothing to widen (already unscoped and unbounded).
    function widenedSearchConfig(cfg) {
      if (!cfg || !cfg.viewbox) return null;
      if (!cfg.geocodeSuffix && !cfg.countrycodes && !cfg.bounded) return null;
      return { viewbox: cfg.viewbox };
    }

    // `isStale()` (optional) is checked before the wait, after it, and after
    // the widened response: a stale search returns null and is dropped.
    async function nominatimWithFallback(query, cfg, opts = {}, isStale = null) {
      const stale = () => !!(isStale && isStale());
      const data = await nominatim(query, cfg, opts);
      if (stale()) return null;
      if (data && data.length) return data;
      const wide = widenedSearchConfig(cfg);
      if (!wide) return data;
      const wait = lastNominatimAt + NOMINATIM_SPACING_MS - performance.now();
      if (wait > 0) await new Promise(resolve => setTimeout(resolve, Math.ceil(wait)));
      if (stale()) return null;
      const widened = await nominatim(query, wide, opts);
      return stale() ? null : widened;
    }

    // Fetches a district's real OSM boundary polygon -- GeoJSON is [lng, lat],
    // converted here to this app's [lat, lng] convention, so nothing downstream
    // ever has to think about coordinate order.
    async function nominatimPolygon(name, cfg) {
      try {
        const data = await nominatimWithFallback(name, cfg, { limit: 1, polygonGeojson: true, timeout: 8000 });
        if (!data || !data.length || !data[0].geojson) return null;
        const gj = data[0].geojson;
        let ring;
        if (gj.type === 'Polygon') ring = gj.coordinates[0];
        else if (gj.type === 'MultiPolygon') ring = gj.coordinates[0][0];
        else return null;
        return ring.map(([lng, lat]) => [lat, lng]);
      } catch (err) {
        return null;
      }
    }

    // Fetches a named street's real mapped path via Overpass. Overpass returns
    // geometry nodes as {lat, lon} objects already, so no coordinate-order
    // conversion is needed (unlike Nominatim's GeoJSON).
    async function overpassWay(name, cfg) {
      const [lonMin, latMin, lonMax, latMax] = cfg.viewbox.split(',').map(Number);
      const query = `[out:json][timeout:15];way["name"="${name}"]["highway"](${latMin},${lonMin},${latMax},${lonMax});out geom;`;
      try {
        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: `data=${encodeURIComponent(query)}`,
          signal: AbortSignal.timeout(15000)
        });
        if (!response.ok) return null;
        const data = await response.json();
        if (!data.elements || !data.elements.length) return null;
        // A street is often split into several OSM way segments -- merge all
        // of them into one path, but keep each element's point count so a
        // caller can still tell them apart (resolveShapeCity() uses this to
        // drop a whole mismatched-city segment instead of voting point by
        // point).
        const points = [];
        const segmentLengths = [];
        data.elements.forEach(el => {
          if (!el.geometry) return;
          const before = points.length;
          el.geometry.forEach(pt => points.push([pt.lat, pt.lon]));
          segmentLengths.push(points.length - before);
        });
        return points.length ? { points, segmentLengths } : null;
      } catch (err) {
        return null;
      }
    }

    // Fallback when OSM has no polygon/way for a district/street: land an
    // approximate pin instead of forcing a trip to
    // tools/neighborhood-shapes.html for manual tracing. Two escalating
    // attempts -- a plain point search (many named neighborhoods have a
    // node even with no boundary relation), then an Overpass node search
    // scoped to the city bbox (catches an entrance/landmark node under a
    // different tag shape than a plain search surfaces). Returns
    // {lat, lng, tier} or null if OSM genuinely has nothing at all.
    // Re-upgrading to a real boundary later, if OSM ever gains one, is a
    // separate concern -- not attempted here.
    async function findApproximatePoint(name, cfg) {
      try {
        const data = await nominatimWithFallback(name, cfg, { limit: 1, addressdetails: true, timeout: 8000 });
        if (data && data.length) {
          // addressDetails feeds the short address (Overpass tier has none).
          return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), tier: 'point search', addressDetails: data[0].address || null };
        }
      } catch (err) { /* fall through to the Overpass node attempt */ }

      try {
        const [lonMin, latMin, lonMax, latMax] = cfg.viewbox.split(',').map(Number);
        const query = `[out:json][timeout:15];node["name"="${name}"](${latMin},${lonMin},${latMax},${lonMax});out;`;
        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: `data=${encodeURIComponent(query)}`,
          signal: AbortSignal.timeout(15000)
        });
        if (response.ok) {
          const data = await response.json();
          if (data.elements && data.elements.length) {
            const el = data.elements[0];
            return { lat: el.lat, lng: el.lon, tier: 'Overpass node' };
          }
        }
      } catch (err) { /* genuinely nothing found */ }

      return null;
    }

    // Debounce function to limit API calls
    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    // ---- THE ADD TAG's search (add-tag-jam phase 2: worldwide, each result says where) ----------
    // The city no longer scopes the search (it is guessed AFTER the pick -- it can't also be the
    // scope). One search, everywhere: no geocodeSuffix, no countrycodes, the map's view only as
    // Nominatim's SOFT viewbox hint; then the app re-orders: near the map first, then near any of
    // your cities, then the rest, each tier nearest first (jam Turn 6, "we think"). Each row prints
    // its name, then "type · Town, Country" from the OSM pair and the address.
    // searchSeq drops a response once a newer search has started or NAME no longer holds its query.
    const SEARCH_CITY_NEAR_KM = 75;   // "near one of your cities" for the ranking only (detectCityContext()'s reach)
    let searchSeq = 0;
    let addResultsData = [];          // the rows on screen, in order (a row's data-i indexes it)
    let addResultsQuery = '';         // the text those rows answer (an unnamed address hit is named from it)
    // The distance tier: 0 in the map's view (+25%), 1 within SEARCH_CITY_NEAR_KM of one of your
    // cities, 2 the rest (3: no coordinates).
    function searchTier(r) {
      const ll = [parseFloat(r.lat), parseFloat(r.lon)];
      if (!isFinite(ll[0]) || !isFinite(ll[1]) || !map) return { tier: 3, d: 0 };
      const c = map.getCenter(), fromMap = haversineKm([c.lat, c.lng], ll);
      if (map.getBounds().pad(0.25).contains(ll)) return { tier: 0, d: fromMap };
      const ids = Object.keys(CITIES), near = ids.length ? Math.min(...ids.map(id => haversineKm(CITIES[id].center, ll))) : Infinity;
      return near <= SEARCH_CITY_NEAR_KM ? { tier: 1, d: near } : { tier: 2, d: fromMap };
    }
    // Inside a tier, Nominatim's importance first (a concert hall beats the bus stop named after
    // it), then the nearest. Duplicates merge: the same OSM object, or the same name and kind
    // within ~50 m (the two "Harpa" bus-stop platforms), keeping the first.
    function rankSearchResults(rows) {
      const ranked = rows.map((r, i) => ({ r, ...searchTier(r), imp: parseFloat(r.importance) || 0, i }))
        .sort((a, b) => a.tier - b.tier || b.imp - a.imp || a.d - b.d || a.i - b.i).map(x => x.r);
      const kept = [];
      ranked.forEach(r => {
        const dup = kept.some(k => (k.osm_type && k.osm_type === r.osm_type && String(k.osm_id) === String(r.osm_id)) ||
          (resultName(k).toLowerCase() === resultName(r).toLowerCase() && osmPair(k).value === osmPair(r).value &&
           haversineKm([+k.lat, +k.lon], [+r.lat, +r.lon]) * 1000 <= 50));
        if (!dup) kept.push(r);
      });
      return kept;
    }
    // Your cities' regions: city boxes merged while the union stays within REGION_MAX_DEG on both
    // sides (Copenhagen + Malmö + Stockholm are one region; LA and Reykjavík each their own).
    const REGION_MAX_DEG = 8;
    function cityRegions() {
      let rs = Object.keys(CITIES).filter(id => CITIES[id].viewbox).map(id => { const [a, b, c, d] = CITIES[id].viewbox.split(',').map(Number); return { w: a, s: b, e: c, n: d, ids: [id] }; });
      let merged = true;
      while (merged) {
        merged = false;
        outer: for (let i = 0; i < rs.length; i++) for (let j = i + 1; j < rs.length; j++) {
          const u = { w: Math.min(rs[i].w, rs[j].w), s: Math.min(rs[i].s, rs[j].s), e: Math.max(rs[i].e, rs[j].e), n: Math.max(rs[i].n, rs[j].n) };
          if (u.e - u.w <= REGION_MAX_DEG && u.n - u.s <= REGION_MAX_DEG) { rs[i] = { ...u, ids: rs[i].ids.concat(rs[j].ids) }; rs.splice(j, 1); merged = true; break outer; }
        }
      }
      return rs.map(r => ({ ids: r.ids, viewbox: [r.w, r.s, r.e, r.n].map(v => v.toFixed(3)).join(','), box: r }));
    }
    // The quiet safety net (blank-tag round 12b): when nothing found is near the map or any of your
    // cities, search once more inside each of your other regions (bounded), at Nominatim's 1/s, and
    // merge. It finds what a worldwide search buries ("Tivoli" or "Noma" seen from Reykjavík).
    async function searchNearCities(query, isStale) {
      const c = map ? map.getCenter() : null, out = [];
      for (const rg of cityRegions()) {
        if (c && c.lng >= rg.box.w && c.lng <= rg.box.e && c.lat >= rg.box.s && c.lat <= rg.box.n) continue;   // the view's own region: already searched
        const wait = lastNominatimAt + NOMINATIM_SPACING_MS - performance.now();
        if (wait > 0) await new Promise(r => setTimeout(r, Math.ceil(wait)));
        if (isStale()) return null;
        try { const d = await nominatim(query, { viewbox: rg.viewbox, bounded: true }, { limit: 5, addressdetails: true, timeout: 5000 }); if (d) out.push(...d); }
        catch (_) { /* quiet: a miss here changes nothing */ }
        if (isStale()) return null;
      }
      return out;
    }

    // The OSM pair of a result: Nominatim format=json class/type, or Photon osm_key/osm_value.
    function osmPair(r) {
      if (!r) return { key: '', value: '' };
      const p = r.properties || r;
      return { key: String(p.class || p.osm_key || p.category || ''), value: String(p.type || p.osm_value || '') };
    }
    const humanOsm = v => { const t = String(v || '').replace(/_/g, ' ').trim(); return t ? t[0].toUpperCase() + t.slice(1) : ''; };
    // The real town of an address: city, town or village, skipping an administrative unit's name
    // ("... Municipality", "... kommun"); with accept-language=en Nominatim gives "Reykjavik", not
    // "Reykjavíkurborg".
    const TOWN_ADMIN_RE = /\b(municipality|kommun|kommune|county|region)\b|^(city|town|village|municipality) of /i;
    // Before giving up, a US-style admin prefix is stripped, most specific first ("Village of
    // Tivoli" inside "Town of Red Hook" -> "Tivoli"; check p3, item 8).
    const TOWN_PREFIX_RE = /^(city|town|village|municipality) of\s+/i;
    function townOf(a) {
      if (!a) return '';
      for (const k of ['city', 'town', 'village']) {
        const v = a[k] ? String(a[k]).trim() : '';
        if (v && !TOWN_ADMIN_RE.test(v)) return v;
      }
      for (const k of ['village', 'town', 'city']) {
        const v = a[k] ? String(a[k]).trim() : '';
        if (!TOWN_PREFIX_RE.test(v)) continue;
        const bare = v.replace(TOWN_PREFIX_RE, '').trim();
        if (bare && !TOWN_ADMIN_RE.test(bare)) return bare;
      }
      return '';
    }
    // The result row's kind in everyday words, never raw OSM vocabulary ("Administrative", "Hamlet",
    // "Building", "Yes"; phase 2 fixes, the owner's "no codes"): settlements and areas by size,
    // streets, stops and addresses by what you'd call them, anything else by its own value.
    const RESULT_PLACE_WORDS = { city: 'City', town: 'Town', village: 'Village', hamlet: 'Village', isolated_dwelling: 'Village', farm: 'Farm',
      suburb: 'District', quarter: 'District', neighbourhood: 'District', city_district: 'District', borough: 'District',
      municipality: 'Region', county: 'Region', state: 'Region', region: 'Region', province: 'Region', state_district: 'Region',
      country: 'Country', island: 'Island', islet: 'Island', postcode: 'Postcode', house: 'Address', square: 'Square', locality: 'Area', plaza: 'Square' };
    const RESULT_VALUE_WORDS = { bus_stop: 'Bus stop', platform: 'Stop', tram_stop: 'Tram stop', station: 'Station', halt: 'Station', subway_entrance: 'Metro',
      aerodrome: 'Airport', ferry_terminal: 'Ferry', place_of_worship: 'Church', fast_food: 'Fast food', guest_house: 'Guest house', attraction: 'Sight' };
    function resultKind(r) {
      const { key, value } = osmPair(r), at = r.addresstype || '';
      if (key === 'place' || key === 'boundary') return RESULT_PLACE_WORDS[value] || RESULT_PLACE_WORDS[at] || 'Area';
      if (key === 'highway') return RESULT_VALUE_WORDS[value] || 'Street';
      if (key === 'building' || key === 'addr' || at === 'building' || at === 'house') return 'Address';
      if (RESULT_VALUE_WORDS[value]) return RESULT_VALUE_WORDS[value];
      if (value && value !== 'yes') return humanOsm(value);
      return 'Place';
    }
    // "Copenhagen, Denmark": the result's town (townOf(): the real town, never an admin name; else
    // the next level up) and country. A row's where-part, and a District / Street's address line.
    const resultTown = r => { const a = (r && r.address) || {}; return [townOf(a) || a.hamlet || a.municipality || a.county || a.state || '', a.country].filter(Boolean).join(', '); };
    // "Swimming pool · Reykjavik, Iceland": what it is, then where.
    function resultWhere(r) {
      return [resultKind(r), resultTown(r)].filter(Boolean).join(' · ');
    }
    // A result with no name of its own (a house number, a building) is named from its street and
    // number ("Laugavegur 18"), else from what was typed -- never a bare "18".
    function resultName(r, query = '') {
      const own = r && r.name ? String(r.name).trim() : '';
      if (own) return own;
      const a = (r && r.address) || {};
      if (a.road && a.house_number) return SHORT_ADDR_NUMBER_FIRST.has(String(a.country_code || '').toLowerCase()) ? `${a.house_number} ${a.road}` : `${a.road} ${a.house_number}`;
      const typed = String(query || '').split(',')[0].trim();
      return typed || String((r && r.display_name) || '').split(',')[0].trim();
    }
    // An address hit: a house or building with no name of its own, or a street found for a typed
    // house number. It is never auto-typed Street or District (it's somebody's door, not the road).
    function isAddressHit(r, query = '') {
      const { key, value } = osmPair(r), a = (r && r.address) || {};
      if (!(r && r.name && String(r.name).trim()) && (key === 'building' || (key === 'place' && value === 'house') || a.house_number)) return true;
      return /(^|[\s,])\d+[a-z]?([\s,]|$)/i.test(String(query)) && (key === 'highway' || key === 'building' || key === 'place');
    }

    async function searchAddress(query) {
      const seq = ++searchSeq;
      if (query.trim().length < 2) { hideAutocomplete(); return; }
      showAddResults('<div class="add-res-note">Searching…</div>');
      const isStale = () => seq !== searchSeq || document.getElementById('nameInput').value !== query;
      try {
        const data = await nominatimWithFallback(query, currentSearchCityConfig(), { limit: 10, addressdetails: true, timeout: 5000 }, isStale);
        if (isStale()) return;
        let rows = data || [];
        const render = () => {
          addResultsData = rankSearchResults(rows); addResultsQuery = query;
          showAddResults(addResultsData.length ? addResultsData.map((r, i) =>
            `<button type="button" class="add-res" role="option" data-i="${i}"><span class="add-res-name">${escapeHtml(resultName(r, query))}</span><span class="add-res-where">${escapeHtml(resultWhere(r))}</span></button>`).join('')
            : '<div class="add-res-note">No places called that — try another name.</div>');
        };
        const nearAny = rows.some(r => searchTier(r).tier <= 1);
        if (rows.length || nearAny) render();
        if (!nearAny) {
          const extra = await searchNearCities(query, isStale);
          if (isStale() || extra === null) return;
          const seen = new Set(rows.map(r => `${r.osm_type}${r.osm_id}`));
          rows = rows.concat(extra.filter(r => !seen.has(`${r.osm_type}${r.osm_id}`)));
          render();
        }
      } catch (err) {
        console.error('Place search failed:', err);
        if (isStale()) return;
        addResultsData = [];
        showAddResults(err.name === 'TimeoutError'
          ? '<div class="add-res-note">Search timed out — try again.</div>'
          : '<div class="add-res-note">Search failed — wait a moment and try again.</div>');
      }
    }
    // The panel runs from under NAME's rule to the tag's foot (over the stub too: ADD waits for a
    // pick anyway, and with the keyboard up the stub is under it).
    function showAddResults(html) {
      const res = document.getElementById('addResults'), stock = document.querySelector('#addForm .tag-stock');
      const row = document.getElementById('addNameRow');
      res.style.setProperty('--res-top', `${row.getBoundingClientRect().bottom - stock.getBoundingClientRect().top}px`);
      res.innerHTML = html; res.hidden = false; res.scrollTop = 0;
    }
    function hideAutocomplete() {
      const res = document.getElementById('addResults');
      if (!res) return;
      res.hidden = true; res.innerHTML = ''; addResultsData = [];
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // escapeHtml() is safe for text NODES but not for double-quoted attribute
    // VALUES -- it never escapes `"`, so a JSON blob (which is full of them)
    // embedded via escapeHtml() would break out of the attribute early. Used
    // only for the data-address-details payload stashed on autocomplete rows.
    function escapeAttr(text) {
      return text.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }
    
    // =========================================================================
    // City state engine
    // =========================================================================

    // Never throws: an unknown id (stale localStorage, an unexpected DB row)
    // degrades to the default city rather than blowing up during init.
    // Never called with ALL_CITIES — callers that can see it branch first.
    function cityConfig(cityId) {
      return CITIES[cityId] || CITIES[DEFAULT_CITY];
    }

    function isAllCities() {
      return citySelection === ALL_CITIES;
    }


    // ---- hidden cities (per viewer) ----------------------------------------
    const cityShown = cityId => !hiddenCities.has(cityId);
    function readHiddenCities() {
      try {
