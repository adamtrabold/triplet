      // later (on 'add'), a tag narrower than 316 was centred by the 316px measure, (316 - w)/2 left
      // of its pin, and tagOpened() measured its height at the wrong width.
      onAdd(map) {
        if (!this._container) this._initLayout();
        this._container.style.setProperty('--tag-w', this.options.maxWidth + 'px');
        return L.Popup.prototype.onAdd.call(this, map);
      },
      _updatePosition() {
        if (!this._map) return;
        const pos = this._map.latLngToLayerPoint(this._latlng), anchor = L.point(this._getAnchor());
        let off = L.point(0, 0);
        if (this._zoomAnimated) L.DomUtil.setPosition(this._container, pos.add(anchor));
        else off = pos.add(anchor);
        this._containerBottom = 0;
        this._containerLeft = -Math.round(this._containerWidth / 2) + off.x;
        this._container.style.left = this._containerLeft + 'px';
        this._container.style.top = (off.y + tagPinRadius(this)) + 'px';
        this._container.style.bottom = 'auto';
      },
      _adjustPan() {}
    });
    function newTagPopup() {
      const w = tagWidth();
      const p = new TagPopup({ minWidth: w, maxWidth: w });
      p.on('add', () => { const c = p.getElement(); if (c) c.style.setProperty('--tag-drop', (TAG_HANG - tagPinRadius(p)) + 'px'); });   // --tag-w: TagPopup.onAdd()
      return p;
    }
    const isTagPopup = p => p instanceof TagPopup;
    // The visible radius of what the string hangs from: the pin (24px; 32 when
    // it is the selected pin), or a shape's anchor dot.
    function tagPinRadius(popup) {
      const src = popup && popup._source;
      if (src && src.locationId != null) return src.locationId === highlightedId ? 16 : 12;
      return 16;   // a district/street: its dot is the 28px close disc while the tag is open (as a selected pin)
    }
    function bindPinPopup(marker, loc) {
      marker.bindPopup(newTagPopup().setContent(buildPopupHtml(loc)));
    }

    // The single writer of highlight state. Highlight lives here, not on the
    // marker objects, so a reconciled marker can be recreated without losing it.
    function setHighlighted(id) {
      if (highlightedId === id) return;
      const prev = highlightedId;
      highlightedId = id;

      [prev, id].forEach(key => {
        if (!key) return;
        const marker = markersById.get(key);
        if (marker) {
          marker.marker.setIcon(markerIcon(marker.loc, key === id));
          applyMarkerStacking(marker.marker, key === id, marker.loc.starred);
        }
        const card = cardsById.get(key);
        if (card) card.el.classList.toggle('highlighted', key === id);
      });
    }

    // ---- list click -> popup, GUARANTEED -----------------------------------
    // A list click must always end with that item's popup open. The old
    // code opened it on a fixed 300ms timer, racing a 0.5s fly: a pin that
    // started inside a cluster had no solo marker yet (syncMarkerGlyphZoom()
    // makes it on moveend), and a shape below its min zoom had no layer, so
    // nothing opened. Now the popup opens when the map has ARRIVED at the
    // target view -- checked on every moveend, not assumed from the first
    // one -- after re-running the (idempotent) syncs, re-looking the marker
    // or layer up at that moment.
    //   - Reduced motion: setView() fires moveend synchronously inside
    //     move(); the listener is already attached, so the same path runs.
    //   - Already there: no move happens, so it opens immediately.
    //   - Last tap wins: one pending intent at a time; a newer tap cancels
    //     the older listener and closes any open popup first, so a stale
    //     popup can never appear after the tap that replaced it.
    //   - The user takes over mid-flight -- ANY direct map input (a pin or
    //     cluster tap, a drag, a pinch, a wheel) -- and the intent is
    //     dropped: pointerdown/wheel in the capture phase on the map
    //     container, so it runs before Leaflet's own handlers. Without it a
    //     stale list-tap popup could replace the pin the user just tapped,
    //     or fire later on any moveend that happened to land on the target.
    let pendingPopupOpen = null;

    function openPopupOnArrival(center, zoom, getLayer, move) {
      if (pendingPopupOpen) pendingPopupOpen();
      map.closePopup();

      const target = L.latLng(center);
      // Arrived = at the zoom and the place is on screen (clear of the top
      // controls and a 24px edge). It needn't be centred: the tag pans it to
      // its open position itself (tagOpened()), so a place already in view
      // opens at once instead of flying to the centre first.
      const arrived = () => {
        if (map.getZoom() < zoom - 0.01) return false;
        const p = map.latLngToContainerPoint(target), sz = map.getSize();
        return p.x >= 24 && p.x <= sz.x - 24 && p.y >= pinPopupTopPad() && p.y <= sz.y - 24;
      };
      const container = map.getContainer();
      const cancel = () => {
        map.off('moveend', onMoveEnd);
        map.off('dragstart', cancel);
        container.removeEventListener('pointerdown', cancel, true);
        container.removeEventListener('wheel', cancel, true);
        if (pendingPopupOpen === cancel) pendingPopupOpen = null;
      };
      function onMoveEnd() {
        if (!arrived()) return;          // an intermediate/other move -- keep waiting
        cancel();
        syncMarkerGlyphZoom();
        syncNeighborhoodLayers();
        const layer = getLayer();
        if (layer) layer.openPopup();
      }

      pendingPopupOpen = cancel;
      map.on('moveend', onMoveEnd);
      map.on('dragstart', cancel);
      container.addEventListener('pointerdown', cancel, true);
      container.addEventListener('wheel', cancel, { capture: true, passive: true });
      if (arrived()) onMoveEnd();
      else move();
    }

    function highlightMarker(locationId) {
      const location = locations.find(loc => loc.id === locationId);
      if (!location) return;

      noteInteraction();
      setHighlighted(locationId);
      // atLeast: SOLO_MIN_ZOOM -- not a coincidence, see that constant's
      // comment. This is the call the whole clustering safety property
      // rests on; if it ever changes, SOLO_MIN_ZOOM must move with it.
      // Arrival is checked at that same zoom, so the popup can only ever
      // open on a solo (never clustered) marker.
      const center = [location.lat, location.lng];
      openPopupOnArrival(center, Math.max(map.getZoom(), SOLO_MIN_ZOOM),
        () => { const entry = markersById.get(locationId); return entry && entry.marker; },
        () => focusMap(center, { atLeast: SOLO_MIN_ZOOM }, { animate: true, duration: 0.5 }));
    }

    // =========================================================================
    // LIST ORDER (design/list-ordering/). Six orders, picked from #sortBtn's
    // menu. An order only REORDERS what visibleLocations() already returns --
    // it never adds, hides or pages anything (the list rule in CLAUDE.md).
    // Per-device view state in localStorage; A-Z is the default.
    // =========================================================================
    const SORT_STORAGE_KEY = 'triplet.sortMode';
    const SORT_MODES = ['az', 'category', 'nearest', 'left', 'starred', 'newest'];
    const SORT_LABELS = { az: 'A–Z', category: 'Category', nearest: 'Nearest', left: 'What’s left', starred: 'Starred', newest: 'Newest' };
    const SORT_DEFAULT = 'az';
    // Nearest re-sorts only after the user has moved this far from the
    // position the current order was computed at -- GPS jitter and a slow
    // walk never shuffle the list under a thumb.
    const NEAREST_RESORT_M = 150;
    // No fix at all this long after asking (e.g. a permission prompt left
    // unanswered, or no GPS indoors): fall back rather than wait forever.
    const NEAREST_WAIT_MS = 20000;
    let nearestTimer = 0;
    let sortMode = SORT_DEFAULT;
    let sortFix = null;         // {lat, lng} the Nearest order was computed at
    let lastFix = null;         // newest known position (Nearest watcher OR center-me)
    let nearestWatch = null;    // the one watchPosition, alive only while Nearest is the order
    let nearestState = 'idle';  // idle | pending | ok | off
    let nearestWhy = '';        // short reason shown on the greyed Nearest row
    let sortDeferred = false;   // a re-sort waited for a row gesture to finish

    function readSortMode() {
      try { const v = localStorage.getItem(SORT_STORAGE_KEY); return SORT_MODES.includes(v) ? v : SORT_DEFAULT; }
      catch (e) { return SORT_DEFAULT; }
    }
    function writeSortMode(v) {
      try { localStorage.setItem(SORT_STORAGE_KEY, v); } catch (e) { /* private mode etc.: order just won't persist */ }
    }

    const nameCmp = (a, b) => String(a || '').localeCompare(String(b || ''), undefined, { sensitivity: 'base', numeric: true });
    const categoryRank = cat => { const i = Object.keys(CATEGORY_COLORS).indexOf(cat); return i < 0 ? 999 : i; };
    const kmFromFix = (lat, lng) => haversineKm([sortFix.lat, sortFix.lng], [lat, lng]);
    function shapeCentroid(nb) {
      const g = nb.geometry || []; if (!g.length) return null;
      let la = 0, ln = 0; g.forEach(p => { la += p[0]; ln += p[1]; }); return [la / g.length, ln / g.length];
    }

    // Pure reorder of the pins. Nearest without a fix yet sorts A-Z.
    function sortLocations(locs) {
      const mode = sortMode === 'nearest' && !sortFix ? 'az' : sortMode;
      if (mode === 'newest') return locs.slice();   // locations arrives created_at DESC from the server
      const out = locs.slice();
      const by = (...keys) => (a, b) => { for (const k of keys) { const d = k(a) - k(b); if (d) return d; } return nameCmp(a.name, b.name); };
      if (mode === 'az') out.sort((a, b) => nameCmp(a.name, b.name));
      else if (mode === 'category') out.sort(by(l => categoryRank(l.category)));
      else if (mode === 'nearest') out.sort(by(l => kmFromFix(l.lat, l.lng)));
      else if (mode === 'left') out.sort(by(l => +!!l.visited, l => +!l.starred));
      else if (mode === 'starred') out.sort(by(l => +!l.starred, l => +!!l.visited));
      return out;
    }
    // Shapes keep their own block after the pins, in the same order as the
    // pins where they have its key: Category (by type), Nearest (by
    // centroid), What's left and Starred (their own visited / starred,
    // 2026-10-02). Newest reads A-Z (no created_at is loaded for them).
    function sortShapes(shapes) {
      const out = shapes.slice(), lab = (a, b) => nameCmp(a.label, b.label);
      const by = (...keys) => (a, b) => { for (const k of keys) { const d = k(a) - k(b); if (d) return d; } return lab(a, b); };
      if (sortMode === 'category') out.sort((a, b) => (categoryRank(a.type) - categoryRank(b.type)) || lab(a, b));
      else if (sortMode === 'left') out.sort(by(n => +!!n.visited, n => +!n.starred));
      else if (sortMode === 'starred') out.sort(by(n => +!n.starred, n => +!!n.visited));
      else if (sortMode === 'nearest' && sortFix) {
        const d = nb => { const c = shapeCentroid(nb); return c ? kmFromFix(c[0], c[1]) : Infinity; };
        out.sort((a, b) => (d(a) - d(b)) || lab(a, b));
      } else out.sort(lab);
      return out;
    }

    // Nearest mode leads a row's meta with its distance -- the one fact that
    // mode is about. Other modes: empty, the meta line is unchanged.
    function distanceLabel(loc) {
      if (sortMode !== 'nearest' || !sortFix) return '';   // Plans sorts its other places too
      const km = kmFromFix(loc.lat, loc.lng);
      if (km < 1) return `${Math.max(10, Math.round(km * 100) * 10)} m`;
      if (km < 10) return `${km.toFixed(1)} km`;
      return `${Math.round(km).toLocaleString('en-US')} km`;
    }

    // A row gesture (pencil star, visit stamp, or their popup replays) owns
    // its row until it settles: while any is live, rows keep their current
    // order and the re-sort runs when the last one lets go.
    // keyOf: a pin's row key is its id; shapes pass nb => shapeKey(nb.id).
    function heldOrder(visible, keyOf = x => x.id) {
      if (!starHeld.size) return null;
      sortDeferred = true;
      const list = document.getElementById('locationsList'), pos = new Map();
      [...list.children].forEach((el, i) => { const id = rowKey(el); if (id) pos.set(id, i); });
      const at = x => { const k = keyOf(x); return pos.has(k) ? pos.get(k) : 1e9; };
      return visible.slice().sort((a, b) => at(a) - at(b));
    }
    const shapeRowKey = nb => shapeKey(nb.id);
    function afterRowGesture() {
      if (!sortDeferred || starHeld.size) return;
      sortDeferred = false;
      requestAnimationFrame(() => { if (!starHeld.size) updateUI(); else sortDeferred = true; });
    }

    // ---- the button + menu --------------------------------------------------
    function syncSortButton() {
      const btn = document.getElementById('sortBtn');
      if (!btn) return;
      const shown = sortMode === 'nearest' && !sortFix ? 'az' : sortMode;
      btn.setAttribute('aria-label', `Sort list: ${SORT_LABELS[sortMode]}${sortMode === 'nearest' && nearestState === 'pending' ? ', locating' : ''}`);
      btn.classList.toggle('not-default', shown !== SORT_DEFAULT);
      btn.classList.toggle('loading', sortMode === 'nearest' && nearestState === 'pending');
    }
    function announceSort(msg) {
      const live = document.getElementById('sortLive');
      if (!live) return;
      live.textContent = '';
      setTimeout(() => { live.textContent = msg; }, 30);   // re-set so a repeat is re-announced
    }
    function renderSortMenu() {
      const menu = document.getElementById('sortMenu');
      menu.innerHTML = `<div class="sort-cap" aria-hidden="true">${inPlanView() ? 'Sort places not in the plan' : 'Sort by'}</div>` + SORT_MODES.map(m => {
        const off = m === 'nearest' && nearestState === 'off';
        const why = m === 'nearest' ? (nearestState === 'off' ? nearestWhy : nearestState === 'pending' ? 'Locating…' : '') : '';
        return `<button class="sort-opt${off ? ' is-off' : ''}" role="menuitemradio" tabindex="-1" data-sort="${m}" aria-checked="${m === sortMode}"${why ? ` aria-describedby="sortWhy-${m}"` : ''}>` +
          `<svg class="sort-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5l5.5 5.5L20.5 6" fill="none" stroke="currentColor" stroke-width="2.25"/></svg><span>${escapeHtml(SORT_LABELS[m])}</span>` +
          `<span class="sort-why" id="sortWhy-${m}">${escapeHtml(why)}</span></button>`;
      }).join('');
    }
    function sortMenuOpen() { return !document.getElementById('sortMenu').hidden; }
    function placeSortMenu(menu = document.getElementById('sortMenu')) {
      const btn = document.getElementById('sortBtn');
      // Above the whole header band (it rises off the sheet's top edge, over
      // the map); below the button only when there's no room above.
      const r = btn.getBoundingClientRect(), band = btn.closest('#locationsHeader').getBoundingClientRect();
      const w = menu.offsetWidth, h = menu.offsetHeight;
      const vw = document.documentElement.clientWidth;
      const above = band.top - h >= 8;
      menu.style.top = `${above ? band.top - h - 2 : r.bottom + 6}px`;   // its 2px ink offset ends exactly on the band's top line
      menu.style.left = `${Math.max(8, Math.min(vw - w - 8, r.right - w))}px`;
      menu.style.setProperty('--slip-from', above ? '4px' : '-4px');
      return above;
    }
    function openSortMenu() {
      const btn = document.getElementById('sortBtn'), menu = document.getElementById('sortMenu');
      closeFiltersPanel();
      closeTitleMenu(false);
      renderSortMenu();
      hideSortNote();
      document.getElementById('sortScrim').hidden = false;
      document.body.classList.add('sort-open');
      menu.hidden = false;
      placeSortMenu();
      menu.classList.remove('opening'); void menu.offsetWidth; menu.classList.add('opening');
      btn.setAttribute('aria-expanded', 'true');
      const cur = menu.querySelector('[aria-checked="true"]') || menu.querySelector('.sort-opt');
      cur.focus({ preventScroll: true });
    }
    function closeSortMenu(refocus = true) {
      const menu = document.getElementById('sortMenu');
      if (menu.hidden) return;
      menu.hidden = true; menu.classList.remove('opening');
      document.getElementById('sortScrim').hidden = true;
      document.body.classList.remove('sort-open');
      const btn = document.getElementById('sortBtn');
      btn.setAttribute('aria-expanded', 'false');
      if (refocus) btn.focus({ preventScroll: true });
    }
    // opts.reframe false: the caller moves the map itself (a list-row tap flies to the place).
    function closeFiltersPanel(opts = {}) {
      const was = document.getElementById('filtersPanel').classList.contains('visible');
      document.getElementById('filtersPanel').classList.remove('visible');
      document.getElementById('toggleFiltersBtn').classList.remove('active');
      document.getElementById('toggleFiltersBtn').setAttribute('aria-expanded', 'false');
      if (!was) return;
      if (opts.reframe !== false) reframeAfterPanel();   // Plans: the same re-fit rule as the toggle button
      else lastPlanFit = null;   // the map is about to be moved: it is no longer the app's fit
      placePlanSlip();   // the list moved under the slip
    }

    function setSortMode(mode, { announce = true, persist = true } = {}) {
      if (!SORT_MODES.includes(mode)) mode = SORT_DEFAULT;
      const prev = sortMode;
      sortMode = mode;
      if (persist) writeSortMode(mode);
      if (mode === 'nearest') startNearest(); else if (prev === 'nearest') stopNearest();
      syncSortButton();
      updateUI();
      if (announce) announceSort(mode === 'nearest' && !sortFix ? 'Sort: Nearest. Finding your location.' : `Sort: ${SORT_LABELS[mode]}`);
    }

    // ---- Nearest: location only on request, one watcher, threshold re-sort --
    function takeFix(lat, lng) {
      lastFix = { lat, lng };
      if (sortMode !== 'nearest') return;
      const first = !sortFix;
      if (first || haversineKm([sortFix.lat, sortFix.lng], [lat, lng]) * 1000 >= NEAREST_RESORT_M) {
        sortFix = { lat, lng };
        updateUI();
      }
      if (nearestState !== 'ok') {
        nearestState = 'ok'; nearestWhy = '';
        syncSortButton();
        if (sortMenuOpen()) renderSortMenu();
        if (first) announceSort('Sort: Nearest');
      }
    }
    function nearestFailed(reason) {
      stopNearest();
      nearestState = 'off'; nearestWhy = reason;
      setSortMode(SORT_DEFAULT, { announce: false });
      announceSort(`Location unavailable. Sort: ${SORT_LABELS[SORT_DEFAULT]}`);
      showSortNote(`${reason} — sorted ${SORT_LABELS[SORT_DEFAULT]}`);
      if (sortMenuOpen()) renderSortMenu();
    }
    let sortNoteTimer = 0;
    function showSortNote(text) {
      const note = document.getElementById('sortNote');
      note.textContent = text; note.hidden = false; document.body.classList.add('sort-noting');
      placeSortMenu(note);
      clearTimeout(sortNoteTimer); sortNoteTimer = setTimeout(hideSortNote, 4000);
    }
    function hideSortNote() { clearTimeout(sortNoteTimer); const n = document.getElementById('sortNote'); if (n) n.hidden = true; document.body.classList.remove('sort-noting'); }
    function startNearest() {
      if (nearestWatch !== null) return;
      if (!navigator.geolocation) { nearestFailed('Not supported'); return; }
      nearestState = 'pending'; nearestWhy = '';
      clearTimeout(nearestTimer);
      nearestTimer = setTimeout(() => { if (sortMode === 'nearest' && !sortFix) nearestFailed('No fix'); }, NEAREST_WAIT_MS);
      if (lastFix) takeFix(lastFix.lat, lastFix.lng);   // e.g. center-me already found us
      try {
        nearestWatch = navigator.geolocation.watchPosition(
          p => takeFix(p.coords.latitude, p.coords.longitude),
          err => {
            if (sortMode !== 'nearest') return;
            if (err.code === 1) nearestFailed('Location off');           // PERMISSION_DENIED
            else if (!sortFix) nearestFailed('No fix');                  // unavailable / timed out before any fix
            // a later blip after a good fix keeps the order we have
          },
          { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 });
      } catch (e) { nearestFailed('No fix'); }
    }
    function stopNearest() {
      if (nearestWatch !== null && navigator.geolocation) { try { navigator.geolocation.clearWatch(nearestWatch); } catch (e) {} }
      nearestWatch = null; sortFix = null; clearTimeout(nearestTimer);
      if (nearestState === 'pending' || nearestState === 'ok') nearestState = 'idle';
    }

    function initSort() {
      const btn = document.getElementById('sortBtn'), menu = document.getElementById('sortMenu'), scrim = document.getElementById('sortScrim');
      btn.addEventListener('click', () => { if (sortMenuOpen()) closeSortMenu(); else openSortMenu(); });
      // The outside tap only dismisses: the scrim takes it, so nothing under it (map, row, button) fires.
      scrim.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); closeSortMenu(); });
      menu.addEventListener('click', e => {
        const opt = e.target.closest('.sort-opt'); if (!opt) return;
        const m = opt.getAttribute('data-sort');
        closeSortMenu();
        if (m === 'nearest' && nearestState === 'off') nearestState = 'idle';   // a tap on the greyed row is a retry
        if (m !== sortMode || (m === 'nearest' && !sortFix && nearestWatch === null)) setSortMode(m);
        else announceSort(`Sort: ${SORT_LABELS[m]}`);
      });
      menu.addEventListener('keydown', e => {
        const opts = [...menu.querySelectorAll('.sort-opt')], i = opts.indexOf(document.activeElement);
        const go = j => { e.preventDefault(); opts[(j + opts.length) % opts.length].focus(); };
        if (e.key === 'ArrowDown') go(i + 1);
        else if (e.key === 'ArrowUp') go(i - 1);
        else if (e.key === 'Home') go(0);
        else if (e.key === 'End') go(opts.length - 1);
        else if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); closeSortMenu(); }
      });
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && sortMenuOpen()) closeSortMenu(); });
      window.addEventListener('resize', () => { if (sortMenuOpen()) placeSortMenu(); });

      // Restore. Nearest resumes only when location is ALREADY granted --
      // never a permission prompt on load; otherwise it falls to A-Z.
      const saved = readSortMode();
      if (saved === 'nearest') {
        sortMode = SORT_DEFAULT;
        if (navigator.permissions && navigator.permissions.query) {
          navigator.permissions.query({ name: 'geolocation' })
            .then(s => { if (s.state === 'granted' && sortMode === SORT_DEFAULT) setSortMode('nearest', { announce: false }); })
            .catch(() => {});
        }
      } else sortMode = saved;
      syncSortButton();
    }

    // ---- First open: where a new device starts (docs/shipped.md "First open") --
    // Nothing stored on this device: ask for the location once, at boot.
    //   granted, within FIRST_OPEN_NEAR_KM of a known city -> that city, framed on you
    //   granted, no city near                              -> All cities, centred on you
    //   denied / unavailable / no answer in FIRST_OPEN_WAIT_MS -> firstOpenFallbackCity()
    // Denial is silent (no error banner). The map moves at most once after the
    // boot frame: the fallback is snapped in (no animation) when the data lands
    // if the location hasn't answered yet, and a fix that arrives later flies
    // there -- unless the user has already touched the page.
    const FIRST_OPEN_NEAR_KM = 80;      // "about a day trip" to the city's centre
    const FIRST_OPEN_WAIT_MS = 8000;

    // Time zone -> a representative [lat, lng], for the no-places fallback.
    // Small on purpose: zones near the CITIES seed plus North America's main
    // ones. An unlisted zone falls through to DEFAULT_CITY.
    const TZ_POINTS = {
      'Atlantic/Reykjavik': [64.15, -21.94], 'Europe/Copenhagen': [55.68, 12.57],
      'Europe/Stockholm': [59.33, 18.07], 'Europe/Oslo': [59.91, 10.75],
      'Europe/Helsinki': [60.17, 24.94], 'Europe/Berlin': [52.52, 13.40],
      'Europe/Amsterdam': [52.37, 4.90], 'Europe/Paris': [48.86, 2.35],
      'Europe/London': [51.51, -0.13], 'Europe/Dublin': [53.35, -6.26],
      'America/Los_Angeles': [34.05, -118.24], 'America/Vancouver': [49.28, -123.12],
      'America/Phoenix': [33.45, -112.07], 'America/Denver': [39.74, -104.99],
      'America/Chicago': [41.88, -87.63], 'America/New_York': [40.71, -74.01],
      'America/Toronto': [43.65, -79.38], 'America/Anchorage': [61.22, -149.90],
      'Pacific/Honolulu': [21.31, -157.86]
    };

    // The fallback chain, in order:
    //   1. the city of the most recently added place (locations arrive
    //      created_at DESC). The data is shared today; with per-person
    //      accounts this becomes the user's own newest place.
    //   2. no places: the known city nearest the device's time zone
    //      (no permission, no network);
    //   3. DEFAULT_CITY.
    function firstOpenFallbackCity() {
      const newest = locations.find(l => CITIES[l.city]);
      if (newest) return newest.city;
      try {
        const pt = TZ_POINTS[Intl.DateTimeFormat().resolvedOptions().timeZone];
        if (pt) return Object.keys(CITIES)
          .sort((a, b) => haversineKm(pt, CITIES[a].center) - haversineKm(pt, CITIES[b].center))[0];
      } catch (e) { /* no Intl time zone: the default */ }
      return DEFAULT_CITY;
    }

    function startFirstOpen() {
      let answer = null;          // null pending | { lat, lng } | 'none'
      let data = false;           // the boot load has landed
      let framed = false;         // the fallback is on screen
      let done = false;           // the location has been applied (or given up on)
      let touched = false;        // the user has started using the page
      const touch = () => { touched = true; };
      document.addEventListener('pointerdown', touch, { capture: true, once: true });
      document.addEventListener('keydown', touch, { capture: true, once: true });

      const applyFallback = () => {
        if (framed) return;
        framed = true;
        // Already using the page (e.g. picked a city): keep what's on screen.
        if (touched) return persistCitySelection(citySelection);
        setActiveCity(firstOpenFallbackCity(), { animate: false, reveal: false });
      };
      const applyFix = ({ lat, lng }) => {
        done = true;
        takeFix(lat, lng);        // Nearest reuses it, no second prompt
        if (touched && framed) return;   // never yank a page the user is already using
        const near = rankCitiesByProximity([lat, lng], FIRST_OPEN_NEAR_KM)[0];
        const animate = framed;   // boot frame -> snap; fallback on screen -> one fly
        setActiveCity(near ? near.cityId : ALL_CITIES, { frame: false, reveal: false });
        placeUserLocationMarker(lat, lng);
        if (!(inPlanView() && activePlan())) focusMap([lat, lng], SOLO_MIN_ZOOM, { animate });
      };
      const settle = () => {
        if (done) return;
        if (answer && answer !== 'none') return applyFix(answer);
        if (data) applyFallback();      // pending or refused: the fallback, now
        if (answer === 'none' && framed) done = true;
      };

      const giveUp = setTimeout(() => { if (!answer) { answer = 'none'; settle(); } }, FIRST_OPEN_WAIT_MS);
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            clearTimeout(giveUp);
            // A late answer (after the wait) still lands if the page is untouched.
            answer = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            done = false;
            settle();
          },
          () => { clearTimeout(giveUp); if (!answer) { answer = 'none'; settle(); } },   // silent
          { enableHighAccuracy: false, maximumAge: 600000, timeout: FIRST_OPEN_WAIT_MS }
        );
      } else {
        answer = 'none';
      }
      return { dataLoaded() { data = true; settle(); } };
    }

    // =========================================================================
    // PLANS (design/plans-deepdive/v3/README.md, docs/shipped.md "Plans").
    // A plan is a named, ordered list of stops -- pins or districts/streets,
    // any city. `plans` + `plan_stops` in Supabase (supabase/migrations/
    // 20260929000000_add_plans.sql), same RLS as locations. The list title's
    // menu picks Places or Plans (and the city / plan); it changes only what
    // the list shows (and so what the map draws). Filters and sort are shared. Plans is where you build AND follow a plan: the stops in order,
    // a captioned divider, then every place the filters match with +.
    // Fails soft: until the tables exist the Plans side says so, and Places
    // is exactly the app it was.
    // =========================================================================
    const LIST_VIEW_KEY = 'triplet.listView';      // per device: 'places' | 'plans'
    const ACTIVE_PLAN_KEY = 'triplet.activePlan';  // per device: the plan last open
    const PLAN_NAME_MAX = 80;                      // = the plans.name CHECK
    const PLAN_SVG = {
      check: '<svg class="plan-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5l5.5 5.5L20.5 6" fill="none" stroke="currentColor" stroke-width="2.25"/></svg>',
      plus: '<svg class="plan-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.25"/></svg>',
      more: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>'
    };

    function inPlanView() { return listView === 'plans'; }
    function activePlan() { return plans.find(p => p.id === activePlanId) || null; }
    function stopsOf(planId) {
      return planStops.filter(s => s.plan_id === planId)
        .sort((a, b) => (a.position - b.position) || String(a.id).localeCompare(String(b.id)));
    }
    function stopCount(planId) { return planRowsFor(planId).length; }

    // The plan's stops that resolve to a loaded place or shape, in order,
    // numbered 1..m (one grey number state; there is no NEXT).
    function planRowsFor(planId) {
      if (!planId) return [];
      const rows = [];
      stopsOf(planId).forEach(s => {
        if (s.location_id != null) {
          const loc = locations.find(l => l.id === s.location_id);
          if (loc) rows.push({ stop: s, loc });
        } else if (s.shape_id != null) {
          const nb = neighborhoodShapes.find(n => n.id === Number(s.shape_id));
          if (nb) rows.push({ stop: s, nb });
        }
      });
      rows.forEach((r, i) => { r.n = i + 1; r.m = rows.length; });
      return rows;
    }

    // One lookup for every surface (list, map, popup), recomputed only when
    // an input changes identity: every writer of these arrays replaces them.
    function planMarks() {
      const key = [listView, activePlanId, planStops, locations, neighborhoodShapes];
      if (planMarksCache && planMarksCache.key.every((v, i) => v === key[i])) return planMarksCache;
      const rows = inPlanView() ? planRowsFor(activePlanId) : [];
      const byLoc = new Map(), byShape = new Map();
      rows.forEach(r => { if (r.loc) byLoc.set(r.loc.id, r); else byShape.set(r.nb.id, r); });
      planMarksCache = { key, rows, byLoc, byShape };
      return planMarksCache;
    }
    function planMark(kind, id) { const pm = planMarks(); return (kind === 'loc' ? pm.byLoc : pm.byShape).get(id) || null; }
    function planMarkKey(kind, id) { const r = planMark(kind, id); return r ? `${r.n}/${r.m}` : ''; }
    function planStopLine(kind, id) { const r = planMark(kind, id); return r ? `Stop ${r.n} of ${r.m}` : ''; }

    // A STOP row's number takes the glyph column -- centred on the app's left
    // axis, x=30, the centre of every Places icon -- and its text starts at 56,
    // as every row's. Rows below the divider are plain Places rows. The number
    // is one grey state; it is the drag handle (hold STOP_HOLD_MS) and the
    // keyboard's reorder control.
    function numSpan(r, label) {
      const aria = `Stop ${r.n} of ${r.m}, ${escapeAttr(label)}. Hold and drag, or use the arrow keys (Home / End for first / last), to move it.`;
      return `<span class="row-n" role="button" tabindex="0" aria-label="${aria}">${r.n}</span>`;
    }
    function planLead(stop, category, kind, ink, label) {
      if (!(stop && inPlanView() && activePlan())) return `<div class="row-badge" style="--row-ink:${ink}">${badgeHtml(category, kind, 24)}</div>`;
      // A stop's lead is its number alone, in the glyph column (add-tag-jam phase 1); the
      // category stays in the meta line.
      return `<div class="row-lead">${numSpan(stop, label)}</div>`;
    }
    function rowActionHtml(stop, label) {
      if (!inPlanView()) return '<button class="delete-btn" aria-label="Delete">&times;</button>';
      const p = activePlan();
      if (!p) return '';
      if (stop) return `<button class="delete-btn plan-x" aria-label="Remove ${escapeAttr(label)} from ${escapeAttr(p.name)}">&times;</button>`;
      return `<button class="delete-btn plan-add" aria-label="Add ${escapeAttr(label)} to ${escapeAttr(p.name)}"><span class="plan-add-glyph" aria-hidden="true">&times;</span></button>`;
    }

    // A district/street's popup IS the pin popup (2026-10-02): star, title, note,
    // Get Directions (to a point on the shape), the type line with "Stop n of m",
    // Mark Visited -- built from its row item.
    function shapePopupHtml(nb) { return buildPopupHtml(shapeRowItem(nb)); }
    // Everything the shape popup shows (syncNeighborhoodLayers() re-sets it on a change).
    function shapePopupSignature(nb) {
      return [nb.label, nb.type, nb.color, nb.note, !!nb.visited, !!nb.starred, planMarkKey('shape', nb.id), nb.city].join('|');
    }

    // r18 (owner: "change the icon to the number like we used to do ... only on the map"): a stop
    // that is its own pin shows its NUMBER in place of the category glyph -- the same ring in its
    // category ink (dashed for an approximate pin, a diamond for a district/street), the same
    // paper field, the near size at every zoom; the numeral is the one grey number style
    // (--ink-2, 13px/700; 12px for two digits). Selected: the ring fills with its ink and the
    // numeral turns paper, as a selected Places pin does. The star keeps its corner. No tag.
    // A VISITED stop keeps its number (the plan's identity) and becomes the
    // round cream sticker (an approximate pin's dashes and a district's
    // diamond go: visited is less information), the flap peeled over the face -- no check; the
    // number is printed ON the face like the check (stickerPrintHtml()), so the flap lies over
    // it and nothing of it shows past the fold. Selected: ink face, paper numeral, as above.
    function planNumberIcon(category, kind, ink, r, size, highlighted, starred, visited = false) {
      const sp = visited ? stickerPinParts({ size, near: true, hi: highlighted, check: false, ang: stickerCorner(r.loc ? r.loc.id : (r.nb ? shapeKey(r.nb.id) : null), starred), sz: -0.5 }) : null;   // a small flap (chord at 0.82 of the radius): the number is printed under it and never cut
      const badge = sp ? sp.base : badgeHtml(category, kind, size, { ink, fill: highlighted ? ink : '#F2EBDD', mark: ink, rim: highlighted ? 2.5 : 2, glyph: false });
      const star = starred ? (sp ? stickerStarHtml(size) : markerStarHtml(size)) : '';
      const html = `<div class="plan-stop${highlighted ? ' highlighted-marker' : ''}${visited ? ' is-visited stk-pin' : ''}" data-n="${r.n}" style="position:relative;width:${size}px;height:${size}px;line-height:0;">${badge}${sp ? stickerPrintHtml(sp.g, `<span class="pin-n${r.n > 9 ? ' two' : ''}"`, `${r.n}</span>`) + sp.flap : `<span class="pin-n${r.n > 9 ? ' two' : ''}">${r.n}</span>`}${star}</div>`;
      return L.divIcon({ html, className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
    }

    // A shape stop has no pin, so it gets a numbered diamond at the shape's
    // centroid -- one mark per stop, so the map reads 1..m with no gaps; a tap
    // is the row's tap. Below SOLO_MIN_ZOOM it clusters like a pin (at its
    // centroid, mapVisibleLocations()); clustered, its own mark hides and the
    // cluster counts and tags it.
    const planShapeMarkers = new Map();   // shape id -> { marker, sig }
    function syncPlanShapeMarkers() {
      if (!map) return;
      const seen = new Set();
      if (inPlanView()) {
        planMarks().rows.forEach(r => {
          if (!r.nb) return;
          if (clusteredShapeIds.has(r.nb.id)) return;   // inside a cluster: the cluster counts and tags it
          const c = shapeCentroid(r.nb);
          if (!c) return;
          const id = r.nb.id;
          seen.add(id);
          const ink = r.nb.color || categoryInk(r.nb.type);
          const sig = [r.n, c.join(), ink, r.nb.type, !!r.nb.starred, !!r.nb.visited].join('|');
          const had = planShapeMarkers.get(id);
          if (had && had.sig === sig) return;
          if (had) map.removeLayer(had.marker);
          const marker = L.marker(c, {
            icon: planNumberIcon(r.nb.type, 'diamond', ink, r, MARKER_SIZE_NEAR, false, !!r.nb.starred, !!r.nb.visited),
            zIndexOffset: Z_PLAN_STOP - r.n,
            title: `Stop ${r.n}: ${r.nb.label}`
          }).addTo(map);
          marker.on('click', () => focusShape(id));
          planShapeMarkers.set(id, { marker, sig });
        });
      }
      planShapeMarkers.forEach((e, id) => {
        if (seen.has(id)) return;
        map.removeLayer(e.marker);
        planShapeMarkers.delete(id);
      });
    }

    // Owner (2026-10-01): an empty list says why. The city has places but the category chips
    // hide them all: "Nothing matches these filters."; a city with no places at all: "Nothing
    // here yet." (Places, and below the divider in Plans.)
    function emptyMatchText() {
      const exist = locations.some(l => cityShown(l.city)) || neighborhoodShapes.some(n => cityShown(n.city));
      return exist ? 'Nothing matches these filters.' : 'Nothing here yet.';
    }
    function emptyText(planMode) {
      if (!planMode) return emptyMatchText();
      if (plansAvailable === false) return 'Plans aren’t set up yet.';
      if (plansAvailable === null) return plansOffline ? 'Offline. Plans load when you’re back online.' : 'Loading plans…';
      if (!activePlan()) return 'Pick a plan.';
      return 'No stops yet.';
    }

    // Plans' own reconciler over the same card maps (pins AND shapes, one
    // list). The Places reconcilers (syncPlacesList) never
    // run in Plans. The list = the plan's stops (all of them, in plan order,
    // whatever the filters: the chips choose what you can add, they never hide
    // your plan) / Places' group divider with a caption / every place and
    // shape the filters match that is not a stop, in the current sort.
    const planRule = document.createElement('div');
    planRule.className = 'plan-rule'; planRule.setAttribute('role', 'separator');
    const planStopsNote = document.createElement('div'); planStopsNote.className = 'plan-list-note';
    planStopsNote.textContent = 'No stops yet · tap + on a place below';
    const planOthersNote = document.createElement('div'); planOthersNote.className = 'plan-list-note';
    // Rename / Delete plan live at the foot of the open plan's stops (no per-row mark on
    // the plans list): today's .plan-act text buttons, on the gutter. Rename swaps the foot for
    // today's in-row form.
    const planFoot = document.createElement('div'); planFoot.className = 'plan-foot';
    const addHeads = new Map();   // the open plan's add-from city sections: city id -> { el, sig }
    let planFootSig = null;
    function renderPlanFoot() {
      const p = activePlan(); if (!p) return;
      const renaming = planPanel.mode === 'renaming' && planPanel.target === p.id;
      const sig = renaming ? 'form' : 'acts|' + p.name;
      if (sig !== planFootSig) {
        planFootSig = sig;
        planFoot.className = renaming ? 'plan-foot plan-form' : 'plan-foot';
        planFoot.innerHTML = renaming ? planFormHtml('Plan name', 'save')
          : `<button type="button" class="plan-act" data-act="foot-rename">Rename</button><button type="button" class="plan-act" data-act="foot-delete">Delete plan…</button>`;
        planFoot.setAttribute('role', 'group'); planFoot.setAttribute('aria-label', p.name);
      }
      const input = planFoot.querySelector('input');
      if (input && planPanel.focusInput) { planPanel.focusInput = false; requestAnimationFrame(() => { input.focus({ preventScroll: true }); input.setSelectionRange(input.value.length, input.value.length); }); }
    }
    // "Add places · cafe 4": where the plan ends, and what the filters put below it.
    function ruleCaption(n) {
      const all = Object.keys(CATEGORY_COLORS), on = all.filter(c => filters.categories[c]);
      const cats = on.length === all.length ? '' : !on.length ? ' · no categories' : on.length <= 2 ? ' · ' + on.join(', ') : ` · ${on.length} categories`;
      return `<span class="rule-cap"><span class="h-name">Add places${escapeHtml(cats)}</span><span class="tally">${n}</span></span>`;
    }
    function addableTally(id, pm = planMarks()) {
      return locations.filter(l => l.city === id && filters.categories[l.category] && !pm.byLoc.has(l.id)).length +
        neighborhoodShapes.filter(n => n.city === id && filters.categories[n.type] && !pm.byShape.has(n.id)).length;
    }
    function planOthers() {
      const pm = planMarks();
      const locs = visibleLocations().filter(l => !pm.byLoc.has(l.id));
      const shapes = visibleNeighborhoodShapes().filter(n => !pm.byShape.has(n.id));
      return { locs: heldOrder(locs) || sortLocations(locs), shapes: heldOrder(shapes, shapeRowKey) || sortShapes(shapes) };
    }
    function othersNoteText() {
      const any = locations.some(l => filters.categories[l.category] && cityShown(l.city)) ||
        neighborhoodShapes.some(n => filters.categories[n.type] && cityShown(n.city));
      return any ? 'Every place these filters match is in this plan.' : emptyMatchText();
    }
    // 9 (UX): after + / x (and their Undo) the rows on either side of the change slide to open or
    // close the gap (150ms, .plan-shift; instant with reduced motion); the changed row just appears.
    let planFlipNext = null, planSliding = false;
    function flipPlanList(list, before, changed) {
      if (prefersReducedMotion()) return;
      const moved = [];
      [...list.children].forEach(el => {
        const t0 = before.get(el);
        if (t0 == null || el === changed || el.classList.contains('plan-lifted')) return;
        const dy = t0 - el.getBoundingClientRect().top;
        if (Math.abs(dy) < 0.5) return;
        el.classList.remove('plan-shift'); el.style.transform = `translateY(${dy}px)`; moved.push(el);
      });
      if (!moved.length) return;
      void list.offsetHeight;
      moved.forEach(el => { el.classList.add('plan-shift'); el.style.transform = ''; });
      // During the slide every spot near the rule is crossed by a moving row (the old rule spot is
      // the new stop's, the new one is where the next row slides from), so the slip waits it out
      // and appears on the settled rule (critics-final P1); its 6s starts as usual.
      planSliding = true; placePlanSlip();
      setTimeout(() => { moved.forEach(el => { if (!el.style.transform) el.classList.remove('plan-shift'); }); planSliding = false; placePlanSlip(); }, 200);
    }
    function syncPlanCards(rows) {
      const list = document.getElementById('locationsList');
      const flip = planFlipNext; planFlipNext = null;
      const before = flip ? new Map([...list.children].map(el => [el, el.getBoundingClientRect().top])) : null;
      const want = [];
      const seenLoc = new Set(), seenShape = new Set(), seenAdd = new Set();
      const open = !!activePlan();
      const others = open ? planOthers() : { locs: [], shapes: [] };
      const pm = planMarks();
      // Leg sections: the stops in stop order, broken where the stop's city changes; a city can
      // recur (two Reykjavík legs, each its own header). No eye: a stop is never hidden.
      const legs = [];
      rows.forEach(r => { const c = r.loc ? r.loc.city : r.nb.city; if (!legs.length || legs[legs.length - 1].city !== c) legs.push({ city: c, rows: [] }); legs[legs.length - 1].rows.push(r); });
      currentLegs = legs;
      const seq = [];
      legs.forEach((l, i) => { seq.push({ leg: i }); l.rows.forEach(r => seq.push(r)); });
      if (open) {
        if (!rows.length) want.push(planStopsNote); else if (planStopsNote.parentNode) planStopsNote.remove();
        seq.push({ foot: true });
        seq.push({ rule: true });
        // the addable places in city sections -- Places' own header (name = go to, tally,
        // eye), same order, same hidden state (one hiddenCities for both kinds).
        const pinsBy = new Map(), shapesBy = new Map();
        others.locs.forEach(l => { if (!pinsBy.has(l.city)) pinsBy.set(l.city, []); pinsBy.get(l.city).push(l); });
        others.shapes.forEach(n => { if (!shapesBy.has(n.city)) shapesBy.set(n.city, []); shapesBy.get(n.city).push(n); });
        let firstAdd = true;
        sectionCityIds().forEach(id => {
          const ps = pinsBy.get(id) || [], ss = shapesBy.get(id) || [], hidden = hiddenCities.has(id);
          if (!ps.length && !ss.length && !(hidden && (CITIES[id] || cityHasPlaces(id)))) return;
          // A hidden section's tally: what it would add if shown (its chip-matching places, not stops) -- never 0.
          const n = hidden ? addableTally(id, pm) : ps.length + ss.length;
          seq.push({ add: id, first: firstAdd, hidden, n }); firstAdd = false;
          ps.forEach(loc => seq.push({ loc }));
          ss.forEach(nb => seq.push({ nb }));
        });
        if (!others.locs.length && !others.shapes.length) { planOthersNote.textContent = othersNoteText(); seq.push({ note: true }); }
        else if (planOthersNote.parentNode) planOthersNote.remove();
      } else { [planRule, planStopsNote, planOthersNote, planFoot].forEach(n => { if (n.parentNode) n.remove(); }); }
      planRule.innerHTML = ruleCaption(others.locs.length + others.shapes.length);
      seq.forEach((r, i) => {
        if (r.leg != null) { const e = headEntry(legHeads, r.leg); renderLegHead(e, r.leg, legs[r.leg], !want.length); want.push(e.el); return; }
        if (r.rule) { want.push(planRule); return; }
        if (r.foot) { renderPlanFoot(); want.push(planFoot); return; }
        if (r.add != null) { const e = headEntry(addHeads, r.add); renderCityHead(e, r.add, r.n, r.hidden, r.first, 'addgo'); seenAdd.add(r.add); want.push(e.el); return; }
        if (r.note) { want.push(planOthersNote); return; }
        if (r.loc) {
          const loc = r.loc;
          seenLoc.add(loc.id);
          let entry = cardsById.get(loc.id);
          if (!entry) { entry = { el: createCard(loc), signature: null }; cardsById.set(loc.id, entry); }
          const signature = cardSignature(loc);
          if (signature !== entry.signature && !starHeld.has(loc.id)) { renderCard(entry.el, loc); entry.signature = signature; }
          entry.el.classList.toggle('highlighted', loc.id === highlightedId);
          entry.el.classList.toggle('is-stop', !!r.stop);
          const nx = seq[i + 1];
          entry.el.classList.toggle('group-end', !r.stop && sortMode === 'category' && !!(nx && nx.loc) && nx.loc.category !== loc.category);
          want.push(entry.el);
        } else {
          const nb = r.nb, item = shapeRowItem(nb);
          seenShape.add(nb.id);
          let entry = shapeCardsById.get(nb.id);
          if (!entry) { entry = { el: createCard(item), signature: null }; shapeCardsById.set(nb.id, entry); }
          const signature = cardSignature(item);
          if (signature !== entry.signature && !starHeld.has(item.id)) { renderCard(entry.el, item); entry.signature = signature; }
          entry.el.classList.toggle('is-stop', !!r.stop);
          want.push(entry.el);
        }
      });
      cardsById.forEach((entry, id) => { if (!seenLoc.has(id)) { entry.el.remove(); cardsById.delete(id); } });
      shapeCardsById.forEach((entry, id) => { if (!seenShape.has(id)) { entry.el.remove(); shapeCardsById.delete(id); } });
      legHeads.forEach((e, k) => { if (k >= legs.length) { e.el.remove(); legHeads.delete(k); } });
      addHeads.forEach((e, k) => { if (!seenAdd.has(k)) { e.el.remove(); addHeads.delete(k); } });
      if (!open && planFoot.parentNode) planFoot.remove();
      want.forEach((el, i) => { if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null); });
      if (before) {
        const changed = typeof flip === 'object' ? (flip.locationId != null ? cardsById.get(flip.locationId) : shapeCardsById.get(Number(flip.shapeId))) : null;
        flipPlanList(list, before, changed && changed.el);
      }
    }

    // ---- per-device view state --------------------------------------------
    function writePlanPrefs() {
      try {
        localStorage.setItem(LIST_VIEW_KEY, listView);
        if (activePlanId) localStorage.setItem(ACTIVE_PLAN_KEY, activePlanId); else localStorage.removeItem(ACTIVE_PLAN_KEY);
      } catch (e) { /* private mode etc.: the view just won't persist */ }
    }
    function restorePlanPrefs() {
      try {
        if (localStorage.getItem(LIST_VIEW_KEY) === 'plans') listView = 'plans';
        activePlanId = localStorage.getItem(ACTIVE_PLAN_KEY) || null;
      } catch (e) { /* nothing stored: Places */ }
    }

    // ---- reads ------------------------------------------------------------
    // Polled with locations (pollTick) so the other traveller's changes
    // arrive. Any read error -- above all "table doesn't exist yet" before
    // the migration is applied -- fails SOFT: no banner, no throw; the Plans
    // side says plans aren't available, and a later good read recovers.
    async function doFetchPlans() {
      let res;
      try {

      const label = cityLabel(id);
      e.el.innerHTML = `<h3 class="sec-title"><button type="button" class="sec-name" data-${goAttr}="${escapeAttr(id)}" aria-label="Go to ${escapeAttr(label)}, ${n}${hidden ? ', hidden' : ''}"><span class="h-name">${escapeHtml(label)}</span><span class="tally">${n}</span></button></h3>` +
        `<button type="button" class="sec-eye" data-eye="${escapeAttr(id)}" aria-label="${hidden ? 'Show' : 'Hide'} ${escapeAttr(label)}">${eyeSvg(hidden, '--paper')}</button>`;
    }
    function renderLegHead(e, i, leg, first) {
      const label = cityLabel(leg.city), n = leg.rows.length, sig = [label, n, first].join('|');
      e.el.classList.add('is-leg');
      e.el.classList.toggle('is-first', first);
      if (sig === e.sig) return;
      e.sig = sig;
      e.el.innerHTML = `<h3 class="sec-title"><button type="button" class="sec-name" data-leg="${i}" aria-label="Show ${escapeAttr(label)}, ${n} ${n === 1 ? 'stop' : 'stops'}, on the map"><span class="h-name">${escapeHtml(label)}</span><span class="tally">${n}</span></button></h3>`;
    }
    function dropHeads(store) { store.forEach(e => e.el.remove()); store.clear(); }

    // Places: one section per city, in the menu's order -- a header per city that has a shown
    // place matching the chips, or that is hidden (its header only, greyed). Inside a section,
    // today's sort, applied per section; shapes keep their block after the pins.
    function syncPlacesList(visible, visibleShapes) {
      const list = document.getElementById('locationsList');
      const pinsBy = new Map(), shapesBy = new Map();
      visible.forEach(l => { if (!pinsBy.has(l.city)) pinsBy.set(l.city, []); pinsBy.get(l.city).push(l); });
      visibleShapes.forEach(n => { if (!shapesBy.has(n.city)) shapesBy.set(n.city, []); shapesBy.get(n.city).push(n); });
      const want = [], seenLoc = new Set(), seenShape = new Set(), seenHead = new Set();
      sectionCityIds().forEach(id => {
        const pins = pinsBy.get(id) || [], shapes = shapesBy.get(id) || [], hidden = hiddenCities.has(id);
        if (!pins.length && !shapes.length && !(hidden && (CITIES[id] || cityHasPlaces(id)))) return;
        const head = headEntry(cityHeads, id);
        renderCityHead(head, id, cityTally(id), hidden, !want.length);
        seenHead.add(id); want.push(head.el);
        pins.forEach((loc, i) => {
          seenLoc.add(loc.id);
          let entry = cardsById.get(loc.id);
          if (!entry) { entry = { el: createCard(loc), signature: null }; cardsById.set(loc.id, entry); }
          const signature = cardSignature(loc);
          // Held while the pencil star owns this row (settleStarDrag() / ssReplay() / vsReplay()).
          if (signature !== entry.signature && !starHeld.has(loc.id)) { renderCard(entry.el, loc); entry.signature = signature; }
          entry.el.classList.toggle('highlighted', loc.id === highlightedId);
          // Category order: the last row of each category run (in its section) carries an ink rule.
          entry.el.classList.toggle('group-end', sortMode === 'category' && i < pins.length - 1 && pins[i + 1].category !== loc.category);
          want.push(entry.el);
        });
        shapes.forEach(nb => {
          const item = shapeRowItem(nb);
          seenShape.add(nb.id);
          let entry = shapeCardsById.get(nb.id);
          if (!entry) { entry = { el: createCard(item), signature: null }; shapeCardsById.set(nb.id, entry); }
          const signature = cardSignature(item);
          // Held while a row gesture owns it, as a pin row.
          if (signature !== entry.signature && !starHeld.has(item.id)) { renderCard(entry.el, item); entry.signature = signature; }
          want.push(entry.el);
        });
      });
      cardsById.forEach((entry, id) => { if (!seenLoc.has(id)) { entry.el.remove(); cardsById.delete(id); } });
      shapeCardsById.forEach((entry, id) => { if (!seenShape.has(id)) { entry.el.remove(); shapeCardsById.delete(id); } });
      cityHeads.forEach((e, id) => { if (!seenHead.has(id)) { e.el.remove(); cityHeads.delete(id); } });
      want.forEach((el, i) => { if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null); });
      return want.length - seenHead.size;   // rows
    }

    // ---- All plans: one row per plan, then New plan (or its create form) ----
    const planListRows = new Map();   // key -> { el, sig }
    const ROUTE_22 = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M8.5 6h5a3 3 0 0 1 0 6h-3a3 3 0 0 0 0 6h5"/></g></svg>';
    const ROW_CHEV = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    // "3 stops · Reykjavík", its cities in stop order ("Copenhagen → Malmö").
    function planMetaText(id) {
      const rows = planRowsFor(id), n = rows.length, cities = [];
      rows.forEach(r => { const c = r.loc ? r.loc.city : r.nb.city; if (c && cities[cities.length - 1] !== c) cities.push(c); });
      return `${n} ${n === 1 ? 'stop' : 'stops'}${cities.length ? ' · ' + cities.map(cityLabel).join(' → ') : ''}`;
    }
    function planFormHtml(lbl, act) {
      return `<input type="text" maxlength="${PLAN_NAME_MAX}" enterkeyhint="done" autocomplete="off" aria-label="${lbl}" placeholder="Plan name" value="${escapeAttr(planPanel.draft)}">` +
        `<button type="button" class="plan-act" data-act="cancel">Cancel</button><button type="button" class="plan-act primary" data-act="${act}">${act === 'create' ? 'Create' : 'Save'}</button>`;
    }
    function syncPlansList() {
      const list = document.getElementById('locationsList');
      const want = [], seen = new Set();
      const put = (key, cls, html, attrs = {}) => {
        let e = planListRows.get(key);
        const sig = cls + '\u0000' + html;
        if (!e) { e = { el: document.createElement('div'), sig: null }; planListRows.set(key, e); }
        if (e.sig !== sig) {
          e.sig = sig; e.el.className = cls; e.el.innerHTML = html;
          [...e.el.attributes].forEach(a => { if (a.name !== 'class') e.el.removeAttribute(a.name); });
          Object.entries(attrs).forEach(([k, v]) => e.el.setAttribute(k, v));
        }
        seen.add(key); want.push(e.el); return e;
      };
      const creating = planPanel.mode === 'creating';
      if (plansAvailable === true) {   // zero plans: the New plan row alone
        plans.forEach(p => {
          const meta = planMetaText(p.id);
          put('p:' + p.id, 'plan-row', `<button type="button" class="plan-open" data-plan="${escapeAttr(p.id)}" aria-label="${escapeAttr(p.name)}, ${escapeAttr(meta)}"><span class="plan-ico">${ROUTE_22}</span>` +
            `<span class="plan-text"><h3>${escapeHtml(p.name)}</h3><span class="row-meta">${escapeHtml(meta)}</span></span></button>` +
            `<span class="plan-row-end"><span class="plan-chev" data-plan="${escapeAttr(p.id)}" aria-hidden="true">${ROW_CHEV}</span></span>`);
        });
        if (creating) put('new', 'plan-form', planFormHtml('New plan name', 'create'), { 'data-form': 'create' });
        else put('new', 'plan-row plan-new-row', `<button type="button" class="plan-open" data-act="new"><span class="plan-ico">${MENU_SVG.plus}</span><span class="plan-new-lab">New plan</span></button>`);
      }
      planListRows.forEach((e, k) => { if (!seen.has(k)) { e.el.remove(); planListRows.delete(k); } });
      want.forEach((el, i) => { if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null); });
      const input = list.querySelector('.plan-form input');
      if (input && planPanel.focusInput) {
        planPanel.focusInput = false;
        input.focus({ preventScroll: true });
        input.setSelectionRange(input.value.length, input.value.length);
        input.closest('.plan-form').scrollIntoView({ block: 'nearest' });
      }
      return want.length;
    }

    // The panel is as tall as its content, capped by its max-height; anything more scrolls inside it.
    function sizeFiltersPanel() {
      const pn = document.getElementById('filtersPanel');
      pn.style.height = '';
      const bw = pn.offsetHeight - pn.clientHeight;   // its top and bottom rules
      pn.style.height = `${Math.min(parseFloat(getComputedStyle(pn).maxHeight) || Infinity, pn.scrollHeight + bw)}px`;
    }
    addEventListener('resize', () => sizeFiltersPanel());
    function setPlanPanel(next) { planPanel = { mode: null, draft: '', ...next }; updateUI(); }
    async function submitPlanForm() {
      const name = cleanPlanName(planPanel.draft);
      if (!name) { const i = document.querySelector('#locationsList .plan-form input'); if (i) i.focus(); return; }
      if (planPanel.mode === 'creating') {
        setPlanPanel({});
        const id = await createPlan(name);
        if (id) choosePlan(id);
      } else if (planPanel.mode === 'renaming') {
        const id = planPanel.target;
        setPlanPanel({});
        await renamePlan(id, name);
      }
    }
    // New plan (the title menu, the plans list, the empty list's button): All plans with the
    // create form as its last row (today's form), the list raised if it was lowered.
    async function openNewPlan() {
      if (!await requireAuth()) return;
      if (!railQuery.matches && sheetIsCollapsed()) toggleSheetCollapsed();
      planPanel = { mode: 'creating', draft: '', focusInput: true };
      if (inPlanView() && !activePlanId) updateUI(); else showAllPlans({ keepPanel: true });
    }
    function initPlans() {
      const ro = new ResizeObserver(() => sizeFiltersPanel());
      ro.observe(document.getElementById('filters'));
      const list = document.getElementById('locationsList');
      // The list's own controls: section headers, the plans list and its forms. Rows keep their
      // own handlers (createCard); these nodes are never rows, so never a gesture target.
      list.addEventListener('click', async e => {
        const go = e.target.closest('.sec-name[data-go]');
        if (go) { goToCity(go.dataset.go); return; }
        const eye = e.target.closest('.sec-eye[data-eye]');
        if (eye) { setCityHidden(eye.dataset.eye, !hiddenCities.has(eye.dataset.eye)); return; }
        const ag = e.target.closest('.sec-name[data-addgo]');
        if (ag) { planGoToCity(ag.dataset.addgo); return; }
        const leg = e.target.closest('.sec-name[data-leg]');
        if (leg) { const l = currentLegs[Number(leg.dataset.leg)]; if (l) frameLeg(l.rows); return; }
        const fa = e.target.closest('.plan-foot [data-act^="foot-"]');
        if (fa) {
          const p = activePlan(); if (!p) return;
          if (!await requireAuth()) return;
          if (fa.dataset.act === 'foot-rename') setPlanPanel({ mode: 'renaming', draft: p.name, target: p.id, focusInput: true });
          // Plain words, the phone's own dialog (the app's other deletes do the same); Plans falls back to All plans.
          else if (confirm(`Delete “${p.name}”? Its places stay in your list.`)) { await deletePlan(p.id); if (inPlanView() && !activePlan()) frameAllPlans(); }
          return;
        }
        if (!e.target.closest('.plan-row, .plan-form')) return;
        const b = e.target.closest('[data-act]');
        if (b) {
          const act = b.dataset.act;
          if (act === 'cancel') setPlanPanel({});
          else if (act === 'create' || act === 'save') submitPlanForm();
          else if (act === 'new') openNewPlan();
          return;
        }
        const pick = e.target.closest('[data-plan]') || (e.target.closest('.plan-row') && e.target.closest('.plan-row').querySelector('[data-plan]'));
        if (pick) choosePlan(pick.dataset.plan);
      });
      list.addEventListener('input', e => { if (e.target.matches('.plan-form input')) planPanel.draft = e.target.value; });
      list.addEventListener('keydown', e => {
        if (!e.target.closest('.plan-form')) return;
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); setPlanPanel({}); return; }
        if (e.target.tagName === 'INPUT' && e.key === 'Enter') { e.preventDefault(); submitPlanForm(); }
      });
      // The title and its menu.
      const btn = document.getElementById('titleBtn'), menu = document.getElementById('titleMenu'), scrim = document.getElementById('menuScrim');
      btn.addEventListener('click', () => { if (titleMenuOpen()) closeTitleMenu(); else openTitleMenu(); });
      scrim.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); closeTitleMenu(); });
      menu.addEventListener('click', e => {
        const r = e.target.closest('.menu-row'); if (!r) return;
        const d = r.dataset;
        if (d.kind) {   // the quiet last row: the other kind, in place, the menu stays open
          menuKind = d.kind; renderTitleMenu(); placeTitleMenu();
          const first = menu.querySelector('.menu-row'); if (first) first.focus({ preventScroll: true });
          return;
        }
        closeTitleMenu();
        if (d.go) goToCity(d.go);
        else if (d.plans) showAllPlans();
        else if (d.plan) choosePlan(d.plan);
        else if (d.act === 'new') openNewPlan();
      });
      menu.addEventListener('keydown', e => {
        const opts = [...menu.querySelectorAll('.menu-row')], i = opts.indexOf(document.activeElement);
        const go = j => { e.preventDefault(); opts[(j + opts.length) % opts.length].focus(); };
        if (e.key === 'ArrowDown') go(i + 1);
        else if (e.key === 'ArrowUp') go(i - 1);
        else if (e.key === 'Home') go(0);
        else if (e.key === 'End') go(opts.length - 1);
        else if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); closeTitleMenu(); }
      });
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && titleMenuOpen()) closeTitleMenu(); });
      window.addEventListener('resize', () => { if (titleMenuOpen()) { menuLock = null; placeTitleMenu(); } });
    }

    function updateUI() {
      const planMode = inPlanView();
      // Plans orders its own list (syncPlanCards: the stops in plan order, then
      // the other matches in the sort); Places sorts here, as it always has.
      const visible = (() => { const v = visibleLocations(); return planMode ? v : (heldOrder(v) || sortLocations(v)); })();
      const visibleShapes = (() => { const v = visibleNeighborhoodShapes(); return planMode ? v : (heldOrder(v, shapeRowKey) || sortShapes(v)); })();
      document.body.classList.toggle('plan-view', planMode);
      document.body.classList.toggle('plan-none', planMode && !activePlan());
      renderTitle();   // after the classes: plan-none hides ⇅, which changes the room the title is fitted to
      const mapVisible = mapVisibleLocations();
      syncMarkers(mapVisible.solo);
      syncClusterMarkers(mapVisible.clusters);
      syncCityBadges(mapVisible.badges);
      let listed;
      if (planMode) {
        dropHeads(cityHeads);
        if (activePlan()) { dropPlanList(); syncPlanCards(planMarks().rows); listed = 1; }
        else {
          dropHeads(legHeads); dropHeads(addHeads); currentLegs = [];
          [planRule, planStopsNote, planOthersNote, planFoot].forEach(n => { if (n.parentNode) n.remove(); });
          cardsById.forEach(e => e.el.remove()); cardsById.clear();
          shapeCardsById.forEach(e => e.el.remove()); shapeCardsById.clear();
          listed = syncPlansList();
        }
      } else {
        dropHeads(legHeads); dropHeads(addHeads); currentLegs = []; dropPlanList();
        [planRule, planStopsNote, planOthersNote, planFoot].forEach(n => { if (n.parentNode) n.remove(); });   // the Places reconciler owns the list from row 0
        document.querySelectorAll('#locationsList .is-stop').forEach(e => e.classList.remove('is-stop'));   // Plans' marker class, back on a Places row
        // No rows: the empty line -- unless every city with places is hidden, when the list holds
        // only their greyed headers.
        const rows = syncPlacesList(visible, visibleShapes);
        listed = rows || (cityHeads.size && !locations.some(l => cityShown(l.city)) && !neighborhoodShapes.some(n => cityShown(n.city)));
      }
      syncNeighborhoodLayers();
      syncPlanShapeMarkers();
      applyPlanMap();
      placePlanSlip();   // the rule may have moved under it

      // Empty state + bottom spacer always come last, after every row and header.
      const list = document.getElementById('locationsList');
      const emptyState = document.getElementById('locationsEmpty');
      // Every city hidden: the list holds only greyed headers (no empty line).
      emptyState.style.display = !listed ? 'block' : 'none';
      const emptyText_ = [...emptyState.childNodes].find(n => n.nodeType === 3);
      if (emptyText_) emptyText_.textContent = emptyText(planMode);
      if (list.lastElementChild !== listSpacer || emptyState.nextElementSibling !== listSpacer) {
        list.appendChild(emptyState);
        list.appendChild(listSpacer);
      }
      refreshTitleMenu();
      applySectionScroll();
    }
    function dropPlanList() { planListRows.forEach(e => e.el.remove()); planListRows.clear(); }

    // ---- neighborhood shape rendering (Phase 3) ------------------------------
    // Binary add/remove at a zoom threshold, not an always-present opacity
    // fade -- below the threshold every zoom level renders pixel-identical to
    // before this feature existed.
    function neighborhoodMinZoom(nb) {
      return nb.min_zoom ?? (cityConfig(nb.city).zoom + 3);
    }

    // The dash patterns are the same two the district/street GLYPHS use, so
    // the map layer and the chrome rhyme: a street is a dotted trail, a
    // district is a tag outline -- distinguishable at a glance and in
    // monochrome, without relying on colour.
    function neighborhoodStyle(nb) {
      return nb.type === 'street'
        ? { color: nb.color || '#5A564C', weight: 6, opacity: 0.9, dashArray: '2 8', lineCap: 'round' }
        : { color: nb.color || '#5A564C', weight: 2.5, opacity: 0.9, dashArray: '6 4', fillOpacity: 0.12 };
    }

    function buildNeighborhoodLayer(nb) {
      const layer = nb.type === 'street'
        ? L.polyline(nb.geometry, neighborhoodStyle(nb))
        : L.polygon(nb.geometry, neighborhoodStyle(nb));
      layer.bindPopup(newTagPopup().setContent(shapePopupHtml(nb)));
      // A shape's tag always hangs from its anchor dot (shapeAnchor(): the
      // Directions point), wherever on the outline or line it was tapped.
      const open = layer.openPopup;
      layer.openPopup = function () { const cur = neighborhoodShapes.find(n => n.id === nb.id) || nb, at = shapeAnchor(cur); return open.call(this, at ? L.latLng(at) : undefined); };
      layer._popSig = shapePopupSignature(nb);
      return layer;
    }

    // A starred district/street carries the pins' map star (markerStarHtml's
    // glyph: ink on a paper halo, the near size) at shapeAnchor() -- a point on
    // the shape -- shown exactly while the shape's layer is. A tap opens the
    // shape's popup. A plan's shape stop has its numbered diamond, which carries
    // the star itself (planNumberIcon), so it gets none here.
    const SHAPE_STAR_PX = 12;
    function shapeStarIcon() {
      const s = SHAPE_STAR_PX, hit = 24, o = (hit - s) / 2;
      const html = `<div style="position:relative;width:${hit}px;height:${hit}px;line-height:0;">` +
        `<svg class="marker-star" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true" style="position:absolute;left:${o}px;top:${o}px;overflow:visible">` +
        `<use class="marker-star-halo" href="#g-star" stroke-width="${(3 * 24 / s).toFixed(2)}" stroke-linejoin="round"/>` +
        `<use class="marker-star-ink" href="#g-star"/></svg></div>`;
      return L.divIcon({ html, className: '', iconSize: [hit, hit], iconAnchor: [hit / 2, hit / 2] });
    }
    // A VISITED district/street carries the pins' visited sticker at the same
    // point (owner brief 2026-10-02: "the same sticker mark at the label point
    // where the starred shape's star sits"): the NEAR pin's 24px sticker --
    // cream, neutral-ink sticker (no category colour, as every visited mark), the 9px check, the flap lower-left (a
    // shape's layer only draws at close zooms, where pins are NEAR too; at
    // 16px the star covered most of the check). When the
    // shape is starred too, the sticker steps down-left so the star (its own
    // marker, unmoved) rides the sticker's upper-right shoulder, exactly as on
    // a pin. Below the star in z; a tap opens the shape's popup. A plan's
    // shape stop carries both marks on its numbered diamond, so none here.
    function shapeVisitIcon(nb) {
      const size = MARKER_SIZE_NEAR, hit = 24, o = (hit - size) / 2, sp = stickerPinParts({ size, near: true, ang: stickerCorner(shapeKey(nb.id), nb.starred), sz: stickerSize(shapeKey(nb.id)) });
      const sh = nb.starred ? (size / 2 - 1 + STICKER.STAR_OUT.near) * Math.SQRT1_2 : 0;   // the shoulder, set out as stickerStarHtml() so the star clears the check
      const html = `<div style="position:relative;width:${hit}px;height:${hit}px;line-height:0;"><div style="position:absolute;left:${o}px;top:${o}px;width:${size}px;height:${size}px;">${sp.base}${sp.flap}</div></div>`;
      return L.divIcon({ html, className: '', iconSize: [hit, hit], iconAnchor: [hit / 2 + sh, hit / 2 - sh] });
    }
    function syncShapeStars(shown) {
      const vWant = new Set();
      shown.forEach(id => {
        const nb = neighborhoodShapes.find(n => n.id === id);
        if (!nb || !nb.visited || planMarks().byShape.has(id)) return;
        const at = shapeAnchor(nb);
        if (!at) return;
        vWant.add(id);
        const sig = [at.join ? at.join() : String(at), nb.color, nb.type, !!nb.starred].join('|'), had = shapeVisitMarkersById.get(id);
        if (had && had.sig === sig) return;
        if (had) map.removeLayer(had.marker);
        const m = L.marker(at, { icon: shapeVisitIcon(nb), zIndexOffset: Z_PIN_STARRED - 100, title: `${nb.label}, visited` });
        m.on('click', () => { const layer = neighborhoodLayersById.get(id); if (layer) layer.openPopup(L.latLng(at)); });
        shapeVisitMarkersById.set(id, { marker: m.addTo(map), sig });
      });
      shapeVisitMarkersById.forEach((e, id) => { if (!vWant.has(id)) { map.removeLayer(e.marker); shapeVisitMarkersById.delete(id); } });
      const want = new Set();
      shown.forEach(id => {
        const nb = neighborhoodShapes.find(n => n.id === id);
        if (!nb || !nb.starred || planMarks().byShape.has(id)) return;
        const at = shapeAnchor(nb);
        if (!at) return;
        want.add(id);
        const had = shapeStarMarkersById.get(id);
        if (had) { if (!had.getLatLng().equals(at)) had.setLatLng(at); return; }
        const m = L.marker(at, { icon: shapeStarIcon(), zIndexOffset: Z_PIN_STARRED, title: `${nb.label}, starred` });
        m.on('click', () => { const layer = neighborhoodLayersById.get(id); if (layer) layer.openPopup(L.latLng(at)); });
        shapeStarMarkersById.set(id, m.addTo(map));
      });
      shapeStarMarkersById.forEach((m, id) => { if (!want.has(id)) { map.removeLayer(m); shapeStarMarkersById.delete(id); } });
    }

    // Category + hidden-city filtered, no zoom involved -- this is "what matches the
    // user's filters," used by the sidebar list/count. A list enumerates
    // everything available; it isn't a viewport, so zoom has no business
    // hiding rows from it (unlike the map layer, see mapVisibleNeighborhoodShapes()).
    function visibleNeighborhoodShapes() {
      const match = neighborhoodShapes.filter(nb => {
        if (!filters.categories[nb.type]) return false;   // same category filter chips as pins
        return cityShown(nb.city);                        // and the same hidden cities
      });
      if (!inPlanView()) return match;
      if (!activePlan()) { const ids = allPlanStopIds('shape_id'); return neighborhoodShapes.filter(n => ids.has(n.id)); }
      const stops = planMarks().rows.filter(r => r.nb).map(r => r.nb);
      const inPlan = new Set(stops.map(n => n.id));
      return stops.concat(match.filter(n => !inPlan.has(n.id)));
    }

    // Adds the zoom gate on top of visibleNeighborhoodShapes() -- only this
    // one feeds the actual map layer, so the map still stays uncluttered when
    // zoomed out while the list shows everything that matches the filters.
    function mapVisibleNeighborhoodShapes() {
      // A plan's own shape stops draw at any zoom: the gate thins Places, and
      // a plan's stops are never clutter (their numbered diamond needs them).
      const zoom = map.getZoom(), pm = planMarks(), badged = badgeCityIds();   // a badged city's shapes give way to its badge
      return visibleNeighborhoodShapes().filter(nb => pm.byShape.has(nb.id) || (zoom >= neighborhoodMinZoom(nb) && !badged.has(nb.city)));
    }

    function syncNeighborhoodLayers() {
      if (!map) return;
      const shouldShow = new Set(mapVisibleNeighborhoodShapes().map(nb => nb.id));

      shouldShow.forEach(id => {

    // Drive one pencil star. raw = content px of the stroke.
    function pencilStar(svg, strokes = STAR_SWIPE.STROKES) {

      const smudge = svg.querySelector('.sg-smudge'), blur = svg.querySelector(`#${u}-bl feGaussianBlur`);
      const rubM = svg.querySelector(`#${u}-rf feColorMatrix:last-child`);

        draw(raw) {                        // the sketch, stroke by stroke

          if (pen.getAttribute('filter') !== `url(#${want})`) pen.setAttribute('filter', `url(#${want})`);

          // and the 17ms spread could straddle two frames -- the landing
          // read soft. Now a 1.1x press (<=0.9px/side) and a 1.15x spread
          // held for EXACTLY one painted frame (rAF, not a timed animation).
          // Round 7 (owner: "more dramatic ... getting slightly larger then going
          // down to the correct size"): ONE legible overshoot-settle -- twists from -20 through +6 at 1.4x, settles upright,
          // 340ms. Full ink on the first frame; the peak is a real frame, not a blur hang.
          ink.animate(STAR_POP, { duration: STAR_POP_MS, easing: 'linear' });
        },
        unink() { svg.classList.remove('inked'); ink.getAnimations().forEach(a => a.cancel()); },
        // Rub-out, in this order, all as a function of travel (so a
        // cancel plays it backwards exactly):
        //   0-10   colour only: ink -> graphite, smooth (never grain on ink)
        //   10-16  grain fades in over the now-100%-graphite fill
        //   16-50  erased from the points inwards, unevenly; smudge widens
        //   24-44  a faint ghost of the star rises to 25% and HOLDS
        //   56     the ghost goes and the dust falls -- only at the commit.
        rub(raw) {

          if (raw <= 0) {                   // identical to the printed star until travel begins
            ink.removeAttribute('mask'); inkp.style.fill = ''; inkg.style.fill = '';

    function beginStarDrag(el, g, forward) {

    // is fast -- the whole sketch takes >= HAND_MS (the rub-out >= RUB_MS)
    // however quickly the row is swiped. It never runs ahead of the finger

    // first, the pen FINISHES the star after release and the ink lands then

    // ---- VISIT STAMP: swipe LEFT -- the stamp STAMPS ---------------------------
    // The mirror of the Pencil Star: a pencil DRAWS over time in the star's
    // slot (left); a stamp is PRESSED in one instant in its own column (right).
    // The mark is the shipped .row-stamp -- same box, ring, track, 82% navy and
    // per-place stampTilt(). Nothing slides (owner, round 3: "it should stamp
    // with some grow shrink ... maybe the same as the star").

    //     the stamp never slides. The name's tail feathers out of the slot
    //     (0..6px), then the ink BLEEDS into the paper in the slot (vsCue,
    //     6..56px): a dense blot where it touched, then a crisp pale core
