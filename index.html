    .plan-stop.highlighted-marker .pin-n { color: var(--paper); }
    /* the grey tag beside a red cluster that holds stops: part of the cluster -- a tap zooms in, like the disc */
    #map .glyph-clipped .badge-glyph, #map .glyph-clipped .pin-n { display: none; }   /* a pin half under a cluster: ring only -- a place's glyph, or a stop's number already in the cluster's tag (applyPlanMap()) */
    .stop-tag.cluster-stops { pointer-events: auto; cursor: pointer; z-index: 3; }   /* r20: above the cluster's star -- a star never sits on a stop number */
    /* r19 (designer): drawn like a stop pin -- a paper field in a 1.5px grey ring, grey numeral; a 16px
       circle for one number, a pill for "2–4" / "1,5–6". A solid grey disc read as a second cluster; a
       square was the one square on a map of circles. Shape dial: --cluster-tag-radius (8px = fully round). */
    .stop-tag { --cluster-tag-radius: 8px; position: absolute; z-index: 2; height: 16px; min-width: 16px; padding: 0 3px; box-sizing: border-box; border: 1.5px solid var(--ink-2); border-radius: var(--cluster-tag-radius);
      background: var(--paper); color: var(--ink-2); font-family: var(--font-ui); font-stretch: 85%; font-weight: 700; font-size: 10px; line-height: 13px; text-align: center; white-space: nowrap; pointer-events: none; }
    .popup-stop { white-space: nowrap; margin-left: calc(var(--s1) * -1); }   /* cancels the flex gap: the dot sits evenly between its words */

    /* Delete is the row's only action. The visited stamp sits here too,
       but it is decoration (pointer-events:none), so a tap on it falls to
       the row and navigates -- see createCard()'s addActive. */
    .location-actions {
      display: flex;
      gap: var(--s1);
      align-items: center;
    }

    .location-actions button {
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1;
    }

    /* Quiet until the row is active -- a fast scroll must never show a
       column of red X's. */
    .delete-btn {
      width: var(--col-action);
      height: var(--col-action);
      border: none;
      background: transparent;
      color: var(--ink-2);
    }

    /* No pressed-X colour rule, deliberately. The old
       `.location-card.active .delete-btn { color: var(--figure-deep) }`
       matched only the persisted .active class, not :active, so the X
       changed when the ROW was pressed but not when the X itself was
       (backwards feedback); it also fell to 3.83:1 (Stockholm) on
       --paper-pressed and went invisible (1:1) on the focus row. The
       resting X is already AA on --paper-pressed (4.93:1). */

    /* Map star (markerStarHtml()): paper halo under an ink star. */
    .marker-star-halo { color: var(--paper); stroke: var(--paper); }
    .marker-star-ink  { color: var(--ink); }

    @keyframes markerPulse {
      0%   { transform: scale(1);    opacity: 1; }
      50%  { transform: scale(1.12); opacity: 0.88; }
      100% { transform: scale(1);    opacity: 1; }
    }

    .highlighted-marker {
      animation: markerPulse 1.5s ease-in-out infinite;
    }
    /* A selected visited sticker pulses in scale only: the pulse's 0.88 dip
       let roads show through its dark face and flap. */
    @keyframes markerPulseSolid {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.12); }
    }
    .highlighted-marker.stk-pin { animation-name: markerPulseSolid; }

    @media (prefers-reduced-motion: reduce) {
      .highlighted-marker { animation: none; }
    }

    /* =====================================================================
       BASEMAP RE-TONE
       Scoped to .leaflet-tile-pane ONLY -- never .leaflet-pane, which would
       sepia the markers and popups too.
       ===================================================================== */
    .leaflet-tile-pane {
      filter: sepia(0.3) saturate(0.75) contrast(0.96) hue-rotate(-6deg);
    }

    /* Popups: paper, hard edge, no shadow. */
    .leaflet-popup-content-wrapper {
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--ink);
      border-radius: 2px;
      box-shadow: none;
      /* Inset lives on the painted box itself rather than entirely on the
         child's margin, so the text is never flush against the border. */
      padding: var(--s1);
    }

    .leaflet-popup-tip {
      background: var(--paper);
      border: 1px solid var(--ink);
      box-shadow: none;
    }

    .leaflet-popup-content { margin: var(--s2); font-family: var(--font-ui); }
    .leaflet-popup-close-button { color: var(--ink-2) !important; }
    /* pressed = the pale tile, inset 3px so the popup's 1px ink border stays unbroken */
    .leaflet-container a.leaflet-popup-close-button { isolation: isolate; }
    .leaflet-container a.leaflet-popup-close-button::before { content: ''; position: absolute; inset: 3px; z-index: -1; border-radius: 3px; }
    .leaflet-container a.leaflet-popup-close-button:active::before { background: var(--state-press); }

    .popup-head {
      display: flex;
      align-items: center;
      gap: var(--s2);
      margin-bottom: var(--s1);
    }

    .popup-title {
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
      color: var(--ink);
    }

    /* buildPopupHtml() used to print the category as plain colorless text,
       which made the popup the ONE surface communicating category by
       nothing at all. It now carries the glyph, like every other surface. */
    .popup-cat {
      display: flex;
      align-items: center;
      /* --s1, not --s2 -- at this row's 20px glyph size (vs. the filter
         chips' 12px using the same glyphHtml(), same --s2 gap, and
         looking fine) each symbol's own internal padding scales up
         enough to read as extra space stacked on top of the flat gap. */
      gap: var(--s1);
      font-stretch: 75%;
      text-transform: uppercase;
      font-size: 10px;
      line-height: 12px;
      letter-spacing: 0.1em;
      font-weight: 700;
      color: var(--ink-2);
      min-width: 0;                        /* bottom row, left: yields to Mark Visited, never wraps it */
    }

    .popup-cat svg { width: 20px; height: 20px; display: block; flex-shrink: 0; }

    /* The star is the ENTRY's mark, as in the list row (P1, round 4): 18px,
       in its own slot at the head of the text column, centred across the
       title and the line under it (the address); the text column indents
       26px (18 + --s2) -- the list's starred-row indent. It is always there
       (hollow = not starred), so every popup's text starts at 26px.
       - No address: centred on the title alone (a 2-line title included) --
         the notes can run several lines, and centring on them would sink
         the star below the name it marks.
       - Title wraps (with an address): centred across the whole heading
         block, as the list centres across its whole text column.
       Off: hollow --ink-2 star (6.17:1 on --paper). On: filled --ink. */
    .popup-title-row {
      display: grid;
      grid-template-columns: 18px auto;    /* auto, not 1fr: a 1fr track has no max-content size, so
                                              Leaflet's auto width would stop at the 240 floor and long
                                              names would wrap to 3 lines instead of widening to 300 */
      column-gap: var(--s2);
    }
    .popup-title-row > :not(.popup-star-slot) { grid-column: 2; }
    .popup-title-row > .popup-title { grid-row: 1; }
    .popup-title-row > .popup-addr  { grid-row: 2; }
    .popup-title-row > .popup-notes { grid-row: 3; }
    .popup-star-slot {
      grid-column: 1;
      grid-row: 1 / span 2;              /* title + address; row 2 is empty (0px) with no address */
      align-self: center;
      position: relative;                  /* anchors .popup-star-tap (no z-index: no new stacking context) */
      width: 18px;
      height: 18px;
    }

    .popup-star {
      position: relative;
      /* Above the category glyph: leaflet.css gives every svg in the map
         pane z-index:200, which takes effect on a flex-item svg like
         .popup-cat's, and would otherwise eat the top of this hit area. */
      z-index: 201;
      width: 18px;                         /* = .row-star */
      height: 18px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--ink-2);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    /* 44 x 44 hit area without moving layout: 18x18 box + 13px all round.
       No address: the star sits 1px from the top of the text (centred on a
       one-line title), so the target reaches 9px up and 17px down -- its
       top stays 5px inside the popup's top edge, never on the map above. The next control, Get Directions, keeps an 8px DEAD
       BAND below the target in every case (see .popup-directions' margins
       below). 13px left keeps it inside the popup border; clear of the
       close button. Accepted side effect: the first ~13px of the title also
       toggles the star (titles aren't interactive otherwise). */
    .popup-star::after,
    .popup-star-tap {
      content: '';
      position: absolute;
      inset: -13px;
    }
    .no-sub > .popup-star-slot .popup-star::after,
    .no-sub > .popup-star-slot .popup-star-tap { inset: -9px -13px -17px; }

    .popup-star svg { width: 18px; height: 18px; display: block; }
    .popup-star.starred { color: var(--ink); }
    /* State system: pressed = the pale tile, same as Mark Visited (the ink /
       rub animation lives on the svg's children and is untouched). */
    .popup-star::before {
      content: '';
      position: absolute;
      inset: calc(-1 * var(--state-tile-inset));
      z-index: -1;
      border-radius: 3px;              /* one radius everywhere: 3px */
    }
    .popup-star:active::before,
    .popup-star-slot:has(> .popup-star-tap:active) .popup-star::before { background: var(--state-press); }
    /* Round 8 (owner): the finger's tap target. EXACTLY .popup-star::after's
       44x44 box (same inset rule, above), one layer above it,
       so the dead band to Mark Visited and z-index:201 are unchanged. It is a
       label for the hidden haptic switch: a real tap on it ticks on iOS
       (26.5+ too). aria-hidden -- the button is what assistive tech gets. */
    .popup-star-tap {
      z-index: 202;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .popup-addr  { font-size: 12px; line-height: 16px; color: var(--ink-2); }
    .popup-notes { font-size: 12px; line-height: 16px; color: var(--ink-2); font-style: italic; margin-top: var(--s2); }

    /* A <button>, not a static status div -- the popup is the only place
       visited can be toggled now that the list row is delete-only. A real
       checkbox affordance (the bordered circle .visit-btn used to show),
       not just a color swap on plain text -- text alone was visually
       identical to the old read-only status line, giving no sign it's now
       tappable. Padding grows the touch target well past the bare 12px
       line-height. The visited state uses --navy, not --figure-deep: on a
       restaurant popup the deep figure would sit ~40px from a
       restaurant-ink glyph they collide with in all five cities. Navy is
       2.71:1 away in value from every category ink. */
    /* 44px tall target: 12px line + 2 x --s4. The ring is centred on
       the popup's 20px icon column (3px each side of the 14px ring) and
       the gap is --s1, so "MARK VISITED" starts at 24px -- the same x as
       the category word and the title above it. */
    .popup-visited {
      display: flex;
      align-items: center;
      gap: var(--s1);
      flex-shrink: 0;
      text-align: right;
      padding: var(--s4) 0;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: var(--font-ui);
      font-stretch: 75%;
      text-transform: uppercase;
      font-size: 10px;
      line-height: 12px;
      letter-spacing: 0.1em;
      font-weight: 700;
      color: var(--ink-2);
    }

    /* Pressed tile: a ::before sized to the words + ring with an equal
       6px inset on every side (the 44px button box is only the tap target). */
    .popup-visited { position: relative; isolation: isolate; }
    .popup-visited::before {
      content: '';
      position: absolute;
      inset: calc(16px - var(--state-tile-inset)) calc(-1 * var(--state-tile-inset));
      z-index: -1;
      border-radius: 3px;
    }
    .popup-visited:active::before,
    .popup-visited-slot:has(> .popup-visited-tap:active) .popup-visited::before { background: var(--state-press); }
    /* The finger's tap target for Mark Visited (owner: "the haptics should
       also be everywhere logical"): the popup star's real-tap label, exactly
       over the button's 44px box, one layer above it. A real tap on it is a
       trusted label click on the hidden haptic switch -- one tick at tap time,
       iOS 26.5+ included -- and the click is forwarded to the button one task
       later (hapticTap()). aria-hidden: the button is what assistive tech gets. */
    .popup-visited-slot { position: relative; display: flex; flex-shrink: 0; }
    .popup-visited-tap {
      position: absolute;
      inset: 0;
      z-index: 202;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* Hollow "tap to fill" ring at the SAME weight and ink as the hollow
       star above it (.popup-star, 2/24 of 16px = 1.33px, --ink-2) so the
       column reads as one family of controls. Was 1px --hair (1.3:1),
       under the 3:1 non-text bar. --ink-2: 6.17:1 on --paper.
       An inset box-shadow, not a border: Chromium floors a 1.33px
       border to 1px (measured), while a shadow spread keeps the
       fraction -- 4 device px at 3x, the star's exact stroke. */
    .popup-visited-check {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin: 0 0 0 3px;                   /* the circle sits at the popup's trailing edge */
      flex-shrink: 0;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1.33px var(--ink-2);
    }

    .popup-visited.visited {
      color: var(--navy);
    }

    .popup-visited.visited .popup-visited-check {
      background: var(--navy);
      box-shadow: none;
    }

    /* Get Directions: the shipped text button (owner: "the same text button,
       not a new button style") -- compass + condensed caps in --figure-deep,
       44px target (12px line + 2 x --s4) -- on its own line under the
       address/notes. Content-width, so only the words are the link. The
       compass sits on the 20px icon column (3px each side, as the Mark
       Visited ring used to), so "GET DIRECTIONS" starts at 24px -- the x of
       the category word below it. */
    .popup-directions {
      display: flex;
      align-items: center;
      gap: var(--s1);
      width: fit-content;
      padding: var(--s4) 0;
      margin-top: var(--s2);
      font-stretch: 75%;
      text-transform: uppercase;
      font-size: 10px;
      line-height: 12px;
      letter-spacing: 0.1em;
      font-weight: 700;
      color: var(--figure-deep);
      text-decoration: none;
    }
    /* The 8px dead band to the star's target, where the text is short:
       address only -- target ends 4px below the text: 4 + 8 = 12;
       title only -- target ends 16px below it: 16 + 8 = 24. With notes the
       text already clears it (--s2). */
    .popup-title-row.addr-end + .popup-directions { margin-top: var(--s3); }   /* 12 */
    .popup-title-row.solo + .popup-directions { margin-top: var(--s6); }       /* 24 */

    /* leaflet.css's `.leaflet-container a { color: #0078A8 }` (0,1,1)
       outranks .popup-directions (0,1,0) -- Directions shipped Leaflet
       blue. This restates the intended colour at (0,2,1). */
    .leaflet-container a.popup-directions { color: var(--figure-deep); }

    .popup-directions svg { width: 14px; height: 14px; margin: 0 3px; flex-shrink: 0; }
    /* Pressed = the pale tile, same 6px inset as Mark Visited. */
    .popup-directions { position: relative; isolation: isolate; }
    .popup-directions::before { content: ''; position: absolute; inset: calc(16px - var(--state-tile-inset)) calc(-1 * var(--state-tile-inset)) calc(16px - var(--state-tile-inset)) calc(-1 * var(--state-tile-inset)); z-index: -1; border-radius: 3px; }   /* left edge = the star tile's (the compass keeps its 3px icon margin, so 7px clear on that side) */
    .popup-directions:active::before { background: var(--state-press); }

    /* Bottom row (owner): the category (non-interactive) on the left, Mark
       Visited on the right with its circle at the trailing edge.
       margin-top --s3 keeps an 8px dead band between Get Directions' 44px
       target and Mark Visited's (both are their own boxes). margin-bottom -8px hands
       the button's 16px bottom padding back to Leaflet's 8px content margin. */
    .popup-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s3);
      margin-top: var(--s2);
      margin-bottom: calc(-1 * var(--s2));
    }

    /* Auth Modal */
    #authModal {
      display: none;
      /* absolute in the 100lvh body, like the sheet: a fixed scrim stops
         62px short from the Home Screen and would leave the sheet unscrimmed. */
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      /* A NAVY-tinted scrim, not black. Tinted scrims are half of why
         vintage print feels coherent. */
      background: rgba(18, 41, 63, 0.72);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      padding: var(--s4);
      /* centre the card in what's visible above the toolbar, not behind it */
      padding-bottom: calc(var(--s4) + var(--chrome-bottom));
    }

    #authModal.show {
      display: flex;
    }

    #authModalContent {
      background: var(--paper);
      border: 2px solid var(--navy);
      border-radius: 2px;
      max-width: 400px;
      width: 100%;
      box-shadow: none;
      overflow: hidden;
    }

    #authModalHead {
      display: flex;
      align-items: center;
      gap: var(--gap);
      background: var(--navy);
      color: var(--paper);
      padding: var(--s3) var(--gutter);
    }

    #authModalContent h2 {
      margin: 0;
      font-stretch: 75%;
      text-transform: uppercase;
      font-size: 15px;
      line-height: 20px;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    #authModalBody { padding: var(--s8) var(--gutter); }

    #authModalContent p {
      margin: 0 0 var(--s6) 0;
      color: var(--ink-2);
      font-size: 12px;
      line-height: 16px;
    }

    #authModalContent input {
      width: 100%;
      padding: 0 0 var(--s1) 0;
      border: none;
      border-bottom: 1px solid var(--hair);
      border-radius: 0;
      margin-bottom: var(--s6);
      font-family: var(--font-ui);
      font-size: 16px;
      line-height: 24px;
      background: transparent;
      color: var(--ink);
    }

    #authModalContent input:focus {
      outline: none;
      border-bottom: 2px solid var(--figure-deep);
      padding-bottom: 3px;
    }

    #authModalContent button {
      width: 100%;
      background: var(--figure);
      color: var(--navy);
      border: none;
      padding: var(--s3);
      border-radius: 2px;
      font-family: var(--font-ui);
      font-stretch: 75%;
      text-transform: uppercase;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: 0.08em;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: var(--s2);
    }

    #authModalContent button.secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--hair);
    }

    #authModalContent button.secondary:hover {
      background: var(--paper-raised);
    }

    /* Auth Status Indicator - Hidden, using account button instead */
    #authStatus {
      display: none !important;
    }

    /* =====================================================================
       DESKTOP: the bottom sheet becomes a left rail. The map needs
       map.invalidateSize() when this flips -- see the matchMedia listener
       at the bottom of the script.
       ===================================================================== */
    @media (min-width: 900px) {
      #locations {
        top: 0;
        bottom: 0;
        left: 0;
        right: auto;
        width: 360px;
        height: auto;   /* top/bottom 0 in the 100lvh body */
        border-right: 2px solid var(--navy);
      }
      /* A full-height rail has nothing to collapse into, so the slide-down
         transform and the list-hiding are both switched off here. */
      #locations.collapsed { transform: none; }
      #locations.collapsed #locationsList { display: block; }
      #collapseBtn { display: none; }
      /* collapseBtn (the header's alignment spacer, see its rule above) is
         gone in the rail, so stand in with a blank spacer of the same
         width -- otherwise the title would sit flush at the gutter instead
         of 56px, out of line with every row's name. */
      #locationsHeader::before {
        content: '';
        display: block;
        width: var(--col-glyph);
        flex-shrink: 0;
      }
      /* The 360px rail is 30px narrower than a phone, and the sort button
         made the icon row four wide: the icons pack at 4px (mouse targets,
         no thumb) so "Copenhagen list (38)" still fits untruncated. The
         spine holds: spacer 28 + 4 gap + 8 margin = the title at 56px. */
      #locationsHeader { gap: var(--s1); }
      #locationsHeader::before { margin-right: var(--s2); }
      #locationsHeader h2 { margin-right: var(--s1); }
      #mainContent { left: 360px; bottom: 0 !important; height: auto !important; }
      /* The panel slides up from the viewport bottom once the sheet is a
         full-height rail -- there is no bottom sheet left to sit above. */
      #filtersPanel { left: 360px; bottom: 0; }
      #filtersPanel.collapsed-mode { bottom: 0; }
    }

    /* =====================================================================
       PENCIL STAR -- printed = the guide's facts, stamped = where you've
       been, PENCILLED = what you care about. Stroke a row right: the name
       slides aside as one block and a star is pencilled -- five straight
       strokes, the way a hand draws one -- in the exact box where the
       printed Baedeker star will sit. At 56px the ink lands; let go and the
       name docks against it. The same stroke on a starred row lightens the
       ink to graphite and rubs it out, edges first. Left is inert.
       ===================================================================== */
    .location-card .row-main { position: relative; }
    /* The name moves as an OBJECT: transform, never re-truncation. It
       slips UNDER a feathered edge (8px mask, fading in with the first 8px
       of travel) at the content column's right edge -- 12px before the
       stamp/X, which are never under the mask. The column borrows the
       12px glyph gap on its left (margin/padding swap, zero layout shift)
       so the ink's 1.2x press-in isn't cut by the mask box. */
    .location-card.sg-live .row-main {
      margin-left: -12px; padding-left: 12px; --sg-lead: 12px;
      -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 8px), rgba(0, 0, 0, var(--sg-fade-a, 1)));
      mask-image: linear-gradient(to right, #000 calc(100% - 8px), rgba(0, 0, 0, var(--sg-fade-a, 1)));
    }
    .location-card.sg-live .row-star { visibility: hidden; }
    .location-card.sg-live { transition: none; }   /* a held press snaps off when the stroke starts */
    .location-card.sg-live h3,
    .location-card.sg-live .row-meta { will-change: transform; }

    /* A drag is not a press. */
    .location-card.sg-live:not(.highlighted),
    .location-card.sg-live:not(.highlighted):active,
    .location-card.vs-live:not(.highlighted),
    .location-card.vs-live:not(.highlighted):active { background: var(--paper); }
    .location-card.is-visited.sg-live:not(.highlighted),
    .location-card.is-visited.sg-live:not(.highlighted):active,
    .location-card.is-visited.vs-live:not(.highlighted),
    .location-card.is-visited.vs-live:not(.highlighted):active { background: var(--paper-filed); }

    /* VISIT STICKER (swipe LEFT): see attachStarGesture() / paintVisit().
       The field changes on the press frame itself -- no 120ms fade -- so
       sticker and field land as ONE event. The name + meta now move as one
       block, the mirror of the Pencil Star's own setSlip() (1:1 with the
       finger); the final truncation lands only at the FLIP
       (flipVisitToFinal(), commit or release), never mid-drag.
       Unlike the star (whose rightward slide runs toward the action
       cluster, which is LATER in paint order and so already covers any
       overrun), a leftward slide here runs toward .row-badge, which is
       EARLIER in paint order. .row-badge now slides WITH the text
       (setSlip() also translates g.badge when the gesture set one --
       visit-only, the star never does), so the two never converge or
       cross a clip edge -- the old .row-main overflow:hidden guard
       (which existed only for that collision) is gone. What replaces it:
       at full rubber-band travel (STAR_SWIPE.MAX past COMMIT, ~73px) the
       badge+text block would slide past the row's own left padding into
       whatever sits above/behind it, since .row-badge is flush with the
       card's left edge. .location-card itself gets the guard instead, so
       both the badge and the text clip cleanly at the row's own bounds. */
    .location-card.vs-live { transition: none; overflow: hidden; }
    /* The printed star moves WITH the sliding block instead of hiding: it
       is absolutely positioned (row-main's own head), so it needs its own
       translateX -- setSlip() drives it at the same offset as .row-badge
       (owner: "it should move like any other element", after the badge
       got the same treatment). Unlike the star gesture's OWN sweep (which
       hides row-star because the pencil draws IN its slot -- a different,
       unrelated case, left alone), nothing is drawn here, so sliding is
       enough; .location-card's overflow:hidden guard (above) covers it at
       full rubber-band travel exactly as it does the badge and text. */
    .location-card.vs-live .location-actions { position: relative; }
    .vs-carry {                             /* the new sticker: the shipped .row-stamp, out of flow AT its slot */
      position: absolute;
      right: calc(var(--col-action) + var(--s1));   /* = its flow slot: [sticker][4px gap][X], keyed to the X.
         If the flow gap changes, update this calc to col-action + <new gap>. */
      top: calc(50% - var(--s3));           /* 24px box centred on the row, as in flow */
    }
    /* Before the commit the sticker HOVERS in its slot (owner-approved
       keyframes, design/visited-system/stamp-first/sticker-keyframes-3x.png):
       lifted under a soft shadow with its flap curled high, growing toward
       1.12x and fading in with travel; at 56 it is pressed down. The shadow
       and the lifted flap are static markup: a drag frame writes only the
       carry's transform and opacity (paintVisit()). The un-visit lift
       (.vs-peel) wears the same shadow. At rest the label sits on a short
       warm contact shadow, so the lighter cream reads as a label laid on the
       filed row, not a smudge in it. */
    .row-stamp > .stk-base { filter: drop-shadow(0 1px 1.8px rgba(138, 106, 68, 0.10)) drop-shadow(0 0 0.35px rgba(138, 106, 68, 0.06)); }   /* paper on paper: wide, faint, warm; no dark core (owner: "Shadow isn't realistic / too intense") */
    .row-stamp.vs-open > .stk-base,
    .row-stamp.vs-peel > .stk-base { filter: drop-shadow(0 3px 2.4px rgba(40, 30, 20, 0.35)); }
    /* The veil: the row's own field, feathered (8px), behind the sticker and
       14px to its left, so the sliding name's tail goes UNDER the lifted
       sticker and is never seen within 6px of it (V14). It scales with
       the carry and fades with it (opacity only); its colour follows the
       field by class (filed on the press frame, the focus row's red). */
    .vs-veil {
      position: absolute; left: -14px; right: 0; top: calc(var(--s2) * -1); bottom: calc(var(--s2) * -1);
      background: linear-gradient(to right, transparent, var(--paper) var(--s2));
    }
    .location-card.is-visited .vs-veil { background: linear-gradient(to right, transparent, var(--paper-filed) var(--s2)); }
    .location-card.highlighted .vs-veil { background: linear-gradient(to right, transparent, var(--figure-deep) var(--s2)); }
    .location-card.vs-live .delete-btn { transition: opacity 80ms linear; }
    .location-card.vs-xhide .delete-btn { opacity: 0; pointer-events: none; }
    /* S2: touch presses are delayed 80ms (createCard()), so the bare
       :active pseudo-class must not paint the press instantly. */
    .location-card:not(.highlighted):not(.active):active { background: var(--paper); }
    .location-card.is-visited:not(.highlighted):not(.active):active { background: var(--paper-filed); }

    .sg-star {
      position: absolute;
      width: var(--s3);                    /* 12 = .row-star */
      height: var(--s3);
      overflow: visible;
      pointer-events: none;
    }
    /* Graphite: --ink-2 through a grain filter (feTurbulence alpha
       speckle + a 0.35px displacement wobble) with a pressure taper per
       stroke. Ink: the approved printed star, --figure-deep. */
    /* The sketch leans -7deg, as a hand does; the ink lands upright over
       it. The lean also keeps a half-drawn star (a Λ, then a Λ with a
       crossbar) from sitting on the type's baseline and reading as a letter. */
    .sg-star .sg-pencil { color: var(--ink-2); fill: currentColor;
                      transform-box: fill-box; transform-origin: 50% 55%; transform: rotate(-12deg); }
    .sg-star .sg-ink { color: var(--ink); fill: currentColor; opacity: 0;
                   transform-box: fill-box; transform-origin: 50% 55%; }
    .sg-spread { opacity: 0; transform-box: fill-box; transform-origin: 50% 55%; }
    .sg-smudge, .sg-ghost { fill: var(--ink-2); }
    .sg-inkg { opacity: 0; }
    .sg-star.inked .sg-ink { opacity: 1; }
    /* Round 5: the COMMIT is shown by PRESSURE, not speed. Before 56px the
       sketch is light graphite (85%); the frame the finger crosses 56 every
       stroke -- drawn and still to come -- goes over harder: ~1.4x wider
       (a 0.7-unit stroke on the capsule), full opacity, darker graphite
       and denser grain. Backed off before 56, it goes light again. */
    .sg-star .sg-pencil { opacity: 0.85; }
    .sg-star.sg-press .sg-pencil { opacity: 1; color: color-mix(in srgb, var(--ink-2) 55%, var(--ink)); stroke: currentColor; stroke-width: 0.7; stroke-linejoin: round; }
    .location-card.highlighted .sg-star.sg-press .sg-pencil { color: var(--paper); }
    .sg-star.inked .sg-pencil { opacity: 0; }
    .sg-crumb {
      position: absolute; width: 1.5px; height: 1.5px; border-radius: 1px;
      background: var(--ink-2); pointer-events: none;
    }
    .location-card.highlighted .sg-pencil,
    .location-card.highlighted .sg-ink { color: var(--paper); }
    .location-card.highlighted .sg-smudge,
    .location-card.highlighted .sg-ghost { fill: var(--paper); }
    .location-card.highlighted .sg-crumb { background: var(--paper); }

    /* Popup (owner: "it probably shouldn't be drawn in the card since the
       outline is already there... just the fade/pop"). Star: the fill fades
       into the outline over 100ms while the whole star plays the row's
       spin-stamp (STAR_POP's table and easings, 380ms from the tap). The
       outline goes on the frame the fill is full -- under full ink, mid-spin.
       Unstar: the fill fades off the outline over 240ms while the star lifts
       with the row's erase pop (1.12x, no twist) -- no rub, no dust. Both
       once per tap (popupInkId / popupRubId); the rest state is the plain
       glyph, same pixels. Reduced motion: no scale, no rotation -- the state
       just lands. */
    .popup-star .sgp { overflow: visible; }
    .popup-star .sgp .sg-ink { transform-box: fill-box; transform-origin: 50% 55%; }
    .popup-star .sgp-in .sg-ink  { animation: sgpPress 380ms linear; }
    .popup-star .sgp-in .sgp-fill { animation: sgpOn 100ms linear backwards; }
    .popup-star .sgp-in .sgp-hollow { animation: sgpOff 1ms linear 100ms forwards; }
    .popup-star .sgp-out .sg-ink { animation: sgpLift 240ms linear; }
    .popup-star .sgp-out .sgp-fill { color: var(--ink); animation: sgpOff 240ms cubic-bezier(.4,0,.6,1) forwards; }   /* the ink that fades is the ink that was there (the button is already --ink-2) */
    @keyframes sgpOff    { to { opacity: 0; } }
    @keyframes sgpOn     { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sgpPress  { 0% { transform: rotate(-20deg) scale(1); animation-timing-function: cubic-bezier(.2,.9,.3,1); } 34% { transform: rotate(6deg) scale(1.4); animation-timing-function: cubic-bezier(.6,0,.85,.45); } 65% { transform: rotate(-2deg) scale(0.95); animation-timing-function: cubic-bezier(.4,0,.3,1); } 100% { transform: rotate(0deg) scale(1); } }
    @keyframes sgpLift   { 0% { transform: scale(1); animation-timing-function: cubic-bezier(.2,.9,.3,1); } 35% { transform: scale(1.12); animation-timing-function: cubic-bezier(.5,0,.4,1); } 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .popup-star .sgp .sg-ink,
      .popup-star .sgp .sgp-fill { animation: none; }
      .popup-star .sgp-in .sgp-hollow { animation: none; opacity: 0; }
      .popup-star .sgp-out .sgp-fill { animation: none; opacity: 0; }
    }
  </style>

<body>
  <!-- =====================================================================

       Flat FILLED silhouettes -- form by shape adjacency, no outlines
       (ref 8's screenprint grammar). Drawn once, <use>d in markerIcon(),
       createFilters(), the list rows AND buildPopupHtml().

       These are load-bearing, not decoration. Under a Machado deuteranope
       transform 8 of 66 token pairs fail the simple value/hue/chroma
       predicate; 5 fail under protanopia. Most of those are low-saturation

       39 of 55 category pairs (71%) still separate on luminance alone.
       Hence the system law: CATEGORY IDENTITY IS CARRIED BY SHAPE; colour
       is reinforcement only. Any surface showing a category shows its glyph.

       district/street are the two that legitimately use stroke rather than
       fill -- a dashed outline IS their meaning, and the dash patterns

    <filter id="stk-shadow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="120" height="72"><feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="w"/><feOffset in="w" dy="0.9" result="wo"/><feFlood flood-color="#8a6a44" flood-opacity="0.06"/><feComposite in2="wo" operator="in" result="ws"/><feGaussianBlur in="SourceAlpha" stdDeviation="0.35" result="t"/><feFlood flood-color="#8a6a44" flood-opacity="0.04"/><feComposite in2="t" operator="in" result="ts"/><feMerge><feMergeNode in="ws"/><feMergeNode in="ts"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

  <script>
    const SUPABASE_URL = 'https://jgvckilmltimabfdvaly.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_TiO_hACvlsn4mfFazsHTlg_i9BnzCfr';

    // Initialize Supabase client with auth support
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    // =========================================================================
    // CATEGORY INKS  (sourced from the WPA park-poster series: Zion
    // rust/slate/gold/olive, Bryce plum/lavender, Yellowstone teal)
    //
    // These are GLYPH / FILL / RULE colours only. They are never text --
    // every category LABEL renders in --ink-2. That is not a stylistic
    // preference, it is forced: requiring all 11 to clear 4.5:1 on --paper
    // caps luminance at 0.147, which collapses the value ladder that stops
    // the palette reading as one mush. (The old palette failed exactly that
    // way: bar/area were ~1 degree apart in hue at near-identical value.)
    //
    // Separation rule -- every PAIR satisfies at least one of:
    //   (a) >= 1.4:1 in (L+0.05)                              40 pairs
    //   (b) >= 60deg in hue, where both have S >= 0.15        13 pairs
    //   (c) >= 0.25 in HSL saturation, where one is near-neutral  2 pairs
    // ...and every ink is >= 3:1 against --paper so a glyph, chip dot or
    // marker rim reads as a non-text UI component (WCAG 1.4.11).
    // Verified: 0 failures of 55.
    //
    // A flat >= 1.4:1 floor for all 11 is IMPOSSIBLE, not merely awkward:
    // pairwise 1.4 across n colours needs a 1.4^(n-1) span, the widest span
    // available on this paper is 17.70:1, so n <= 9 -- and with the 3:1
    // floor the span is 5.90:1, so n <= 6.
    //
    // Tightest margins -- do not nudge these without re-running the checks:
    //   nature/area     hue 61.4deg   (+1.4)
    //   area/other      value 1.403   (+0.003; ΔS 0.281 is a second channel)
    //   area/cafe       value 1.405   (+0.005; 176deg hue is a second channel)
    //   other/bar       ΔS 0.303      (+0.053) -- `other` cannot be greyer
    //   cafe/restaurant value 1.440
    //
    // `restaurant` and --figure-deep are deliberately adjacent (they collide
    // on all three channels in all five cities). They are kept apart in
    // SPACE, not in colour: the highlighted row reverses its glyph to
    // --paper, the delete control sits >=244px away across the content
    // column, form controls never render category ink, and the popup's
    // visited marker is --navy rather than --figure-deep.
    // =========================================================================
    const CATEGORY_COLORS = {
      restaurant: '#AC5019',   // Bryce burnt orange   4.52:1  H  22.4  S .746
      cafe:       '#6E4C22',   // Zion olive-brown     6.51:1  H  33.2  S .528
      bar:        '#3D5A7A',   // McKinley blue        6.02:1  H 211.5  S .333
      attraction: '#A68018',   // Zion gold            3.09:1  H  43.9  S .747
      nature:     '#1E3A2B',   // Yellowstone spruce  10.44:1  H 147.9  S .318
      shopping:   '#8A7AA8',   // Bryce lavender       3.26:1  H 260.9  S .209
      area:       '#2B3F52',   // Zion slate           9.15:1  H 209.2  S .312
      hotel:      '#2E2433',   // Bryce deep plum     12.50:1  H 280.0  S .172
      other:      '#4F5450',   // near-neutral         6.52:1  (S .031)
      district:   '#328177',   // Yellowstone teal     3.90:1  H 172.4  S .441
      street:     '#5E2C17'    // Zion deep rust       9.58:1  H  17.7  S .607
    };

    // -------------------------------------------------------------------------
    // PER-CITY ACCENT (ref 8: one rigid type/layout system, re-inked per
    // poster). The chrome, grid and glyphs never change; only these two
    // tokens do. Runtime-added cities inherit the default.
    //   figure     -> carries NAVY type. >= 4.5:1 on #12293F, all five.
    //   figureDeep -> carries PAPER type. >= 4.5:1 on #F2EBDD, all five.
    // -------------------------------------------------------------------------
    const CITY_PALETTES = {
      reykjavik:  { figure: '#EE7434', figureDeep: '#A8400C' },  // 5.08 / 5.20  glacier
      copenhagen: { figure: '#E2705C', figureDeep: '#B23A2C' },  // 4.74 / 5.01  harbour
      malmo:      { figure: '#E0A22E', figureDeep: '#8A5A0E' },  // 6.63 / 4.99  dusk
      stockholm:  { figure: '#D98A2B', figureDeep: '#995610' },  // 5.39 / 4.79  ochre facades
      la:         { figure: '#E8674F', figureDeep: '#AE3A29' }   // 4.58 / 5.15  canyon
    };

    const DEFAULT_PALETTE = CITY_PALETTES.reykjavik;

    // The only writer of the accent tokens. Called from setActiveCity().
    function applyCityPalette(cityId) {
      const p = CITY_PALETTES[cityId] || DEFAULT_PALETTE;
      document.documentElement.style.setProperty('--figure', p.figure);
      document.documentElement.style.setProperty('--figure-deep', p.figureDeep);
    }
    
    // `countrycodes` is Nominatim's HARD filter -- results outside these countries
    // are not returned at all. It is a comma-separated list, deliberately, so that
    // contiguous cross-border travel areas (Copenhagen/Malmo) stay searchable.
    // `viewbox` is Nominatim's SOFT ranking hint (lonMin,latMin,lonMax,latMax) --
    // it biases ordering, it does not exclude. It is a geocoding hint ONLY; map
    // framing comes from the declared center/zoom, or from fitVisible().
    const CITIES = {
      la:         { label: 'LA',         center: [34.0522, -118.2437], zoom: 11,
                    geocodeSuffix: 'Los Angeles, CA', countrycodes: 'us',
                    viewbox: '-118.668,33.704,-118.155,34.337' },
      reykjavik:  { label: 'Reykjavík',  center: [64.1466,  -21.9426], zoom: 11,
                    geocodeSuffix: 'Iceland',         countrycodes: 'is',
                    viewbox: '-22.700,63.900,-21.200,64.300' },
      copenhagen: { label: 'Copenhagen', center: [55.6761,   12.5683], zoom: 12,
                    geocodeSuffix: 'København',       countrycodes: 'dk,se',
                    viewbox: '12.450,55.610,12.700,55.750' },
      malmo:      { label: 'Malmö',      center: [55.6050,   13.0038], zoom: 12,
                    geocodeSuffix: 'Malmö',           countrycodes: 'se,dk',
                    viewbox: '12.900,55.530,13.120,55.650' },
      stockholm:  { label: 'Stockholm',  center: [59.3293,   18.0686], zoom: 11,
                    geocodeSuffix: 'Stockholm',       countrycodes: 'se',
                    viewbox: '17.850,59.250,18.220,59.420' }
    };

    // Captured before fetchCities() ever merges runtime rows in -- the
    // permanent, never-delete set for cleanupOrphanCities().
    const SEED_CITY_IDS = new Set(Object.keys(CITIES));

    const DEFAULT_CITY = 'la';
    const ALL_CITIES   = '__all__';   // explicit, persisted sentinel for "all cities"
    const CITY_STORAGE_KEY = 'triplet.citySelection';

    let citySelection = DEFAULT_CITY; // 'la' | … | ALL_CITIES — what the selector shows
    let activeCity    = DEFAULT_CITY; // ALWAYS a real CITIES key — authoring/viewport context

    let map;
    let userLocationMarker = null;
    let locations = [];
    let neighborhoodShapes = [];
    // filters.city === null ⇒ no city predicate (all cities)
    let filters = { categories: {}, city: DEFAULT_CITY };
    Object.keys(CATEGORY_COLORS).forEach(cat => filters.categories[cat] = true);

    // ---- reconciler state (Phase 0) -----------------------------------------
    const markersById = new Map();   // id → { marker, signature, loc }
    const clusterMarkersById = new Map();   // stable cluster id → L.Marker, present only while visible
    const cardsById   = new Map();   // id → { el, signature }
    const shapeCardsById = new Map();   // id → { el, signature } -- neighborhood_shapes' list-panel counterpart to cardsById
    let highlightedId = null;
    let lastPayloadDigest = null;

    // ---- neighborhood shape state (Phase 3) ----------------------------------
    // Presence-tracking only, not a signature diff: shapes are added rarely
    // (through the add-shape flow below) and never edited in place, so there
    // is no churn here for a full reconciler to protect against.
    const neighborhoodLayersById = new Map();   // id → L.Layer, present only while visible
    const shapeStarMarkersById = new Map();     // id → L.Marker: a starred shape's map star (syncNeighborhoodLayers)
    const shapeVisitMarkersById = new Map();    // id → { marker, sig }: a visited shape's sticker (syncShapeStars)

    // ---- shapes in the row / popup / flag machinery ----------------------------
    // Owner (2026-10-02): "Every category should have the same information and
    // capabilities." A district/street row is the same row as a pin's (createCard /
    // renderCard, the Pencil Star, the visit stamp, the popup), so that machinery
    // addresses every row by ONE key: a pin's uuid, or 'shape:<id>' for a shape
    // (shape ids are numbers). A row item is a pin as-is, or a shape dressed as one
    // (shapeRowItem): name = label, category = type, notes = note, lat/lng = its
    // centroid (the Nearest distance, as sortShapes() orders it), dir = the point
    // Get Directions and its map star use (shapeAnchor()).
    const SHAPE_KEY = 'shape:';
    const shapeKey = id => SHAPE_KEY + id;
    const isShapeKey = k => typeof k === 'string' && k.startsWith(SHAPE_KEY);
    const shapeIdOf = k => Number(String(k).slice(SHAPE_KEY.length));
    function shapeRowItem(nb) {
      const c = shapeCentroid(nb) || [0, 0];
      return { ...nb, id: shapeKey(nb.id), shapeId: nb.id, name: nb.label, category: nb.type, notes: nb.note, address: null,
        lat: c[0], lng: c[1], dir: shapeAnchor(nb), visited: !!nb.visited, starred: !!nb.starred };
    }
    function rowItem(key) {
      if (isShapeKey(key)) { const nb = neighborhoodShapes.find(n => n.id === shapeIdOf(key)); return nb ? shapeRowItem(nb) : null; }
      return locations.find(l => l.id === key) || null;
    }
    function rowKey(el) {
      const s = el && el.getAttribute && el.getAttribute('data-shape-id');
      return s != null ? shapeKey(s) : (el && el.getAttribute ? el.getAttribute('data-id') : null);
    }
    function rowEntry(key) { return isShapeKey(key) ? shapeCardsById.get(shapeIdOf(key)) : cardsById.get(key); }
    // A point ON the shape, for Get Directions and the map star: a street's middle
    // vertex; a district's vertex centroid when it lies inside the outline, else the
    // vertex nearest to it (a concave or ring-shaped district).
    function shapeAnchor(nb) {
      const g = nb.geometry || [];
      if (!g.length) return null;
      if (nb.type === 'street') {
        // halfway along its length (a 2-vertex street's middle vertex would be an end)
        const k = Math.cos(g[0][0] * Math.PI / 180), seg = [];
        let total = 0;
        for (let i = 1; i < g.length; i++) { const d = Math.hypot(g[i][0] - g[i - 1][0], (g[i][1] - g[i - 1][1]) * k); seg.push(d); total += d; }
        let left = total / 2;
        for (let i = 0; i < seg.length; i++) {
          if (left <= seg[i] && seg[i] > 0) { const t = left / seg[i]; return [g[i][0] + (g[i + 1][0] - g[i][0]) * t, g[i][1] + (g[i + 1][1] - g[i][1]) * t]; }
          left -= seg[i];
        }
        return g[g.length - 1];
      }
      const c = shapeCentroid(nb);
      let inside = false;
      for (let i = 0, j = g.length - 1; i < g.length; j = i++) {
        const [yi, xi] = g[i], [yj, xj] = g[j];
        if ((yi > c[0]) !== (yj > c[0]) && c[1] < (xj - xi) * (c[0] - yi) / (yj - yi) + xi) inside = !inside;
      }
      if (inside) return c;
      return g.reduce((best, p) => Math.hypot(p[0] - c[0], p[1] - c[1]) < Math.hypot(best[0] - c[0], best[1] - c[1]) ? p : best, g[0]);
    }

    // ---- poll state ----------------------------------------------------------
    const POLL_ACTIVE_MS = 10000;
    const POLL_IDLE_MS   = 60000;
    const IDLE_AFTER_MS  = 120000;   // no interaction for this long ⇒ back off
    let pollTimer = null;
    let pollScheduledMs = 0;
    let lastInteractionAt = Date.now();
    let fetchPromise = null;         // in-flight guard

    // ---- plans state (PLANS, below) --------------------------------------------
    let listView = 'places';         // 'places' | 'plans' -- the Places | Plans switch
    let plans = [];                  // [{ id, name, created_at }]
    let planStops = [];              // [{ id, plan_id, location_id, shape_id, position }]
    let plansAvailable = null;       // null = not loaded yet; false = tables missing (fail soft)
    let plansOffline = false;        // the last read failed for another reason (no connection): keep what's loaded
    let activePlanId = null;
    let planWritesInFlight = 0;
    let plansDigest = null;
    let plansFetchPromise = null;
    let planMarksCache = null;
    let planPanel = { mode: null, draft: '' };   // mode: null | 'creating' | 'acting' | 'renaming'

    // Auth functions
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      currentUser = session?.user || null;
      updateAuthUI();
      return currentUser !== null;
    }

    function updateAuthUI() {
      const accountBtn = document.getElementById('accountBtn');
      const dropdownUserEmail = document.getElementById('dropdownUserEmail');

      if (currentUser) {
        dropdownUserEmail.textContent = currentUser.email;
        accountBtn.classList.add('show');
      } else {
        accountBtn.classList.remove('show');
        hideAccountDropdown();
      }
    }

    function toggleAccountDropdown() {
      const dropdown = document.getElementById('accountDropdown');
      const accountBtn = document.getElementById('accountBtn');
      dropdown.classList.toggle('show');
      accountBtn.classList.toggle('active');
    }

    function hideAccountDropdown() {
      const dropdown = document.getElementById('accountDropdown');
      const accountBtn = document.getElementById('accountBtn');
      dropdown.classList.remove('show');
      accountBtn.classList.remove('active');
    }

    async function showAuthModal() {
      document.getElementById('authModal').classList.add('show');
      document.getElementById('authError').style.display = 'none';
    }

    function hideAuthModal() {
      document.getElementById('authModal').classList.remove('show');
      document.getElementById('authEmailInput').value = '';
      document.getElementById('authPasswordInput').value = '';
      document.getElementById('authError').style.display = 'none';
    }

    async function login() {
      const email = document.getElementById('authEmailInput').value;
      const password = document.getElementById('authPasswordInput').value;
      const authError = document.getElementById('authError');

      if (!email || !password) {
        authError.textContent = 'Please enter email and password';
        authError.style.display = 'block';
        return;
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        authError.textContent = error.message;
        authError.style.display = 'block';
      } else {
        currentUser = data.user;
        updateAuthUI();
        hideAuthModal();
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      hideAccountDropdown();
      updateAuthUI();
    }

    async function requireAuth() {
      if (!currentUser) {
        await showAuthModal();
        return false;
      }
      return true;
    }

    // Visited/starred writes in flight (toggleLocationFlag()). While any is
    // pending, a fetch -- the 10s poll or another write's refetch -- must
    // not paint server rows over the optimistic screen: that repainted a
    // just-removed star for ~230ms when the owner tapped twice. The fetch
    // still runs; its rows are simply not applied. The last write to
    // settle refetches once, which reconciles everything.
    let flagWritesInFlight = 0;

    // Explicit column list: created_at is ordered by server-side but never
    // rendered, so it is deliberately not selected. PostgREST allows ordering
    // on an unselected column.
    async function doFetchLocations() {
      try {
        const { data, error } = await supabaseClient
          .from('locations')
          .select('id,name,address,category,lat,lng,notes,visited,starred,city')
          .order('created_at', { ascending: false });

        if (error) throw error;
        if (flagWritesInFlight > 0) return;   // see flagWritesInFlight
        const rows = data || [];
        const digest = payloadDigest(rows);
        locations = rows;
        // No-op render: an unchanged payload must not touch the DOM or the map.
        if (digest !== lastPayloadDigest) {
          lastPayloadDigest = digest;
          updateUI();
        }
        hideError('locations');
      } catch (err) {
        showReadProblem(err, 'locations');
      }
    }

    // In-flight guard: overlapping polls would otherwise race each other.
    function fetchLocations() {
      if (fetchPromise) return fetchPromise;
      fetchPromise = doFetchLocations().finally(() => { fetchPromise = null; });
      return fetchPromise;
    }

    // After a mutation we need a read that STARTED after the write, so an
    // already-in-flight request is awaited first and then a fresh one is issued.
    async function refetchLocations() {
      if (fetchPromise) { try { await fetchPromise; } catch (e) { /* reported already */ } }
      return fetchLocations();
    }

    // Shapes carry visited / starred like pins (2026-10-02), so they are polled
    // with the pins (pollTick) and the other phone's marks arrive; the same
    // in-flight guard, the same flagWritesInFlight hold and the same no-op
    // render on an unchanged payload as doFetchLocations().
    let shapesFetchPromise = null;
    let lastShapesDigest = null;
    async function doFetchNeighborhoodShapes() {
      try {
        const { data, error } = await supabaseClient
          .from('neighborhood_shapes')
          .select('id,city,type,label,color,note,min_zoom,geometry,visited,starred');
        if (error) throw error;
        if (flagWritesInFlight > 0) return;   // see flagWritesInFlight
        const rows = data || [];
        const digest = JSON.stringify(rows);
        neighborhoodShapes = rows;
        if (digest !== lastShapesDigest) {
          lastShapesDigest = digest;
          updateUI();   // refreshes the list count/cards too, not just the map layers
        }
        hideError('shapes');
      } catch (err) {
        showReadProblem(err, 'shapes');
      }
    }
    function fetchNeighborhoodShapes() {
      if (shapesFetchPromise) return shapesFetchPromise;
      shapesFetchPromise = doFetchNeighborhoodShapes().finally(() => { shapesFetchPromise = null; });
      return shapesFetchPromise;
    }
    // A read that STARTED after the write (see refetchLocations()).
    async function refetchNeighborhoodShapes() {
      if (shapesFetchPromise) { try { await shapesFetchPromise; } catch (e) { /* reported already */ } }
      return fetchNeighborhoodShapes();
    }

    function payloadDigest(rows) {
      return rows.map(r => `${r.id}:${markerSignature(r)}`).join('~');
    }

    // Owner (2026-10-01): the banner never shows a raw message. A write that fails for want of
    // a connection (a fetch TypeError: Chromium "Failed to fetch", Safari "Load failed", or the
    // browser offline) says "Couldn't save. Check your connection." and goes after 6s; a write
    // the RLS policy refuses says who can edit and stays until tapped. Either way the row has
    // already rolled back.
    const BANNER_WRITE_MS = 6000;
    const errText = err => `${(err && err.message) || err || ''} ${(err && err.code) || ''}`;
    const isNetworkError = err => (typeof navigator !== 'undefined' && navigator.onLine === false) || err instanceof TypeError ||
      /failed to fetch|load failed|networkerror|network request failed/i.test(errText(err));
    const isRLSError = err => /row-level security|policy|42501/i.test(errText(err));
    function showWriteError(err, what, source = 'mutation') {
      if (isRLSError(err)) { showError(`Only Adam and Erica can edit ${what}.`, source); return; }
      showError(isNetworkError(err) ? 'Couldn’t save. Check your connection.' : 'Couldn’t save. Try again.', source, { autoHideMs: BANNER_WRITE_MS });
    }
    // A failed read (load or poll) keeps what's on screen and says so in the navy info band;
    // the next good read of that source, or the browser's `online` event, clears it.
    function showReadProblem(err, source) {
      showInfo(isNetworkError(err) ? 'Offline. Showing what’s loaded.' : 'Couldn’t load. Showing what’s loaded.', source);
    }

    async function addLocation(loc) {
      if (!await requireAuth()) return;

      try {
        const { error } = await supabaseClient
          .from('locations')
          .insert([loc]);

        if (error) throw error;
        await refetchLocations();
        hideError('mutation');
      } catch (err) {
        showWriteError(err, 'places');
      }
    }

    async function addNeighborhoodShape(shape) {
      if (!await requireAuth()) return;

      try {
        const { error } = await supabaseClient
          .from('neighborhood_shapes')
          .insert([shape]);

        if (error) throw error;
        await refetchNeighborhoodShapes();
        hideError('mutation');
      } catch (err) {
        showWriteError(err, 'places');
      }
    }

    async function deleteLocation(id) {
      if (!await requireAuth()) return;

      try {
        const { error } = await supabaseClient
          .from('locations')
          .delete()
          .eq('id', id);

        if (error) throw error;
        await refetchLocations();
        hideError('mutation');
        cleanupOrphanCities();
      } catch (err) {
        showWriteError(err, 'places');
      }
    }

    async function deleteNeighborhoodShape(id) {
      if (!await requireAuth()) return;

      try {
        const { error } = await supabaseClient
          .from('neighborhood_shapes')
          .delete()
          .eq('id', id);

        if (error) throw error;
        await refetchNeighborhoodShapes();
        hideError('mutation');
        cleanupOrphanCities();
      } catch (err) {
        showWriteError(err, 'places');
      }
    }

    // Visited and starred are both one-tap popup toggles, so they share
    // one writer. OPTIMISTIC: the local row flips and updateUI() re-renders
    // the popup, list row and marker at once; the write follows. On
    // failure the flip is reverted. The refetch after a successful write
    // returns the state already on screen, so every signature matches and
    // nothing re-renders (no flicker). The target value is written, not
    // "!current" server-side, so a quick double-tap lands where the
    // screen says it did.
    function setLocationFlag(id, field, value) {
      // Re-rendering replaces the popup's HTML; keep keyboard/VoiceOver
      // focus on the control that was just used.
      const focused = document.activeElement;
      const refocus = focused && focused.matches && focused.matches('.popup-star, .popup-visited')
        ? `.${focused.classList[0]}[data-id="${CSS.escape(id)}"]` : null;
      if (isShapeKey(id)) { const sid = shapeIdOf(id); neighborhoodShapes = neighborhoodShapes.map(n => n.id === sid ? { ...n, [field]: value } : n); }
      else locations = locations.map(l => l.id === id ? { ...l, [field]: value } : l);
      updateUI();
      if (refocus) {
        const btn = document.querySelector(`.leaflet-popup ${refocus}`);
        if (btn) btn.focus({ preventScroll: true });
      }
    }

    // `id` is a row key (rowItem()): a pin's uuid, or 'shape:<id>' for a
    // district/street, written to neighborhood_shapes the same way.
    async function toggleLocationFlag(id, field) {
      if (!await requireAuth()) return;
      const loc = rowItem(id);
      if (!loc) return;
      const next = !loc[field];
      const shape = isShapeKey(id);

      setLocationFlag(id, field, next);
      flagWritesInFlight++;
      try {
        const { error } = await supabaseClient
          .from(shape ? 'neighborhood_shapes' : 'locations')
          .update({ [field]: next })
          .eq('id', shape ? shapeIdOf(id) : id);

        if (error) throw error;
        hideError('mutation');
      } catch (err) {
        // Rollback is per write: only this tap's flip is undone.
        setLocationFlag(id, field, !next);
        showWriteError(err, 'places');
      } finally {
        flagWritesInFlight--;
      }
      // Only the last write to settle reconciles with the server -- see
      // flagWritesInFlight. One visible change per tap, nothing after.
      if (flagWritesInFlight === 0) await Promise.all([refetchLocations(), refetchNeighborhoodShapes()]);
    }

    // The single Nominatim call site. A city is configured in exactly one place
    // (CITIES), and the geocoding context always comes from formCityId().
    // NOTE: no User-Agent header — it is a forbidden header name for fetch and
    // browsers drop it silently, so the old ones never did anything.
    // `cfg` is usually a CITIES entry, but detectCityContext()'s "unknown
    // region" fallback (see below) passes a partial cfg with only `viewbox`
    // + `bounded` set. new URLSearchParams({...}) stringifies a missing
    // field as the literal string "undefined" if it's included unconditionally
    // -- every optional field below is therefore set only when present,
    // never passed as an object key that might be undefined.
    async function nominatim(query, cfg, opts = {}) {
      const params = new URLSearchParams({
        format: 'json',
        q: cfg.geocodeSuffix ? `${query}, ${cfg.geocodeSuffix}` : query,
        limit: String(opts.limit || 1)
      });
      if (cfg.countrycodes) params.set('countrycodes', cfg.countrycodes);   // HARD filter — comma list, see CITIES
      if (cfg.viewbox) params.set('viewbox', cfg.viewbox);                  // SOFT ranking hint only
      if (cfg.bounded) params.set('bounded', '1');                          // HARD filter to viewbox — only set by the unscoped-region fallback
      if (opts.addressdetails) params.set('addressdetails', '1');
      if (opts.polygonGeojson) params.set('polygon_geojson', '1');

      const init = {};
      if (opts.timeout) init.signal = AbortSignal.timeout(opts.timeout);
      lastNominatimAt = performance.now();
      const response = await fetch(`https://nominatim.openstreetmap.org/search?${params}`, init);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    // ---- widen on miss --------------------------------------------------------
    // A trip's places aren't all in the current city (day trips, other towns,
    // another country), but the scoped search above can never return them:
    // the city suffix is part of `q` and `countrycodes` is a hard filter.
    // Owner decision (2026-09-29): search the current city first, exactly as
    // before, and only when that finds NOTHING run one wider search -- no
    // suffix, no countrycodes, the same viewbox as a SOFT bias (never
    // bounded). Filing is untouched. See design/trip-location-model/.
    // Nominatim's usage policy is at most 1 request/s, so the widened call
    // waits until NOMINATIM_SPACING_MS after the previous request started.
    const NOMINATIM_SPACING_MS = 1000;
    let lastNominatimAt = 0;

    // Null when there is nothing to widen (already unscoped and unbounded).
    function widenedSearchConfig(cfg) {
      if (!cfg || !cfg.viewbox) return null;
      if (!cfg.geocodeSuffix && !cfg.countrycodes && !cfg.bounded) return null;
      return { viewbox: cfg.viewbox };
    }

    // `isStale()` (optional) is checked before the wait, after it, and after
    // the widened response: a stale search returns null and is dropped.
    async function nominatimWithFallback(query, cfg, opts = {}, isStale = null) {
      const stale = () => !!(isStale && isStale());
      const data = await nominatim(query, cfg, opts);
      if (stale()) return null;
      if (data && data.length) return data;
      const wide = widenedSearchConfig(cfg);
      if (!wide) return data;
      const wait = lastNominatimAt + NOMINATIM_SPACING_MS - performance.now();
      if (wait > 0) await new Promise(resolve => setTimeout(resolve, Math.ceil(wait)));
      if (stale()) return null;
      const widened = await nominatim(query, wide, opts);
      return stale() ? null : widened;
    }

    // Fetches a district's real OSM boundary polygon -- GeoJSON is [lng, lat],
    // converted here to this app's [lat, lng] convention, so nothing downstream
    // ever has to think about coordinate order.
    async function nominatimPolygon(name, cfg) {
      try {
        const data = await nominatimWithFallback(name, cfg, { limit: 1, polygonGeojson: true, timeout: 8000 });
        if (!data || !data.length || !data[0].geojson) return null;
        const gj = data[0].geojson;
        let ring;
        if (gj.type === 'Polygon') ring = gj.coordinates[0];
        else if (gj.type === 'MultiPolygon') ring = gj.coordinates[0][0];
        else return null;
        return ring.map(([lng, lat]) => [lat, lng]);
      } catch (err) {
        return null;
      }
    }

    // Fetches a named street's real mapped path via Overpass. Overpass returns
    // geometry nodes as {lat, lon} objects already, so no coordinate-order
    // conversion is needed (unlike Nominatim's GeoJSON).
    async function overpassWay(name, cfg) {
      const [lonMin, latMin, lonMax, latMax] = cfg.viewbox.split(',').map(Number);
      const query = `[out:json][timeout:15];way["name"="${name}"]["highway"](${latMin},${lonMin},${latMax},${lonMax});out geom;`;
      try {
        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: `data=${encodeURIComponent(query)}`,
          signal: AbortSignal.timeout(15000)
        });
        if (!response.ok) return null;
        const data = await response.json();
        if (!data.elements || !data.elements.length) return null;
        // A street is often split into several OSM way segments -- merge all
        // of them into one path, but keep each element's point count so a
        // caller can still tell them apart (resolveShapeCity() uses this to
        // drop a whole mismatched-city segment instead of voting point by
        // point).
        const points = [];
        const segmentLengths = [];
        data.elements.forEach(el => {
          if (!el.geometry) return;
          const before = points.length;
          el.geometry.forEach(pt => points.push([pt.lat, pt.lon]));
          segmentLengths.push(points.length - before);
        });
        return points.length ? { points, segmentLengths } : null;
      } catch (err) {
        return null;
      }
    }

    // Fallback when OSM has no polygon/way for a district/street: land an
    // approximate pin instead of forcing a trip to
    // tools/neighborhood-shapes.html for manual tracing. Two escalating
    // attempts -- a plain point search (many named neighborhoods have a
    // node even with no boundary relation), then an Overpass node search
    // scoped to the city bbox (catches an entrance/landmark node under a
    // different tag shape than a plain search surfaces). Returns
    // {lat, lng, tier} or null if OSM genuinely has nothing at all.
    // Re-upgrading to a real boundary later, if OSM ever gains one, is a
    // separate concern -- not attempted here.
    async function findApproximatePoint(name, cfg) {
      try {
        const data = await nominatimWithFallback(name, cfg, { limit: 1, timeout: 8000 });
        if (data && data.length) {
          return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), tier: 'point search' };
        }
      } catch (err) { /* fall through to the Overpass node attempt */ }

      try {
        const [lonMin, latMin, lonMax, latMax] = cfg.viewbox.split(',').map(Number);
        const query = `[out:json][timeout:15];node["name"="${name}"](${latMin},${lonMin},${latMax},${lonMax});out;`;
        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: `data=${encodeURIComponent(query)}`,
          signal: AbortSignal.timeout(15000)
        });
        if (response.ok) {
          const data = await response.json();
          if (data.elements && data.elements.length) {
            const el = data.elements[0];
            return { lat: el.lat, lng: el.lon, tier: 'Overpass node' };
          }
        }
      } catch (err) { /* genuinely nothing found */ }

      return null;
    }

    async function geocode(address) {
      try {
        const data = await nominatimWithFallback(address, currentSearchCityConfig(), { limit: 1, addressdetails: true });
        if (data && data.length > 0) {
          return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), addressDetails: data[0].address || null };
        }
        return null;
      } catch (err) {
        console.error('Geocoding failed:', err);
        return null;
      }
    }

    // Debounce function to limit API calls
    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    // Autocomplete search function
    // searchSeq drops a response (scoped or widened) once a newer search has
    // started or the Name field no longer holds the query it answers.
    let searchSeq = 0;
    async function searchAddress(query) {
      const seq = ++searchSeq;
      if (query.length < 2) {
        hideAutocomplete();
        return;
      }

      const autocompleteDiv = document.getElementById('addressAutocomplete');
      autocompleteDiv.innerHTML = '<div class="autocomplete-loading">Searching...</div>';
      autocompleteDiv.classList.add('show');

      const isStale = () => seq !== searchSeq || document.getElementById('nameInput').value !== query;
      try {
        const data = await nominatimWithFallback(query, currentSearchCityConfig(), {
          limit: 10,
          addressdetails: true,
          timeout: 5000
        }, isStale);
        if (isStale()) return;

        if (data && data.length > 0) {
          autocompleteDiv.innerHTML = data.map(result => {
            const displayName = result.display_name;
            const addressDetailsJson = escapeAttr(JSON.stringify(result.address || {}));
            return `<div class="autocomplete-item" data-lat="${result.lat}" data-lon="${result.lon}" data-name="${escapeHtml(displayName)}" data-address-details="${addressDetailsJson}">${escapeHtml(displayName)}</div>`;
          }).join('');

          // Add click handlers to autocomplete items
          autocompleteDiv.querySelectorAll('.autocomplete-item').forEach(item => {
            item.onclick = () => selectAddress(item);
          });
        } else {
          autocompleteDiv.innerHTML = '<div class="autocomplete-loading">No results found. Try a different search.</div>';
        }
      } catch (err) {
        console.error('Autocomplete search failed:', err);
        if (isStale()) return;
        if (err.name === 'TimeoutError') {
          autocompleteDiv.innerHTML = '<div class="autocomplete-loading">Search timed out. Try again.</div>';
        } else {
          autocompleteDiv.innerHTML = '<div class="autocomplete-loading">Search failed. Please wait and try again.</div>';
        }
      }
    }

    // Coordinates already returned by the autocomplete, so the submit handler
    // does not have to re-geocode a string that IS a Nominatim display_name.
    // Keyed by the address text, so any manual edit invalidates it naturally.
    let selectedPlace = null;   // { address, lat, lng }

    // Select an address from autocomplete
    function selectAddress(item) {
      const displayName = item.getAttribute('data-name');
      const addressInput = document.getElementById('addressInput');
      const nameInput = document.getElementById('nameInput');

      // Extract just the place name (first part before comma)
      const placeName = displayName.split(',')[0].trim();

      // Set name to the place name
      nameInput.value = placeName;

      // Set address to the full display name
      addressInput.value = displayName;

      const lat = parseFloat(item.getAttribute('data-lat'));
      const lng = parseFloat(item.getAttribute('data-lon'));
      selectedPlace = (isFinite(lat) && isFinite(lng))
        ? { address: displayName, lat, lng }
        : null;

      if (selectedPlace) {
        let addressDetails = null;
        try { addressDetails = JSON.parse(item.getAttribute('data-address-details') || 'null'); } catch (e) { /* ignore */ }
        maybeDetectCity(lat, lng, addressDetails);
      }

      hideAutocomplete();
    }

    // Hide autocomplete dropdown
    function hideAutocomplete() {
      const autocompleteDiv = document.getElementById('addressAutocomplete');
      autocompleteDiv.classList.remove('show');
      autocompleteDiv.innerHTML = '';
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // escapeHtml() is safe for text NODES but not for double-quoted attribute
    // VALUES -- it never escapes `"`, so a JSON blob (which is full of them)
    // embedded via escapeHtml() would break out of the attribute early. Used
    // only for the data-address-details payload stashed on autocomplete rows.
    function escapeAttr(text) {
      return text.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }
    
    // =========================================================================
    // City state engine
    // =========================================================================

    // Never throws: an unknown id (stale localStorage, an unexpected DB row)
    // degrades to the default city rather than blowing up during init.
    // Never called with ALL_CITIES — callers that can see it branch first.
    function cityConfig(cityId) {
      return CITIES[cityId] || CITIES[DEFAULT_CITY];
    }

    function isAllCities() {
      return citySelection === ALL_CITIES;
    }

    function activeCityLabel() {
      return isAllCities() ? 'All cities' : cityConfig(citySelection).label;
    }

    // The filters apply in BOTH views. Plans adds the open plan's stops,
    // whole and whatever the filters say (the chips choose what you can add;
    // they never hide your plan).
    function visibleLocations() {
      const match = locations.filter(loc =>
        filters.categories[loc.category] &&
        (filters.city === null || loc.city === filters.city));
      if (!inPlanView()) return match;
      if (!activePlan()) return [];
      const stops = planMarks().rows.filter(r => r.loc).map(r => r.loc);
      const inPlan = new Set(stops.map(l => l.id));
      return stops.concat(match.filter(l => !inPlan.has(l.id)));
    }

    function persistCitySelection(selection) {
      try {
        localStorage.setItem(CITY_STORAGE_KEY, selection);
      } catch (err) {
        // Private mode / storage disabled — selection simply doesn't persist.
      }
    }

    // → cityId | ALL_CITIES | null. null means "nothing usable stored", and ONLY that.
    function restoreCitySelection() {
      try {
        const stored = localStorage.getItem(CITY_STORAGE_KEY);
        if (stored === ALL_CITIES) return ALL_CITIES;
        if (stored && CITIES[stored]) return stored;
        return null;
      } catch (err) {
        return null;
      }
    }

    // The ONLY writer of citySelection, activeCity and filters.city.
    // NOTE: there is deliberately NO no-op early-return when the selection is
    // unchanged. Re-tapping the already-active city MUST re-frame the map —
    // that is the recovery path for a user who panned into the ocean.
    function setActiveCity(selection, opts = {}) {
      if (selection !== ALL_CITIES && !CITIES[selection]) selection = DEFAULT_CITY;

      citySelection = selection;
      if (selection !== ALL_CITIES) activeCity = selection;   // else keep last real city
      filters.city = (selection === ALL_CITIES) ? null : selection;

      // Re-ink the chrome. activeCity (never ALL_CITIES) is the authoring /
      // viewport context, so "All cities" keeps the last real city's accent
      // rather than falling back to a neutral.
      applyCityPalette(activeCity);

      noteInteraction();

      // The highlighted location may belong to the city we are leaving.
      setHighlighted(null);

      // Plans frames the open plan instead (frameActivePlan(): the building
      // fit takes in the new city's places; following, its leg; no stops yet,
      // the city's matching places).
      const framePlan = inPlanView() && !!activePlan();
      if (opts.frame !== false && !framePlan) {
        focusCity(selection, { animate: opts.animate !== false });
      }

      persistCitySelection(selection);
      updateUI();                 // reaches syncMarkers()/syncLocationCards()
      updateCitySelectorUI();
      syncAddFormCity();

      // Preserving scroll across a poll tick is the point of the reconciler;
      // preserving it across a city switch strands the user mid-list.
      document.getElementById('locationsList').scrollTop = 0;
      if (inPlanView()) { showPlanRule(); if (opts.frame !== false && framePlan) frameActivePlan(); }
    }
    // After a filter change in Plans, the list scrolls so the rule sits at the
    // top of the list (the stops are one flick up, or a tap on the plan's name
    // in the header). Nothing moves in Places.
    function showPlanRule() {
      const list = document.getElementById('locationsList');
      const rule = list.querySelector('.plan-rule');
      if (!rule || !planMarks().rows.length) return;
      list.scrollTop += rule.getBoundingClientRect().top - list.getBoundingClientRect().top;
    }

    // ---- viewport ------------------------------------------------------------

    function prefersReducedMotion() {
      return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    // The single wrapper over Leaflet viewport control.
    //   zoom: number → absolute; { atLeast: n } → Math.max(map.getZoom(), n)
    function focusMap(center, zoom, opts = {}) {
      let targetZoom;
      if (zoom && typeof zoom === 'object' && typeof zoom.atLeast === 'number') {
        targetZoom = Math.max(map.getZoom(), zoom.atLeast);
      } else if (typeof zoom === 'number') {
        targetZoom = zoom;
      } else {
        targetZoom = map.getZoom();
      }

      if (opts.animate === false || prefersReducedMotion()) {
        map.setView(center, targetZoom, { animate: false });
        return;
      }

      map.flyTo(center, targetZoom, {
        duration: opts.duration || flyDuration(map.getCenter(), center)
      });
    }

    // The only city-framing entry point.
    function focusCity(selection, opts = {}) {
      if (selection === ALL_CITIES) return fitVisible(opts);
      const cfg = cityConfig(selection);
      return focusMap(cfg.center, cfg.zoom, opts);
    }

    // Frames the currently-visible data (respects the category filters).
    function fitVisible(opts = {}) {
      const pts = visibleLocations().map(l => [l.lat, l.lng]);
      if (pts.length === 0) return focusCity(activeCity, opts);   // concrete fallback
      if (pts.length === 1) return focusMap(pts[0], { atLeast: 13 }, opts);

      const bounds = L.latLngBounds(pts).pad(0.15);
      const animate = opts.animate !== false && !prefersReducedMotion();
      map.fitBounds(bounds, animate
