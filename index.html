        // first eraser speck (unstar), and the detent catch.
        if (!g.starred) g.svg.classList.toggle('sg-press', crossed);
        else if (crossed && !g.speck) { g.speck = true; starCrumbs(g, [0]); }
        if (crossed && !prefersReducedMotion()) g.catchT = sgNow();
      }
      setSlip(g, g.offBase + starCatch(g));
      setPen(g, raw);
    }

    // Eraser dust: three graphite specks, <=2px of drift, gone in 200ms.
    function starCrumbs(g, which = [0, 1, 2]) {
      if (prefersReducedMotion()) return;
      const x = parseFloat(g.svg.style.left), y = parseFloat(g.svg.style.top), k = (g.svg.getBoundingClientRect().width || 12) / 12;
      // Round 6: the dust is BRUSHED OFF THE PAGE -- out of the text column.
      // It falls from the star's lower-left inner corner and is swept left
      // (fast at first) into the 12px gutter between the category badge and
      // the text column, which no text ever enters, fading as it goes. The
      // name, already on its way home (N4-b), therefore never meets a speck:
      // no stray "accent" on the letters.
      [[3.5, 9.5, -12, 2], [4.5, 10.8, -13, 3], [2.8, 8.4, -11, 1.5]].map(([a, b2, dx, dy]) => [a * k, b2 * k, dx, dy]).forEach(([cx, cy, dx, dy], i) => {
        if (!which.includes(i)) return;
        const c = document.createElement('span');
        c.className = 'sg-crumb';
        c.style.left = (x + cx) + 'px'; c.style.top = (y + cy) + 'px';
        g.main.appendChild(c);
        c.animate([{ transform: 'translate(0,0)', opacity: 1 },
                   { transform: `translate(${dx * 0.7}px, ${dy * 0.5}px)`, opacity: 0.9, offset: 0.3 },
                   { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 }],
                  { duration: 200 + i * 20, easing: 'cubic-bezier(.2,.6,.4,1)', fill: 'forwards' })
          .finished.then(() => c.remove(), () => c.remove());
      });
    }

    function releaseStarRow(el, g, restore) {
      const dust = [...el.querySelectorAll('.sg-crumb')], before = dust.length && g.main ? g.main.getBoundingClientRect().left : 0;
      el.classList.remove('sg-live');
      if (dust.length && g.main) { const shift = before - g.main.getBoundingClientRect().left; dust.forEach(c => { c.style.left = (parseFloat(c.style.left) + shift) + 'px'; }); }
      if (restore) { g.svg.remove(); setSlip(g, 0); g.main.style.transform = ''; g.main.style.removeProperty('--sg-fade-a'); }
      if (starGesture && starGesture.id === g.id) starGesture = null;
      starHeld.delete(g.id);
    }

    function abortStarDrag(el, g) { g.penLive = false; if (g.penRaf) cancelAnimationFrame(g.penRaf); releaseStarRow(el, g, true); }

    const easeOut = t => 1 - Math.pow(1 - t, 3);
    let sgNow = () => performance.now();   // one clock for every timeline (a test can step it)
    function runTimeline(ms, frame, done) {
      if (ms <= 0 || prefersReducedMotion()) { frame(1); done(); return; }
      const t0 = sgNow();
      const step = () => { const t = Math.min(1, (sgNow() - t0) / ms); frame(t); if (t < 1) requestAnimationFrame(step); else done(); };
      requestAnimationFrame(step);
    }

    // R2-S1: the FINAL row (printed star in or out, final truncation) is
    // laid out on the release frame; the name then FLIPs home from where
    // the finger left it. Letters change while the name is moving fastest,
    // never on the frame it comes to rest.
    function flipToFinal(el, g, nowStarred, ms, done) {
      const oldH = textLeft(g.h3);
      const oldMeta = g.meta.getBoundingClientRect().left;
      const loc = locations.find(l => l.id === g.id) || {};
      const fin = { ...loc, starred: nowStarred };
      const svg = g.svg; svg.remove();
      const dust = [...g.main.querySelectorAll('.sg-crumb')]; dust.forEach(c => c.remove());   // the dust keeps falling
      renderCard(el, fin);
      const entry = cardsById.get(g.id); if (entry) entry.signature = cardSignature(fin);
      g.h3 = el.querySelector('h3'); g.meta = el.querySelector('.row-meta'); g.main = el.querySelector('.row-main');
      g.main.appendChild(svg); dust.forEach(c => g.main.appendChild(c));
      const dH = oldH - textLeft(g.h3), dM = oldMeta - g.meta.getBoundingClientRect().left;
      setSlip(g, dH, dM);
      runTimeline(ms, t => { const e = easeOut(t); setSlip(g, dH * (1 - e), dM * (1 - e)); }, done);
    }

    function settleStarDrag(el, g, commit) {
      const nowStarred = commit ? !g.starred : g.starred;
      if (!commit) el.querySelectorAll('.sg-crumb').forEach(c => c.remove());   // a cancel takes its dust back
      const off0 = g.off, meta0 = g.metaOff || 0, raw0 = g.raw, give0 = g.main.style.transform;
      if (commit) {
        toggleLocationFlag(g.id, 'starred');   // optimistic; this row's re-render is held -- we lay it out ourselves
        let parts = 2;
        const both = () => { if (--parts === 0) { g.penLive = false; releaseStarRow(el, g, true); updateUI(); } };
        // The pen finishes on its own (a flick, or a fast swipe, lets go
        // before the sketch is done); ink lands / dust falls when it arrives.
        const held = starHeld.get(g.id);
        if (held) held.ff = () => {           // R4-S2: jump to the ink frame (still presses in / dust still falls)
          if (g.ffDone) return; g.ffDone = true;
          if (g.penRaf) { cancelAnimationFrame(g.penRaf); g.penRaf = 0; }
          g.f = STAR_SWIPE.COMMIT; g.v = STAR_SWIPE.COMMIT; paintStarVisual(g, STAR_SWIPE.COMMIT);
          if (g.onNear) { const cb = g.onNear.cb; g.onNear = null; cb(); }
          if (g.onPen) { const cb = g.onPen; g.onPen = null; cb(); }
        };
        if (g.starred && !prefersReducedMotion() && (g.v || 0) < STAR_SWIPE.COMMIT) {
          // Unstar let go before the rub finished: the name holds where the
          // finger left it and starts home 100ms before the dust falls (N4-b)
          // -- never over the star while it is still readable.
          const at = STAR_SWIPE.COMMIT - 100 * STAR_SWIPE.COMMIT / STAR_SWIPE.RUB_MS;
          g.rubDeadline = sgNow() + STAR_SWIPE.RUB_AFTER_LIFT;          // round 6: lift -> name moving <= 150ms
          g.onNear = { at, time: g.rubDeadline - 100, cb: () => flipToFinal(el, g, nowStarred, STAR_SWIPE.SETTLE, both) };
          g.onPen = () => both();
          setPen(g, STAR_SWIPE.COMMIT);
          if ((g.v || 0) >= at && g.onNear) { const cb = g.onNear.cb; g.onNear = null; cb(); }
          return;
        }
        g.onPen = () => setTimeout(both, g.starred || prefersReducedMotion() ? 0 : STAR_POP_MS + 20);   // let the ink pop land
        setPen(g, STAR_SWIPE.COMMIT);
        if (g.v >= STAR_SWIPE.COMMIT && g.onPen) { const cb = g.onPen; g.onPen = null; cb(); }
        flipToFinal(el, g, nowStarred, STAR_SWIPE.SETTLE, both);
        return;
      }
      const v0 = g.v || 0; g.penLive = false; if (g.penRaf) { cancelAnimationFrame(g.penRaf); g.penRaf = 0; }
      runTimeline(STAR_SWIPE.SETTLE, (t) => {
        const e = easeOut(t);
        if (give0) g.main.style.transform = `translateX(${(parseFloat(give0.slice(11)) * (1 - e)).toFixed(2)}px)`;
        if (!g.forward) return;
        setSlip(g, off0 * (1 - e), meta0 * (1 - e));
        paintStarVisual(g, Math.min(v0, raw0 * (1 - e)));   // pencil retracts / ink returns, never ahead of the finger
      }, () => releaseStarRow(el, g, true));
    }

    // ---- VISIT STAMP: swipe LEFT -- the stamp STAMPS ---------------------------
    // The mirror of the Pencil Star: a pencil DRAWS over time in the star's
    // slot (left); a stamp is PRESSED in one instant in its own column (right).
    // The mark is the shipped .row-stamp -- same box, ring, track, 82% navy and
    // per-place stampTilt(). Nothing slides (owner, round 3: "it should stamp
    // with some grow shrink ... maybe the same as the star").
    //   Before the commit (0..56px of content travel, past the 10px lock):
    //     the stamp never slides. The name's tail feathers out of the slot
    //     (0..6px), then the ink BLEEDS into the paper in the slot (vsCue,
    //     6..56px): a dense blot where it touched, then a crisp pale core
    //     spreading out under a wet fibrous front -- never the whole ring, never full ink.
    //   Press (the 56px crossing, in the same event): the cue gives way to the
    //     whole stamp at full strength (ring, track, word), the visited field and the final
    //     truncation land on this frame, haptic, and VISIT_POP plays: the
    //     star's STAR_POP -- same timing, offsets and per-segment easings --
    //     about the place's own tilt, scaled for a 72x32 oval (peak 1.2x, twist
    //     -12 -> +4 -> -1.5deg; measured clearance below). Backing off 4px
    //     below 56 un-presses on that frame (hysteresis).
    //   Un-visit: the same stroke on a visited row. At the lock the stamp
    //     lifts with the star's erase pop (STAR_ERASE_POP: 1.12x, no twist);
    //     then it pales toward a light navy tint (full opacity, chroma >= 0.045)
    //     between 12 and 44px; at 56 it is gone, the field drains, erase haptic.
    //   Reduced motion: no pop, no lift; the sweep (finger-driven, not motion)
    //     stays and the press simply appears. Haptics still fire.
    const VISIT_SWIPE = { PRINT_INK: 0.82, GHOST: 0.3, FADE_LAG: 12, HYST: 4, TAIL_OUT: 6,
                          RETURN_MS: 180, XBACK_MS: 120 };
    const DELETE_TAP_SLOP = 4;
    // STAR_POP, about the stamp's tilt: [offset, twist (deg, added to the tilt), scale, easing into the next].
    // Same timing, offsets and per-segment easings as the star; smaller, because
    // a 72x32 oval's growth is large in absolute px (owner, live: "Visited pops
    // too large" at 1.2x). Peak 1.1x, twist -10/+3/-1.2deg, dip 0.97. Still
    // distinct from the un-visit lift (1.12x, no twist, no dip): the visit pop
    // twists and dips; the lift only rises, then pales.
    const VISIT_POP_PEAK = 1.1;
    const VISIT_POP = [[0, -10, 1, [.2, .9, .3, 1]], [0.34, 3, VISIT_POP_PEAK, [.6, 0, .85, .45]], [0.65, -1.2, 0.97, [.4, 0, .3, 1]], [1, 0, 1, null]];
    const VISIT_POP_MS = STAR_POP_MS;
    const VISIT_LIFT = [[0, 0, 1, [.2, .9, .3, 1]], [0.35, 0, 1.12, [.5, 0, .4, 1]], [1, 0, 1, null]];   // = STAR_ERASE_POP
    function cubicBezier(x1, y1, x2, y2) {
      const bx = t => ((1 - 3 * x2 + 3 * x1) * t + (3 * x2 - 6 * x1)) * t * t + 3 * x1 * t;
      const by = t => ((1 - 3 * y2 + 3 * y1) * t + (3 * y2 - 6 * y1)) * t * t + 3 * y1 * t;
      return x => { let lo = 0, hi = 1, t = x; for (let i = 0; i < 24; i++) { const v = bx(t); if (Math.abs(v - x) < 1e-5) break; if (v < x) lo = t; else hi = t; t = (lo + hi) / 2; } return by(t); };
    }
    const vsEase = new Map();
    function keyAt(keys, u) {                // linear effect, per-segment easing (the star's model)
      if (u >= 1) return [keys[keys.length - 1][1], keys[keys.length - 1][2]];
      for (let i = 0; i < keys.length - 1; i++) if (u < keys[i + 1][0]) {
        const [o0, r0, s0, e] = keys[i], [o1, r1, s1] = keys[i + 1];
        if (!vsEase.has(e)) vsEase.set(e, cubicBezier(...e));
        const k = vsEase.get(e)((u - o0) / (o1 - o0));
        return [r0 + (r1 - r0) * k, s0 + (s1 - s0) * k];
      }
      return [0, 1];
    }
    // rAF-driven (main-thread inline styles, never a promoted layer, so every
    // frame rasterises crisp at 4x).
    function runVisitPop(g, keys, ms, done) {
      const st = g.st, t0 = sgNow(), id = (g.popId = (g.popId || 0) + 1);
      const step = () => {
        if (g.popId !== id) return;
        const u = Math.min(1, (sgNow() - t0) / ms), [dr, sc] = keyAt(keys, u);
        st.style.transform = `scale(${sc.toFixed(4)}) rotate(${(g.tilt + dr).toFixed(3)}deg)`;
        if (u < 1) requestAnimationFrame(step); else { st.style.transform = `rotate(${g.tilt}deg)`; g.popId++; if (done) done(); }
      };
      step();
    }
    function stopVisitPop(g) { g.popId = (g.popId || 0) + 1; g.st.style.transform = `rotate(${g.tilt}deg)`; }
    // The pre-commit cue for travel fraction p (0..1): see the CSS.
    // The bleed (see the CSS): p (0..1) drives only transforms and opacities.
    const VS_BLEED = { S0: 0.1, S1: 1.55, WAIT: 0.24, LEAD: 0.16, BLOT_OUT: [0.3, 0.7], BLOT_REST: 0.35, RX: 18.2, RY: 13, STEP2: [0.31, 0.39], STEP3: [0.66, 0.74] };
    // The reveal ellipse is 18.2 x 13 CSS px at scale 1 (aspect 1.4). At S0 the
    // core is 1.8 x 1.3px -- inside the blot's solid 5.4 x 2.7px -- until
    // WAIT (content 18px), on every row type. It reaches the ring's top and
    // bottom (12px) from ~27px; its half-width tops out at ~30px (< the
    // ring's 32 / the track's 36), so the ends are still soaking at 54px.
    const VS_INK = ['oklch(0.70 0.035 247)', 'oklch(0.665 0.035 247)', 'oklch(0.632 0.035 247)'];
    const VS_INK_HI = [34, 42, 50];   // % paper into the highlighted row's field
    function vsBleedMarkup() {
      const copy = (k = '') => `<span class="row-stamp vs-copy${k}"><span class="row-stamp-ring"><span class="row-stamp-word">Visited</span></span></span>`;
      return '<span class="vs-bleed" aria-hidden="true">'
        + '<span class="vs-rv vs-rv-halo"><span class="vs-cs">' + copy() + '<span class="vs-blot"></span></span></span>'
        + '<span class="vs-rv vs-rv-core"><span class="vs-cs">' + copy() + copy(' vs-k2') + copy(' vs-k3') + '</span></span></span>';
    }
    function vsCue(st, p, k = 1) {
      const q = Math.max(0, Math.min(1, p)), B = VS_BLEED;
      const u = Math.max(0, (q - B.WAIT) / (1 - B.WAIT));                  // the blot first: the core waits inside it until ~18px
      const sc = B.S0 + B.S1 * Math.sqrt(u), sh = sc + B.LEAD;           // capillary: fast, then slowing; the wet halo leads
      st.__vsQ = q;
      const key = sc.toFixed(4); if (st.__vsKey === key && st.__vsK === k) return; st.__vsKey = key; st.__vsK = k;
      const rv = st.querySelectorAll(':scope > .vs-bleed > .vs-rv');
      if (rv.length === 2) {
        rv[0].style.transform = `scale(${sh.toFixed(4)})`; rv[0].firstElementChild.style.transform = `scale(${(1 / sh).toFixed(5)})`;
        rv[1].style.transform = `scale(${sc.toFixed(4)})`; rv[1].firstElementChild.style.transform = `scale(${(1 / sc).toFixed(5)})`;
        const blot = rv[0].querySelector('.vs-blot'), [b0, b1] = B.BLOT_OUT;
        blot.style.opacity = (1 - (1 - B.BLOT_REST) * Math.max(0, Math.min(1, (q - b0) / (b1 - b0)))).toFixed(3);
      }
      // P6-N1: the ink deepens by crossfading pre-rendered copies (opacity only)
      const sm = (a, b) => { const t = Math.max(0, Math.min(1, (q - a) / (b - a))); return t * t * (3 - 2 * t); };
      const w2 = sm(B.STEP2[0], B.STEP2[1]), w3 = sm(B.STEP3[0], B.STEP3[1]);
      if (rv.length === 2) { const cs = rv[1].firstElementChild.children; cs[1].style.opacity = w2.toFixed(3); cs[2].style.opacity = w3.toFixed(3); }
      st.style.opacity = k.toFixed(3);
    }
    function vsCueClear(st) { st.style.opacity = ''; }

    // P3-N1: the un-visit ghost pales toward a LIGHT NAVY TINT at full opacity
    // (oklch, hue held), never by alpha over warm paper, which went neutral
    // grey (chroma 0.016). Chroma stays >= 0.045 on every frame until it's gone.
    const VS_GHOST_TINT = 'oklch(0.80 0.045 249.2)';
    function vsGhostInk(k) { return `color-mix(in oklch, var(--navy) ${(k * 100).toFixed(1)}%, ${VS_GHOST_TINT})`; }

    function beginVisitDrag(el, g) {
      const id = el.getAttribute('data-id'), loc = locations.find(l => l.id === id);
      if (!loc) return false;
      starHeld.forEach((h, hid) => { if (hid !== id && h.ff) h.ff(); });     // R4-S2 for any finishing row
      el.classList.remove('active');
      const main = el.querySelector('.row-main'), acts = el.querySelector('.location-actions');
      const h3 = el.querySelector('h3'), meta = el.querySelector('.row-meta');
      const badge = el.querySelector('.row-badge');
      const star = el.querySelector('.row-star');
      if (!main || !acts || !h3 || !meta) return false;
      const tilt = stampTilt(id), visited = !!loc.visited;
      let st = el.querySelector('.row-stamp');
      if (!visited) {
        st = document.createElement('span');
        st.className = 'row-stamp vs-carry vs-open'; st.setAttribute('aria-hidden', 'true');
        st.style.setProperty('--stamp-tilt', tilt + 'deg');
        st.style.transform = `rotate(${tilt}deg)`;
        st.innerHTML = '<span class="row-stamp-ring"><span class="row-stamp-word">Visited</span></span>' + vsBleedMarkup();
        const hl = el.classList.contains('highlighted');
        const bg = getComputedStyle(el).backgroundColor;
        (hl ? VS_INK_HI.map(k => `color-mix(in oklch, var(--paper) ${k}%, ${bg})`) : VS_INK).forEach((c, i) => st.style.setProperty(`--vs-ink-${i + 1}`, c));
        vsCue(st, 0, 0);
      }
      const field = getComputedStyle(el).backgroundColor;
      el.classList.add('vs-live', 'vs-xhide');
      if (!visited) acts.prepend(st);
      Object.assign(g, { state: 'drag', visit: true, id, el, visited, st, main, h3, meta, badge, star, tilt, field, hi: el.classList.contains('highlighted'), raw: 0, pressed: false, lifted: false, armed: false });
      starHeld.set(id, { ff: null });
      if (visited && !prefersReducedMotion()) runVisitPop(g, VISIT_LIFT, 240);   // the star's erase pop: lift to rub it out
      paintVisit(g);
      return true;
    }

    function paintVisitDrag(g, dx) {
      g.raw = Math.max(0, -dx - STAR_SWIPE.LOCK);
      paintVisit(g);
    }

    // Visual state for content travel g.raw. The name + meta slide as one
    // block via the star's own setSlip() (1:1 with the finger, mirrored --
    // negative here, since this stroke runs left), rubber-banding past
    // COMMIT exactly as paintStarDrag() does. Final truncation is a FLIP
    // concern (flipVisitToFinal(), at settle) -- nothing here ever
    // re-truncates the still-live text mid-drag.
    function paintVisit(g) {
      const C = STAR_SWIPE.COMMIT, V = VISIT_SWIPE, rm = prefersReducedMotion();
      const r = g.raw, st = g.st, el = g.el;
      const offBase = r <= C ? r : Math.min(STAR_SWIPE.MAX, C + (r - C) * 0.35);
      setSlip(g, -offBase);
      if (!g.visited) {
        const wasPressed = g.pressed;
        g.pressed = wasPressed ? r >= C - V.HYST : r >= C;
        if (g.pressed) {
          if (!wasPressed) {                // the stamp lands: same event, same frame
            st.classList.remove('vs-open'); vsCueClear(st);
            el.classList.add('is-visited');                 // field lands INSIDE the press
            g.pressT = sgNow();
            if (!rm) runVisitPop(g, VISIT_POP, VISIT_POP_MS); else stopVisitPop(g);
            if (!g.replay) starHaptic('ink');
          }
        } else {
          if (wasPressed) { stopVisitPop(g); st.classList.add('vs-open'); el.classList.remove('is-visited'); }   // un-press frame: old layout back
          vsCue(st, (r - V.TAIL_OUT) / (C - V.TAIL_OUT), Math.max(0, Math.min(1, (r - V.TAIL_OUT) / V.TAIL_OUT)));
        }
      } else {
        const wasLifted = g.lifted;
        g.lifted = wasLifted ? r >= C - V.HYST : r >= C;
        const f = Math.max(0, Math.min(1, (r - V.FADE_LAG) / (44 - V.FADE_LAG)));
        // P3-N1 + P5-S2: the ghost path starts AT the resting ink (82% navy on
        // this field: L 0.40 / C 0.035) and only pales, in oklch, toward a light
        // navy tint at full opacity -- lightness never drops, chroma never
        // falls below the rest's, and until 12px nothing changes at all.
        if (!g.hi) st.style.color = f <= 0 ? '' : `color-mix(in oklch, color-mix(in srgb, var(--navy) 82%, ${g.field}) ${((1 - f) * 100).toFixed(1)}%, ${VS_GHOST_TINT})`;
        st.style.opacity = g.lifted ? '0' : g.hi ? (1 - (1 - V.GHOST / V.PRINT_INK) * f).toFixed(3) : '1';   // highlighted row: its paper ink thins
        if (g.lifted && !wasLifted) { el.classList.remove('is-visited'); if (!g.replay) starHaptic('erase'); }
        if (!g.lifted && wasLifted) el.classList.add('is-visited');
        // Reduced motion has no sweep to hide the wider truncation under, so it
        // lands on the lift frame itself (the stamp and field go on that frame).
        if (rm) st.style.display = g.lifted ? 'none' : '';
      }
    }

    function vsCleanup(el, g) {
      el.classList.remove('vs-live');
      if (g.h3) setSlip(g, 0);   // defensive: the FLIP (or a cancel) should already be at rest
      starHeld.delete(g.id);
    }
    function vsXBack(el, g) {               // the X fades back; it is tappable only once it's fully there
      el.classList.remove('vs-xhide');
      const x = el.querySelector('.delete-btn');
      if (!x) return;
      x.style.pointerEvents = 'none';           // reduced motion too: it appears at once, but is live only after XBACK_MS
      const live = () => { x.style.pointerEvents = ''; };
      if (prefersReducedMotion() || !x.animate) { setTimeout(live, VISIT_SWIPE.XBACK_MS); return; }
      x.animate([{ opacity: 0 }, { opacity: 1 }], { duration: VISIT_SWIPE.XBACK_MS, easing: 'linear' }).finished.then(live, live);
    }

    function abortVisitDrag(el, g) { settleVisitDrag(el, g, false); }

    // POPUP -> ROW REPLAY. Mark Visited / Unmark in the popup plays the same
    // stamp on the place's list row, every time (not a teaching cap): visit =
    // a quick bleed, then the press frame (field + final truncation) and the
    // pop; un-visit = the erase lift, the pale-out, gone, then the reveal. It
    // is the gesture's own machinery driven by a timeline instead of a finger,
    // so every rule carries over (glyphs change only on the press/lift frame
    // or under the sweep; the row's re-render is held via starHeld, so a
    // refetch can't cut it short or replay it). It is started by the click,
    // never by a render, so it plays once. Only if the row is on screen;
    // otherwise, and under reduced motion, the state simply lands. No haptic
    // here: the popup tap already ticked (hapticTap()). Rapid toggles: the running replay is
    // finished at once (its final state lands), then the next one starts from
    // there -- last wins, no half states.
    const VS_REPLAY = { VISIT_MS: 240, UNVISIT_MS: 260 };
    function vsReplay(id) {
      if (prefersReducedMotion() || !currentUser) return false;   // signed out: the toggle won't happen, so neither does the stamp
      const entry = cardsById.get(id), list = document.getElementById('locationsList'), sheet = document.getElementById('locations');
      if (!entry || !list || !entry.el.isConnected || (sheet && sheet.classList.contains('collapsed'))) return false;
      const held = starHeld.get(id);
      if (held && held.ff) held.ff();                          // last wins: land the running replay first
      if (starHeld.has(id)) return false;                      // a live gesture on this row owns it
      const el = entry.el, r = el.getBoundingClientRect(), lr = list.getBoundingClientRect();
      if (r.height === 0 || r.bottom <= lr.top || r.top >= lr.bottom) return false;   // off screen: the state just lands
      const g = { replay: true };
      if (!beginVisitDrag(el, g)) return false;
      const C = STAR_SWIPE.COMMIT;
      let pressed = false;
      const toPress = () => { if (pressed) return; pressed = true; g.raw = C; paintVisit(g); settleVisitDrag(el, g, true); };
      starHeld.get(id).ff = () => { toPress(); const h = starHeld.get(id); if (h && h.ff) h.ff(); };
      runTimeline(g.visited ? VS_REPLAY.UNVISIT_MS : VS_REPLAY.VISIT_MS, t => { if (pressed) return; g.raw = C * t; paintVisit(g); }, toPress);
      return true;
    }

    // The mirror of flipToFinal(): the final row (final truncation, stamp
    // in or out) is laid out once, and the name + meta FLIP home from
    // wherever the finger (or the settle timeline) left them -- letters
    // never change on the frame the eye comes to rest. `mid` runs right
    // after the DOM swap, before the FLIP animates, for side effects that
    // must see the fresh DOM (the X's fade-back needs the new button).
    function flipVisitToFinal(el, g, nowVisited, ms, mid, done) {
      const oldH = textLeft(g.h3), oldMeta = g.meta.getBoundingClientRect().left;
      const loc = locations.find(l => l.id === g.id) || {};
      const fin = { ...loc, visited: nowVisited };
      renderCard(el, fin);
      const entry = cardsById.get(g.id); if (entry) entry.signature = cardSignature(fin);
      g.h3 = el.querySelector('h3'); g.meta = el.querySelector('.row-meta'); g.main = el.querySelector('.row-main'); g.st = el.querySelector('.row-stamp');
      g.badge = el.querySelector('.row-badge');
      g.star = el.querySelector('.row-star');
      if (mid) mid();
      const dH = oldH - textLeft(g.h3), dM = oldMeta - g.meta.getBoundingClientRect().left;
      setSlip(g, dH, dM);
      runTimeline(ms, t => { const e = easeOut(t); setSlip(g, dH * (1 - e), dM * (1 - e)); }, done);
    }

    function settleVisitDrag(el, g, commit) {
      const C = STAR_SWIPE.COMMIT;
      g.state = 'settle';
      let dead = false;
      const nowVisited = commit ? !g.visited : g.visited;
      const finish = () => {
        if (dead) return; dead = true;
        g.popId = (g.popId || 0) + 1;
        if (!commit) {
          if (!g.visited) g.st.remove();
          else { g.st.classList.remove('vs-open'); g.st.style.transform = ''; g.st.style.opacity = ''; g.st.style.color = ''; g.st.style.display = ''; el.classList.add('is-visited'); }
          vsXBack(el, g); vsCleanup(el, g); updateUI();
          return;
        }
        // vs-live (and the row-star hide it carries) stays through the
        // whole FLIP -- only vsCleanup(), once the name is truly at rest,
        // removes it (the star's own releaseStarRow() does the same).
        flipVisitToFinal(el, g, nowVisited, STAR_SWIPE.SETTLE,
          () => { el.classList.add('vs-xhide'); vsXBack(el, g); },
          () => { vsCleanup(el, g); updateUI(); });
      };
      const held = starHeld.get(g.id); if (held) held.ff = () => finish();
      if (commit) {
        if (!g.replay) toggleLocationFlag(g.id, 'visited');      // optimistic; this row's re-render is held -- we lay it out ourselves (a popup replay's caller toggles)
        if (!g.visited && !g.pressed) {           // a flick: the ring finishes closing, then the stamp lands
          const r0 = g.raw, ms = Math.max(60, (C - r0) / 0.6);
          runTimeline(ms, t => { if (dead) return; g.raw = r0 + (C - r0) * t; paintVisit(g); }, () => { if (dead) return; g.raw = C; paintVisit(g); setTimeout(finish, prefersReducedMotion() ? 0 : VISIT_POP_MS + 20); });
          return;
        }
        if (!g.visited) {                          // let the pop land -- the X stays away until it has
          const left = prefersReducedMotion() ? 0 : Math.max(0, VISIT_POP_MS + 20 - (sgNow() - (g.pressT || 0)));
          setTimeout(finish, left);
          return;
        }
        finish();
        return;
      }
      // cancel: the cue retracts, no ink (visit), or the stamp re-inks (un-visit)
      const r0 = g.raw;
      runTimeline(VISIT_SWIPE.RETURN_MS, t => { if (dead) return; g.raw = r0 * (1 - easeOut(t)); paintVisit(g); }, finish);
    }

    // N3: shape rows have no star -- a stroke gets the same 6px of give.
    function attachShapeGive(el) {
      let g = null;
      el.addEventListener('touchstart', (e) => { const t = e.touches[0]; g = t ? { x0: t.clientX, y0: t.clientY, lock: false } : null; }, { passive: true });
      el.addEventListener('touchmove', (e) => {
        if (!g) return; const t = e.touches[0], dx = t.clientX - g.x0, dy = t.clientY - g.y0;
        if (!g.lock) { if (Math.abs(dy) >= STAR_SWIPE.SCROLL) { g = null; return; } if (Math.abs(dx) < STAR_SWIPE.LOCK || Math.abs(dx) <= 1.5 * Math.abs(dy) || !e.cancelable) return; g.lock = true; }
        if (e.cancelable) e.preventDefault();
        const give = Math.sign(dx) * Math.min(STAR_SWIPE.WRONG_MAX, (Math.abs(dx) - STAR_SWIPE.LOCK) * 0.12);
        const main = el.querySelector('.row-main'); if (main) main.style.transform = `translateX(${give}px)`;
      }, { passive: false });
      const end = () => { if (!g || !g.lock) { g = null; return; } g = null; const main = el.querySelector('.row-main'); if (!main) return;
        const from = parseFloat((main.style.transform || '').slice(11)) || 0;
        runTimeline(160, t => { main.style.transform = `translateX(${(from * (1 - easeOut(t))).toFixed(2)}px)`; }, () => { main.style.transform = ''; }); };
      el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
    }

    // POPUP -> ROW STAR REPLAY (owner: "Star animation should go both ways").
    // Setting OR clearing the star in the popup plays the row's own mark on
    // the place's list row, every time -- vsReplay()'s rules exactly: started
    // by the click, never by a render, so it plays once; the row's re-render
    // is held (starHeld), so a refetch can't cut it short or replay it; only
    // if the row is on screen; last wins (a running replay lands its final
    // state at once, then the next starts from there); reduced motion or
    // signed out: no replay, the state just lands. No haptic here: the
    // popup tap already ticked (hapticTap()).
    //   Star = pencil, then ink (the row's grammar: a row star is always
    //     pencilled; only the popup, where the outline is already printed,
    //     fades): the name steps 30px aside (clear of the sketch), five
    //     strokes at hand speed (HAND_MS), the ink lands with STAR_POP and the
    //     name docks while it moves (FLIP). ~430ms to ink, rest ~810ms.
    //   Unstar = the row's full erase: the star lifts (STAR_ERASE_POP), is
    //     rubbed out over RUB_MS (colour first, grain, erosion, the ghost),
    //     the ghost vanishes and the dust is swept off as the name moves home
    //     (FLIP). ~620ms.
    // (Replaces the 2-per-device teaching replay and its localStorage key.)
    const SS_REPLAY = { SLIP: 30, SLIP_MS: 120 };
    try { localStorage.removeItem('triplet.pencilStarTaught'); } catch (_) {}   // the old teaching counter: never read again
    function ssReplay(id) {
      if (prefersReducedMotion() || !currentUser) return false;
      const entry = cardsById.get(id), list = document.getElementById('locationsList'), sheet = document.getElementById('locations');
      if (!entry || !list || !entry.el.isConnected || (sheet && sheet.classList.contains('collapsed'))) return false;
      const held = starHeld.get(id);
      if (held && held.ff) held.ff();                          // last wins: land the running replay first
      if (starHeld.has(id)) return false;                      // a live gesture on this row owns it
      const el = entry.el, r = el.getBoundingClientRect(), lr = list.getBoundingClientRect();
      if (r.height === 0 || r.bottom <= lr.top || r.top >= lr.bottom) return false;   // off screen: the state just lands
      const loc = locations.find(l => l.id === id);
      if (!loc) return false;
      el.classList.remove('active');
      const m = mountPencilStar(el, loc);
      if (!m) return false;
      const was = !!loc.starred, g = { ...m, id, starred: was, off: 0, replay: true };
      let dead = false;
      const done = () => { if (dead) return; dead = true; releaseStarRow(el, g, true); updateUI(); };
      starHeld.get(id).ff = () => {
        if (dead) return; dead = true;
        releaseStarRow(el, g, true);
        el.querySelectorAll('.sg-crumb').forEach(c => c.remove());
        const park = document.createElement('div'); g.h3 = g.meta = g.main = park;   // a running FLIP's late frames now move nothing
        const fin = { ...(locations.find(l => l.id === id) || loc), starred: !was };
        renderCard(el, fin);
        const e2 = cardsById.get(id); if (e2) e2.signature = cardSignature(fin);
        updateUI();
      };
      const t0 = sgNow();
      if (!was) {
        const step = () => {
          if (dead) return;
          const ms = sgNow() - t0, out = Math.min(1, ms / SS_REPLAY.SLIP_MS), k = 0.5 - 0.5 * Math.cos(Math.PI * out);
          setSlip(g, SS_REPLAY.SLIP * k, SS_REPLAY.SLIP * k);
          const p = Math.max(0, Math.min(1, (ms - SS_REPLAY.SLIP_MS) / STAR_SWIPE.HAND_MS));
          g.ps.draw(g.strokes[0] + (50 - g.strokes[0]) * p);
          if (ms >= SS_REPLAY.SLIP_MS + 10 + STAR_SWIPE.HAND_MS) {
            g.ps.draw(STAR_SWIPE.COMMIT); g.ps.ink(true);
            flipToFinal(el, g, true, 190, () => setTimeout(done, Math.max(0, STAR_POP_MS + 20 - 190)));
            return;
          }
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      } else {
        starErasePop(g.svg);
        runTimeline(STAR_SWIPE.RUB_MS, t => { if (!dead) g.ps.rub(STAR_SWIPE.COMMIT * t); }, () => {
          if (dead) return;
          g.ps.rub(STAR_SWIPE.COMMIT); starCrumbs(g);
          flipToFinal(el, g, false, STAR_SWIPE.SETTLE, done);
        });
      }
      return true;
    }

    // Popup unstar (owner: the outline is already there, so no drawing in
    // the popup): the ink fades off the outline as the star lifts, 240ms.
    let popupRubId = null;   // popup star just cleared: fade out + erase lift ONCE (CSS .sgp-out)

    // Deterministic per-place stamp angle: one of six hand-stamped leans,
    // BOTH ways (positive = left side higher), never near level:
    // +-2, +-3.5, +-5deg. Same place -> same angle on every render (never
    // Math.random, which would re-roll on each re-render).
    // Six separated buckets, not a fine ramp: two different leans always
    // differ by >= 1.5deg (a 0.25deg one-way ramp read as "all the same"),
    // and nothing under 2deg, which reads as straight/unstamped. Measured:
    // at 5deg the 10px caps are as crisp at 1x as the old -3.5deg cap, and
    // the rotated box (74.5 x 38.2) stays >= 10.7px clear of the delete X
    // and >= 8.4px inside the row. For a fixed angle instead, drop this
    // helper and the inline --stamp-tilt below; the CSS default (-3deg)
    // takes over.
    const STAMP_TILTS = [-5, -3.5, -2, 2, 3.5, 5];
    function stampTilt(id) {
      let h = 0;
      for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) | 0;
      return STAMP_TILTS[Math.abs(h) % STAMP_TILTS.length];
    }

    // A ledger row, not a card: 28px glyph | 1fr content | action cluster.
    // The category ink lives in the glyph; the metadata line reads
    // CATEGORY · CITY in --ink-2. Visited shows as a stamp at the head of
    // the action cluster (see .row-stamp), at a fixed x so the list scans
    // as a column; the .sr-only text in .row-meta is its accessible name.
    function renderCard(el, loc) {
      // Visited rows recede (.is-visited) -- see the DONE block in the CSS.
      // Safe here: renderCard() re-runs whenever cardSignature() changes,
      // and that signature includes loc.visited.
      el.classList.toggle('is-visited', !!loc.visited);
      el.classList.toggle('is-starred', !!loc.starred);
      const ink = categoryInk(loc.category);
      const city = loc.city && CITIES[loc.city] ? CITIES[loc.city].label : loc.city;
      const dist = distanceLabel(loc);   // Nearest only: the distance leads the meta
      const stop = planMarks().byLoc.get(loc.id);   // Plans: the number leads, then the icon; × removes from the plan
      el.classList.toggle('plan-num-row', inPlanView() && !!activePlan() && !!stop);
      const stamp = loc.visited
        ? `<span class="row-stamp" style="--stamp-tilt:${stampTilt(loc.id)}deg" aria-hidden="true"><span class="row-stamp-ring"><span class="row-stamp-word">Visited</span></span></span>`
        : '';
      el.innerHTML = `
        ${planLead(stop, loc.category, markerKind(loc), ink, loc.name)}
        <div class="row-main">${loc.starred ? '<svg class="row-star" viewBox="0 0 24 24" aria-hidden="true"><use href="#g-star"/></svg>' : ''}
          <h3>${escapeHtml(loc.name)}</h3>
          <div class="row-meta">${dist ? `<span class="row-dist">${escapeHtml(dist)}</span> &middot; ` : ''}${escapeHtml(loc.category)}${city ? ' &middot; ' + escapeHtml(city) : ''}<span class="sr-only">${loc.starred ? ', starred' : ''}${loc.visited ? ', visited' : ', not visited yet'}</span></div>
        </div>
        <div class="location-actions">
          ${stamp}${rowActionHtml(stop, loc.name)}
        </div>
      `;
    }

    function syncLocationCards(visible) {
      const list = document.getElementById('locationsList');
      const seen = new Set();

      visible.forEach((loc, index) => {
        seen.add(loc.id);
        let entry = cardsById.get(loc.id);

        if (!entry) {
          entry = { el: createCard(loc), signature: null };
          cardsById.set(loc.id, entry);
        }

        const signature = cardSignature(loc);
        // Held while the pencil star owns this row (settleStarDrag() / ssReplay() / vsReplay()).
        if (signature !== entry.signature && !starHeld.has(loc.id)) {
          renderCard(entry.el, loc);
          entry.signature = signature;
        }
        entry.el.classList.toggle('highlighted', loc.id === highlightedId);
        // Category order: the last row of each category run carries an ink rule.
        entry.el.classList.toggle('group-end', sortMode === 'category' && index < visible.length - 1 && visible[index + 1].category !== loc.category);

        if (list.children[index] !== entry.el) {
          list.insertBefore(entry.el, list.children[index] || null);
        }
      });

      cardsById.forEach((entry, id) => {
        if (seen.has(id)) return;
        entry.el.remove();
        cardsById.delete(id);
      });
    }

    // ---- neighborhood shape list cards ---------------------------------------
    // Mirrors createCard()/renderCard()/syncLocationCards() for pins, but
    // shapes have no address/visited state and are framed by bounds, not a
    // point -- see focusShape(). pinOffset places these cards right after the
    // pin cards syncLocationCards() just wrote, so the two reconcilers can
    // share one DOM list without stepping on each other's child indices.
    function shapeCardSignature(nb) {
      return [nb.label, nb.type, nb.color, planMarkKey('shape', nb.id), listView, inPlanView() ? activePlanId : ''].join('|');
    }

    function focusShape(shapeId) {
      const nb = neighborhoodShapes.find(n => n.id === shapeId);
      if (!nb) return;

      noteInteraction();
      // Fit the shape, but never land below neighborhoodMinZoom(): the
      // map layer (and so its popup) doesn't exist under that zoom, so a
      // fit that settled there would show nothing and open nothing. A
      // shape small enough to fit below its min zoom is now framed AT its
      // min zoom instead ("zoom in enough to actually see the thing").
      const bounds = L.latLngBounds(nb.geometry).pad(0.15);
      const center = bounds.getCenter();
      const zoom = Math.min(map.getMaxZoom(),
        Math.max(map.getBoundsZoom(bounds), neighborhoodMinZoom(nb)));
      openPopupOnArrival(center, zoom,
        () => neighborhoodLayersById.get(shapeId),
        () => {
          if (prefersReducedMotion()) {
            map.setView(center, zoom, { animate: false });
          } else {
            map.flyTo(center, zoom, { duration: 0.5 });
          }
        });
    }

    function createShapeCard(nb) {
      const el = document.createElement('div');
      el.className = 'location-card';
      el.style.cursor = 'pointer';
      el.setAttribute('data-shape-id', nb.id);

      let touchMoved = false;
      const addActive = (e) => {
        if (!e.target.closest('.location-actions')) {
          touchMoved = false;
          el.classList.add('active');
        }
      };
      const removeActive = () => el.classList.remove('active');
      const handleTouchMove = () => { touchMoved = true; removeActive(); };

      el.addEventListener('mousedown', addActive);
      el.addEventListener('touchstart', addActive, { passive: true });
      el.addEventListener('touchmove', handleTouchMove, { passive: true });
      el.addEventListener('mouseup', removeActive);
      el.addEventListener('mouseleave', removeActive);
      el.addEventListener('touchend', removeActive);
      el.addEventListener('touchcancel', removeActive);

      // Plans' + / × fire only on a near-still tap (DELETE_TAP_SLOP), as on a pin row.
      let aDown = null, aTravel = 0;
      const aStart = (x, y) => { aDown = [x, y]; aTravel = 0; };
      const aMove = (x, y) => { if (aDown) aTravel = Math.max(aTravel, Math.hypot(x - aDown[0], y - aDown[1])); };
      el.addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) aStart(t.clientX, t.clientY); }, { passive: true });
      el.addEventListener('touchmove', (e) => { const t = e.touches[0]; if (t) aMove(t.clientX, t.clientY); }, { passive: true });
      el.addEventListener('touchend', (e) => { const t = e.changedTouches[0]; if (t) aMove(t.clientX, t.clientY); }, { passive: true });
      el.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') aStart(e.clientX, e.clientY); });
      el.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' && e.buttons) aMove(e.clientX, e.clientY); });

      el.addEventListener('click', (e) => {
        const id = Number(el.getAttribute('data-shape-id'));
        const current = neighborhoodShapes.find(n => n.id === id);

        const pa = e.target.closest('.plan-add, .plan-x');
        if (pa) {
          if (e.detail !== 0 && aTravel >= DELETE_TAP_SLOP) return;
          planRowAct(pa.classList.contains('plan-add') ? 'add' : 'remove', { shapeId: id }, current ? current.label : '');
          return;
        }
        if (e.target.closest('.delete-btn')) {
          if (current) confirmDeleteShape(current.id, current.label);
          return;
        }
        if (touchMoved) return;   // the tap was a scroll
        focusShape(id);
      });

      attachStopDrag(el);
      attachShapeGive(el);
      return el;
    }

    // Same ledger row, but the badge is a DIAMOND -- the shape, not the
    // colour, is what tells a district apart from a pin.
    function renderShapeCard(el, nb) {
      const ink = nb.color || categoryInk(nb.type);
      const city = nb.city && CITIES[nb.city] ? CITIES[nb.city].label : nb.city;
      const stop = planMarks().byShape.get(nb.id);
      el.classList.toggle('plan-num-row', inPlanView() && !!activePlan() && !!stop);
      el.innerHTML = `
        ${planLead(stop, nb.type, 'diamond', ink, nb.label)}
        <div class="row-main">
          <h3>${escapeHtml(nb.label)}</h3>
          <div class="row-meta">${escapeHtml(nb.type)}${city ? ' &middot; ' + escapeHtml(city) : ''}</div>
        </div>
        <div class="location-actions">
          ${rowActionHtml(stop, nb.label)}
        </div>
      `;
    }

    function syncShapeCards(visible, pinOffset) {
      const list = document.getElementById('locationsList');
      const seen = new Set();

      visible.forEach((nb, index) => {
        seen.add(nb.id);
        let entry = shapeCardsById.get(nb.id);

        if (!entry) {
          entry = { el: createShapeCard(nb), signature: null };
          shapeCardsById.set(nb.id, entry);
        }

        const signature = shapeCardSignature(nb);
        if (signature !== entry.signature) {
          renderShapeCard(entry.el, nb);
          entry.signature = signature;
        }

        const targetIndex = pinOffset + index;
        if (list.children[targetIndex] !== entry.el) {
          list.insertBefore(entry.el, list.children[targetIndex] || null);
        }
      });

      shapeCardsById.forEach((entry, id) => {
        if (seen.has(id)) return;
        entry.el.remove();
        shapeCardsById.delete(id);
      });
    }

    function createCitySelector() {
      const container = document.getElementById('cityFilters');
      const entries = Object.entries(CITIES)
        .map(([id, c]) => [id, c.label])
        .concat([[ALL_CITIES, 'All cities']]);

      container.innerHTML = entries
        .map(([id, label]) => `<button class="city-btn" data-city="${escapeHtml(id)}">${escapeHtml(label)}</button>`)
        .join('');

      container.querySelectorAll('.city-btn').forEach(btn => {
        btn.onclick = () => setActiveCity(btn.getAttribute('data-city'));
      });
    }

    function updateCitySelectorUI() {
      document.querySelectorAll('#cityFilters .city-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-city') === citySelection);
      });
    }

    // Chips are ink-on-paper with the category glyph, never white-on-category
    // -colour (which measured 1.80:1 on the old palette). The ink arrives as
    // --chip-ink so the `.inactive` rule can override it without !important,
    // and ONLY the bottom rule changes between states -- contrast is constant,
    // so all 11 stay AA whatever their ink.
    function createFilters() {
      const container = document.getElementById('filters');
      container.innerHTML = Object.keys(CATEGORY_COLORS).map(cat => `
        <button class="filter-btn" id="filter-${cat}" style="--chip-ink: ${CATEGORY_COLORS[cat]}">
          <span class="chip-glyph">${glyphHtml(cat, 12)}</span>${cat}
        </button>
      `).join('');

      Object.keys(CATEGORY_COLORS).forEach(cat => {
        document.getElementById(`filter-${cat}`).onclick = () => {
          noteInteraction();
          filters.categories[cat] = !filters.categories[cat];
          const btn = document.getElementById(`filter-${cat}`);
          if (filters.categories[cat]) {
            btn.classList.remove('inactive');
          } else {
            btn.classList.add('inactive');
          }
          updateUI();
          if (inPlanView()) { showPlanRule(); frameActivePlan(); }   // Plans: land on what the chip changed
        };
      });
    }

    // An explicit "clear filters" control would call this. setActiveCity must
    // never call it: category filters are a statement of intent, orthogonal to
    // geography, and survive a city switch untouched.
    function resetCategoryFilters() {
      Object.keys(CATEGORY_COLORS).forEach(cat => {
        filters.categories[cat] = true;
        const btn = document.getElementById(`filter-${cat}`);
        if (btn) btn.classList.remove('inactive');
      });
      updateUI();
    }
    // Deleting a place that is a stop says so (the plan would otherwise renumber silently).
    function inPlansNote(match) {
      const inPlans = plans.filter(p => planStops.some(s => s.plan_id === p.id && match(s)));
      if (!inPlans.length) return '';
      return `\nIt is a stop in ${inPlans.map(p => `“${p.name}”`).join(', ')}; it will leave ${inPlans.length > 1 ? 'those plans' : 'that plan'} too.`;
    }
    window.confirmDelete = (id, name) => {
      if (confirm(`Delete ${name}?${inPlansNote(s => s.location_id === id)}`)) {
        deleteLocation(id);
      }
    };
    window.confirmDeleteShape = (id, label) => {
      if (confirm(`Delete ${label}?${inPlansNote(s => s.shape_id === Number(id))}`)) {
        deleteNeighborhoodShape(id);
      }
    };
    
    document.getElementById('floatingAddBtn').onclick = async () => {
      const controls = document.getElementById('controls');
      const form = document.getElementById('addForm');
      const btn = document.getElementById('floatingAddBtn');

      // If trying to open the form, check auth first
      if (!btn.classList.contains('active')) {
        if (!await requireAuth()) return;
        noteInteraction();
        syncAddFormCity();   // default only — the user's explicit pick wins
      }

      controls.classList.toggle('show');
      form.classList.toggle('show');
      btn.classList.toggle('active');

      setAddBtnGlyph(btn.classList.contains('active'));
    };

    // The +/× glyph as SVG rather than a text character.
    function setAddBtnGlyph(isClose) {
      const btn = document.getElementById('floatingAddBtn');
      btn.innerHTML = isClose
        ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>'
        : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
    }

    document.getElementById('toggleFiltersBtn').onclick = () => {
      closeSortMenu(false);   // one overlay at a time: the panel and the sort menu never share the screen
      const filtersPanel = document.getElementById('filtersPanel');
      const toggleBtn = document.getElementById('toggleFiltersBtn');
      filtersPanel.classList.toggle('visible');
      toggleBtn.classList.toggle('active');
      reframeAfterPanel();   // Plans: opening re-fits too (building), not only closing
      placePlanSlip();       // the list moved under the slip
    };

    document.getElementById('collapseBtn').onclick = () => {
      const locations = document.getElementById('locations');
      const collapseBtn = document.getElementById('collapseBtn');
      const mapElement = document.getElementById('map');
      const mainContent = document.getElementById('mainContent');
      const filtersPanel = document.getElementById('filtersPanel');

      locations.classList.toggle('collapsed');
      collapseBtn.classList.toggle('collapsed');
      mapElement.classList.toggle('expanded');
      filtersPanel.classList.toggle('collapsed-mode');

      // The map meets the sheet's top edge; the geometry lives in CSS
      // (#mainContent / #mainContent.sheet-collapsed).
      mainContent.classList.toggle('sheet-collapsed', locations.classList.contains('collapsed'));

      // Force Leaflet to redraw map after resize
      setTimeout(() => {
        map.invalidateSize();
      }, 300);
    };

    document.getElementById('centerMeBtn').onclick = centerOnUserLocation;
    initSort();

    // Auth event listeners
    document.getElementById('loginBtn').onclick = login;
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('cancelAuthBtn').onclick = hideAuthModal;
    document.getElementById('accountBtn').onclick = toggleAccountDropdown;
    document.getElementById('dropdownLogoutBtn').onclick = logout;

    // Close auth modal when clicking outside
    document.getElementById('authModal').onclick = (e) => {
      if (e.target.id === 'authModal') {
        hideAuthModal();
      }
    };

    // Close account dropdown when clicking outside
    document.addEventListener('click', (e) => {
      const accountBtn = document.getElementById('accountBtn');
      const accountDropdown = document.getElementById('accountDropdown');

      if (!accountBtn.contains(e.target) && !accountDropdown.contains(e.target)) {
        hideAccountDropdown();
      }
    });

    // Allow Enter key to submit login
    document.getElementById('authPasswordInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        login();
      }
    });

    // Set up place name autocomplete with debouncing (1000ms delay to avoid rate limiting)
    const debouncedSearch = debounce(searchAddress, 1000);
    const nameInput = document.getElementById('nameInput');

    nameInput.addEventListener('input', (e) => {
      debouncedSearch(e.target.value);
    });

    // Hide autocomplete when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#addressInputWrapper')) {
        hideAutocomplete();
      }
    });

    // Hide autocomplete when pressing Escape
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        hideAutocomplete();
      }
    });

    // Changing the city context invalidates any autocomplete results already
    // shown, since they were queried under the old city's countrycodes/viewbox.
    document.getElementById('cityInput').addEventListener('change', () => {
      userOverrodeCity = true;   // a real user tap, never a programmatic .value set -- see maybeDetectCity()
      hideAutocomplete();
    });

    document.getElementById('newCityConfirmAdd').onclick = async () => {
      if (!pendingNewCity) return;
      const cfg = pendingNewCity;
      const btn = document.getElementById('newCityConfirmAdd');
      btn.disabled = true;
      const ok = await addCity(cfg);
      btn.disabled = false;
      if (ok) {
        document.getElementById('cityInput').value = cfg.id;
      }
      hideNewCityConfirm();
    };

    document.getElementById('newCityConfirmDismiss').onclick = () => {
      userOverrodeCity = true;   // stop re-guessing; the manual select is the fallback from here
      hideNewCityConfirm();
    };

    // A category IS the mode: 'district'/'street' mean "fetch an OSM shape,"
    // every other category means "a normal pin." One dropdown drives both
    // what fields are shown AND which table the submit goes to (see
    // isShapeCategory() / submitBtn.onclick below) -- no separate toggle.
    function isShapeCategory(category) {
      return category === 'district' || category === 'street';
    }

    // Add-form star (#starInput). Its value only counts while it's shown:
    // on a district/street category it's hidden, and anything saved --
    // including the approximate pin findApproximatePoint() can fall back
    // to -- arrives unstarred. Its pressed state survives a category
    // round-trip (street -> restaurant) and is reset by closeAddForm().
    function setAddFormStarred(on) {
      const btn = document.getElementById('starInput');
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.querySelector('use').setAttribute('href', on ? '#g-star' : '#g-star-open');
    }

    function addFormStarred() {
      return !isShapeCategory(document.getElementById('categoryInput').value) &&
        document.getElementById('starInput').getAttribute('aria-pressed') === 'true';
    }

    document.getElementById('starInput').addEventListener('click', () => {
      setAddFormStarred(!(document.getElementById('starInput').getAttribute('aria-pressed') === 'true'));
    });

    document.getElementById('categoryInput').addEventListener('change', (e) => {
      const isShape = isShapeCategory(e.target.value);
      document.getElementById('addressInput').style.display = isShape ? 'none' : '';
      document.getElementById('addressInput').required = !isShape;
      document.getElementById('shapeHint').style.display = isShape ? '' : 'none';
      document.getElementById('starInputRow').style.display = isShape ? 'none' : '';
      document.getElementById('nameInput').placeholder = isShape
        ? 'Neighborhood/street name to search OSM for (e.g. Nørrebro)'
        : 'Search for a place...';
      hideAutocomplete();
    });

    function closeAddForm() {
      selectedPlace = null;
      userOverrodeCity = false;
      hideNewCityConfirm();
      hideShapeCityConfirm();
      document.getElementById('nameInput').value = '';
      document.getElementById('addressInput').value = '';
      document.getElementById('notesInput').value = '';
      setAddFormStarred(false);
      document.getElementById('categoryInput').value = 'restaurant';
      document.getElementById('categoryInput').dispatchEvent(new Event('change'));
      document.getElementById('controls').classList.remove('show');
      document.getElementById('addForm').classList.remove('show');
      document.getElementById('floatingAddBtn').classList.remove('active');
      setAddBtnGlyph(false);
      document.getElementById('submitBtn').textContent = 'Add Location';
      document.getElementById('submitBtn').disabled = false;
    }

    // ---- shape-flow city resolution (post-fetch) ------------------------

    let pendingShapeCity = null;   // { resolved, saveShape } while shapeCityConfirm is showing

    function hideShapeCityConfirm() {
      pendingShapeCity = null;
      document.getElementById('shapeCityConfirm').style.display = 'none';
    }

    // Analogue of showNewCityConfirm() for the shape flow -- but unlike a
    // pin (one point, matched or not), a shape's geometry has already been
    // through resolveShapeCity(), which may have a best-guess existing city
    // even when it isn't confident. Offer that as a one-tap alternative to
    // creating a new city, rather than only create-or-abandon.
    function showShapeCityConfirm(resolved, saveShape) {
      pendingShapeCity = { resolved, saveShape };
      const addToBtn = document.getElementById('shapeCityConfirmAddTo');
      if (resolved.winner) {
        addToBtn.style.display = '';
        addToBtn.textContent = `Add to ${cityConfig(resolved.winner).label}`;
        document.getElementById('shapeCityConfirmText').textContent =
          `This doesn't clearly fit ${cityConfig(resolved.winner).label}. Add it as a new city, or file it under ${cityConfig(resolved.winner).label} anyway?`;
      } else {
        addToBtn.style.display = 'none';
        document.getElementById('shapeCityConfirmText').textContent =
          `This doesn't match any known city. Add it as a new city?`;
      }
      const existingSelect = document.getElementById('shapeCityConfirmExisting');
      existingSelect.innerHTML =
        Object.entries(CITIES)
          .map(([id, c]) => `<option value="${id}">${escapeHtml(c.label)}</option>`)
          .join('');
      if (resolved.winner && CITIES[resolved.winner]) existingSelect.value = resolved.winner;
      document.getElementById('shapeCityConfirm').style.display = '';
    }

    document.getElementById('shapeCityConfirmAddCity').onclick = async () => {
      if (!pendingShapeCity) return;
      const { resolved, saveShape } = pendingShapeCity;
      const btn = document.getElementById('shapeCityConfirmAddCity');
      btn.disabled = true;
      const addressDetails = await nominatimReverse(resolved.centroid[0], resolved.centroid[1]);
      const cfg = addressDetails ? await deriveNewCityConfig(addressDetails, resolved.centroid[0], resolved.centroid[1]) : null;
      btn.disabled = false;
      if (!cfg) {
        alert('Could not determine a new city from this location. Try "Add to" an existing city instead.');
        return;
      }
      const ok = await addCity(cfg);
      if (!ok) return;
      hideShapeCityConfirm();
      await saveShape(cfg.id);
    };

    document.getElementById('shapeCityConfirmAddTo').onclick = async () => {
      if (!pendingShapeCity || !pendingShapeCity.resolved.winner) return;
      const { resolved, saveShape } = pendingShapeCity;
      hideShapeCityConfirm();
      await saveShape(resolved.winner);
    };

    document.getElementById('shapeCityConfirmUseExisting').onclick = async () => {
      if (!pendingShapeCity) return;
      const { saveShape } = pendingShapeCity;
      const cityId = document.getElementById('shapeCityConfirmExisting').value;
      hideShapeCityConfirm();
      await saveShape(cityId);
    };

    document.getElementById('shapeCityConfirmCancel').onclick = () => {
      hideShapeCityConfirm();
      document.getElementById('submitBtn').textContent = 'Add Location';
      document.getElementById('submitBtn').disabled = false;
    };

    // A single OSM lookup, one click, one form -- fetch and save happen
    // together so there is no separate authoring step for a shape added this
    // way (unlike tools/neighborhood-shapes.html, which is for bulk/offline
    // authoring and produces code to paste in by hand). The pre-fetch
    // cityInput selection only biases the OSM query (viewbox/countrycodes) --
    // the row's actual `city` is resolved from the fetched geometry itself
    // via resolveShapeCity(), which is robust to (a) a shape straddling two
    // cities' bounds and (b) a spurious OSM merge dragging in an unrelated
    // cluster of points (see resolveShapeCity()'s doc comment).
    async function handleAddShapeSubmit() {
      const name = document.getElementById('nameInput').value.trim();
      const type = document.getElementById('categoryInput').value;   // 'district' | 'street'
      const notes = document.getElementById('notesInput').value.trim();
      const cityHint = formCityId();

      if (!name) {
        alert('Please provide a name to search for.');
        return;
      }

      noteInteraction();
      document.getElementById('submitBtn').textContent = 'Fetching area...';
      document.getElementById('submitBtn').disabled = true;

      const cfg = cityConfig(cityHint);
      const fetched = type === 'street'
        ? await overpassWay(name, cfg)
        : await nominatimPolygon(name, cfg);

      if (!fetched) {
        const point = await findApproximatePoint(name, cfg);
        if (!point) {
          alert(`Could not find "${name}" on OpenStreetMap at all -- no boundary/way, no point, no node. Try a more specific or differently-spelled name.`);
          document.getElementById('submitBtn').textContent = 'Add Location';
          document.getElementById('submitBtn').disabled = false;
          return;
        }

        const pointResolved = resolveShapeCity([[point.lat, point.lng]], null);
        const savePin = async (city) => {
          const tag = `Approximate placement -- OSM has no boundary/way for this ${type}; resolved via ${point.tier}.`;
          await addLocation({
            name: `${name} (approx.)`,
            address: null,
            category: type,
            city,
            lat: point.lat,
            lng: point.lng,
            notes: notes ? `${notes}\n\n${tag}` : tag,
            visited: false,
            // Carried through for when shapes can be starred; today this
            // is always false -- the toggle is hidden on shape categories,
            // so an approx pin from a district/street add arrives unstarred.
            starred: addFormStarred()
          });
          closeAddForm();
        };

        if (pointResolved.confident) {
          await savePin(pointResolved.winner);
          return;
        }
        document.getElementById('submitBtn').textContent = 'Add Location';
        document.getElementById('submitBtn').disabled = false;
        showShapeCityConfirm(pointResolved, savePin);
        return;
      }

      const geometry = type === 'street' ? fetched.points : fetched;
      const segmentLengths = type === 'street' ? fetched.segmentLengths : null;
      const resolved = resolveShapeCity(geometry, segmentLengths);

      if (resolved.droppedPoints) {
        console.warn(`"${name}": dropped ${resolved.droppedPoints} point(s) that disagreed with the majority city (likely an unrelated OSM way merged in).`);
      }

      const saveShape = async (city) => {
        await addNeighborhoodShape({
          city,
          type,
          label: name,
          color: CATEGORY_COLORS[type],
          note: notes || null,
          geometry: resolved.cleanedGeometry
        });
        closeAddForm();
      };

      if (resolved.confident) {
        await saveShape(resolved.winner);
        return;
      }

      document.getElementById('submitBtn').textContent = 'Add Location';
      document.getElementById('submitBtn').disabled = false;
      showShapeCityConfirm(resolved, saveShape);
    }

    async function handleAddLocationSubmit() {
      const name = document.getElementById('nameInput').value;
      const address = document.getElementById('addressInput').value;
      const category = document.getElementById('categoryInput').value;
      const notes = document.getElementById('notesInput').value;

      if (!name || !address) {
        alert('Please provide name and address');
        return;
      }

      noteInteraction();
      document.getElementById('submitBtn').textContent = 'Adding...';
      document.getElementById('submitBtn').disabled = true;

      // An address picked from autocomplete is already geocoded (and already
      // ran through maybeDetectCity() in selectAddress()) — re-geocoding a
      // full Nominatim display_name is a wasted (and worse) round trip.
      const alreadySelected = selectedPlace && selectedPlace.address === address;
      const coords = alreadySelected
        ? { lat: selectedPlace.lat, lng: selectedPlace.lng }
        : await geocode(address);

      if (!coords) {
        alert('Could not geocode address. Try a different address.');
        document.getElementById('submitBtn').textContent = 'Add Location';
        document.getElementById('submitBtn').disabled = false;
        return;
      }

      // Freeform-typed-and-submitted path never went through selectAddress()'s
      // detection -- this is that path's one chance, right before insert.
      if (!alreadySelected && coords.addressDetails) {
        await maybeDetectCity(coords.lat, coords.lng, coords.addressDetails);
      }

      // Covers BOTH paths: an autocomplete pick may have left a new-city
      // prompt showing (selectAddress() doesn't block on it), and the
      // freeform path may have just raised one above. Either way, inserting
      // under the old cityInput value right now would silently use the
      // wrong city -- stop and let the user resolve the prompt, then submit
      // again (Add City just updates cityInput, it doesn't reopen the form).
      if (pendingNewCity) {
        document.getElementById('submitBtn').textContent = 'Add Location';
        document.getElementById('submitBtn').disabled = false;
        return;
      }
      const city = formCityId();   // read AFTER detection may have updated cityInput

      await addLocation({
        name,
        address,
        category,
        city,
        lat: coords.lat,
        lng: coords.lng,
        notes: notes || null,
        visited: false,
        starred: addFormStarred()
      });

      closeAddForm();
    }

    document.getElementById('submitBtn').onclick = () => {
      return isShapeCategory(document.getElementById('categoryInput').value)
        ? handleAddShapeSubmit()
        : handleAddLocationSubmit();
    };

    // minZoom: without it a user can zoom out to world level and pan into a
    // repeating world copy, where markers (rendered on one copy only) vanish
    // with no error. worldCopyJump brings them back when panning past ±180°.
    // No maxBounds: a per-city clamp would break the center-me button at a
    // city's edge, and Copenhagen/Malmö are one travel area across the Øresund.
    map = L.map('map', { minZoom: 3, worldCopyJump: true })
           .setView(CITIES[DEFAULT_CITY].center, CITIES[DEFAULT_CITY].zoom);
    // Standard OSM raster tiles. CARTO's anonymous light_all/rastertiles
    // endpoints now require an API key (they render an "API KEY REQUIRED"
    // watermark instead of tiles without one) -- reverted rather than
    // ship a key. The aging/desaturating filter on .leaflet-tile-pane ONLY
    // (see the stylesheet) still does the re-toning work; applying it to
    // .leaflet-pane would sepia the markers and popups too.
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      subdomains: 'abc',
      minZoom: 3,
      maxZoom: 19
    }).addTo(map);

    map.on('dragend zoomend', noteInteraction);
    map.on('zoomend', syncNeighborhoodLayers);
    map.on('zoomend', syncPlanShapeMarkers);   // the numbered diamonds share the pin numbers' zoom gate
    // moveend (not zoomend) -- clustering depends on screen position, which
    // panning changes even without a zoom crossing.
    map.on('moveend', syncMarkerGlyphZoom);
    map.on('moveend', applyPlanMap);   // the stop tags, after the markers are synced

    // Popups are plain HTML strings (buildPopupHtml()), not real DOM
    // components -- there's no per-button listener to attach the way
    // createCard()'s row buttons get one. Leaflet creates exactly one
    // popupPane for the map's whole lifetime and reuses it for every
    // popup open/close/replace, so a SINGLE delegated listener here can
    // never double-bind the way a per-popup listener would risk.
    starHapticSwitch();   // the popup star's tap label points at it from the first popup
    map.getPane('popupPane').addEventListener('click', (e) => {
      const btn = e.target.closest('.popup-visited, .popup-star');
      if (!btn) return;
      const loc = locations.find(l => l.id === btn.dataset.id);
      if (!loc) return;
      // Consume the click. The optimistic toggle re-renders the popup
      // HTML within this same dispatch (after requireAuth()'s microtask),
      // detaching the button; if the click then bubbled on to the map
      // container, Leaflet would walk the detached target, not find its
      // popup's click-disable flag, treat it as a map click, and CLOSE the
      // popup (measured in Playwright before this line existed).
      e.stopPropagation();
      const isStar = btn.classList.contains('popup-star');
      // No tick here: a finger's tap already ticked on touch (hapticTap());
      // keyboard / VoiceOver activation gets none -- their own feedback stands.
      if (isStar && !loc.starred) popupInkId = loc.id;
      if (isStar && loc.starred) popupRubId = loc.id;
      if (isStar) ssReplay(loc.id); else vsReplay(loc.id);  // before the toggle, so the row is held and plays from its old state
      toggleLocationFlag(loc.id, isStar ? 'starred' : 'visited');
    });

    // Initialize auth and set up auth state listener
    supabaseClient.auth.onAuthStateChange((event, session) => {
      currentUser = session?.user || null;
      updateAuthUI();

      // If user just signed in and auth modal is open, close it
      if (event === 'SIGNED_IN' && document.getElementById('authModal').classList.contains('show')) {
        hideAuthModal();
      }
    });

    // Check auth on page load
    checkAuth();

    // The list's scroll gradient listener is attached ONCE, here — not inside a
    // renderer, where it used to leak one listener per poll tick.
    const locationsListEl = document.getElementById('locationsList');
    locationsListEl.addEventListener('scroll', () => {
      if (locationsListEl.scrollTop > 0) {
        locationsListEl.classList.add('scrolling');
      } else {
        locationsListEl.classList.remove('scrolling');
      }
    }, { passive: true });

    // Persistent tail elements of the list, owned by syncLocationCards().
    const listSpacer = document.createElement('div');
    listSpacer.className = 'location-list-spacer';
    const locationsEmptyEl = document.createElement('div');
    locationsEmptyEl.className = 'locations-empty';
    locationsEmptyEl.id = 'locationsEmpty';
    // One of the few screens with nothing to be efficient about, so it gets
    // the space: 48px of padding and a 28px glyph.
    locationsEmptyEl.innerHTML =
      '<svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><use href="#g-compass"/></svg>Nothing here yet.';
    locationsEmptyEl.style.display = 'none';
    locationsListEl.appendChild(locationsEmptyEl);
    locationsListEl.appendChild(listSpacer);

    populateCityInput();
    createCitySelector();
    createFilters();
    restorePlanPrefs();
    initPlans();

    // Sole entry point for city state. On cold start there is nothing to
    // animate away from, so framing is instant.
    const restoredCity = restoreCitySelection();          // cityId | ALL_CITIES | null
    setActiveCity(restoredCity ?? DEFAULT_CITY, { animate: false });

    Promise.all([fetchLocations(), fetchNeighborhoodShapes(), fetchCities(), fetchPlans()])
      .then(() => { if (inPlanView()) frameActivePlan(); cleanupOrphanCities(); });
    startPoll();

    // The bottom sheet becomes a left rail at >=900px (see the media query).
    // Leaflet has to be told its container changed size when that flips; the
    // inline `bottom` the collapse handler writes would otherwise fight the
    // media query, so it is cleared on the way into rail mode.
    const railQuery = window.matchMedia('(min-width: 900px)');
    const handleRailChange = (e) => {
      if (e.matches) document.getElementById('mainContent').style.bottom = '';
      setTimeout(() => map.invalidateSize(), 50);
    };
    if (railQuery.addEventListener) railQuery.addEventListener('change', handleRailChange);
    else if (railQuery.addListener) railQuery.addListener(handleRailChange);
    if (railQuery.matches) document.getElementById('mainContent').style.bottom = '';

    // The page never scrolls. Touch can't (body overflow:hidden reaches the
    // viewport; overscroll-behavior stops the rubber band), but the 100lvh
    // root can be taller than innerHeight in a Safari tab and the collapsed
    // sheet / hidden filter panel translate past the bottom, so focus() or
    // similar could scroll it programmatically. Undo that -- except while a
    // field has focus (iOS lifting it above the keyboard), and again once
    // it loses focus.
    const unscrollPage = () => {
      if (!window.scrollY && !window.scrollX) return;
      const a = document.activeElement;
      if (a && a.matches('input, textarea, select, [contenteditable]')) return;
      window.scrollTo(0, 0);
    };
    window.addEventListener('scroll', unscrollPage, { passive: true });
    document.addEventListener('focusout', () => setTimeout(unscrollPage, 0));

    // A phone in a pocket is the dominant state of this app during a trip:
    // pause entirely while hidden, catch up immediately on return.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopPoll();
      } else {
        lastInteractionAt = Date.now();
        fetchLocations();
        fetchPlans();
        startPoll();
      }
    });
  </script>
</body>
</html>
