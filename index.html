      [sw.parentNode, document.getElementById('cityFilters'), document.getElementById('filters')].forEach(e => ro.observe(e));
      fp.addEventListener('scroll', () => layoutPlanLedger(), { passive: true });   // chips scrolling under the open slip
      sw.addEventListener('click', e => { const b = e.target.closest('[role="radio"]'); if (b) setListView(b.dataset.view); });
      sw.addEventListener('keydown', e => {
        if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) return;
        e.preventDefault();
        const v = e.key === 'Home' ? 'places' : e.key === 'End' ? 'plans' : (listView === 'places' ? 'plans' : 'places');
        setListView(v);
        sw.querySelector(`[data-view="${v}"]`).focus();
      });
      const ledger = document.getElementById('planLedger');
      ledger.addEventListener('input', e => { if (e.target.tagName === 'INPUT') planPanel.draft = e.target.value; });
      ledger.addEventListener('keydown', e => {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); setPlanPanel(e.target.tagName === 'INPUT' ? {} : { open: false }); return; }
        if (e.target.tagName === 'INPUT' && e.key === 'Enter') { e.preventDefault(); submitPlanForm(); }
      });
      const onClick = async e => {
        const pick = e.target.closest('[data-plan]');
        if (pick) { choosePlan(pick.dataset.plan); return; }
        const b = e.target.closest('[data-act]');
        if (!b) return;
        const act = b.dataset.act, tp = plans.find(p => p.id === planPanel.target);
        if (act === 'none') return;
        if (act === 'toggle') setPlanPanel({ open: !(planPanel.open || planPanel.mode) });
        else if (act === 'cancel') setPlanPanel({});
        else if (act === 'create' || act === 'save') submitPlanForm();
        else if (act === 'new') openNewPlan();
        else if (act === 'more') setPlanPanel({ mode: 'acting', target: b.dataset.more });
        else if (act === 'rename' && tp) { if (await requireAuth()) setPlanPanel({ mode: 'renaming', draft: tp.name, target: tp.id, focusInput: true }); else setPlanPanel({}); }
        else if (act === 'delete' && tp) {
          if (!await requireAuth()) { setPlanPanel({}); return; }
          setPlanPanel({});
          // Plain words, the phone's own dialog (the app's other deletes do the same). Any plan,
          // open or not: deleting another plan never changes what you're looking at.
          if (confirm(`Delete “${tp.name}”? Its places stay in your list.`)) {
            await deletePlan(tp.id);
            if (inPlanView() && !activePlan()) focusCity(citySelection, { animate: true });   // the last plan: frame the city, as Places does
          }
        }
      };
      ledger.addEventListener('click', onClick);
      document.getElementById('planPick').addEventListener('click', onClick);
      // The slip closes with the panel.
      document.getElementById('toggleFiltersBtn').addEventListener('click', () => setTimeout(() => {
        if (!document.getElementById('filtersPanel').classList.contains('visible') && (planPanel.open || planPanel.mode)) setPlanPanel({ open: false });
      }, 0));
      // Back to the stops from anywhere in a long list: tap the plan's name
      // (the iOS "tap the title to go to the top" convention). No new control.
      document.querySelector('#locationsHeader h2').addEventListener('click', () => {
        if (!inPlanView()) return;
        document.getElementById('locationsList').scrollTo({ top: 0, behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
      });
      planEmptyBtn.addEventListener('click', openNewPlan);
    }

    function updateUI() {
      const planMode = inPlanView();
      // Plans orders its own list (syncPlanCards: the stops in plan order, then
      // the other matches in the sort); Places sorts here, as it always has.
      const visible = (() => { const v = visibleLocations(); return planMode ? v : (heldOrder(v) || sortLocations(v)); })();
      const visibleShapes = (() => { const v = visibleNeighborhoodShapes(); return planMode ? v : (heldOrder(v, shapeRowKey) || sortShapes(v)); })();
      // The header is only a label: whatever the list is. Places: the city
      // list and its count. Plans: just the plan's name (a count cost two
      // characters of fit; Places' "<city> list (N)" still tells them apart).
      const h2 = document.querySelector('#locationsHeader h2');
      if (planMode && activePlan()) h2.innerHTML = `<span class="h-name">${escapeHtml(activePlan().name)}</span>`;
      else h2.textContent = planMode ? 'Plans' : `${activeCityLabel()} list (${visible.length + visibleShapes.length})`;
      document.body.classList.toggle('plan-view', planMode);
      document.body.classList.toggle('plan-none', planMode && !activePlan());
      const mapVisible = mapVisibleLocations();
      syncMarkers(mapVisible.solo);
      syncClusterMarkers(mapVisible.clusters);
      if (planMode) syncPlanCards(planMarks().rows);
      else {
        [planRule, planStopsNote, planOthersNote].forEach(n => { if (n.parentNode) n.remove(); });   // the index-based reconcilers own the list from row 0
        document.querySelectorAll('#locationsList .is-stop').forEach(e => e.classList.remove('is-stop'));   // Plans' marker class, back on a Places row
        syncLocationCards(visible);
        syncShapeCards(visibleShapes, visible.length);
      }
      syncNeighborhoodLayers();
      syncPlanShapeMarkers();
      applyPlanMap();
      placePlanSlip();   // the rule may have moved under it

      // Empty state + bottom spacer always come last, after both card kinds.
      const list = document.getElementById('locationsList');
      const emptyState = document.getElementById('locationsEmpty');
      emptyState.style.display = (planMode ? !activePlan() : (visible.length + visibleShapes.length) === 0) ? 'block' : 'none';
      const emptyText_ = [...emptyState.childNodes].find(n => n.nodeType === 3);
      if (emptyText_) emptyText_.textContent = emptyText(planMode);
      // No plans yet: the empty list offers the one next step (sign-in first if needed).
      const wantNew = planMode && plansAvailable === true && !plans.length;
      if (wantNew && !planEmptyBtn.parentNode) emptyState.append(planEmptyLine2, planEmptyBtn);
      else if (!wantNew && planEmptyBtn.parentNode) { planEmptyLine2.remove(); planEmptyBtn.remove(); }
      if (list.lastElementChild !== listSpacer) {
        list.appendChild(emptyState);
        list.appendChild(listSpacer);
      }
      renderPlanPanel();
    }

    // ---- neighborhood shape rendering (Phase 3) ------------------------------
    // Binary add/remove at a zoom threshold, not an always-present opacity
    // fade -- below the threshold every zoom level renders pixel-identical to
    // before this feature existed.
    function neighborhoodMinZoom(nb) {
      return nb.min_zoom ?? (cityConfig(nb.city).zoom + 3);
    }

    // The dash patterns are the same two the district/street GLYPHS use, so
    // the map layer and the chrome rhyme: a street is a dotted trail, a
    // district is a tag outline -- distinguishable at a glance and in
    // monochrome, without relying on colour.
    function neighborhoodStyle(nb) {
      return nb.type === 'street'
        ? { color: nb.color || '#5A564C', weight: 6, opacity: 0.9, dashArray: '2 8', lineCap: 'round' }
        : { color: nb.color || '#5A564C', weight: 2.5, opacity: 0.9, dashArray: '6 4', fillOpacity: 0.12 };
    }

    function buildNeighborhoodLayer(nb) {
      const layer = nb.type === 'street'
        ? L.polyline(nb.geometry, neighborhoodStyle(nb))
        : L.polygon(nb.geometry, neighborhoodStyle(nb));
      layer.bindPopup(shapePopupHtml(nb));
      popupPadding(layer.getPopup());
      layer._popSig = shapePopupSignature(nb);
      return layer;
    }

    // A starred district/street carries the pins' map star (markerStarHtml's
    // glyph: ink on a paper halo, the near size) at shapeAnchor() -- a point on
    // the shape -- shown exactly while the shape's layer is. A tap opens the
    // shape's popup. A plan's shape stop has its numbered diamond, which carries
    // the star itself (planNumberIcon), so it gets none here.
    const SHAPE_STAR_PX = 12;
    function shapeStarIcon() {
      const s = SHAPE_STAR_PX, hit = 24, o = (hit - s) / 2;
      const html = `<div style="position:relative;width:${hit}px;height:${hit}px;line-height:0;">` +
        `<svg class="marker-star" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true" style="position:absolute;left:${o}px;top:${o}px;overflow:visible">` +
        `<use class="marker-star-halo" href="#g-star" stroke-width="${(3 * 24 / s).toFixed(2)}" stroke-linejoin="round"/>` +
        `<use class="marker-star-ink" href="#g-star"/></svg></div>`;
      return L.divIcon({ html, className: '', iconSize: [hit, hit], iconAnchor: [hit / 2, hit / 2] });
    }
    // A VISITED district/street carries the pins' visited sticker at the same
    // point (owner brief 2026-10-02: "the same sticker mark at the label point
    // where the starred shape's star sits"): the NEAR pin's 24px sticker in the
    // shape's own colour -- its wash, the 9px check, the flap lower-left (a
    // shape's layer only draws at close zooms, where pins are NEAR too; at
    // 16px the star covered most of the check). When the
    // shape is starred too, the sticker steps down-left so the star (its own
    // marker, unmoved) rides the sticker's upper-right shoulder, exactly as on
    // a pin. Below the star in z; a tap opens the shape's popup. A plan's
    // shape stop carries both marks on its numbered diamond, so none here.
    function shapeVisitIcon(nb) {
      const size = MARKER_SIZE_NEAR, hit = 24, o = (hit - size) / 2, sp = stickerPinParts({ size, near: true });
      const sh = nb.starred ? (size / 2 - 1 + STICKER.STAR_OUT.near) * Math.SQRT1_2 : 0;   // the shoulder, set out as stickerStarHtml() so the star clears the check
      const html = `<div style="position:relative;width:${hit}px;height:${hit}px;line-height:0;"><div style="position:absolute;left:${o}px;top:${o}px;width:${size}px;height:${size}px;">${sp.base}${sp.flap}</div></div>`;
      return L.divIcon({ html, className: '', iconSize: [hit, hit], iconAnchor: [hit / 2 + sh, hit / 2 - sh] });
    }
    function syncShapeStars(shown) {
      const vWant = new Set();
      shown.forEach(id => {
        const nb = neighborhoodShapes.find(n => n.id === id);
        if (!nb || !nb.visited || planMarks().byShape.has(id)) return;
        const at = shapeAnchor(nb);
        if (!at) return;
        vWant.add(id);
        const sig = [at.join ? at.join() : String(at), nb.color, nb.type, !!nb.starred].join('|'), had = shapeVisitMarkersById.get(id);
        if (had && had.sig === sig) return;
        if (had) map.removeLayer(had.marker);
        const m = L.marker(at, { icon: shapeVisitIcon(nb), zIndexOffset: Z_PIN_STARRED - 100, title: `${nb.label}, visited` });
        m.on('click', () => { const layer = neighborhoodLayersById.get(id); if (layer) layer.openPopup(L.latLng(at)); });
        shapeVisitMarkersById.set(id, { marker: m.addTo(map), sig });
      });
      shapeVisitMarkersById.forEach((e, id) => { if (!vWant.has(id)) { map.removeLayer(e.marker); shapeVisitMarkersById.delete(id); } });
      const want = new Set();
      shown.forEach(id => {
        const nb = neighborhoodShapes.find(n => n.id === id);
        if (!nb || !nb.starred || planMarks().byShape.has(id)) return;
        const at = shapeAnchor(nb);
        if (!at) return;
        want.add(id);
        const had = shapeStarMarkersById.get(id);
        if (had) { if (!had.getLatLng().equals(at)) had.setLatLng(at); return; }
        const m = L.marker(at, { icon: shapeStarIcon(), zIndexOffset: Z_PIN_STARRED, title: `${nb.label}, starred` });
        m.on('click', () => { const layer = neighborhoodLayersById.get(id); if (layer) layer.openPopup(L.latLng(at)); });
        shapeStarMarkersById.set(id, m.addTo(map));
      });
      shapeStarMarkersById.forEach((m, id) => { if (!want.has(id)) { map.removeLayer(m); shapeStarMarkersById.delete(id); } });
    }

    // City + category filtered, no zoom involved -- this is "what matches the
    // user's filters," used by the sidebar list/count. A list enumerates
    // everything available; it isn't a viewport, so zoom has no business
    // hiding rows from it (unlike the map layer, see mapVisibleNeighborhoodShapes()).
    function visibleNeighborhoodShapes() {
      const match = neighborhoodShapes.filter(nb => {
        if (!filters.categories[nb.type]) return false;   // same category filter chips as pins
        if (!isAllCities() && nb.city !== activeCity) return false;
        return true;
      });
      if (!inPlanView()) return match;
      if (!activePlan()) return [];
      const stops = planMarks().rows.filter(r => r.nb).map(r => r.nb);
      const inPlan = new Set(stops.map(n => n.id));
      return stops.concat(match.filter(n => !inPlan.has(n.id)));
    }

    // Adds the zoom gate on top of visibleNeighborhoodShapes() -- only this
    // one feeds the actual map layer, so the map still stays uncluttered when
    // zoomed out while the list shows everything that matches the filters.
    function mapVisibleNeighborhoodShapes() {
      // A plan's own shape stops draw at any zoom: the gate thins Places, and
      // a plan's stops are never clutter (their numbered diamond needs them).
      const zoom = map.getZoom(), pm = planMarks();
      return visibleNeighborhoodShapes().filter(nb => pm.byShape.has(nb.id) || zoom >= neighborhoodMinZoom(nb));
    }

    function syncNeighborhoodLayers() {
      if (!map) return;
      const shouldShow = new Set(mapVisibleNeighborhoodShapes().map(nb => nb.id));

      shouldShow.forEach(id => {
        if (neighborhoodLayersById.has(id)) return;
        const nb = neighborhoodShapes.find(n => n.id === id);
        neighborhoodLayersById.set(id, buildNeighborhoodLayer(nb).addTo(map));
      });

      neighborhoodLayersById.forEach((layer, id) => {
        if (shouldShow.has(id)) {
          // The popup follows the shape's marks and "Stop n of m" without rebuilding the layer.
          const nb = neighborhoodShapes.find(n => n.id === id);
          const sig = nb ? shapePopupSignature(nb) : layer._popSig;
          if (nb && layer._popSig !== sig) { layer.setPopupContent(shapePopupHtml(nb)); layer._popSig = sig; }
          return;
        }
        map.removeLayer(layer);
        neighborhoodLayersById.delete(id);
      });
      syncShapeStars(shouldShow);
    }

    // Adds a zoom-gated grid-snap on top of visibleLocations() -- same split
    // as mapVisibleNeighborhoodShapes(): the sidebar list keeps enumerating
    // every pin via visibleLocations() unchanged, only what's drawn on the
    // MAP is affected. At/above SOLO_MIN_ZOOM every pin renders on its own,
    // same as before clustering existed -- that cutoff, not GLYPH_MIN_ZOOM,
    // is what a list-item click is guaranteed to land past (see
    // SOLO_MIN_ZOOM's own comment). Below it, pins whose screen positions
    // round to the same clusterCellPxForZoom() cell (a real, not just visual,
    // overlap at that zoom -- e.g. Reykjavik/Stockholm's old-town cores,
    // which stay dense well past GLYPH_MIN_ZOOM with real glyphs visible)
    // collapse into a single cluster point rather than rendering as
    // indistinguishable, unclickable stacked dots. A lone pin in a cell is
    // untouched -- most of the map, most of the time, looks exactly as it
    // always has.
    // ---- THE PLANS MAP (design/plans-deepdive/v3 §4, §12, §13) ----------------
    // Places' clustering, pins and highlight, unchanged, and the ONE
    // implementation: stops cluster exactly like any pin (owner: "Stop clusters
    // should function the same as a normal cluster"), a district/street stop at
    // its centroid; the count includes them. A stop outside every cluster is its
    // own numbered pin (planNumberIcon); at SOLO_MIN_ZOOM and above nothing
    // clusters, so every stop is a numbered pin and a list tap always lands on
    // one. A red cluster that holds stops carries ONE grey tag listing their
    // numbers, flush against its count (clusterStopTags()). Clusters still beat
    // every pin (the ladder at applyMarkerStacking()).
    const CLUSTER_DISC_R = (CLUSTER_BADGE_PX - 2) / 2;   // a cluster disc's drawn radius (clusterMarkerIcon)
    const CLUSTER_TAG_MAX_RUNS = 3, CLUSTER_TAG_GAP = 2;
    let clusteredShapeIds = new Set();   // district/street stops currently inside a cluster
    // The map's own chrome, in container px -- the zoom control, the account
    // and add buttons, the attribution -- and the safe box inside it (above
    // the open filter panel) that every default fit frames into.
    function planChrome() {
      const mb = document.getElementById('map').getBoundingClientRect();
      return [document.querySelector('.leaflet-control-zoom'), document.getElementById('accountBtn'), document.getElementById('floatingAddBtn'), document.querySelector('.leaflet-control-attribution')]
        .filter(el => el && el.getBoundingClientRect().width).map(el => { const r = el.getBoundingClientRect(); return { x1: r.left - mb.left - 4, y1: r.top - mb.top - 4, x2: r.right - mb.left + 4, y2: r.bottom - mb.top + 4 }; });
    }
    function openPanelHeight() {   // the open filter panel lies over the map's bottom edge (phone and rail)
      const pn = document.getElementById('filtersPanel');
      return pn.classList.contains('visible') ? pn.offsetHeight : 0;
    }
    function planSafeBox(under) {
      const sz = map.getSize(), ch = planChrome();
      const topBand = Math.max(16, ...ch.filter(c => c.y1 < 120).map(c => c.y2 + 16));   // below the controls along the top
      const bottom = Math.min(sz.y - under, ...ch.filter(c => c.y1 > sz.y / 2 && c.y1 < sz.y - under).map(c => c.y1)) - 24;   // a cluster disc's radius + 4
      return { l: 24, r: sz.x - 24, t: topBand, b: bottom };
    }
    function applyPlanMap() {
      document.querySelectorAll('#map .glyph-clipped').forEach(el => el.classList.remove('glyph-clipped'));
      if (!map || !inPlanView() || !activePlan()) return;
      syncPlanShapeMarkers();   // a district/street stop's mark follows its clustering at this zoom
      const pm = planMarks();
      // A place pin partly under a cluster disc (clusters beat pins, as in Places) loses its glyph:
      // a glyph cut by the disc's edge left a stub that read as a numeral beside a stop tag. Its
      // ring stays (as below GLYPH_MIN_ZOOM); the cluster is untouched.
      const discs = [...clusterMarkersById.values()].map(m => map.latLngToContainerPoint(m.getLatLng()));
      markersById.forEach((e, id) => {
        const el = e.marker.getElement(); if (!el || pm.byLoc.has(id) || !discs.length) return;
        const p = map.latLngToContainerPoint(e.marker.getLatLng()), half = (el.offsetWidth || 24) / 2;
        if (discs.some(c => c.distanceTo(p) < CLUSTER_DISC_R + 1 + half - 2)) el.classList.add('glyph-clipped');
      });
      // A stop drawn as its own mark whose centre lies under a cluster disc (pins from a
      // neighbouring cell) would be hidden by the disc: its number joins that cluster's tag.
      const absorbed = new Map();   // cluster id -> [stop numbers]
      const el2 = e => e.marker.getElement();
      pm.rows.forEach(r => {
        const e = r.loc ? markersById.get(r.loc.id) : planShapeMarkers.get(r.nb.id);
        if (!e || !e.marker.getElement()) return;
        const p = map.latLngToContainerPoint(e.marker.getLatLng());
        for (const [id, m] of clusterMarkersById) if (map.latLngToContainerPoint(m.getLatLng()).distanceTo(p) < CLUSTER_DISC_R + 6) { absorbed.set(id, (absorbed.get(id) || []).concat([r.n])); el2(e).classList.add('glyph-clipped'); break; }   // its number is in the tag: the pin's own, cut by the disc, would read as a stray digit
      });
      clusterStopTags(absorbed);
    }
    // "3", "2–4", "1,5–6"; past CLUSTER_TAG_MAX_RUNS runs, "first…last".
    function clusterStopLabel(ns) {
      const runs = rangeLabel(ns).split(',');
      return runs.length <= CLUSTER_TAG_MAX_RUNS ? runs.join(',') : `${ns[0]}…${ns[ns.length - 1]}`;
    }
    // The tag sits flush against the count, CLUSTER_TAG_GAP px from its digits and level with
    // them: on the right, or on the left when the cluster's star rides the disc's upper right;
    // then above / below if a side runs off the visible map, onto a control, another tag or
    // another cluster's count. It may cover part of the red disc, never a digit.
    // r20: tags never overlap -- one that would land on another tag, or under another
    // tag-bearing disc, merges its numbers into that tag, which is placed again at its new
    // width; a tag-bearing cluster draws above plain ones (Z_PLAN_CLUSTER + 1000).
    function clusterStopTags(absorbed) {
      const pm = planMarks(), msz = map.getSize(), chrome = planChrome(), placed = [], tagged = [];
      const mbr = document.getElementById('map').getBoundingClientRect();
      const visBottom = (() => { const pn = document.getElementById('filtersPanel'), lt = document.getElementById('locations').getBoundingClientRect().top;
        return Math.min(msz.y, lt - mbr.top, pn.classList.contains('visible') ? pn.getBoundingClientRect().top - mbr.top : Infinity); })();
      const hits = (a, b) => a.x1 < b.x2 && b.x1 < a.x2 && a.y1 < b.y2 && b.y1 < a.y2;
      const onDisc = (rc, c, r) => { const dx = c.x - Math.max(rc.x1, Math.min(c.x, rc.x2)), dy = c.y - Math.max(rc.y1, Math.min(c.y, rc.y2)); return dx * dx + dy * dy < r * r; };
      const discs = [...clusterMarkersById.entries()].map(([id, m]) => ({ id, m, el: m.getElement(), c: map.latLngToContainerPoint(m.getLatLng()) })).filter(d => d.el && d.el.firstElementChild);
      const countBox = d => { const r = d.el.querySelector('svg text').getBoundingClientRect(); return { x1: r.left - mbr.left - 1, y1: r.top - mbr.top - 1, x2: r.right - mbr.left + 1, y2: r.bottom - mbr.top + 1 }; };
      discs.forEach(d => { d.el.querySelectorAll('.cluster-stops').forEach(t => t.remove()); applyMarkerStacking(d.m, false, d.id.includes(':*'), true); });
      const counts = discs.map(d => ({ d, box: countBox(d) }));
      const merge = (into, ns) => { into.ns = into.ns.concat(ns).sort((a, b) => a - b); into.t.textContent = clusterStopLabel(into.ns);
        const i = placed.indexOf(into.rc); if (i >= 0) placed.splice(i, 1); into.rc = into.place(); placed.push(into.rc); };
      discs.forEach(d => {
        const ns = d.id.replace(/^p?cluster:\*?/, '').split(',')
          .map(id => id.startsWith('shape:') ? pm.byShape.get(Number(id.slice(6))) : pm.byLoc.get(id)).filter(Boolean).map(r => r.n)
          .concat(absorbed.get(d.id) || []).sort((a, b) => a - b);
        if (!ns.length) return;
        const box = d.el.firstElementChild, t = document.createElement('div');
        t.className = 'stop-tag cluster-stops'; t.textContent = clusterStopLabel(ns); t.setAttribute('aria-hidden', 'true');
        box.appendChild(t);
        const place = () => {   // a closure: a tag that grows by a merge is placed again at its new width
          const w = t.offsetWidth || 16, h = t.offsetHeight || 16, bb = box.getBoundingClientRect(), tb = d.el.querySelector('svg text').getBoundingClientRect();
          const tl = tb.left - bb.left, tr = tb.right - bb.left, tt = tb.top - bb.top, tbm = tb.bottom - bb.top, tcx = (tl + tr) / 2, tcy = (tt + tbm) / 2;
          const right = [tr + CLUSTER_TAG_GAP, tcy - h / 2], left = [tl - CLUSTER_TAG_GAP - w, tcy - h / 2], above = [tcx - w / 2, tt - CLUSTER_TAG_GAP - h], below = [tcx - w / 2, tbm + CLUSTER_TAG_GAP];
          const toMap = ([x, y]) => ({ x1: bb.left - mbr.left + x, y1: bb.top - mbr.top + y, x2: bb.left - mbr.left + x + w, y2: bb.top - mbr.top + y + h });
          const own = tagged.find(o => o.t === t), others = placed.filter(o => !own || o !== own.rc);
          // The least-bad flush spot: over another cluster's count digits is worst (never, if any spot
          // avoids it), then off the visible map, then a control, then another tag.
          const bad = sp => { const rc = toMap(sp); return 1000 * counts.filter(c => c.d !== d && hits(rc, c.box)).length
            + (rc.x1 < 2 || rc.x2 > msz.x - 2 || rc.y1 < 2 || rc.y2 > visBottom - 2 ? 500 : 0)
            + 300 * chrome.filter(o => hits(rc, { x1: o.x1 + 4, y1: o.y1 + 4, x2: o.x2 - 4, y2: o.y2 - 4 })).length
            + 100 * others.filter(o => hits(rc, o)).length; };
          const order = d.id.includes(':*') ? [left, right, below, above] : [right, left, above, below];
          const best = order.reduce((m, sp) => bad(sp) < bad(m) ? sp : m, order[0]);
          if (bad(best) >= 1000) t.dataset.forced = '1'; else delete t.dataset.forced;   // a knot of overlapping clusters: every flush spot is over another count (disclosed)
          t.style.left = `${best[0]}px`; t.style.top = `${best[1]}px`;
          return toMap(best);
        };
