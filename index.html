        id, label, center, zoom: 12,
        geocodeSuffix: `${label}, ${addressDetails.country || countryCode}`,
        countrycodes: countryCode,
        viewbox,
        lowConfidence
      };
    }

    function mergeCityIntoRuntime(cfg) {
      CITIES[cfg.id] = {
        label: cfg.label, center: cfg.center, zoom: cfg.zoom,
        geocodeSuffix: cfg.geocodeSuffix, countrycodes: cfg.countrycodes, viewbox: cfg.viewbox
      };
      populateCityInput();
      createCitySelector();
      updateCitySelectorUI();   // createCitySelector() rebuilds from scratch -- reapply the active highlight
    }

    async function addCity(cfg) {
      if (!await requireAuth()) return false;
      try {
        const { error } = await supabaseClient.from('cities').insert([{
          id: cfg.id,
          label: cfg.label,
          center_lat: cfg.center[0],
          center_lng: cfg.center[1],
          zoom: cfg.zoom,
          geocode_suffix: cfg.geocodeSuffix,
          countrycodes: cfg.countrycodes,
          viewbox: cfg.viewbox,
          auto_added: true,
          created_by: currentUser ? currentUser.email : null
        }]);
        if (error) throw error;
        mergeCityIntoRuntime(cfg);
        hideError('mutation');
        return true;
      } catch (err) {
        showError(handleRLSError(err, 'add'), 'mutation');
        return false;
      }
    }

    // Fetches the live cities table and merges it into CITIES (never
    // replaces it) -- the static object stays as an offline-safe bootstrap
    // seed the map can draw from before this fetch ever resolves. On
    // failure, degrades to exactly the 5 static cities, same posture as
    // doFetchLocations()/fetchNeighborhoodShapes().
    async function fetchCities() {
      try {
        const { data, error } = await supabaseClient
          .from('cities')
          .select('id,label,center_lat,center_lng,zoom,geocode_suffix,countrycodes,viewbox');
        if (error) throw error;
        (data || []).forEach(row => {
          CITIES[row.id] = {
            label: row.label, center: [row.center_lat, row.center_lng], zoom: row.zoom,
            geocodeSuffix: row.geocode_suffix, countrycodes: row.countrycodes, viewbox: row.viewbox
          };
        });
        populateCityInput();
        createCitySelector();
        updateCitySelectorUI();
        hideError('cities');
      } catch (err) {
        showError(`Failed to load cities: ${err.message}`, 'cities');
      }
    }

    // Removes runtime-created cities that nothing references any more --
    // the only "delete a city" path in the app, deliberately never a
    // standing UI. A city can end up orphaned two ways: its one pin/shape
    // gets deleted, or the add-form's city step ran (addCity() writes the
    // row immediately) but the form itself was abandoned before saving.
    // Both are caught here since locations/neighborhoodShapes are always
    // fetched in full (never city-filtered), so membership is checked
    // against local state, not a fresh query. Runs at boot and after every
    // delete; failures are swallowed -- this is best-effort hygiene, never
    // something worth surfacing as an error.
    async function cleanupOrphanCities() {
      const referenced = new Set([
        ...locations.map(loc => loc.city),
        ...neighborhoodShapes.map(shape => shape.city)
      ]);
      const orphanIds = Object.keys(CITIES).filter(id =>
        !SEED_CITY_IDS.has(id) && !referenced.has(id));
      if (orphanIds.length === 0) return;

      try {
        const { error } = await supabaseClient
          .from('cities')
          .delete()
          .in('id', orphanIds)
          .eq('auto_added', true);
        if (error) throw error;
      } catch (err) {
        return;
      }

      const removedLabels = orphanIds.map(id => CITIES[id]?.label).filter(Boolean);
      orphanIds.forEach(id => delete CITIES[id]);

      if (orphanIds.includes(citySelection)) {
        setActiveCity(DEFAULT_CITY);
      } else {
        populateCityInput();
        createCitySelector();
        updateCitySelectorUI();
      }

      if (removedLabels.length) {
        showInfo(
          `Removed unused ${removedLabels.length === 1 ? 'city' : 'cities'}: ${removedLabels.join(', ')}`,
          'cleanup'
        );
      }
    }

    // ---- add-form city detection state ---------------------------------------
    let pendingNewCity = null;
    let userOverrodeCity = false;   // a manual cityInput pick stops further auto-guessing this form session

    async function maybeDetectCity(lat, lng, addressDetails) {
      if (userOverrodeCity) return;
      const matched = matchCity(lat, lng);
      if (matched) {
        document.getElementById('cityInput').value = matched;
        hideNewCityConfirm();
        return;
      }
      if (!addressDetails) return;   // not enough signal to consider a new city
      const derived = await deriveNewCityConfig(addressDetails, lat, lng);
      if (!derived || userOverrodeCity) return;   // re-check: user may have acted while the derivation was in flight
      showNewCityConfirm(derived);
    }

    function showNewCityConfirm(cfg) {
      pendingNewCity = cfg;
      document.getElementById('newCityConfirmText').textContent =
        `"${cfg.label}" isn't in your city list yet. Add it?`;
      document.getElementById('newCityConfirm').style.display = '';
    }

    function hideNewCityConfirm() {
      pendingNewCity = null;
      document.getElementById('newCityConfirm').style.display = 'none';
    }

    // ---- add-form city -------------------------------------------------------

    // Rebuilding innerHTML on a <select> silently resets its selected value
    // to whatever option is now first -- a real problem once this can be
    // called mid-session (fetchCities() resolving after boot, a new city
    // being merged in) rather than only once at cold start. Preserve
    // whatever was selected, when it still exists after the rebuild.
    function populateCityInput() {
      const select = document.getElementById('cityInput');
      const previous = select.value;
      select.innerHTML =
        Object.entries(CITIES)
          .map(([id, c]) => `<option value="${id}">${escapeHtml(c.label)}</option>`)
          .join('');
      if (previous && CITIES[previous]) select.value = previous;
    }

    // The single source of truth for geocoding context and for the inserted row.
    function formCityId() {
      const select = document.getElementById('cityInput');
      const v = select ? select.value : null;
      return CITIES[v] ? v : activeCity;
    }

    function syncAddFormCity() {
      document.getElementById('cityInput').value = defaultFormCity();
    }

    function defaultFormCity() {
      if (!isAllCities()) return activeCity;
      // In all-cities view, guess from what the user is actually looking at,
      // rather than from a stale authoring context.
      const c = map.getCenter();
      const ranked = rankCitiesByProximity([c.lat, c.lng], 150);
      return ranked.length ? ranked[0].cityId : activeCity;
    }

    // ---- poll ----------------------------------------------------------------

    function currentPollMs() {
      return (Date.now() - lastInteractionAt < IDLE_AFTER_MS) ? POLL_ACTIVE_MS : POLL_IDLE_MS;
    }

    function startPoll() {
      if (pollTimer) return;
      pollScheduledMs = currentPollMs();
      pollTimer = setTimeout(pollTick, pollScheduledMs);
    }

    function stopPoll() {
      clearTimeout(pollTimer);
      pollTimer = null;
    }

    function pollTick() {
      pollTimer = null;
      // Phase 2 hook: refreshTodayKey() belongs here, so date-dependent
      // rendering rolls over even in a tab that never fires visibilitychange.
      fetchLocations();
      fetchPlans();
      startPoll();
    }

    // Any user interaction resets the idle back-off. Only reschedules when the
    // pending wait is longer than the active cadence, so constant interaction
    // can never starve the poll.
    function noteInteraction() {
      lastInteractionAt = Date.now();
      if (pollTimer && pollScheduledMs > POLL_ACTIVE_MS) {
        stopPoll();
        startPoll();
      }
    }

    function centerOnUserLocation() {
      const btn = document.getElementById('centerMeBtn');
      
      if (!navigator.geolocation) {
        showError('Geolocation is not supported by your browser', 'geolocation');
        return;
      }
      
      btn.classList.add('loading');
      
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude } = position.coords;
          takeFix(latitude, longitude);   // the list's Nearest order reuses this fix (no second prompt)
          
          // Remove old user location marker if exists
          if (userLocationMarker) {
            map.removeLayer(userLocationMarker);
          }
          
          // "You are here" is not a category, so it deliberately carries no
          // glyph and no category ink -- a plain navy dot with a paper rim.
          const userIcon = L.divIcon({
            html: `<div style="background: var(--navy); width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--navy), inset 0 0 0 4px var(--paper), 0 1px 0 rgba(0,0,0,0.25);"></div>`,
            className: '',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          });

          userLocationMarker = L.marker([latitude, longitude], { icon: userIcon }).addTo(map);
          userLocationMarker.bindPopup('<div class="popup-title" style="text-align:center">You are here</div>');
          
          // Center map on user location
          focusMap([latitude, longitude], 14, { animate: true });

          btn.classList.remove('loading');
          hideError('geolocation');
        },
        (error) => {
          btn.classList.remove('loading');
          let errorMsg = 'Unable to get your location';
          
          switch(error.code) {
            case error.PERMISSION_DENIED:
              errorMsg = 'Location permission denied. Enable location access in browser settings.';
              break;
            case error.POSITION_UNAVAILABLE:
              errorMsg = 'Location information unavailable. Check GPS settings.';
              break;
            case error.TIMEOUT:
              errorMsg = 'Location request timed out. Try again.';
              break;
          }
          
          showError(errorMsg, 'geolocation');
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }
    
    // The banner is a single shared DOM element, but errors come from
    // unrelated sources (the locations poll, the shapes fetch, a mutation,
    // geolocation) -- without tracking which one is currently showing, any
    // OTHER source's success would call hideError() and mask a real error
    // before it's read. hideError(source) only clears when it matches
    // whoever's currently showing; the newest showError() always wins the
    // single banner slot outright, since only one message fits at a time.
    let currentErrorSource = null;

    function showError(msg, source) {
      currentErrorSource = source;
      document.getElementById('errorText').textContent = msg;
      document.getElementById('error').classList.remove('info');
      document.getElementById('error').classList.add('show');
    }

    // Same banner, navy "info" styling instead of the error color -- for
    // messages that report something that happened, not something that failed.
    function showInfo(msg, source) {
      currentErrorSource = source;
      document.getElementById('errorText').textContent = msg;
      document.getElementById('error').classList.add('info', 'show');
    }

    function hideError(source) {
      if (source !== currentErrorSource) return;
      currentErrorSource = null;
      document.getElementById('error').classList.remove('show', 'info');
    }

    // =========================================================================
    // Rendering — id-keyed reconcilers. Nothing here tears down and rebuilds:
    // a poll tick, a filter tap and a city switch are all just a different
    // result from visibleLocations(), diffed against what is already on screen.
    // =========================================================================

    // Everything that affects a marker's position, icon or popup. loc.city is
    // included because a location moved between cities keeps its id, so only
    // the signature can force the refresh.
    function markerSignature(loc) {
      return [loc.name, loc.address, loc.category, loc.lat, loc.lng,
              loc.notes, loc.visited, loc.city, loc.starred].join('|');
    }

    // Everything the list card renders.
    function cardSignature(loc) {
      return [loc.name, loc.address, loc.category, loc.visited, loc.starred, distanceLabel(loc), planMarkKey('loc', loc.id), listView, inPlanView() ? activePlanId : ''].join('|');
    }

    // =========================================================================
    // GLYPHS & BADGES
    // Badge SHAPE encodes the data state, which the list could not previously
    // express at all:
    //   circle             -> a `locations` pin
    //   diamond            -> a `neighborhood_shapes` feature
    //   circle, dashed rim -> an "(approx.)" fallback pin from
    //                         findApproximatePoint() -- indistinguishable
    //                         from a real pin before this.
    // =========================================================================

    // Two size tiers, not one flat number: NEAR is used with the glyph
    // visible (needs interior room), FAR is shape/color only (doesn't) --
    // see GLYPH_MIN_ZOOM below, which gates both. Clustering used to share
    // this same threshold too, but it's now governed separately by
    // SOLO_MIN_ZOOM (see below) -- a solo NEAR-tier marker (glyph visible)
    // can still be absorbed into a cluster badge; that's independent of
    // whether ITS OWN size/glyph would be NEAR or FAR if it were solo.
    // Both values land on the app's own spacing scale (--s6/--s4,
    // index.html ~160) rather than being picked freestanding. Highlighted
    // sizes are a flat +8 (--s2) on top of the active tier, not a
    // multiplier -- that's what makes both bases land back on the scale
    // (24->32, 16->24); it's a property of these two specific values, not
    // a general rule, so a future third tier shouldn't assume it transfers.
    const MARKER_SIZE_NEAR    = 24;   // --s6, glyph visible
    const MARKER_SIZE_FAR     = 16;   // --s4, shape/color only
    const MARKER_HI_DELTA     = 8;    // --s2, additive
    const MARKER_SIZE_NEAR_HI = MARKER_SIZE_NEAR + MARKER_HI_DELTA; // 32, --s8
    const MARKER_SIZE_FAR_HI  = MARKER_SIZE_FAR  + MARKER_HI_DELTA; // 24, --s6

    // Below this zoom pins cluster and 11 pictograms stop being readable, so
    // markers drop to badge SHAPE only -- which still answers the question
    // that matters at that scale ("is that a pin or a district?"). This
    // governs glyph visibility and marker size ONLY -- see SOLO_MIN_ZOOM
    // below for the (separate, higher) zoom where clustering itself ends.
    const GLYPH_MIN_ZOOM = 12;

    // Clustering's own cutoff -- deliberately NOT the same as GLYPH_MIN_ZOOM.
    // It's pinned to highlightMarker()'s focusMap({ atLeast: 14 }) call,
    // which is what every list-item click and every cluster-badge click
    // routes through: as long as this stays <= that atLeast value, a click
    // is GUARANTEED to land at a zoom where the thing it's navigating to is
    // rendered solo, never still hidden inside a cluster bubble -- the same
    // safety property GLYPH_MIN_ZOOM=12 gave clustering before this existed,
    // just at the zoom navigation actually lands on instead of the zoom
    // glyphs happen to turn on. Real density (dense old-town cores) persists
    // well past zoom 12 with real glyphs visible, which GLYPH_MIN_ZOOM alone
    // couldn't address without also hiding glyphs at those zooms -- this
    // constant is what lets clustering extend there independently.
    const SOLO_MIN_ZOOM = 14;

    // Cluster-cell size for mapVisibleLocations()'s grid-snap below
    // SOLO_MIN_ZOOM, banded by zoom rather than one flat number -- a
    // coarser cell far out, finer as you approach the solo cutoff, so a
    // dense cluster gets more chances to split into smaller ones across
    // several zoom ticks instead of jumping straight from "one badge" to
    // "every pin solo" in a single tick. Leaflet's default zoomSnap means
    // map.getZoom() is always an integer, so these band on whole zoom
    // levels cleanly. All five values are 4px multiples continuing the
    // app's own spacing-scale convention (64/48 sit above its --s12=48
    // ceiling; 32/24/16 are --s8/--s6/--s4).
    function clusterCellPxForZoom(zoom) {
      if (zoom <= 9)  return 64;
      if (zoom === 10) return 48;
      if (zoom === 11) return 32;
      if (zoom === 12) return 24;
      return 16; // zoom === 13 (last band before SOLO_MIN_ZOOM's cutoff)
    }

    // The cluster badge's own rendered size, independent of whichever cell
    // size bucketed it -- so the badge always looks like the rest of the
    // app's UI regardless of how coarse the current band's bucketing is,
    // rather than ballooning to ~46px at the 48px band.
    const CLUSTER_BADGE_PX = 24;

    function categoryInk(category) {
      return CATEGORY_COLORS[category] || CATEGORY_COLORS.other;
    }

    // Plain static link, no JS platform detection -- an Apple Maps
    // universal link opens the native app on iOS and degrades to a normal
    // webpage everywhere else, never a dead click. Pins only: a shape has
    // no single natural destination point (see neighborhoodShapes'
    // geometry, an arbitrary point array framed by bounds, not a coordinate).
    function directionsUrl(loc) {
      return `https://maps.apple.com/?daddr=${loc.lat},${loc.lng}&dirflg=d`;
    }

    // An approximate pin records its provenance in the name suffix written by
    // handleAddShapeSubmit(); that is the only marker of its kind on the row.
    function markerKind(loc) {
      if (typeof loc.name === 'string' && loc.name.indexOf('(approx.)') !== -1) return 'dashed';
      return 'circle';
    }

    // Bare glyph, no shell -- chips, popups.
    function glyphHtml(category, size) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><use href="#g-${escapeAttr(category)}"/></svg>`;
    }

    // Stamped-seal badge: paper field, category-ink rim, category-ink glyph.
    // Legible over any tile value, and readable WITHOUT the legend.
    //
    // Defaults are `currentColor` / `var(--badge-field)` so a ROW can flip
    // the whole badge to paper on the reversed highlighted block just by
    // changing its own `color` -- no re-render, and no category ink ever
    // lands on the --figure-deep field. Markers, which live outside that
    // cascade, pass explicit colours instead.
    function badgeHtml(category, kind, size, opts = {}) {
      const ink  = opts.ink  || 'currentColor';
      const fill = opts.fill || 'var(--badge-field, #F2EBDD)';
      const mark = opts.mark || ink;
      const rim  = opts.rim || 2;
      const c    = size / 2;
      const r    = c - rim / 2;

      let shell;
      if (kind === 'diamond') {
        const p = `${c},${rim / 2} ${size - rim / 2},${c} ${c},${size - rim / 2} ${rim / 2},${c}`;
        shell = `<polygon points="${p}" fill="${fill}" stroke="${ink}" stroke-width="${rim}" stroke-linejoin="round"/>`;
      } else if (kind === 'dashed') {
        shell = `<circle cx="${c}" cy="${c}" r="${r}" fill="${fill}" stroke="${ink}" stroke-width="${rim}" stroke-dasharray="3 3"/>`;
      } else {
        shell = `<circle cx="${c}" cy="${c}" r="${r}" fill="${fill}" stroke="${ink}" stroke-width="${rim}"/>`;
      }

      let glyph = '';
      if (opts.glyph !== false) {
        // Size-aware, not a flat fraction of `size` -- a flat ratio shrinks
        // faster than the badge shrinks as tiers get smaller, which can push
        // the glyph below the ~18px floor for telling 11 silhouettes apart.
        // Floored for legibility, capped so it can never exceed the badge's
        // own interior field regardless of how small `size` gets.
        const field = size - rim * 2;
        const g = Math.min(field - 2, Math.max(18, field - 4));
        const o = (size - g) / 2;
        glyph = `<svg x="${o}" y="${o}" width="${g}" height="${g}" viewBox="0 0 24 24" style="color:${mark}"><use href="#g-${escapeAttr(category)}"/></svg>`;
      }
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${shell}${glyph}</svg>`;
    }

    // The list's Baedeker star, riding a map seal's upper-right shoulder
    // (45deg on the rim). A marker has no name to lead, so the star goes
    // on the seal. INK on the map, not --figure-deep as in the list and
    // popup: on the map --figure-deep already means "cluster" (the disc)
    // and is ~1.1:1 from the restaurant seal, so the star would fuse into
    // both. --ink is 14.69:1 on its --paper halo and dark against every
    // seal and disc. Shape is the identity across surfaces; colour adapts.
    // Colours are .marker-star-halo / .marker-star-ink in the CSS (tokens
    // can't go in SVG presentation attributes). `size` is the seal's px;
    // the star scales with it (12 near / 10 far / +2 hi).
    function markerStarHtml(size) {
      const s = size >= 24 ? size / 2 : 10;
      const c = size / 2, r = c - 1;
      const x = c + r * Math.SQRT1_2 - s / 2, y = c - r * Math.SQRT1_2 - s / 2;
      return `<svg class="marker-star" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true" style="position:absolute;left:${x}px;top:${y}px;overflow:visible">` +
        `<use class="marker-star-halo" href="#g-star" stroke-width="${(3 * 24 / s).toFixed(2)}" stroke-linejoin="round"/>` +
        `<use class="marker-star-ink" href="#g-star"/></svg>`;
    }

    function markerIcon(loc, highlighted) {
      const showGlyph = !map || map.getZoom() >= GLYPH_MIN_ZOOM;
      const size = (showGlyph ? MARKER_SIZE_NEAR : MARKER_SIZE_FAR) + (highlighted ? MARKER_HI_DELTA : 0);
      const ink = categoryInk(loc.category);
      // Plans: a stop is its Places pin at the near size, glyph and all, at
      // every zoom, plus its numbered tag (planNumberIcon). Every other place
      // is its ordinary Places pin.
      const stop = planMarks().byLoc.get(loc.id);
      if (stop) return planNumberIcon(loc.category, markerKind(loc), ink, stop, MARKER_SIZE_NEAR + (highlighted ? MARKER_HI_DELTA : 0), highlighted, loc.starred);
      const badge = badgeHtml(loc.category, markerKind(loc), size, {
        ink,
        // Highlighted inverts: ink field, paper glyph.
        fill: highlighted ? ink : '#F2EBDD',
        mark: highlighted ? '#F2EBDD' : ink,
        rim: highlighted ? 2.5 : 2,
        glyph: showGlyph
      });
      // Far-tier badges render smaller than WCAG 2.5.8's 24px AA touch
      // target -- pad the invisible click/tap area out to 24px around the
      // small visible badge rather than shrinking the tap target with it.
      const hit = Math.max(size, 24);
      const star = loc.starred ? markerStarHtml(size) : '';
      const html = hit === size
        ? `<div class="${highlighted ? 'highlighted-marker' : ''}" style="position:relative;width:${size}px;height:${size}px;line-height:0;">${badge}${star}</div>`
        : `<div style="width:${hit}px;height:${hit}px;display:flex;align-items:center;justify-content:center;">` +
          `<div class="${highlighted ? 'highlighted-marker' : ''}" style="position:relative;width:${size}px;height:${size}px;line-height:0;">${badge}${star}</div></div>`;
      return L.divIcon({
        html,
        className: '',
        iconSize: [hit, hit],
        iconAnchor: [hit / 2, hit / 2]
      });
    }

    // Resyncs cluster membership on every view change (pan shifts which
    // cluster cell a pin's screen position falls into, even without a zoom
    // change) -- and additionally force-re-icons every remaining solo
    // marker when the map crosses GLYPH_MIN_ZOOM, since glyph visibility
    // and size tier both gate off that threshold but AREN'T part of a
    // marker's data signature, so the ordinary syncMarkers() diff wouldn't
    // otherwise notice they need to change. Crossing-guarded so an ordinary
    // move that doesn't cross the threshold skips the force-re-icon pass.
    let lastGlyphZoomOn = null;
    function syncMarkerGlyphZoom() {
      if (!map) return;
      const on = map.getZoom() >= GLYPH_MIN_ZOOM;
      const crossed = on !== lastGlyphZoomOn;
      lastGlyphZoomOn = on;

      const mapVisible = mapVisibleLocations();
      syncMarkers(mapVisible.solo);
      syncClusterMarkers(mapVisible.clusters);

      if (!crossed) return;
      markersById.forEach((entry, id) => {
        entry.marker.setIcon(markerIcon(entry.loc, id === highlightedId));
        applyMarkerStacking(entry.marker, id === highlightedId, entry.loc.starred);
      });
    }

    // Category sits above the title so the title and its notes/address chunk
    // together as one visual group, category read first as context.
    let popupInkId = null;   // popup star just set: fade + pop ONCE (consumed on first render)
    // A pin's popup autopans clear of the TOP CONTROLS (UX S1). The star is
    // the popup's top-left item and the "+" sits over its top-right, so the
    // default 5px would pin a tall popup under the zoom control, the add
    // button and, in a Home Screen launch, the status bar. The top padding
    // is read from where those controls actually are (their bottom edge,
    // which already includes env(safe-area-inset-top)) + --s2, each time a
    // popup pans -- a getter on the popup's own options, which Leaflet
    // re-reads in _adjustPan(). Fallback 84 = the zoom control's 74 + 10.
    // Sides and bottom keep Leaflet's 5px.
    const POPUP_PAN_GAP = 8;
    function pinPopupTopPad() {
      try {
        const mt = map.getContainer().getBoundingClientRect().top;
        let y = 0;
        for (const el of [document.querySelector('.leaflet-control-zoom'), document.getElementById('floatingAddBtn'), document.getElementById('accountBtn')]) {
          const r = el && el.getBoundingClientRect();
          if (r && r.height) y = Math.max(y, r.bottom - mt);
        }
        return Math.round(y ? y + POPUP_PAN_GAP : 84);
      } catch (_) { return 84; }
    }
    function bindPinPopup(marker, loc) {
      marker.bindPopup(buildPopupHtml(loc));
      Object.defineProperty(marker.getPopup().options, 'autoPanPaddingTopLeft', { get: () => L.point(5, pinPopupTopPad()), configurable: true });
    }

    function buildPopupHtml(loc) {
      const inkNow = !!loc.starred && popupInkId === loc.id;
      if (inkNow) popupInkId = null;
      const rubNow = !loc.starred && popupRubId === loc.id;
      if (rubNow) popupRubId = null;
      const ink = categoryInk(loc.category);
      const stopLine = planStopLine('loc', loc.id);   // Plans: "Stop n of m" -- information, never a control
      return `
        <div style="min-width: 240px;">
          <div class="popup-title-row${loc.address ? '' : ' no-sub'}${loc.notes ? '' : loc.address ? ' addr-end' : ' solo'}">
            <span class="popup-star-slot"><button type="button" class="popup-star ${loc.starred ? 'starred' : ''}" data-id="${escapeAttr(loc.id)}" aria-pressed="${loc.starred ? 'true' : 'false'}" aria-label="Star">${inkNow || rubNow ? `<svg class="sgp ${inkNow ? 'sgp-in' : 'sgp-out'}" viewBox="0 0 24 24" aria-hidden="true"><g class="sg-ink"><use class="sgp-hollow" href="#g-star-open"/><use class="sgp-fill" href="#g-star"/></g></svg>` : `<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#g-star${loc.starred ? '' : '-open'}"/></svg>`}</button><label class="popup-star-tap" for="starHapticSwitch" aria-hidden="true"></label></span>
            <div class="popup-title">${escapeHtml(loc.name)}</div>
            ${loc.address ? `<div class="popup-addr">${escapeHtml(loc.address)}</div>` : ''}
            ${loc.notes ? `<div class="popup-notes">${escapeHtml(loc.notes)}</div>` : ''}
          </div>
          <a class="popup-directions" href="${directionsUrl(loc)}" target="_blank" rel="noopener" aria-label="Get directions"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#g-compass"/></svg>Get Directions</a>
          <div class="popup-actions">
            <div class="popup-cat"><span style="color:${ink};display:flex">${glyphHtml(loc.category, 20)}</span>${escapeHtml(loc.category)}${stopLine ? `<span class="popup-stop">&nbsp;&middot;&nbsp;${stopLine}</span>` : ''}</div>
            <span class="popup-visited-slot"><button type="button" class="popup-visited ${loc.visited ? 'visited' : ''}" data-id="${escapeAttr(loc.id)}" aria-pressed="${loc.visited ? 'true' : 'false'}">${loc.visited ? 'Visited' : 'Mark Visited'}<span class="popup-visited-check" aria-hidden="true"></span></button><label class="popup-visited-tap" for="starHapticSwitch" aria-hidden="true"></label></span>
          </div>
        </div>
      `;
    }

    // The single writer of highlight state. Highlight lives here, not on the
    // marker objects, so a reconciled marker can be recreated without losing it.
    function setHighlighted(id) {
      if (highlightedId === id) return;
      const prev = highlightedId;
      highlightedId = id;

      [prev, id].forEach(key => {
        if (!key) return;
        const marker = markersById.get(key);
        if (marker) {
          marker.marker.setIcon(markerIcon(marker.loc, key === id));
          applyMarkerStacking(marker.marker, key === id, marker.loc.starred);
        }
        const card = cardsById.get(key);
        if (card) card.el.classList.toggle('highlighted', key === id);
      });
    }

    // ---- list click -> popup, GUARANTEED -----------------------------------
    // A list click must always end with that item's popup open. The old
    // code opened it on a fixed 300ms timer, racing a 0.5s fly: a pin that
    // started inside a cluster had no solo marker yet (syncMarkerGlyphZoom()
    // makes it on moveend), and a shape below its min zoom had no layer, so
    // nothing opened. Now the popup opens when the map has ARRIVED at the
    // target view -- checked on every moveend, not assumed from the first
    // one -- after re-running the (idempotent) syncs, re-looking the marker
    // or layer up at that moment.
    //   - Reduced motion: setView() fires moveend synchronously inside
    //     move(); the listener is already attached, so the same path runs.
    //   - Already there: no move happens, so it opens immediately.
    //   - Last tap wins: one pending intent at a time; a newer tap cancels
    //     the older listener and closes any open popup first, so a stale
    //     popup can never appear after the tap that replaced it.
    //   - The user takes over mid-flight -- ANY direct map input (a pin or
    //     cluster tap, a drag, a pinch, a wheel) -- and the intent is
    //     dropped: pointerdown/wheel in the capture phase on the map
    //     container, so it runs before Leaflet's own handlers. Without it a
    //     stale list-tap popup could replace the pin the user just tapped,
    //     or fire later on any moveend that happened to land on the target.
    let pendingPopupOpen = null;

    function openPopupOnArrival(center, zoom, getLayer, move) {
      if (pendingPopupOpen) pendingPopupOpen();
      map.closePopup();

      const target = L.latLng(center);
      const arrived = () => {
        if (map.getZoom() < zoom - 0.01) return false;
        const p = map.latLngToContainerPoint(target);
        return p.distanceTo(map.getSize().divideBy(2)) <= 2;
      };
      const container = map.getContainer();
      const cancel = () => {
        map.off('moveend', onMoveEnd);
        map.off('dragstart', cancel);
        container.removeEventListener('pointerdown', cancel, true);
        container.removeEventListener('wheel', cancel, true);
        if (pendingPopupOpen === cancel) pendingPopupOpen = null;
      };
      function onMoveEnd() {
        if (!arrived()) return;          // an intermediate/other move -- keep waiting
        cancel();
        syncMarkerGlyphZoom();
        syncNeighborhoodLayers();
        const layer = getLayer();
        if (layer) layer.openPopup();
      }

      pendingPopupOpen = cancel;
      map.on('moveend', onMoveEnd);
      map.on('dragstart', cancel);
      container.addEventListener('pointerdown', cancel, true);
      container.addEventListener('wheel', cancel, { capture: true, passive: true });
      if (arrived()) onMoveEnd();
      else move();
    }

    function highlightMarker(locationId) {
      const location = locations.find(loc => loc.id === locationId);
      if (!location) return;

      noteInteraction();
      setHighlighted(locationId);
      // atLeast: SOLO_MIN_ZOOM -- not a coincidence, see that constant's
      // comment. This is the call the whole clustering safety property
      // rests on; if it ever changes, SOLO_MIN_ZOOM must move with it.
      // Arrival is checked at that same zoom, so the popup can only ever
      // open on a solo (never clustered) marker.
      const center = [location.lat, location.lng];
      openPopupOnArrival(center, Math.max(map.getZoom(), SOLO_MIN_ZOOM),
        () => { const entry = markersById.get(locationId); return entry && entry.marker; },
        () => focusMap(center, { atLeast: SOLO_MIN_ZOOM }, { animate: true, duration: 0.5 }));
    }

    // =========================================================================
    // LIST ORDER (design/list-ordering/). Six orders, picked from #sortBtn's
    // menu. An order only REORDERS what visibleLocations() already returns --
    // it never adds, hides or pages anything (the list rule in CLAUDE.md).
    // Per-device view state in localStorage; A-Z is the default.
    // =========================================================================
    const SORT_STORAGE_KEY = 'triplet.sortMode';
    const SORT_MODES = ['az', 'category', 'nearest', 'left', 'starred', 'newest'];
    const SORT_LABELS = { az: 'A–Z', category: 'Category', nearest: 'Nearest', left: 'What’s left', starred: 'Starred', newest: 'Newest' };
    const SORT_DEFAULT = 'az';
    // Nearest re-sorts only after the user has moved this far from the
    // position the current order was computed at -- GPS jitter and a slow
    // walk never shuffle the list under a thumb.
    const NEAREST_RESORT_M = 150;
    // No fix at all this long after asking (e.g. a permission prompt left
    // unanswered, or no GPS indoors): fall back rather than wait forever.
    const NEAREST_WAIT_MS = 20000;
    let nearestTimer = 0;
    let sortMode = SORT_DEFAULT;
    let sortFix = null;         // {lat, lng} the Nearest order was computed at
    let lastFix = null;         // newest known position (Nearest watcher OR center-me)
    let nearestWatch = null;    // the one watchPosition, alive only while Nearest is the order
    let nearestState = 'idle';  // idle | pending | ok | off
    let nearestWhy = '';        // short reason shown on the greyed Nearest row
    let sortDeferred = false;   // a re-sort waited for a row gesture to finish

    function readSortMode() {
      try { const v = localStorage.getItem(SORT_STORAGE_KEY); return SORT_MODES.includes(v) ? v : SORT_DEFAULT; }
      catch (e) { return SORT_DEFAULT; }
    }
    function writeSortMode(v) {
      try { localStorage.setItem(SORT_STORAGE_KEY, v); } catch (e) { /* private mode etc.: order just won't persist */ }
    }

    const nameCmp = (a, b) => String(a || '').localeCompare(String(b || ''), undefined, { sensitivity: 'base', numeric: true });
    const categoryRank = cat => { const i = Object.keys(CATEGORY_COLORS).indexOf(cat); return i < 0 ? 999 : i; };
    const kmFromFix = (lat, lng) => haversineKm([sortFix.lat, sortFix.lng], [lat, lng]);
    function shapeCentroid(nb) {
      const g = nb.geometry || []; if (!g.length) return null;
      let la = 0, ln = 0; g.forEach(p => { la += p[0]; ln += p[1]; }); return [la / g.length, ln / g.length];
    }

    // Pure reorder of the pins. Nearest without a fix yet sorts A-Z.
    function sortLocations(locs) {
      const mode = sortMode === 'nearest' && !sortFix ? 'az' : sortMode;
      if (mode === 'newest') return locs.slice();   // locations arrives created_at DESC from the server
      const out = locs.slice();
      const by = (...keys) => (a, b) => { for (const k of keys) { const d = k(a) - k(b); if (d) return d; } return nameCmp(a.name, b.name); };
      if (mode === 'az') out.sort((a, b) => nameCmp(a.name, b.name));
      else if (mode === 'category') out.sort(by(l => categoryRank(l.category)));
      else if (mode === 'nearest') out.sort(by(l => kmFromFix(l.lat, l.lng)));
      else if (mode === 'left') out.sort(by(l => +!!l.visited, l => +!l.starred));
      else if (mode === 'starred') out.sort(by(l => +!l.starred, l => +!!l.visited));
      return out;
    }
    // Shapes keep their own block after the pins; they have no visited /
    // starred / created order, so they read A-Z except in Category (by
    // type) and Nearest (by centroid).
    function sortShapes(shapes) {
      const out = shapes.slice(), lab = (a, b) => nameCmp(a.label, b.label);
      if (sortMode === 'category') out.sort((a, b) => (categoryRank(a.type) - categoryRank(b.type)) || lab(a, b));
      else if (sortMode === 'nearest' && sortFix) {
        const d = nb => { const c = shapeCentroid(nb); return c ? kmFromFix(c[0], c[1]) : Infinity; };
        out.sort((a, b) => (d(a) - d(b)) || lab(a, b));
      } else out.sort(lab);
      return out;
    }

    // Nearest mode leads a row's meta with its distance -- the one fact that
    // mode is about. Other modes: empty, the meta line is unchanged.
    function distanceLabel(loc) {
      if (sortMode !== 'nearest' || !sortFix) return '';   // Plans sorts its other places too
      const km = kmFromFix(loc.lat, loc.lng);
      if (km < 1) return `${Math.max(10, Math.round(km * 100) * 10)} m`;
      if (km < 10) return `${km.toFixed(1)} km`;
      return `${Math.round(km).toLocaleString('en-US')} km`;
    }

    // A row gesture (pencil star, visit stamp, or their popup replays) owns
    // its row until it settles: while any is live, rows keep their current
    // order and the re-sort runs when the last one lets go.
    function heldOrder(visible) {
      if (!starHeld.size) return null;
      sortDeferred = true;
      const list = document.getElementById('locationsList'), pos = new Map();
      [...list.children].forEach((el, i) => { const id = el.getAttribute && el.getAttribute('data-id'); if (id) pos.set(id, i); });
      return visible.slice().sort((a, b) => (pos.has(a.id) ? pos.get(a.id) : 1e9) - (pos.has(b.id) ? pos.get(b.id) : 1e9));
    }
    function afterRowGesture() {
      if (!sortDeferred || starHeld.size) return;
      sortDeferred = false;
      requestAnimationFrame(() => { if (!starHeld.size) updateUI(); else sortDeferred = true; });
    }

    // ---- the button + menu --------------------------------------------------
    function syncSortButton() {
      const btn = document.getElementById('sortBtn');
      if (!btn) return;
      const shown = sortMode === 'nearest' && !sortFix ? 'az' : sortMode;
      btn.setAttribute('aria-label', `Sort list: ${SORT_LABELS[sortMode]}${sortMode === 'nearest' && nearestState === 'pending' ? ', locating' : ''}`);
      btn.classList.toggle('not-default', shown !== SORT_DEFAULT);
      btn.classList.toggle('loading', sortMode === 'nearest' && nearestState === 'pending');
    }
    function announceSort(msg) {
      const live = document.getElementById('sortLive');
      if (!live) return;
      live.textContent = '';
      setTimeout(() => { live.textContent = msg; }, 30);   // re-set so a repeat is re-announced
    }
    function renderSortMenu() {
      const menu = document.getElementById('sortMenu');
      menu.innerHTML = `<div class="sort-cap" aria-hidden="true">${inPlanView() ? 'Sort places not in the plan' : 'Sort by'}</div>` + SORT_MODES.map(m => {
        const off = m === 'nearest' && nearestState === 'off';
        const why = m === 'nearest' ? (nearestState === 'off' ? nearestWhy : nearestState === 'pending' ? 'Locating…' : '') : '';
        return `<button class="sort-opt${off ? ' is-off' : ''}" role="menuitemradio" tabindex="-1" data-sort="${m}" aria-checked="${m === sortMode}"${why ? ` aria-describedby="sortWhy-${m}"` : ''}>` +
          `<svg class="sort-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5l5.5 5.5L20.5 6" fill="none" stroke="currentColor" stroke-width="2.25"/></svg><span>${escapeHtml(SORT_LABELS[m])}</span>` +
          `<span class="sort-why" id="sortWhy-${m}">${escapeHtml(why)}</span></button>`;
      }).join('');
    }
    function sortMenuOpen() { return !document.getElementById('sortMenu').hidden; }
    function placeSortMenu(menu = document.getElementById('sortMenu')) {
      const btn = document.getElementById('sortBtn');
      // Above the whole header band (it rises off the sheet's top edge, over
      // the map); below the button only when there's no room above.
      const r = btn.getBoundingClientRect(), band = btn.closest('#locationsHeader').getBoundingClientRect();
      const w = menu.offsetWidth, h = menu.offsetHeight;
      const vw = document.documentElement.clientWidth;
      const above = band.top - h >= 8;
      menu.style.top = `${above ? band.top - h - 2 : r.bottom + 6}px`;   // its 2px ink offset ends exactly on the band's top line
      menu.style.left = `${Math.max(8, Math.min(vw - w - 8, r.right - w))}px`;
      menu.style.setProperty('--slip-from', above ? '4px' : '-4px');
      return above;
    }
    function openSortMenu() {
      const btn = document.getElementById('sortBtn'), menu = document.getElementById('sortMenu');
      closeFiltersPanel();
      renderSortMenu();
      hideSortNote();
      document.getElementById('sortScrim').hidden = false;
      document.body.classList.add('sort-open');
      menu.hidden = false;
      placeSortMenu();
      menu.classList.remove('opening'); void menu.offsetWidth; menu.classList.add('opening');
      btn.setAttribute('aria-expanded', 'true');
      const cur = menu.querySelector('[aria-checked="true"]') || menu.querySelector('.sort-opt');
      cur.focus({ preventScroll: true });
    }
    function closeSortMenu(refocus = true) {
      const menu = document.getElementById('sortMenu');
      if (menu.hidden) return;
      menu.hidden = true; menu.classList.remove('opening');
      document.getElementById('sortScrim').hidden = true;
      document.body.classList.remove('sort-open');
      const btn = document.getElementById('sortBtn');
      btn.setAttribute('aria-expanded', 'false');
      if (refocus) btn.focus({ preventScroll: true });
    }
    function closeFiltersPanel() {
      const was = document.getElementById('filtersPanel').classList.contains('visible');
      document.getElementById('filtersPanel').classList.remove('visible');
      document.getElementById('toggleFiltersBtn').classList.remove('active');
      if (was) reframeAfterPanel();   // Plans: the same re-fit rule as the toggle button
    }

    function setSortMode(mode, { announce = true, persist = true } = {}) {
      if (!SORT_MODES.includes(mode)) mode = SORT_DEFAULT;
      const prev = sortMode;
      sortMode = mode;
      if (persist) writeSortMode(mode);
      if (mode === 'nearest') startNearest(); else if (prev === 'nearest') stopNearest();
      syncSortButton();
      updateUI();
      if (announce) announceSort(mode === 'nearest' && !sortFix ? 'Sort: Nearest. Finding your location.' : `Sort: ${SORT_LABELS[mode]}`);
    }

    // ---- Nearest: location only on request, one watcher, threshold re-sort --
    function takeFix(lat, lng) {
      lastFix = { lat, lng };
      if (sortMode !== 'nearest') return;
      const first = !sortFix;
      if (first || haversineKm([sortFix.lat, sortFix.lng], [lat, lng]) * 1000 >= NEAREST_RESORT_M) {
        sortFix = { lat, lng };
        updateUI();
      }
      if (nearestState !== 'ok') {
        nearestState = 'ok'; nearestWhy = '';
        syncSortButton();
        if (sortMenuOpen()) renderSortMenu();
        if (first) announceSort('Sort: Nearest');
      }
    }
    function nearestFailed(reason) {
      stopNearest();
      nearestState = 'off'; nearestWhy = reason;
      setSortMode(SORT_DEFAULT, { announce: false });
      announceSort(`Location unavailable. Sort: ${SORT_LABELS[SORT_DEFAULT]}`);
      showSortNote(`${reason} — sorted ${SORT_LABELS[SORT_DEFAULT]}`);
      if (sortMenuOpen()) renderSortMenu();
    }
    let sortNoteTimer = 0;
    function showSortNote(text) {
      const note = document.getElementById('sortNote');
      note.textContent = text; note.hidden = false; document.body.classList.add('sort-noting');
      placeSortMenu(note);
      clearTimeout(sortNoteTimer); sortNoteTimer = setTimeout(hideSortNote, 4000);
    }
    function hideSortNote() { clearTimeout(sortNoteTimer); const n = document.getElementById('sortNote'); if (n) n.hidden = true; document.body.classList.remove('sort-noting'); }
    function startNearest() {
      if (nearestWatch !== null) return;
      if (!navigator.geolocation) { nearestFailed('Not supported'); return; }
      nearestState = 'pending'; nearestWhy = '';
      clearTimeout(nearestTimer);
      nearestTimer = setTimeout(() => { if (sortMode === 'nearest' && !sortFix) nearestFailed('No fix'); }, NEAREST_WAIT_MS);
      if (lastFix) takeFix(lastFix.lat, lastFix.lng);   // e.g. center-me already found us
      try {
        nearestWatch = navigator.geolocation.watchPosition(
          p => takeFix(p.coords.latitude, p.coords.longitude),
          err => {
            if (sortMode !== 'nearest') return;
            if (err.code === 1) nearestFailed('Location off');           // PERMISSION_DENIED
            else if (!sortFix) nearestFailed('No fix');                  // unavailable / timed out before any fix
            // a later blip after a good fix keeps the order we have
          },
          { enableHighAccuracy: true, maximumAge: 30000, timeout: 15000 });
      } catch (e) { nearestFailed('No fix'); }
    }
    function stopNearest() {
      if (nearestWatch !== null && navigator.geolocation) { try { navigator.geolocation.clearWatch(nearestWatch); } catch (e) {} }
      nearestWatch = null; sortFix = null; clearTimeout(nearestTimer);
      if (nearestState === 'pending' || nearestState === 'ok') nearestState = 'idle';
    }

    function initSort() {
      const btn = document.getElementById('sortBtn'), menu = document.getElementById('sortMenu'), scrim = document.getElementById('sortScrim');
      btn.addEventListener('click', () => { if (sortMenuOpen()) closeSortMenu(); else openSortMenu(); });
      // The outside tap only dismisses: the scrim takes it, so nothing under it (map, row, button) fires.
      scrim.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); closeSortMenu(); });
      menu.addEventListener('click', e => {
        const opt = e.target.closest('.sort-opt'); if (!opt) return;
        const m = opt.getAttribute('data-sort');
        closeSortMenu();
        if (m === 'nearest' && nearestState === 'off') nearestState = 'idle';   // a tap on the greyed row is a retry
        if (m !== sortMode || (m === 'nearest' && !sortFix && nearestWatch === null)) setSortMode(m);
        else announceSort(`Sort: ${SORT_LABELS[m]}`);
      });
      menu.addEventListener('keydown', e => {
        const opts = [...menu.querySelectorAll('.sort-opt')], i = opts.indexOf(document.activeElement);
        const go = j => { e.preventDefault(); opts[(j + opts.length) % opts.length].focus(); };
        if (e.key === 'ArrowDown') go(i + 1);
        else if (e.key === 'ArrowUp') go(i - 1);
        else if (e.key === 'Home') go(0);
        else if (e.key === 'End') go(opts.length - 1);
        else if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); closeSortMenu(); }
      });
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && sortMenuOpen()) closeSortMenu(); });
      window.addEventListener('resize', () => { if (sortMenuOpen()) placeSortMenu(); });

      // Restore. Nearest resumes only when location is ALREADY granted --
      // never a permission prompt on load; otherwise it falls to A-Z.
      const saved = readSortMode();
      if (saved === 'nearest') {
        sortMode = SORT_DEFAULT;
        if (navigator.permissions && navigator.permissions.query) {
          navigator.permissions.query({ name: 'geolocation' })
            .then(s => { if (s.state === 'granted' && sortMode === SORT_DEFAULT) setSortMode('nearest', { announce: false }); })
            .catch(() => {});
        }
      } else sortMode = saved;
      syncSortButton();
    }

    // =========================================================================
    // PLANS (design/plans-deepdive/v3/README.md, docs/shipped.md "Plans").
    // A plan is a named, ordered list of stops -- pins or districts/streets,
    // any city. `plans` + `plan_stops` in Supabase (supabase/migrations/
    // 20260929000000_add_plans.sql), same RLS as locations. Places | Plans is
    // a switch at the top of the filter panel; it changes only what the list
    // shows (and so what the map draws). Filters, sort and the panel are
    // shared. Plans is where you build AND follow a plan: the stops in order,
    // a captioned divider, then every place the filters match with +.
    // Fails soft: until the tables exist the Plans side says so, and Places
    // is exactly the app it was.
    // =========================================================================
    const LIST_VIEW_KEY = 'triplet.listView';      // per device: 'places' | 'plans'
    const ACTIVE_PLAN_KEY = 'triplet.activePlan';  // per device: the plan last open
    const PLAN_NAME_MAX = 80;                      // = the plans.name CHECK
    const PLAN_SVG = {
      check: '<svg class="plan-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5l5.5 5.5L20.5 6" fill="none" stroke="currentColor" stroke-width="2.25"/></svg>',
      plus: '<svg class="plan-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.25"/></svg>',
      more: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>'
    };

    function inPlanView() { return listView === 'plans'; }
    function activePlan() { return plans.find(p => p.id === activePlanId) || null; }
    function stopsOf(planId) {
      return planStops.filter(s => s.plan_id === planId)
        .sort((a, b) => (a.position - b.position) || String(a.id).localeCompare(String(b.id)));
    }
    function stopCount(planId) { return planRowsFor(planId).length; }

    // The plan's stops that resolve to a loaded place or shape, in order,
    // numbered 1..m (one grey number state; there is no NEXT).
    function planRowsFor(planId) {
      if (!planId) return [];
      const rows = [];
      stopsOf(planId).forEach(s => {
        if (s.location_id != null) {
          const loc = locations.find(l => l.id === s.location_id);
          if (loc) rows.push({ stop: s, loc });
        } else if (s.shape_id != null) {
          const nb = neighborhoodShapes.find(n => n.id === Number(s.shape_id));
          if (nb) rows.push({ stop: s, nb });
        }
      });
      rows.forEach((r, i) => { r.n = i + 1; r.m = rows.length; });
      return rows;
    }

    // One lookup for every surface (list, map, popup), recomputed only when
    // an input changes identity: every writer of these arrays replaces them.
    function planMarks() {
      const key = [listView, activePlanId, planStops, locations, neighborhoodShapes];
      if (planMarksCache && planMarksCache.key.every((v, i) => v === key[i])) return planMarksCache;
      const rows = inPlanView() ? planRowsFor(activePlanId) : [];
      const byLoc = new Map(), byShape = new Map();
      rows.forEach(r => { if (r.loc) byLoc.set(r.loc.id, r); else byShape.set(r.nb.id, r); });
      planMarksCache = { key, rows, byLoc, byShape };
      return planMarksCache;
    }
    function planMark(kind, id) { const pm = planMarks(); return (kind === 'loc' ? pm.byLoc : pm.byShape).get(id) || null; }
    function planMarkKey(kind, id) { const r = planMark(kind, id); return r ? `${r.n}/${r.m}` : ''; }
    function planStopLine(kind, id) { const r = planMark(kind, id); return r ? `Stop ${r.n} of ${r.m}` : ''; }

    // A STOP row's number takes the glyph column -- centred on the app's left
    // axis, x=30, the centre of the header chevron and of every Places icon --
    // and its Places badge moves one column over (x=56, the header title's
    // edge); its text follows at x=96. Rows below the divider are plain Places
    // rows (icon centred on x=30, text 56). The number is one grey state; it is
    // the drag handle (hold STOP_HOLD_MS) and the keyboard's reorder control.
    function numSpan(r, label) {
      const aria = `Stop ${r.n} of ${r.m}, ${escapeAttr(label)}. Hold and drag, or use the arrow keys (Home / End for first / last), to move it.`;
      return `<span class="row-n" role="button" tabindex="0" aria-label="${aria}">${r.n}</span>`;
    }
    function planLead(stop, category, kind, ink, label) {
      if (!(stop && inPlanView() && activePlan())) return `<div class="row-badge" style="--row-ink:${ink}">${badgeHtml(category, kind, 24)}</div>`;
      // The stop's icon is placed by its INK, not its box: data-kind picks the optical offset (CSS .row-lead).
      return `<div class="row-lead">${numSpan(stop, label)}<div class="row-badge" data-kind="${kind}" style="--row-ink:${ink}">${badgeHtml(category, kind, 24)}</div></div>`;
    }
    function rowActionHtml(stop, label) {
      if (!inPlanView()) return '<button class="delete-btn" aria-label="Delete">&times;</button>';
      const p = activePlan();
      if (!p) return '';
      if (stop) return `<button class="delete-btn plan-x" aria-label="Remove ${escapeAttr(label)} from ${escapeAttr(p.name)}">&times;</button>`;
      return `<button class="delete-btn plan-add" aria-label="Add ${escapeAttr(label)} to ${escapeAttr(p.name)}">+</button>`;
    }

    function shapePopupHtml(nb) {
      const line = planStopLine('shape', nb.id);
      return `<strong>${escapeHtml(nb.label)}</strong>${line ? `<span class="shape-stop">${line}</span>` : ''}${nb.note ? `<p>${escapeHtml(nb.note)}</p>` : ''}`;
    }

    // A stop on the map is its ordinary Places pin (same ring, same glyph --
    // dashed for an approximate pin, a diamond for a shape stop; the star keeps
    // its corner), always at the near size, plus a numbered TAG: a small
    // square paper tile ruled 1px --ink-2 with an --ink-2 numeral, one style
    // for every stop. The tag alone marks a stop. applyPlanMap() moves each
    // tag to a free spot and merges the tags of stops whose pins overlap.
    function planNumberIcon(category, kind, ink, r, size, highlighted, starred) {
      const pad = 12, box = size + pad * 2, c = box / 2;
      const badge = badgeHtml(category, kind, size, { ink, fill: highlighted ? ink : '#F2EBDD', mark: highlighted ? '#F2EBDD' : ink, rim: highlighted ? 2.5 : 2, glyph: true });
      const star = starred ? `<div style="position:absolute;left:${pad}px;top:${pad}px;width:${size}px;height:${size}px">${markerStarHtml(size)}</div>` : '';
      const tag = `<div class="stop-tag" data-n="${r.n}" style="left:${pad - 11}px;top:${pad - 11}px">${r.n}</div>`;
      const html = `<div class="plan-stop${highlighted ? ' highlighted-marker' : ''}" data-n="${r.n}" style="position:relative;width:${box}px;height:${box}px;line-height:0;"><div style="position:absolute;left:${pad}px;top:${pad}px">${badge}</div>${star}${tag}</div>`;
      return L.divIcon({ html, className: 'plan-stop-icon', iconSize: [box, box], iconAnchor: [c, c] });   // the 12px margin round the pin is pass-through (never covers a neighbour's tag or takes its tap)
    }

    // A shape stop has no pin, so it gets the list's own diamond badge (plus
    // its tag) at the shape's centroid -- one mark per stop, so the map reads
    // 1..m with no gaps, at every zoom; a tap is the row's tap.
    const planShapeMarkers = new Map();   // shape id -> { marker, sig }
    function syncPlanShapeMarkers() {
      if (!map) return;
      const seen = new Set();
      if (inPlanView()) {
        planMarks().rows.forEach(r => {
          if (!r.nb) return;
          const c = shapeCentroid(r.nb);
          if (!c) return;
          const id = r.nb.id;
          seen.add(id);
          const ink = r.nb.color || categoryInk(r.nb.type);
          const sig = [r.n, c.join(), ink, r.nb.type].join('|');
          const had = planShapeMarkers.get(id);
          if (had && had.sig === sig) return;
          if (had) map.removeLayer(had.marker);
          const marker = L.marker(c, {
            icon: planNumberIcon(r.nb.type, 'diamond', ink, r, MARKER_SIZE_NEAR, false, false),
            zIndexOffset: Z_PLAN_STOP - r.n,
            title: `Stop ${r.n}: ${r.nb.label}`
          }).addTo(map);
          marker.on('click', () => focusShape(id));
          planShapeMarkers.set(id, { marker, sig });
        });
      }
      planShapeMarkers.forEach((e, id) => {
        if (seen.has(id)) return;
        map.removeLayer(e.marker);
        planShapeMarkers.delete(id);
      });
    }

    function emptyText(planMode) {
      if (!planMode) return 'Nothing here yet.';
      if (plansAvailable === false) return 'Plans aren’t available yet.';
      if (plansAvailable === null) return 'Loading plans…';
      if (!plans.length) return 'No plans yet. A plan’s stops show here and on the map.';
      if (!activePlan()) return 'Pick a plan.';
      return 'No stops yet.';
    }

    // Plans' own reconciler over the same card maps (pins AND shapes, one
    // list). The Places reconcilers (syncLocationCards / syncShapeCards) never
    // run in Plans. The list = the plan's stops (all of them, in plan order,
    // whatever the filters: the chips choose what you can add, they never hide
    // your plan) / Places' group divider with a caption / every place and
    // shape the filters match that is not a stop, in the current sort.
    const planRule = document.createElement('div');
    planRule.className = 'plan-rule'; planRule.setAttribute('role', 'separator');
    const planStopsNote = document.createElement('div'); planStopsNote.className = 'plan-list-note';
    planStopsNote.textContent = 'No stops yet. Tap + on a place below.';
    const planOthersNote = document.createElement('div'); planOthersNote.className = 'plan-list-note';
    const planEmptyBtn = document.createElement('button'); planEmptyBtn.type = 'button'; planEmptyBtn.className = 'plan-empty-new'; planEmptyBtn.textContent = 'New plan';
    // "Add from Copenhagen · cafe (1)": where the plan ends, and what the filters put below it.
    function ruleCaption(n) {
      const all = Object.keys(CATEGORY_COLORS), on = all.filter(c => filters.categories[c]);
      const cats = on.length === all.length ? '' : !on.length ? ' · no categories' : on.length <= 2 ? ' · ' + on.join(', ') : ` · ${on.length} categories`;
      return `Add from ${activeCityLabel()}${cats} (${n})`;
    }
    function planOthers() {
      const pm = planMarks();
      const locs = visibleLocations().filter(l => !pm.byLoc.has(l.id));
      const shapes = visibleNeighborhoodShapes().filter(n => !pm.byShape.has(n.id));
      return { locs: heldOrder(locs) || sortLocations(locs), shapes: sortShapes(shapes) };
    }
    function othersNoteText() {
      const any = locations.some(l => filters.categories[l.category] && (filters.city === null || l.city === filters.city)) ||
        neighborhoodShapes.some(n => filters.categories[n.type] && (isAllCities() || n.city === activeCity));
      return any ? 'Every place these filters match is in this plan.' : 'No places match these filters.';
    }
    function syncPlanCards(rows) {
      const list = document.getElementById('locationsList');
      const want = [];
      const seenLoc = new Set(), seenShape = new Set();
      const open = !!activePlan();
      const others = open ? planOthers() : { locs: [], shapes: [] };
      const seq = rows.slice();
      if (open) {
        if (!rows.length) want.push(planStopsNote); else if (planStopsNote.parentNode) planStopsNote.remove();
        seq.push({ rule: true });
        others.locs.forEach(loc => seq.push({ loc }));
        others.shapes.forEach(nb => seq.push({ nb }));
        if (!others.locs.length && !others.shapes.length) { planOthersNote.textContent = othersNoteText(); seq.push({ note: true }); }
        else if (planOthersNote.parentNode) planOthersNote.remove();
      } else { [planRule, planStopsNote, planOthersNote].forEach(n => { if (n.parentNode) n.remove(); }); }
      planRule.textContent = ruleCaption(others.locs.length + others.shapes.length);
      seq.forEach((r, i) => {
        if (r.rule) { want.push(planRule); return; }
        if (r.note) { want.push(planOthersNote); return; }
        if (r.loc) {
          const loc = r.loc;
          seenLoc.add(loc.id);
          let entry = cardsById.get(loc.id);
          if (!entry) { entry = { el: createCard(loc), signature: null }; cardsById.set(loc.id, entry); }
          const signature = cardSignature(loc);
          if (signature !== entry.signature && !starHeld.has(loc.id)) { renderCard(entry.el, loc); entry.signature = signature; }
          entry.el.classList.toggle('highlighted', loc.id === highlightedId);
          entry.el.classList.toggle('is-stop', !!r.stop);
          const nx = seq[i + 1];
          entry.el.classList.toggle('group-end', !r.stop && sortMode === 'category' && !!(nx && nx.loc) && nx.loc.category !== loc.category);
          want.push(entry.el);
        } else {
          const nb = r.nb;
          seenShape.add(nb.id);
          let entry = shapeCardsById.get(nb.id);
          if (!entry) { entry = { el: createShapeCard(nb), signature: null }; shapeCardsById.set(nb.id, entry); }
          const signature = shapeCardSignature(nb);
          if (signature !== entry.signature) { renderShapeCard(entry.el, nb); entry.signature = signature; }
          entry.el.classList.toggle('is-stop', !!r.stop);
          want.push(entry.el);
        }
      });
      cardsById.forEach((entry, id) => { if (!seenLoc.has(id)) { entry.el.remove(); cardsById.delete(id); } });

      const under = openPanelHeight();
      const box = planSafeBox(under), sz = map.getSize();
      const pad = { paddingTopLeft: [box.l, box.t], paddingBottomRight: [sz.x - box.r, sz.y - box.b], animate: false };
      const stopLL = rows.map(stopLatLng).filter(Boolean);
      const fit = lls => lls.length === 1 ? map.setView(lls[0], Math.max(map.getZoom(), 15), { animate: false }) : map.fitBounds(L.latLngBounds(lls), { ...pad, maxZoom: 16 });
      if (under) {
        const o = planOthers();
        const cand = o.locs.map(l => L.latLng(l.lat, l.lng)).concat(o.shapes.map(n => shapeCentroid(n)).filter(Boolean).map(c => L.latLng(c)));
        fit(stopLL.concat(cand));
      } else {
        const inCity = filters.city === null ? [] : rows.filter(r => (r.loc ? r.loc.city : r.nb.city) === filters.city).map(stopLatLng).filter(Boolean);

      }

    }
    // The panel changes the map's job (building vs following), so opening AND
    // closing it re-fit -- while the map is still where the app last put it (a
    // fit, or the pan after +). Once you have moved the map yourself it stays
    // yours: closing leaves it alone (you only gain room); opening keeps your
    // zoom and pans the least that lifts the stops you had on screen out from
    // under the panel (zooming out only if they can't fit in the strip).
    let lastPlanFit = null;
    const planFitView = () => { const c = map.getCenter(); return `${c.lat.toFixed(6)},${c.lng.toFixed(6)},${map.getZoom()}`; };
    const planMapUnmoved = () => !!lastPlanFit && planFitView() === lastPlanFit.view;
    function reframeAfterPanel() {
      if (!inPlanView() || !activePlan() || !map) return;
      if (planMapUnmoved()) { frameActivePlan(); return; }
      lastPlanFit = null;
      const pn = document.getElementById('filtersPanel');
      if (!pn.classList.contains('visible')) return;
      const box = planSafeBox(pn.offsetHeight), full = planSafeBox(0);
      const pts = planMarks().rows.map(stopLatLng).filter(Boolean);
      const seen = pts.filter(ll => { const p = map.latLngToContainerPoint(ll); return p.x >= full.l && p.x <= full.r && p.y >= full.t && p.y <= full.b; });
      if (!seen.length) return;   // you had panned away from the plan: nothing of it to keep
      const ps = seen.map(ll => map.latLngToContainerPoint(ll));
      const x1 = Math.min(...ps.map(p => p.x)), x2 = Math.max(...ps.map(p => p.x)), y1 = Math.min(...ps.map(p => p.y)), y2 = Math.max(...ps.map(p => p.y));
      if (x2 - x1 <= box.r - box.l && y2 - y1 <= box.b - box.t) {

    }

    // The only writer of listView. The switch changes only what the list shows
    // (and so what the map draws): never the filters, the sort or the panel.
    // Back in Places, the map re-frames the selected city.
    function setListView(view) {
      if (view !== 'plans') view = 'places';
      if (view === listView) return;
      closeSortMenu(false);
      noteInteraction();
      planPanel = { mode: null, draft: '' };
      listView = view;
      setHighlighted(null);
      if (map) map.closePopup();
      if (view === 'plans') {
        if (!activePlan()) activePlanId = plans[0] ? plans[0].id : null;
        updateUI();
        frameActivePlan();
      } else {
        updateUI();
        focusCity(citySelection, { animate: true });
      }
      writePlanPrefs();
      document.getElementById('locationsList').scrollTop = 0;
    }
    // Picking a plan opens it in Plans, closes the picker's slip and leaves the
    // panel open; the map frames it.
    function choosePlan(id) {
      if (!plans.some(p => p.id === id)) return;
      noteInteraction();
      const same = listView === 'plans' && activePlanId === id;
      listView = 'plans';
      activePlanId = id;
      planPanel = { mode: null, draft: '', open: false };
      if (!same) { setHighlighted(null); if (map) map.closePopup(); }
      updateUI();
      frameActivePlan();   // re-picking the open plan re-frames it (the city chip's recovery move)
      writePlanPrefs();
      if (!same) document.getElementById('locationsList').scrollTop = 0;
    }

    // ---- the panel: switch + plan picker ----------------------------------
    // The picker sits in the switch's row, in BOTH views (the panel is identical and the
    // same height); its slip lists every plan (✓ = open, count, ⋯ = rename/delete THAT plan)
    // and New plan. Picking a plan opens it in Plans and closes the slip; the panel stays.
    let planLedgerSig = null;
    const PLAN_CHEV = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.25"/></svg>';
    function renderPlanPanel() {
      const panel = document.getElementById('filtersPanel');
      panel.classList.toggle('plans-side', inPlanView());
      document.querySelectorAll('#listSwitch [role="radio"]').forEach(b => {
        const on = b.dataset.view === listView;
        b.setAttribute('aria-checked', String(on));
        b.tabIndex = on ? 0 : -1;
      });
      const pick = document.getElementById('planPick'), ledger = document.getElementById('planLedger');
      const counts = plans.map(p => stopCount(p.id));
      const open = plansAvailable === true && (!!planPanel.open || planPanel.mode === 'creating');
      const sig = JSON.stringify([listView, plansAvailable, activePlanId, planPanel.mode, open, planPanel.target, plans.map(p => [p.id, p.name]), counts]);
      if (sig === planLedgerSig) return;
      planLedgerSig = sig;
      const hadFocus = panel.contains(document.activeElement) ? document.activeElement : null;
      const focusKey = hadFocus && (hadFocus.dataset.plan || hadFocus.dataset.more || hadFocus.dataset.act || (hadFocus.tagName === 'INPUT' ? 'input' : null));
      const cur = activePlan();
      const label = plansAvailable === false ? 'Not available yet' : plansAvailable === null ? 'Loading…' : cur ? cur.name : plans.length ? 'Pick a plan' : 'New plan';
      const act = plansAvailable !== true ? 'none' : plans.length ? 'toggle' : 'new';
      pick.innerHTML = `<button type="button" class="plan-picker" data-act="${act}" aria-haspopup="true" aria-expanded="${open}"${act === 'none' ? ' aria-disabled="true"' : ''} aria-label="Plan: ${escapeAttr(label)}">` +
        `${act === 'new' ? PLAN_SVG.plus : ''}<span class="plan-name">${escapeHtml(label)}</span>${act === 'toggle' ? PLAN_CHEV : ''}</button>`;
      ledger.hidden = !open;
      if (!open) { ledger.innerHTML = ''; return; }
      const form = (lbl, a) => `<div class="plan-opt plan-form"><input type="text" maxlength="${PLAN_NAME_MAX}" enterkeyhint="done" autocomplete="off" aria-label="${lbl}" placeholder="Plan name" value="${escapeAttr(planPanel.draft)}">` +
        `<button type="button" class="plan-act" data-act="cancel">Cancel</button><button type="button" class="plan-act primary" data-act="${a}">${a === 'create' ? 'Create' : 'Save'}</button></div>`;
      ledger.innerHTML = plans.map((p, i) => {
        const tgt = p.id === planPanel.target;
        if (tgt && planPanel.mode === 'renaming') return form('Plan name', 'save');
        if (tgt && planPanel.mode === 'acting') {
          return `<div class="plan-opt plan-form" role="group" aria-label="${escapeAttr(p.name)}"><button type="button" class="plan-act primary" data-act="rename">Rename</button>` +
            `<button type="button" class="plan-act danger" data-act="delete">Delete plan</button><span class="plan-spacer"></span><button type="button" class="plan-act" data-act="cancel">Cancel</button></div>`;
        }
        const n = counts[i], ct = `${n} ${n === 1 ? 'stop' : 'stops'}`;
        return `<div class="plan-opt"><button type="button" class="plan-pick" data-plan="${escapeAttr(p.id)}" aria-current="${p.id === activePlanId}" aria-label="${escapeAttr(p.name)}, ${ct}">` +
          `${PLAN_SVG.check}<span class="plan-name">${escapeHtml(p.name)}</span><span class="plan-count">${ct}</span></button>` +
          `<button type="button" class="plan-more" data-act="more" data-more="${escapeAttr(p.id)}" aria-label="Rename or delete ${escapeAttr(p.name)}">${PLAN_SVG.more}</button></div>`;
      }).join('') + (planPanel.mode === 'creating' ? form('New plan name', 'create')
        : `<div class="plan-opt"><button type="button" class="plan-pick plan-new" data-act="new">${PLAN_SVG.plus}<span class="plan-name">New plan</span><span></span></button></div>`);
      const input = ledger.querySelector('input');
      if (input && (focusKey === 'input' || planPanel.focusInput)) {

        input.focus({ preventScroll: true });
        input.setSelectionRange(input.value.length, input.value.length);
      } else if (focusKey) {
        const again = panel.querySelector(`[data-plan="${CSS.escape(focusKey)}"], [data-more="${CSS.escape(focusKey)}"], [data-act="${CSS.escape(focusKey)}"]`);
        if (again) again.focus({ preventScroll: true });

    function setPlanPanel(next) { planPanel = { mode: null, draft: '', open: true, ...next }; renderPlanPanel(); }
    async function submitPlanForm() {

    }
    async function openNewPlan() {   // from the picker, the slip, or the empty list's button

    function initPlans() {

      sw.addEventListener('keydown', e => {

        e.preventDefault();

        else if (act === 'delete' && tp) {

          // open or not: deleting another plan never changes what you're looking at.

        }
      };

      document.getElementById('planPick').addEventListener('click', onClick);
      // The slip closes with the panel.
      document.getElementById('toggleFiltersBtn').addEventListener('click', () => setTimeout(() => {
        if (!document.getElementById('filtersPanel').classList.contains('visible') && (planPanel.open || planPanel.mode)) setPlanPanel({ open: false });
      }, 0));
      // Back to the stops from anywhere in a long list: tap the plan's name
      // (the iOS "tap the title to go to the top" convention). No new control.
      document.querySelector('#locationsHeader h2').addEventListener('click', () => {
        if (!inPlanView()) return;

      });
      planEmptyBtn.addEventListener('click', openNewPlan);
    }

    function updateUI() {
      const planMode = inPlanView();
      // Plans orders its own list (syncPlanCards: the stops in plan order, then
      // the other matches in the sort); Places sorts here, as it always has.
      const visible = (() => { const v = visibleLocations(); return planMode ? v : (heldOrder(v) || sortLocations(v)); })();
      const visibleShapes = planMode ? visibleNeighborhoodShapes() : sortShapes(visibleNeighborhoodShapes());
      // The header is only a label: whatever the list is. Places: the city
      // list and its count. Plans: just the plan's name (a count cost two
      // characters of fit; Places' "<city> list (N)" still tells them apart).
      const h2 = document.querySelector('#locationsHeader h2');
      if (planMode && activePlan()) h2.innerHTML = `<span class="h-name">${escapeHtml(activePlan().name)}</span>`;
      else h2.textContent = planMode ? 'Plans' : `${activeCityLabel()} list (${visible.length + visibleShapes.length})`;
      document.body.classList.toggle('plan-view', planMode);
      document.body.classList.toggle('plan-none', planMode && !activePlan());
      const mapVisible = mapVisibleLocations();
      syncMarkers(mapVisible.solo);
      syncClusterMarkers(mapVisible.clusters);
      if (planMode) syncPlanCards(planMarks().rows);
      else {
        [planRule, planStopsNote, planOthersNote].forEach(n => { if (n.parentNode) n.remove(); });   // the index-based reconcilers own the list from row 0
        syncLocationCards(visible);
        syncShapeCards(visibleShapes, visible.length);
      }
      syncNeighborhoodLayers();
      syncPlanShapeMarkers();
      applyPlanMap();
      placePlanSlip();   // the rule may have moved under it

      const list = document.getElementById('locationsList');
      const emptyState = document.getElementById('locationsEmpty');
      emptyState.style.display = (planMode ? !activePlan() : (visible.length + visibleShapes.length) === 0) ? 'block' : 'none';

      if (wantNew && !planEmptyBtn.parentNode) emptyState.appendChild(planEmptyBtn);
