    function paintVisit(g) {
      const C = STAR_SWIPE.COMMIT, V = VISIT_SWIPE, rm = prefersReducedMotion();
      const r = g.raw, st = g.st, el = g.el;
      const offBase = r <= C ? r : Math.min(STAR_SWIPE.MAX, C + (r - C) * 0.35);
      setSlip(g, -offBase);
      if (!g.visited) {
        const wasPressed = g.pressed;
        g.pressed = wasPressed ? r >= C - V.HYST : r >= C;
        if (g.pressed) {
          if (!wasPressed) {                // the stamp lands: same event, same frame
            st.classList.remove('vs-open'); vsCueClear(st);
            el.classList.add('is-visited');                 // field lands INSIDE the press
            g.pressT = sgNow();
            if (!rm) runVisitPop(g, VISIT_POP, VISIT_POP_MS); else stopVisitPop(g);
            if (!g.replay) starHaptic('ink');
          }
        } else {
          if (wasPressed) { stopVisitPop(g); st.classList.add('vs-open'); el.classList.remove('is-visited'); }   // un-press frame: old layout back
          vsCue(st, (r - V.TAIL_OUT) / (C - V.TAIL_OUT), Math.max(0, Math.min(1, (r - V.TAIL_OUT) / V.TAIL_OUT)));
        }
      } else {
        const wasLifted = g.lifted;
        g.lifted = wasLifted ? r >= C - V.HYST : r >= C;
        const f = Math.max(0, Math.min(1, (r - V.FADE_LAG) / (44 - V.FADE_LAG)));
        // P3-N1 + P5-S2: the ghost path starts AT the resting ink (82% navy on
        // this field: L 0.40 / C 0.035) and only pales, in oklch, toward a light
        // navy tint at full opacity -- lightness never drops, chroma never
        // falls below the rest's, and until 12px nothing changes at all.
        if (!g.hi) st.style.color = f <= 0 ? '' : `color-mix(in oklch, color-mix(in srgb, var(--navy) 82%, ${g.field}) ${((1 - f) * 100).toFixed(1)}%, ${VS_GHOST_TINT})`;
        st.style.opacity = g.lifted ? '0' : g.hi ? (1 - (1 - V.GHOST / V.PRINT_INK) * f).toFixed(3) : '1';   // highlighted row: its paper ink thins
        if (g.lifted && !wasLifted) { el.classList.remove('is-visited'); if (!g.replay) starHaptic('erase'); }
        if (!g.lifted && wasLifted) el.classList.add('is-visited');
        // Reduced motion has no sweep to hide the wider truncation under, so it
        // lands on the lift frame itself (the stamp and field go on that frame).
        if (rm) st.style.display = g.lifted ? 'none' : '';
      }
    }

    function vsCleanup(el, g) {
      el.classList.remove('vs-live');
      if (g.h3) setSlip(g, 0);   // defensive: the FLIP (or a cancel) should already be at rest
      starHeld.delete(g.id);
    }
    function vsXBack(el, g) {               // the X fades back; it is tappable only once it's fully there
      el.classList.remove('vs-xhide');
      // The guard lives on the ROW, not only the button: a re-render inside
      // the window (reduced motion's synchronous updateUI() with the not yet
      // flipped `locations`, a refetch) builds a fresh X, and renderCard()
      // re-arms it from here (xGuardRearm()).
      el.__xLiveAt = performance.now() + VISIT_SWIPE.XBACK_MS;
      const x = el.querySelector('.delete-btn');
      if (!x) return;
      x.style.pointerEvents = 'none';           // reduced motion too: it appears at once, but is live only after XBACK_MS
      const live = () => { x.style.pointerEvents = ''; };
      if (prefersReducedMotion() || !x.animate) { setTimeout(live, VISIT_SWIPE.XBACK_MS); return; }
      x.animate([{ opacity: 0 }, { opacity: 1 }], { duration: VISIT_SWIPE.XBACK_MS, easing: 'linear' }).finished.then(live, live);
    }

    function abortVisitDrag(el, g) { settleVisitDrag(el, g, false); }

    // POPUP -> ROW REPLAY. Mark Visited / Unmark in the popup plays the same
    // stamp on the place's list row, every time (not a teaching cap): visit =
    // a quick bleed, then the press frame (field + final truncation) and the
    // pop; un-visit = the erase lift, the pale-out, gone, then the reveal. It
    // is the gesture's own machinery driven by a timeline instead of a finger,
    // so every rule carries over (glyphs change only on the press/lift frame
    // or under the sweep; the row's re-render is held via starHeld, so a
    // refetch can't cut it short or replay it). It is started by the click,
    // never by a render, so it plays once. Only if the row is on screen;
    // otherwise, and under reduced motion, the state simply lands. No haptic
    // here: the popup tap already ticked (hapticTap()). Rapid toggles: the running replay is
    // finished at once (its final state lands), then the next one starts from
    // there -- last wins, no half states.
    const VS_REPLAY = { VISIT_MS: 240 };   // un-visit: the dry up (DRY.MS), see below
    function vsReplay(id) {
      if (prefersReducedMotion() || !currentUser) return false;   // signed out: the toggle won't happen, so neither does the stamp
      const entry = rowEntry(id), list = document.getElementById('locationsList'), sheet = document.getElementById('locations');
      if (!entry || !list || !entry.el.isConnected || (sheet && sheet.classList.contains('collapsed'))) return false;
      const held = starHeld.get(id);
      if (held && held.ff) held.ff();                          // last wins: land the running replay first
      if (starHeld.has(id)) return false;                      // a live gesture on this row owns it
      const el = entry.el, r = el.getBoundingClientRect(), lr = list.getBoundingClientRect();
      if (r.height === 0 || r.bottom <= lr.top || r.top >= lr.bottom) return false;   // off screen: the state just lands
      const g = { replay: true };
      if (!beginVisitDrag(el, g)) return false;
      const C = STAR_SWIPE.COMMIT;
      let pressed = false;
      const toPress = () => { if (pressed) return; pressed = true; g.raw = C; paintVisit(g); settleVisitDrag(el, g, true); };
      starHeld.get(id).ff = () => { toPress(); const h = starHeld.get(id); if (h && h.ff) h.ff(); };
      if (g.visited) {
        // Un-visit: the row's stamp dries up exactly as the tag's does, at its own size (.dry-out:
        // the CSS clock -> dryUp(), a separate visual step, never inside the gesture's painting),
        // and when the copy has cleared the row lifts (field drains) and settles.
        g.st.classList.add('dry-out');
        setTimeout(toPress, DRY.MS * 0.833);
      } else runTimeline(VS_REPLAY.VISIT_MS, t => { if (pressed) return; g.raw = C * t; paintVisit(g); }, toPress);
      return true;
    }

    // The mirror of flipToFinal(): the final row (final truncation, stamp
    // in or out) is laid out once, and the name + meta FLIP home from
    // wherever the finger (or the settle timeline) left them -- letters
    // never change on the frame the eye comes to rest. `mid` runs right
    // after the DOM swap, before the FLIP animates, for side effects that
    // must see the fresh DOM (the X's fade-back needs the new button).
    function flipVisitToFinal(el, g, nowVisited, ms, mid, done) {
      const oldH = textLeft(g.h3), oldMeta = g.meta.getBoundingClientRect().left;
      const loc = rowItem(g.id) || {};
      const fin = { ...loc, visited: nowVisited };
      renderCard(el, fin);
      const entry = rowEntry(g.id); if (entry) entry.signature = cardSignature(fin);
      g.h3 = el.querySelector('h3'); g.meta = el.querySelector('.row-meta'); g.main = el.querySelector('.row-main'); g.st = el.querySelector('.row-stamp');
      g.badge = el.querySelector('.row-badge');
      g.star = el.querySelector('.row-star');
      if (mid) mid();
      const dH = oldH - textLeft(g.h3), dM = oldMeta - g.meta.getBoundingClientRect().left;
      setSlip(g, dH, dM);
      runTimeline(ms, t => { const e = easeOut(t); setSlip(g, dH * (1 - e), dM * (1 - e)); }, done);
    }

    function settleVisitDrag(el, g, commit) {
      const C = STAR_SWIPE.COMMIT;
      g.state = 'settle';
      let dead = false;
      const nowVisited = commit ? !g.visited : g.visited;
      const finish = () => {
        if (dead) return; dead = true;
        g.popId = (g.popId || 0) + 1;
        if (!commit) {
          if (!g.visited) g.st.remove();
          else { g.st.classList.remove('vs-open'); g.st.style.transform = ''; g.st.style.opacity = ''; g.st.style.color = ''; g.st.style.display = ''; el.classList.add('is-visited'); }
          vsXBack(el, g); vsCleanup(el, g); updateUI();
          return;
        }
        // vs-live (and the row-star hide it carries) stays through the
        // whole FLIP -- only vsCleanup(), once the name is truly at rest,
        // removes it (the star's own releaseStarRow() does the same).
        flipVisitToFinal(el, g, nowVisited, STAR_SWIPE.SETTLE,
          () => { el.classList.add('vs-xhide'); vsXBack(el, g); },
          () => { vsCleanup(el, g); updateUI(); });
      };
      const held = starHeld.get(g.id); if (held) held.ff = () => finish();
      if (commit) {
        if (!g.replay) toggleLocationFlag(g.id, 'visited');      // optimistic; this row's re-render is held -- we lay it out ourselves (a popup replay's caller toggles)
        if (!g.visited && !g.pressed) {           // a flick: the ring finishes closing, then the stamp lands
          const r0 = g.raw, ms = Math.max(60, (C - r0) / 0.6);
          runTimeline(ms, t => { if (dead) return; g.raw = r0 + (C - r0) * t; paintVisit(g); }, () => { if (dead) return; g.raw = C; paintVisit(g); setTimeout(finish, prefersReducedMotion() ? 0 : VISIT_POP_MS + 20); });
          return;
        }
        if (!g.visited) {                          // let the pop land -- the X stays away until it has
          const left = prefersReducedMotion() ? 0 : Math.max(0, VISIT_POP_MS + 20 - (sgNow() - (g.pressT || 0)));
          setTimeout(finish, left);
          return;
        }
        finish();
        return;
      }
      // cancel: the cue retracts, no ink (visit), or the stamp re-inks (un-visit)
      const r0 = g.raw;
      runTimeline(VISIT_SWIPE.RETURN_MS, t => { if (dead) return; g.raw = r0 * (1 - easeOut(t)); paintVisit(g); }, finish);
    }

    // POPUP -> ROW STAR REPLAY (owner: "Star animation should go both ways").
    // Setting OR clearing the star in the popup plays the row's own mark on
    // the place's list row, every time -- vsReplay()'s rules exactly: started
    // by the click, never by a render, so it plays once; the row's re-render
    // is held (starHeld), so a refetch can't cut it short or replay it; only
    // if the row is on screen; last wins (a running replay lands its final
    // state at once, then the next starts from there); reduced motion or
    // signed out: no replay, the state just lands. No haptic here: the
    // popup tap already ticked (hapticTap()).
    //   Star = pencil, then ink (the row's grammar: a row star is always
    //     pencilled; only the popup, where the outline is already printed,
    //     fades): the name steps 30px aside (clear of the sketch), five
    //     strokes at hand speed (HAND_MS), the ink lands with STAR_POP and the
    //     name docks while it moves (FLIP). ~430ms to ink, rest ~810ms.
    //   Unstar = the row's full erase: the star lifts (STAR_ERASE_POP), is
    //     rubbed out over RUB_MS (colour first, grain, erosion, the ghost),
    //     the ghost vanishes and the dust is swept off as the name moves home
    //     (FLIP). ~620ms.
    // (Replaces the 2-per-device teaching replay and its localStorage key.)
    const SS_REPLAY = { SLIP: 30, SLIP_MS: 120 };
    try { localStorage.removeItem('triplet.pencilStarTaught'); } catch (_) {}   // the old teaching counter: never read again
    function ssReplay(id) {
      if (prefersReducedMotion() || !currentUser) return false;
      const entry = rowEntry(id), list = document.getElementById('locationsList'), sheet = document.getElementById('locations');
      if (!entry || !list || !entry.el.isConnected || (sheet && sheet.classList.contains('collapsed'))) return false;
      const held = starHeld.get(id);
      if (held && held.ff) held.ff();                          // last wins: land the running replay first
      if (starHeld.has(id)) return false;                      // a live gesture on this row owns it
      const el = entry.el, r = el.getBoundingClientRect(), lr = list.getBoundingClientRect();
      if (r.height === 0 || r.bottom <= lr.top || r.top >= lr.bottom) return false;   // off screen: the state just lands
      const loc = rowItem(id);
      if (!loc) return false;
      el.classList.remove('active');
      const m = mountPencilStar(el, loc);
      if (!m) return false;
      const was = !!loc.starred, g = { ...m, id, starred: was, off: 0, replay: true };
      let dead = false;
      const done = () => { if (dead) return; dead = true; releaseStarRow(el, g, true); updateUI(); };
      starHeld.get(id).ff = () => {
        if (dead) return; dead = true;
        releaseStarRow(el, g, true);
        el.querySelectorAll('.sg-crumb').forEach(c => c.remove());
        const park = document.createElement('div'); g.h3 = g.meta = g.main = park;   // a running FLIP's late frames now move nothing
        const fin = { ...(rowItem(id) || loc), starred: !was };
        renderCard(el, fin);
        const e2 = rowEntry(id); if (e2) e2.signature = cardSignature(fin);
        updateUI();
      };
      const t0 = sgNow();
      if (!was) {
        const step = () => {
          if (dead) return;
          const ms = sgNow() - t0, out = Math.min(1, ms / SS_REPLAY.SLIP_MS), k = 0.5 - 0.5 * Math.cos(Math.PI * out);
          setSlip(g, SS_REPLAY.SLIP * k, SS_REPLAY.SLIP * k);
          const p = Math.max(0, Math.min(1, (ms - SS_REPLAY.SLIP_MS) / STAR_SWIPE.HAND_MS));
          g.ps.draw(g.strokes[0] + (50 - g.strokes[0]) * p);
          if (ms >= SS_REPLAY.SLIP_MS + 10 + STAR_SWIPE.HAND_MS) {
            g.ps.draw(STAR_SWIPE.COMMIT); g.ps.ink(true);
            flipToFinal(el, g, true, 190, () => setTimeout(done, Math.max(0, STAR_POP_MS + 20 - 190)));
            return;
          }
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      } else {
        starErasePop(g.svg);
        runTimeline(STAR_SWIPE.RUB_MS, t => { if (!dead) g.ps.rub(STAR_SWIPE.COMMIT * t); }, () => {
          if (dead) return;
          g.ps.rub(STAR_SWIPE.COMMIT); starCrumbs(g);
          flipToFinal(el, g, false, STAR_SWIPE.SETTLE, done);
        });
      }
      return true;
    }

    // Popup unstar (owner: the outline is already there, so no drawing in
    // the popup): the ink fades off the outline as the star lifts, 240ms.
    let popupRubId = null;   // popup star just cleared: fade out + erase lift ONCE (CSS .sgp-out)

    // The check printed in the stamp's ring, before the word (owner: keep the check and the text). The same filled check
    // as the pins' (STICKER_CHECK.row), in the ring's own ink.
    function stampCheckSvg() { return `<svg class="row-stamp-check" viewBox="0 0 24 24" aria-hidden="true"><path d="${STICKER_CHECK.row.d}" fill="currentColor"/></svg>`; }
    // RANDOMIZED, SEEDED PER PLACE AND PER ITEM (owner 2026-10-08: "yes but angle and texture (on
    // all textured items) should be randomized"; then, on seeding rather than re-rolling: "yes that
    // logic makes sense"). Every stamp's angle and every inked item's texture patch is drawn from
    // seedRand(place id, item): it looks random -- no two places, and no two items on one tag,
    // share an angle or a patch -- but it is the same on every render, so nothing jumps when a tag
    // re-renders (star tap, the 10s poll) or a row refreshes (UX: no wobble). Never Math.random.
    // If the owner wants a fresh roll per render instead, this is the one place to change.
    function seedRand(id, item) {   // 0..1, a murmur-style mix of an FNV-1a hash of `id#item`
      let h = 2166136261;
      for (const ch of String(id) + '#' + item) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
      h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
      return (h >>> 0) / 4294967296;
    }
    // A lean in +-[min, max] deg, either way, seeded.
    const seededLean = (id, item, min, max) => (seedRand(id, item + ':s') < 0.5 ? -1 : 1) * +(min + (max - min) * seedRand(id, item + ':m')).toFixed(2);
    // The VISITED stamp's angle (rows and the tag; the visit gesture's replay reads it too): any lean
    // in +-[2, 5]deg -- the old six-bucket envelope (+-2 / 3.5 / 5), now continuous. Nothing under
    // 2deg (it reads as straight/unstamped); at 5deg the rotated row stamp (74.5 x 38.2) stays
    // >= 10.7px clear of the delete X and >= 8.4px inside the row (measured with the buckets).
    function stampTilt(id) { return seededLean(id, 'visited', 2, 5); }
    // The map stickers keep their own lean (half of the old bucketed stamp lean): they are not
    // inked, so the randomization doesn't reach them, and pins stay exactly as shipped.
    const STICKER_TILTS = [-5, -3.5, -2, 2, 3.5, 5];
    function stickerLean(id) { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) | 0; return STICKER_TILTS[Math.abs(h) % STICKER_TILTS.length] / 2; }
    // The tag's stamped TYPE / PLAN entries: any lean in +-[3, 4.5]deg (round 2's range), seeded per
    // item ('type', 'n', 'm'), resampled until it is >= 1deg from this place's VISITED angle and from
    // its mirror, so no two stamps on one tag read as a matched pair.
    function typeTilt(id, salt) {
      const item = ['type', 'n', 'm'][salt || 0] || 'x' + salt, v = stampTilt(id);
      for (let k = 0; k < 8; k++) {
        const t = seededLean(id, item + k, 3, 4.5);
        if (Math.abs(t - v) >= 1 && Math.abs(t + v) >= 1) return t;
      }
      return Math.abs(v) >= 4 ? 3 : 4.5;   // never reached in practice (8 seeded tries); still >= 1deg from v and -v
    }
    // An inked item's own patch of its texture tile: an offset anywhere in the tile and a size within
    // +-spread of the base, seeded per place and item. Returned as inline custom properties
    // (--tx, --ty, --ts) that the item's mask / background reads.
    function texVars(id, item, base, spread) {
      const x = (seedRand(id, item + ':x') * base).toFixed(1), y = (seedRand(id, item + ':y') * base).toFixed(1);
      const sz = (base * (1 - spread + 2 * spread * seedRand(id, item + ':z'))).toFixed(1);
      const fd = ((seedRand(id, item + ':f') < 0.5 ? 98 : 278) + (seedRand(id, item + ':g') - 0.5) * 16).toFixed(1);   // stamps: which end was pressed harder, and the falloff's slant
      return `--tx:${x}px;--ty:${y}px;--ts:${sz}px;--fd:${fd}deg`;
    }

    // A ledger row, not a card: 28px glyph | 1fr content | action cluster.
    // The category ink lives in the glyph; the metadata line reads
    // CATEGORY · CITY in --ink-2. Visited shows as a stamp at the head of
    // the action cluster (see .row-stamp), at a fixed x so the list scans
    // as a column; the .sr-only text in .row-meta is its accessible name.
    function renderCard(el, loc) {
      // Visited rows recede (.is-visited) -- see the DONE block in the CSS.
      // Safe here: renderCard() re-runs whenever cardSignature() changes,
      // and that signature includes loc.visited.
      el.classList.toggle('is-visited', !!loc.visited);
      el.classList.toggle('is-starred', !!loc.starred);
      // A district/street (shapeRowItem()): the same row, its badge a DIAMOND in
      // its own ink -- the shape, not the colour, tells it apart from a pin.
      const sh = loc.shapeId != null;
      const ink = sh ? (loc.color || categoryInk(loc.category)) : categoryInk(loc.category);
      const city = loc.city && CITIES[loc.city] ? CITIES[loc.city].label : loc.city;
      const dist = distanceLabel(loc);   // Nearest only: the distance leads the meta
      const stop = sh ? planMarks().byShape.get(loc.shapeId) : planMarks().byLoc.get(loc.id);   // Plans: the number leads, then the icon; × removes from the plan
      el.classList.toggle('plan-num-row', inPlanView() && !!activePlan() && !!stop);
      const stamp = loc.visited
        ? `<span class="row-stamp" style="--stamp-tilt:${stampTilt(loc.id)}deg" aria-hidden="true"><span class="row-stamp-ring">${stampCheckSvg()}<span class="row-stamp-word">Visited</span></span></span>`
        : '';
      el.innerHTML = `
        ${planLead(stop, loc.category, sh ? 'diamond' : markerKind(loc), ink, loc.name)}
        <div class="row-main">${loc.starred ? '<svg class="row-star" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star-fill"/></svg>' : ''}
          <h3>${escapeHtml(loc.name)}</h3>
          <div class="row-meta">${dist ? `<span class="row-dist">${escapeHtml(dist)}</span> &middot; ` : ''}${escapeHtml(categoryLabel(loc.category))}${city ? ' &middot; ' + escapeHtml(city) : ''}<span class="sr-only">${loc.starred ? ', starred' : ''}${loc.visited ? ', visited' : ', not visited yet'}</span></div>
        </div>
        <div class="location-actions">
          ${stamp}${rowActionHtml(stop, loc.name)}
        </div>
      `;
      xGuardRearm(el);
    }
    // vsXBack()'s 120ms "not live yet" guard, carried onto a freshly rendered X.
    function xGuardRearm(el) {
      const left = (el.__xLiveAt || 0) - performance.now();
      if (left <= 0) return;
      const x = el.querySelector('.delete-btn');
      if (!x) return;
      x.style.pointerEvents = 'none';
      setTimeout(() => { x.style.pointerEvents = ''; }, left);
    }

    // ---- neighborhood shape list cards ---------------------------------------
    // A shape's row is a pin's row (createCard()/renderCard() on its
    // shapeRowItem(): every gesture, the stamp, the star, delete safety), with
    // its own diamond badge and TYPE · CITY meta; framed by bounds, not a point
    // -- see focusShape(). syncPlacesList() places them after their section's pins.
    function focusShape(shapeId) {
      const nb = neighborhoodShapes.find(n => n.id === shapeId);
      if (!nb) return;

      noteInteraction();
      // Fit the shape, but never land below neighborhoodMinZoom(): the
      // map layer (and so its popup) doesn't exist under that zoom, so a
      // fit that settled there would show nothing and open nothing. A
      // shape small enough to fit below its min zoom is now framed AT its
      // min zoom instead ("zoom in enough to actually see the thing").
      const bounds = L.latLngBounds(nb.geometry).pad(0.15);
      const center = bounds.getCenter();
      const zoom = Math.min(map.getMaxZoom(),
        Math.max(map.getBoundsZoom(bounds), neighborhoodMinZoom(nb)));
      openPopupOnArrival(center, zoom,
        () => neighborhoodLayersById.get(shapeId),
        () => {
          if (prefersReducedMotion()) {
            map.setView(center, zoom, { animate: false });
          } else {
            map.flyTo(center, zoom, { duration: 0.5 });
          }
        });
    }

    // Chips are ink-on-paper with the category glyph, never white-on-category
    // -colour (which measured 1.80:1 on the old palette). The ink arrives as
    // --chip-ink so the `.inactive` rule can override it without !important,
    // and ONLY the bottom rule changes between states -- contrast is constant,
    // so all 13 stay AA whatever their ink.
    function createFilters() {
      const container = document.getElementById('filters');
      container.innerHTML = Object.keys(CATEGORY_COLORS).map(cat => `
        <button class="filter-btn" id="filter-${cat}" style="--chip-ink: ${CATEGORY_COLORS[cat]}">
          <span class="chip-glyph">${glyphHtml(cat, 12)}</span>${escapeHtml(categoryLabel(cat))}
        </button>
      `).join('');

      Object.keys(CATEGORY_COLORS).forEach(cat => {
        document.getElementById(`filter-${cat}`).onclick = () => {
          noteInteraction();
          filters.categories[cat] = !filters.categories[cat];
          const btn = document.getElementById(`filter-${cat}`);
          if (filters.categories[cat]) {
            btn.classList.remove('inactive');
          } else {
            btn.classList.add('inactive');
          }
          updateUI();
          if (inPlanView()) { showPlanRule(); frameActivePlan(); }   // Plans: land on what the chip changed
        };
      });
    }

    // An explicit "clear filters" control would call this. setActiveCity must
    // never call it: category filters are a statement of intent, orthogonal to
    // geography, and survive a city switch untouched.
    function resetCategoryFilters() {
      Object.keys(CATEGORY_COLORS).forEach(cat => {
        filters.categories[cat] = true;

    function inPlansNote(match) {

    // THE ADD TAG (add-tag-jam phase 2; design/add-tag-jam/handoff.md "Phase 2", the blank-tag

    // Tap +: the list drops to its band, the map is washed back and a blank place tag sits in the

    // =========================================================================
    const ADD_TYPES = Object.keys(CATEGORY_COLORS);   // the locked list, in its order (shapes last)
    const ADD_TYPE_DEFAULT = 'restaurant';   // today's form default, kept: TYPE before a pick (or a pick with no match)
    const ADD_PICK_ZOOM = 16, ADD_PICK_ZOOM_SHAPE = 14;   // a pick shows the place at least this close
    const ADD_PIN_ABOVE = TAG_HANG + 16;     // the pin's top above the tag's top (the string + the 32px pin's radius)
    // The draft. city: { id } (one of CITIES) or { newCity: { label, details, lat, lng } } (ADD makes

    // guess (today's userOverrodeCity, and its TYPE twin).
    const addDraft = { pick: null, city: null, cityHand: false, type: ADD_TYPE_DEFAULT, typeHand: false, starred: false, visited: false };
    let addRestore = null;    // { collapsed, scroll, tag } while the tag is up
    let addView = null;       // the map's view when + was tapped (cancel goes back to it)

    const addFormOpen = () => !document.getElementById('addForm').hidden;
    const addPicked = () => !!addDraft.pick;

    // Rows per design/icon-system/categories-design-calls.md 6 (2026-10-30). Airports, stations,
    // terminals and place=locality have no row on purpose: null = TYPE stays as it was.
    const OSM_TYPE_TABLE = [
      ['hotel', { tourism: ['hotel', 'hostel', 'guest_house', 'motel', 'apartment', 'chalet', 'alpine_hut', 'camp_site'] }],
      ['restaurant', { amenity: ['restaurant', 'fast_food', 'food_court'] }],
      ['cafe', { amenity: ['cafe', 'ice_cream'], shop: ['bakery', 'pastry', 'coffee'] }],
      ['venue', { amenity: ['theatre', 'arts_centre', 'cinema', 'nightclub', 'music_venue', 'events_venue', 'concert_hall'], leisure: ['stadium'] }],
      ['bar', { amenity: ['bar', 'pub', 'biergarten'], craft: ['brewery', 'distillery'] }],
      ['museum', { tourism: ['museum', 'gallery'], shop: ['art'] }],
      ['attraction', { tourism: ['attraction', 'zoo', 'aquarium', 'theme_park'], historic: ['castle'],
        amenity: ['public_bath', 'spa'],
        leisure: ['swimming_pool', 'sports_centre', 'water_park', 'resort', 'beach_resort', 'spa', 'sauna'] }],
      ['landmark', { tourism: ['artwork'], historic: '*', amenity: ['place_of_worship', 'townhall', 'fountain'],
        man_made: ['lighthouse', 'tower'], place: ['square', 'plaza'] }],
      ['park', { leisure: ['park', 'garden', 'playground', 'dog_park'], landuse: ['cemetery'], amenity: ['grave_yard'] }],
      ['nature', { natural: '*', water: '*', leisure: ['nature_reserve', 'beach'], boundary: ['national_park', 'protected_area'], waterway: ['waterfall'], tourism: ['viewpoint'] }],
      ['shopping', { shop: '*', amenity: ['marketplace'] }],
      ['neighborhood', { place: ['suburb', 'quarter', 'neighbourhood'] }]

    }

    // ---- the city ----
    const cityKey = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

    // empty city can still be guessed and a nearby place never duplicates it. None in reach: the
    // real town as a NEW city (ADD makes it), or the existing city of that name. No town in the
    // details (or no details): null, the caller's cue to reverse-geocode the point
    // (guessCityAt()). Boxes no longer file anything: a seeded city's box decides only the
    // distance note.
    const CITY_REACH_KM = 70;   // (we think) one constant, never a setting
    function guessCity(lat, lng, details) {
      const near = rankCitiesByProximity([lat, lng], CITY_REACH_KM)[0];
      if (near) return { id: near.cityId };
      const town = townOf(details);
      if (town && details.country_code) {
        const same = Object.keys(CITIES).find(id => cityKey(CITIES[id].label) === cityKey(town));

      return g || nearestCityAnywhere(lat, lng);

    const addCityIsNew = () => !!(addDraft.city && addDraft.city.newCity);

    function newTownOption(details, lat, lng) {

    // ---- rendering ----
    function addStubHtml(anim = {}) {

    function renderAddStub(anim) {

    function addOpenArea() {

    // any screen and mid-slide.
    function syncFiltersLift() {
      const panel = document.getElementById('filtersPanel'), btn = document.getElementById('floatingAddBtn'), root = document.documentElement;
      const size = parseFloat(getComputedStyle(root).getPropertyValue('--add-size')) || 60;
      let lift = 0, top = false;

        // Layout only (offsetTop / offsetHeight ignore transforms); the resting foot is the same
        // whatever the box's current size (bottom-anchored).

        const boxTop = panel.offsetTop - gap - size;

        // resting box (rendered box minus its own, maybe mid-move, transform). Without a shown
        // account badge, the slot from its tokens (--account-slot-right: --s4; top --s4 +
        // --chrome-top-inset).

    // ---- THE HANGING TAG'S CITY (add-tag-jam phase 3, "the city-bucket model") ------------------
    // The routing line's city opens the add tag's city menu (cityMenuHtml(): your cities, then "New

    function tagNewTown(key) {

    }

    // Rollback is per write: only when the place still shows this write's city. Into a hidden city,
    // the city is shown first (revealCity()) -- only when the place would otherwise vanish with its

    async function setPlaceCity(key, cityId) {

    }
    // Is the place listed whatever its city's eye says? Only a plan's stops are (visibleLocations() /

    function placeListedAnyCity(key) {

    // nothing moves), then the move. A move that then fails leaves the new city empty, and
    // setPlaceCity()'s cleanup removes it.
    async function movePlaceToNewCity(key, town) {
      if (!await requireAuth()) return false;
      const cfg = await deriveNewCityConfig(town.details, town.lat, town.lng);
      if (!cfg || !await addCity(cfg)) return false;
      return setPlaceCity(key, cfg.id);
    }

    // ---- the tag's open / close choreography --------------------------------
    // Open: the map pans the pin to just under the top controls, the list
    // sheet LOWERS only as far as the whole tag needs, with tagSheetGap() of
    // map below it (owner 2026-10-07: "i dont like closing the list when a tag
    // is open now -- it should just adjust height if it needs to (with a good
    // amount of padding below the tag."); if the tag already fits, the list
    // doesn't move. Never below TAG_LIST_MIN of list (its header + one row):
    // a taller tag scrolls inside instead. Then the tag pops out of the pin;
    // its taps go live once the pan and the lowering are done. Close (x, a

    // had. A list you collapsed yourself stays collapsed. A tap on another
    // pin swaps tags in one tap (the list re-fits to the new tag).
    let tagSession = null, tagRestoreTimer = 0, tagLiveTimer = 0, tagPopTimer = 0, tagDot = null, tagSlipOn = false;

    let tagKeyInput = false;

    ['pointerdown', 'touchstart', 'mousedown'].forEach(t => document.addEventListener(t, () => { tagKeyInput = false; }, { capture: true, passive: true }));

    const tagOpenNow = () => !!(map._popup && map.hasLayer(map._popup) && isTagPopup(map._popup));
    // The row key (rowItem()) of the place whose tag is open, or null.
    function openTagKey() {
      if (!tagOpenNow()) return null;
      const src = map._popup._source;
      if (!src) return null;
      if (src.locationId != null) return src.locationId;
      for (const [sid, layer] of neighborhoodLayersById) if (layer === src) return shapeKey(sid);
      return null;
    }
    window.addEventListener('click', (e) => {
      // The slip's first outside tap only dismisses it: it never closes the tag or reaches the map.
      if (!tagSlipOn) return;
      const t = e.target, inTag = t.closest && t.closest('.tag-popup');
      if (!inTag) { e.stopImmediatePropagation(); e.preventDefault(); hideTagSlip(); return; }
      if (!t.closest('.tag-slip') && !(t.closest('.popup-star, .popup-visited, .tag-city') && t.closest('[aria-disabled="true"]'))) hideTagSlip();
    }, true);
    function showTagSlip() {
      const p = tagOpenNow() && map._popup, c = p && p.getElement();
      const s = c && c.querySelector(':scope > .tag-slip');
      if (!s) return;
      if (!s.firstChild) s.innerHTML = '<span>Sign in to make changes</span><button type="button">Sign in</button>';
      tagSlipOn = true;
    }
    function hideTagSlip() {
      tagSlipOn = false;
      document.querySelectorAll('.tag-slip').forEach(s => { s.textContent = ''; });
    }
    function tagFit(popup) {
      // Only a tag taller than the map can give it (after the list has lowered as far as it may) scrolls inside, with a fade.
      const c = popup.getElement(), inn = c && c.querySelector('.tag-in');
      if (!inn) return;
      inn.style.maxHeight = ''; inn.classList.remove('scrolls');
      const mapR = map.getContainer().getBoundingClientRect(), r = c.getBoundingClientRect();
      const over = r.bottom + tagSlipRoom() - (mapR.bottom - tagSheetGap(popup));
      if (over > 0 && !c.classList.contains('tag-wait')) { inn.style.maxHeight = Math.max(120, inn.offsetHeight - over) + 'px'; inn.classList.add('scrolls'); }
    }
    const tagSlipRoom = () => currentUser ? 0 : 52;   // signed out: room for the sign-in slip (44px button + 2 x 1px rule) + its 6px gap
    TagPopup.include({ _adjustPan() { if (this._map && this._container && !this._container.classList.contains('tag-wait')) tagFit(this); } });
    // The sheet lowered by `px` (0 = where it was): --sheet-lower moves #locations
    // down and lengthens #mainContent by the same amount, so the map meets the
    // sheet's new top edge. The map's height snaps; its top-left stays fixed.
    function setSheetLower(px) {
      const v = Math.max(0, Math.round(px)) + 'px';
      if (document.documentElement.style.getPropertyValue('--sheet-lower') === v) return;
      document.documentElement.style.setProperty('--sheet-lower', v);
      map.invalidateSize({ pan: false });
      if (typeof placePlanSlip === 'function') placePlanSlip();
    }
    function sheetIsCollapsed() { return document.getElementById('locations').classList.contains('collapsed'); }
    // How far the sheet must lower for this tag (pin at its open position).
    function tagSheetNeed(popup) {
      if (railQuery.matches || sheetIsCollapsed()) return 0;
      const c = popup.getElement(), cur = parseFloat(document.documentElement.style.getPropertyValue('--sheet-lower')) || 0;
      const inn = c.querySelector('.tag-in'); if (inn) { inn.style.maxHeight = ''; inn.classList.remove('scrolls'); }   // measure the whole tag
      const mapH = map.getSize().y - cur;   // the map's height with the sheet where the user left it
      const bottom = pinPopupTopPad() + 2 * tagPinRadius(popup) + c.offsetHeight + tagSlipRoom();
      const sheetH = document.getElementById('locations').getBoundingClientRect().height;
      return Math.min(Math.max(0, bottom + tagSheetGap(popup) - mapH), Math.max(0, sheetH - TAG_LIST_MIN));
    }
    function showTagDot(popup) {
      const src = popup._source;
      if (!src || src.locationId != null || !src.options) return;
      const ink = src.options.color || '#5A564C';
      // While the tag is open the dot is the close (the 28px disc, CSS): a 44px target, not keyboard-
      // reachable (the tag's own .tag-x is the accessible close).
      tagDot = L.marker(popup.getLatLng(), { interactive: true, keyboard: false, bubblingMouseEvents: false, zIndexOffset: Z_PIN_STARRED - 200,
        icon: L.divIcon({ className: 'tag-dot', iconSize: [44, 44], iconAnchor: [22, 22],
          html: `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="var(--paper)"/><circle cx="7" cy="7" r="4" fill="${escapeAttr(ink)}"/></svg>` }) }).addTo(map);
      tagDot.on('click', ev => { L.DomEvent.stop(ev); if (map._popup === popup) map.closePopup(); });
    }
    function tagOpened(popup) {
      clearTimeout(tagRestoreTimer); clearTimeout(tagLiveTimer); clearTimeout(tagPopTimer);
      hideTagSlip();
      if (tagDot) { map.removeLayer(tagDot); tagDot = null; }
      map.getContainer().classList.add('tag-is-open');   // the open tag's pin (or dot) shows it is the close
      const c = popup.getElement(), list = document.getElementById('locationsList');
      if (!tagSession) tagSession = { scroll: list.scrollTop, focus: document.activeElement };
      // Selection follows the tag (UX): a pin opened from the map selects its pin and row exactly
      // as a list tap does; a district/street (no selectable row) clears it -- a navy row never
      // names a different place than the open tag.
      const src = popup._source, selId = src && src.locationId != null ? src.locationId : null;
      const fromMap = selId != null && highlightedId !== selId;   // a list tap selects its row before the tag opens (highlightMarker())
      setHighlighted(selId);
      const reduced = prefersReducedMotion();
      c.classList.remove('tag-pop'); c.classList.add('tag-wait');
      if (!currentUser && !c.querySelector(':scope > .tag-slip')) {   // the live region exists before it speaks
        const s = document.createElement('div'); s.className = 'tag-slip'; s.setAttribute('role', 'status'); s.setAttribute('aria-live', 'polite'); c.appendChild(s);
      }
      let wait = 0;
      const before = parseFloat(document.documentElement.style.getPropertyValue('--sheet-lower')) || 0, need = tagSheetNeed(popup);
      setSheetLower(need);
      if (Math.abs(need - before) > 1 && !reduced) wait = TAG_SHEET_MS;
      // Compressed list: its one full row is the selected place's (owner: "the list item in view
      // should be the one selected"); the half row under it says it scrolls.
      if (need > 0 && highlightedId) {
        const en = rowEntry(highlightedId);
        if (en && en.el && en.el.isConnected) list.scrollTop += en.el.getBoundingClientRect().top - list.getBoundingClientRect().top;
      } else if (fromMap && !sheetIsCollapsed()) {
        // List where it was (not lowered): a pin tapped on the MAP scrolls the list just enough that
        // its navy row is fully in view (Impeccable C3, owner: "yes"). The tag and the map don't
        // move; close restores the list's scroll (tagSession).
        const en = rowEntry(selId);
        if (en && en.el && en.el.isConnected && list.clientHeight > 0 && list.contains(en.el)) {
          const lr = list.getBoundingClientRect(), r = en.el.getBoundingClientRect();
          const under = listSpacer.offsetHeight;   // the sheet runs under the toolbar / home indicator (--sheet-under)
          const top = lr.top, bottom = lr.bottom - under;
          if (r.top < top || r.height > bottom - top) list.scrollTop += r.top - top;
          else if (r.bottom > bottom) list.scrollTop += r.bottom - bottom;
        }
      }
      showTagDot(popup);
      const size = map.getSize(), p = map.latLngToContainerPoint(popup.getLatLng());
      const d = p.subtract(L.point(size.x / 2, pinPopupTopPad() + tagPinRadius(popup)));
      if (Math.abs(d.x) > 1 || Math.abs(d.y) > 1) {
        map.panBy(d, { animate: !reduced, duration: TAG_PAN_MS / 1000, easeLinearity: 0.35 });
        if (!reduced) wait = Math.max(wait, TAG_PAN_MS + 20);
      }
      const live = () => {
        if (map._popup !== popup || !map.hasLayer(popup)) return;
        c.classList.remove('tag-wait');
        tagFit(popup);
        if (!reduced) { c.classList.add('tag-pop'); tagPopTimer = setTimeout(() => c.classList.remove('tag-pop'), TAG_POP_MS + 40); }
        const t = c.querySelector('.tag');
        if (t) { t.classList.toggle('kbd-open', tagKeyInput); t.focus({ preventScroll: true }); }   // VoiceOver: into the tag; .kbd-open: the keyboard-only focus look (A2)
      };
      if (wait) tagLiveTimer = setTimeout(live, wait); else live();
    }
    function tagClosed(popup) {
      clearTimeout(tagLiveTimer); clearTimeout(tagPopTimer);
      closeTagCityMenu(false);
      hideTagSlip();
      map.getContainer().classList.remove('tag-is-open');
      const c = popup.getElement(); if (c) c.classList.remove('tag-wait', 'tag-pop');
      if (tagDot) { map.removeLayer(tagDot); tagDot = null; }
      clearTimeout(tagRestoreTimer);
      tagRestoreTimer = setTimeout(() => {   // a swap opens the next tag in this same dispatch: then nothing is restored
        if (tagOpenNow()) return;
        const s = tagSession; tagSession = null;
        setSheetLower(0);
        setHighlighted(null);   // closing the tag ends the selection (UX)
        if (!s) return;
        const list = document.getElementById('locationsList');
        if (!sheetIsCollapsed()) list.scrollTop = s.scroll;
        const a = document.activeElement;   // VoiceOver: back out to where focus was
        if (s.focus && s.focus.isConnected && s.focus !== document.body && (!a || a === document.body || a === map.getContainer() || (c && c.contains(a)))) s.focus.focus({ preventScroll: true });   // (the closing tag fades out still holding focus)
      }, 0);
    }
    // Esc closes the tag wherever focus is inside it (Leaflet's own Esc only listens while the map
    // container itself has focus); not while the sign-in sheet is up.
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape' || !tagOpenNow() || document.getElementById('authModal').classList.contains('show')) return;
      e.preventDefault();
      if (tagCityMenuOpen()) { closeTagCityMenu(true); return; }   // the city menu first
      map.closePopup();
    });
    map.on('popupopen', e => { if (isTagPopup(e.popup)) tagOpened(e.popup); });
    map.on('popupclose', e => { if (isTagPopup(e.popup)) tagClosed(e.popup); });
    // Signing in or out re-renders every tag (live vs greyed controls); the open one stays open.
    function refreshTags() {
      if (!map) return;
      markersById.forEach(en => { en.marker.setPopupContent(buildPopupHtml(en.loc)); });
      neighborhoodLayersById.forEach((layer, id) => { const nb = neighborhoodShapes.find(n => n.id === id); if (nb) layer.setPopupContent(shapePopupHtml(nb)); });
      if (currentUser) { hideTagSlip(); document.querySelectorAll('.tag-popup > .tag-slip').forEach(s => s.remove()); }
    }

    // Initialize auth and set up auth state listener
    supabaseClient.auth.onAuthStateChange((event, session) => {
      // Signed out (a session that could no longer refresh, or another tab signing out):
      // boot again as the playground at once. A sign-out this tab started (logout()) waits
      // for its dry-up and reloads itself.
      if (!PLAYGROUND && event === 'SIGNED_OUT') { if (!signOutInFlight) location.reload(); return; }
      currentUser = session?.user || null;
      updateAuthUI();

      // Signed in elsewhere (another tab) while the sheet is open: close it. This tab's own
      // sign-in (loginInFlight) closes it itself, with the Strike.
      if (event === 'SIGNED_IN' && !loginInFlight && document.getElementById('authModal').classList.contains('show')) {
        hideAuthModal();
      }
    });

    // Signed out is known synchronously in the playground: the sign-in badge is there from the
    // first paint. Real mode waits for checkAuth() to confirm the stored session.
    if (PLAYGROUND) setAccountBadge('signin');
    // Check auth on page load
    checkAuth();

    // The list's scroll gradient listener is attached ONCE, here — not inside a
    // renderer, where it used to leak one listener per poll tick.
    const locationsListEl = document.getElementById('locationsList');
    locationsListEl.addEventListener('scroll', () => {
      const on = locationsListEl.scrollTop > 0;
      locationsListEl.classList.toggle('scrolling', on);
      document.getElementById('locations').classList.toggle('list-scrolled', on);   // the header's scroll shadow (no :has())
    }, { passive: true });

    // Persistent tail elements of the list, kept last by updateUI().
    const listSpacer = document.createElement('div');
    listSpacer.className = 'location-list-spacer';
    const locationsEmptyEl = document.createElement('div');
    locationsEmptyEl.className = 'locations-empty';
    locationsEmptyEl.id = 'locationsEmpty';
    // One of the few screens with nothing to be efficient about, so it gets
    // the space: 48px of padding and a 28px glyph.
    locationsEmptyEl.innerHTML =
      '<svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><use href="#g-compass"/></svg>Nothing here yet.';
    locationsEmptyEl.style.display = 'none';
    locationsListEl.appendChild(locationsEmptyEl);
    locationsListEl.appendChild(listSpacer);


    hiddenCities = readHiddenCities();
    createFilters();
    restorePlanPrefs();
    initPlans();

    // Sole entry point for city state. On cold start there is nothing to
    // animate away from, so framing is instant.
    // Returning device: the last viewed city (or All cities), exactly as stored.
    // First open (nothing stored, and not an auth hop): see startFirstOpen().
    const restoredCity = restoreCitySelection();          // cityId | ALL_CITIES | null
    const firstOpen = restoredCity === null && !authHop ? startFirstOpen() : null;
    setActiveCity(restoredCity ?? DEFAULT_CITY, { animate: false, persist: !firstOpen, reveal: false });   // a restore, not a go-to: a hidden city stays hidden

    Promise.all([fetchLocations(), fetchNeighborhoodShapes(), fetchCities(), fetchPlans()])
      .then(() => {
        placesLoaded = true;
        updateUI(); applySectionScroll();   // the go-to city's section exists now: the list lands on it
        if (firstOpen) firstOpen.dataLoaded();
        if (inPlanView()) frameActivePlan(); cleanupOrphanCities();
        // Just hopped (signed in or out): land where you were -- the view, and the open tag.
        if (authHop) { try { restoreHopView(authHop.view); } catch (e) { /* the default view stands */ } }
      })
      .finally(() => bootLoaded());   // the arrival's hold waits for this (then a beat), capped at ARRIVAL.CAP_MS
    startPoll();

    // The bottom sheet becomes a left rail at >=900px (see the media query).
    // Leaflet has to be told its container changed size when that flips; the
    // inline `bottom` the collapse handler writes would otherwise fight the
    // media query, so it is cleared on the way into rail mode.
    const railQuery = window.matchMedia('(min-width: 900px)');
    const handleRailChange = (e) => {
      if (e.matches) document.getElementById('mainContent').style.bottom = '';
      setTimeout(() => map.invalidateSize(), 50);
    };
    if (railQuery.addEventListener) railQuery.addEventListener('change', handleRailChange);
    else if (railQuery.addListener) railQuery.addListener(handleRailChange);
    if (railQuery.matches) document.getElementById('mainContent').style.bottom = '';

    // The page never scrolls. Touch can't (body overflow:hidden reaches the
    // viewport; overscroll-behavior stops the rubber band), but the 100lvh
    // root can be taller than innerHeight in a Safari tab and the collapsed
    // sheet / hidden filter panel translate past the bottom, so focus() or
    // similar could scroll it programmatically. Undo that -- except while a
    // field has focus (iOS lifting it above the keyboard), and again once
    // it loses focus.
    const unscrollPage = () => {
      if (!window.scrollY && !window.scrollX) return;
      const a = document.activeElement;
      if (a && a.matches('input, textarea, select, [contenteditable]')) return;
      window.scrollTo(0, 0);
    };
    window.addEventListener('scroll', unscrollPage, { passive: true });
    document.addEventListener('focusout', () => setTimeout(unscrollPage, 0));

    // A phone in a pocket is the dominant state of this app during a trip:
    // pause entirely while hidden, catch up immediately on return.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopPoll();
      } else {
        lastInteractionAt = Date.now();
        fetchLocations();
        fetchNeighborhoodShapes();
        fetchPlans();
        startPoll();
      }
    });
  </script>
</body>
</html>
