    // Shapes carry visited / starred like pins (2026-10-02), so they are polled
    // with the pins (pollTick) and the other phone's marks arrive; the same
    // in-flight guard, the same flagWritesInFlight hold and the same no-op
    // render on an unchanged payload as doFetchLocations().
    let shapesFetchPromise = null;
    let lastShapesDigest = null;
    async function doFetchNeighborhoodShapes() {
      try {
        const { data, error } = await supabaseClient
          .from('neighborhood_shapes')
          .select('id,city,type,label,color,note,min_zoom,geometry,visited,starred');
        if (error) throw error;
        if (flagWritesInFlight > 0) return;   // see flagWritesInFlight
        const rows = data || [];
        const digest = JSON.stringify(rows);
        neighborhoodShapes = rows;
        if (digest !== lastShapesDigest) {
          lastShapesDigest = digest;
          updateUI();   // refreshes the list count/cards too, not just the map layers
        }
        hideError('shapes');
      } catch (err) {
        showReadProblem(err, 'shapes');
      }
    }
    function fetchNeighborhoodShapes() {
      if (shapesFetchPromise) return shapesFetchPromise;
      shapesFetchPromise = doFetchNeighborhoodShapes().finally(() => { shapesFetchPromise = null; });
      return shapesFetchPromise;
    }
    // A read that STARTED after the write (see refetchLocations()).
    async function refetchNeighborhoodShapes() {
      if (shapesFetchPromise) { try { await shapesFetchPromise; } catch (e) { /* reported already */ } }
      return fetchNeighborhoodShapes();
    }

    function payloadDigest(rows) {
      return rows.map(r => `${r.id}:${markerSignature(r)}`).join('~');
    }

    // Owner (2026-10-01): the banner never shows a raw message. A write that fails for want of
    // a connection (a fetch TypeError: Chromium "Failed to fetch", Safari "Load failed", or the
    // browser offline) says "Couldn't save. Check your connection." and goes after 6s; a write
    // the RLS policy refuses says who can edit and stays until tapped. Either way the row has
    // already rolled back.
    const BANNER_WRITE_MS = 6000;
    const errText = err => `${(err && err.message) || err || ''} ${(err && err.code) || ''}`;
    const isNetworkError = err => (typeof navigator !== 'undefined' && navigator.onLine === false) || err instanceof TypeError ||
      /failed to fetch|load failed|networkerror|network request failed/i.test(errText(err));
    const isRLSError = err => /row-level security|policy|42501/i.test(errText(err));
    function showWriteError(err, what, source = 'mutation') {
      if (isRLSError(err)) { showError(`Only Adam and Erica can edit ${what}.`, source); return; }
      showError(isNetworkError(err) ? 'Couldn’t save. Check your connection.' : 'Couldn’t save. Try again.', source, { autoHideMs: BANNER_WRITE_MS });
    }
    // A failed read (load or poll) keeps what's on screen and says so in the navy info band;
    // the next good read of that source, or the browser's `online` event, clears it.
    function showReadProblem(err, source) {
      showInfo(isNetworkError(err) ? 'Offline. Showing what’s loaded.' : 'Couldn’t load. Showing what’s loaded.', source);
    }

    // The short-address columns (address_details, short_address; migration
    // 20261005000000_add_short_address.sql) may not exist yet: index.html
    // deploys on push, possibly before the migration runs. PostgREST then
    // refuses the whole insert (PGRST204 "Could not find the '...' column"),
    // so addLocation() retries once without them and stops sending them for
    // the rest of the session; the read (doFetchLocations()) does the same.
    // The tag shows short_address (tagAddress()).
    const SHORT_ADDRESS_COLUMNS = ['address_details', 'short_address'];
    let shortAddressColumnsMissing = false;

    function isMissingShortAddressColumn(error) {
      if (!error) return false;
      const text = `${error.code || ''} ${error.message || ''} ${error.details || ''}`;
      return (error.code === 'PGRST204' || error.code === '42703' || /column/i.test(text))
        && SHORT_ADDRESS_COLUMNS.some(c => text.includes(c));
    }

    function withoutShortAddress(loc) {
      const rest = { ...loc };
      SHORT_ADDRESS_COLUMNS.forEach(c => delete rest[c]);
      return rest;
    }

    // The fields addLocation() stores for a Nominatim `address` object; {} when
    // there are none, so a caller can always spread it into the row.
    function shortAddressFields(details, placeName) {
      if (!details || typeof details !== 'object' || !Object.keys(details).length) return {};
      return { address_details: details, short_address: deriveShortAddress(details, placeName) || null };
    }

    async function addLocation(loc) {
      if (!await requireAuth()) return;

      try {
        const hasShort = SHORT_ADDRESS_COLUMNS.some(c => c in loc);
        let { error } = await supabaseClient
          .from('locations')
          .insert([shortAddressColumnsMissing ? withoutShortAddress(loc) : loc]);

        if (error && hasShort && !shortAddressColumnsMissing && isMissingShortAddressColumn(error)) {
          shortAddressColumnsMissing = true;
          console.warn('locations short-address columns missing; saved without them.', error.message);
          ({ error } = await supabaseClient.from('locations').insert([withoutShortAddress(loc)]));
        }

        if (error) throw error;
        await refetchLocations();
        hideError('mutation');
      } catch (err) {
        showWriteError(err, 'places');
      }
    }

    async function addNeighborhoodShape(shape) {
      if (!await requireAuth()) return;

      try {
        const { error } = await supabaseClient
          .from('neighborhood_shapes')
          .insert([shape]);

        if (error) throw error;
        await refetchNeighborhoodShapes();
        hideError('mutation');
      } catch (err) {
        showWriteError(err, 'places');
      }
    }

    async function deleteLocation(id) {
      if (!await requireAuth()) return;

      try {
        const { error } = await supabaseClient
          .from('locations')
          .delete()
          .eq('id', id);

        if (error) throw error;
        await refetchLocations();
        hideError('mutation');
        cleanupOrphanCities();
      } catch (err) {
        showWriteError(err, 'places');
      }
    }

    async function deleteNeighborhoodShape(id) {
      if (!await requireAuth()) return;

      try {
        const { error } = await supabaseClient
          .from('neighborhood_shapes')
          .delete()
          .eq('id', id);

        if (error) throw error;
        await refetchNeighborhoodShapes();
        hideError('mutation');
        cleanupOrphanCities();
      } catch (err) {
        showWriteError(err, 'places');
      }
    }

    // Visited and starred are both one-tap popup toggles, so they share
    // one writer. OPTIMISTIC: the local row flips and updateUI() re-renders
    // the popup, list row and marker at once; the write follows. On
    // failure the flip is reverted. The refetch after a successful write
    // returns the state already on screen, so every signature matches and
    // nothing re-renders (no flicker). The target value is written, not
    // "!current" server-side, so a quick double-tap lands where the
    // screen says it did.
    function setLocationFlag(id, field, value) {
      // Re-rendering replaces the popup's HTML; keep keyboard/VoiceOver
      // focus on the control that was just used.
      const focused = document.activeElement;
      const refocus = focused && focused.matches && focused.matches('.popup-star, .popup-visited')
        ? `.${focused.classList[0]}[data-id="${CSS.escape(id)}"]` : null;
      if (isShapeKey(id)) { const sid = shapeIdOf(id); neighborhoodShapes = neighborhoodShapes.map(n => n.id === sid ? { ...n, [field]: value } : n); }
      else locations = locations.map(l => l.id === id ? { ...l, [field]: value } : l);
      // Visited changed ANYWHERE (a row swipe, the tag, a rollback) while this place's tag is open:
      // the tag stamps (or lifts) once, as if pressed there (owner 2026-10-08: "when i have a tag
      // open that is unvisited, if i mark it visited in the list, the animation on the tag marking it
      // visited should still run"). Driven by the state change, never by the row's gesture code
      // (CLAUDE.md, animation separation). A tag tap has already set the same flag -- no double.
      // The flag is consumed by the re-render below and cleared after it, so the poll or a later
      // re-render never replays it. Reduced motion: the CSS drops both animations.
      if (field === 'visited' && openTagKey() === id) { if (value) popupStampId = id; else popupUnstampId = id; }
      updateUI();
      if (field === 'visited') { popupStampId = null; popupUnstampId = null; }
      if (refocus) {
        const btn = document.querySelector(`.leaflet-popup ${refocus}`);
        if (btn) btn.focus({ preventScroll: true });
      }
    }

    // `id` is a row key (rowItem()): a pin's uuid, or 'shape:<id>' for a
    // district/street, written to neighborhood_shapes the same way.
    async function toggleLocationFlag(id, field) {
      if (!await requireAuth()) return;
      const loc = rowItem(id);
      if (!loc) return;
      const next = !loc[field];
      const shape = isShapeKey(id);

      setLocationFlag(id, field, next);
      flagWritesInFlight++;
      try {
        const { error } = await supabaseClient
          .from(shape ? 'neighborhood_shapes' : 'locations')
          .update({ [field]: next })
          .eq('id', shape ? shapeIdOf(id) : id);

        if (error) throw error;
        hideError('mutation');
      } catch (err) {
        // Rollback is per write: only this tap's flip is undone.
        setLocationFlag(id, field, !next);
        showWriteError(err, 'places');
      } finally {
        flagWritesInFlight--;
      }
      // Only the last write to settle reconciles with the server -- see
      // flagWritesInFlight. One visible change per tap, nothing after.
      if (flagWritesInFlight === 0) await Promise.all([refetchLocations(), refetchNeighborhoodShapes()]);
    }

    // The single Nominatim call site. A city is configured in exactly one place
    // (CITIES), and the geocoding context always comes from formCityId().
    // NOTE: no User-Agent header — it is a forbidden header name for fetch and
    // browsers drop it silently, so the old ones never did anything.
    // `cfg` is usually a CITIES entry, but detectCityContext()'s "unknown
    // region" fallback (see below) passes a partial cfg with only `viewbox`
    // + `bounded` set. new URLSearchParams({...}) stringifies a missing
    // field as the literal string "undefined" if it's included unconditionally
    // -- every optional field below is therefore set only when present,
    // never passed as an object key that might be undefined.
    async function nominatim(query, cfg, opts = {}) {
      const params = new URLSearchParams({
        format: 'json',
        q: cfg.geocodeSuffix ? `${query}, ${cfg.geocodeSuffix}` : query,
        limit: String(opts.limit || 1)
      });
      if (cfg.countrycodes) params.set('countrycodes', cfg.countrycodes);   // HARD filter — comma list, see CITIES
      if (cfg.viewbox) params.set('viewbox', cfg.viewbox);                  // SOFT ranking hint only
      if (cfg.bounded) params.set('bounded', '1');                          // HARD filter to viewbox — only set by the unscoped-region fallback
      if (opts.addressdetails) params.set('addressdetails', '1');
      if (opts.polygonGeojson) params.set('polygon_geojson', '1');

      const init = {};
      if (opts.timeout) init.signal = AbortSignal.timeout(opts.timeout);
      lastNominatimAt = performance.now();
      const response = await fetch(`https://nominatim.openstreetmap.org/search?${params}`, init);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    // ---- short address ---------------------------------------------------------
    // Owner (2026-10-05), choosing a stored short form over trimming the full
    // string: "#1 since there's a directions button". Why it matters:
    // "sometimes the address *does* matter at a glance, if something has
    // multiple locations or something". So: "street + number · area", enough to
    // tell WHICH branch / WHERE, never a postal address (Directions navigates).
    // Input is a Nominatim `address` object (addressdetails=1); it is stored
    // raw in locations.address_details so the rules below can be re-run later.
    // DUPLICATED PORT (no build step): tools/short-address-backfill.html has a
    // verbatim copy of SHORT_ADDR_* and deriveShortAddress() -- change both.
    // Rules (docs/shipped.md "Short address"):
    //   street: the first road-level key; house_number joins it ("Laugavegur 12";
    //     number first in SHORT_ADDR_NUMBER_FIRST countries: "4800 Hollywood
    //     Blvd"). Dropped when the place's own name already contains the road
    //     (a street pin, "Davidshallsgatan 10 Malmö").
    //   area: the first of SHORT_ADDR_AREA_KEYS that is not an administrative
    //     unit ("Norra innerstadens stadsdelsområde", "Malmö kommun"), not the
    //     road, and not contained in the place's name. suburb comes first: it is
    //     the level people know (Vesterbro, Södermalm, Möllevången); the finer
    //     neighbourhood/quarter names (Humleby, Den Gule By) are the fallback.
    //     Settlement keys come last, so a place outside a city still says where
    //     (Reykjanesbær).
    //   The POI's own name key (amenity, shop, tourism...) is never read.
    // Returns '' when nothing useful is left (stored as NULL).
    const SHORT_ADDR_ROAD_KEYS = ['road', 'pedestrian', 'square', 'footway', 'path', 'cycleway', 'place'];
    const SHORT_ADDR_AREA_KEYS = ['suburb', 'borough', 'city_district', 'quarter', 'neighbourhood', 'district',
                                  'village', 'town', 'hamlet', 'city', 'municipality'];
    const SHORT_ADDR_ADMIN_RE = /stadsdelsområde|stadsdel\b|bydel\b|municipality|kommun|county|\bregion\b/i;
    const SHORT_ADDR_NUMBER_FIRST = new Set(['us', 'ca', 'gb', 'ie', 'au', 'nz', 'fr', 'lu']);

    function shortAddrWords(s) {
      return ' ' + String(s || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
        .replace(/[^\p{L}\p{N}]+/gu, ' ').trim() + ' ';
    }

    function deriveShortAddress(details, placeName) {
      if (!details || typeof details !== 'object') return '';
      const nameWords = shortAddrWords(placeName);
      const inName = part => nameWords.trim() !== '' && nameWords.includes(shortAddrWords(part));
      const roadKey = SHORT_ADDR_ROAD_KEYS.find(k => details[k]);
      const road = roadKey ? String(details[roadKey]).trim() : '';
      let street = '';
      if (road && !inName(road)) {
        const num = details.house_number ? String(details.house_number).trim() : '';
        street = !num ? road
          : SHORT_ADDR_NUMBER_FIRST.has(String(details.country_code || '').toLowerCase()) ? `${num} ${road}` : `${road} ${num}`;
      }
      let area = '';
      for (const k of SHORT_ADDR_AREA_KEYS) {
        const v = details[k] ? String(details[k]).trim() : '';
        if (!v || SHORT_ADDR_ADMIN_RE.test(v) || inName(v)) continue;
        if (road && shortAddrWords(v) === shortAddrWords(road)) continue;
        area = v;
        break;
      }
      return [street, area].filter(Boolean).join(' · ');
    }

    // ---- widen on miss --------------------------------------------------------
    // A trip's places aren't all in the current city (day trips, other towns,
    // another country), but the scoped search above can never return them:
    // the city suffix is part of `q` and `countrycodes` is a hard filter.
    // Owner decision (2026-09-29): search the current city first, exactly as
    // before, and only when that finds NOTHING run one wider search -- no
    // suffix, no countrycodes, the same viewbox as a SOFT bias (never
    // bounded). Filing is untouched. See design/trip-location-model/.
    // Nominatim's usage policy is at most 1 request/s, so the widened call
    // waits until NOMINATIM_SPACING_MS after the previous request started.
    const NOMINATIM_SPACING_MS = 1000;
    let lastNominatimAt = 0;

    // Null when there is nothing to widen (already unscoped and unbounded).
    function widenedSearchConfig(cfg) {
      if (!cfg || !cfg.viewbox) return null;
      if (!cfg.geocodeSuffix && !cfg.countrycodes && !cfg.bounded) return null;
      return { viewbox: cfg.viewbox };
    }

    // `isStale()` (optional) is checked before the wait, after it, and after
    // the widened response: a stale search returns null and is dropped.
    async function nominatimWithFallback(query, cfg, opts = {}, isStale = null) {
      const stale = () => !!(isStale && isStale());
      const data = await nominatim(query, cfg, opts);
      if (stale()) return null;
      if (data && data.length) return data;
      const wide = widenedSearchConfig(cfg);
      if (!wide) return data;
      const wait = lastNominatimAt + NOMINATIM_SPACING_MS - performance.now();
      if (wait > 0) await new Promise(resolve => setTimeout(resolve, Math.ceil(wait)));
      if (stale()) return null;
      const widened = await nominatim(query, wide, opts);
      return stale() ? null : widened;
    }

    // Fetches a district's real OSM boundary polygon -- GeoJSON is [lng, lat],
    // converted here to this app's [lat, lng] convention, so nothing downstream
    // ever has to think about coordinate order.
    async function nominatimPolygon(name, cfg) {
      try {
        const data = await nominatimWithFallback(name, cfg, { limit: 1, polygonGeojson: true, timeout: 8000 });
        if (!data || !data.length || !data[0].geojson) return null;
        const gj = data[0].geojson;
        let ring;
        if (gj.type === 'Polygon') ring = gj.coordinates[0];
        else if (gj.type === 'MultiPolygon') ring = gj.coordinates[0][0];
        else return null;
        return ring.map(([lng, lat]) => [lat, lng]);
      } catch (err) {
        return null;
      }
    }

    // Fetches a named street's real mapped path via Overpass. Overpass returns
    // geometry nodes as {lat, lon} objects already, so no coordinate-order
    // conversion is needed (unlike Nominatim's GeoJSON).
    async function overpassWay(name, cfg) {
      const [lonMin, latMin, lonMax, latMax] = cfg.viewbox.split(',').map(Number);
      const query = `[out:json][timeout:15];way["name"="${name}"]["highway"](${latMin},${lonMin},${latMax},${lonMax});out geom;`;
      try {
        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: `data=${encodeURIComponent(query)}`,
          signal: AbortSignal.timeout(15000)
        });
        if (!response.ok) return null;
        const data = await response.json();
        if (!data.elements || !data.elements.length) return null;
        // A street is often split into several OSM way segments -- merge all
        // of them into one path, but keep each element's point count so a
        // caller can still tell them apart (resolveShapeCity() uses this to
        // drop a whole mismatched-city segment instead of voting point by
        // point).
        const points = [];
        const segmentLengths = [];
        data.elements.forEach(el => {
          if (!el.geometry) return;
          const before = points.length;
          el.geometry.forEach(pt => points.push([pt.lat, pt.lon]));
          segmentLengths.push(points.length - before);
        });
        return points.length ? { points, segmentLengths } : null;
      } catch (err) {
        return null;
      }
    }

    // Fallback when OSM has no polygon/way for a district/street: land an
    // approximate pin instead of forcing a trip to
    // tools/neighborhood-shapes.html for manual tracing. Two escalating
    // attempts -- a plain point search (many named neighborhoods have a
    // node even with no boundary relation), then an Overpass node search
    // scoped to the city bbox (catches an entrance/landmark node under a
    // different tag shape than a plain search surfaces). Returns
    // {lat, lng, tier} or null if OSM genuinely has nothing at all.
    // Re-upgrading to a real boundary later, if OSM ever gains one, is a
    // separate concern -- not attempted here.
    async function findApproximatePoint(name, cfg) {
      try {
        const data = await nominatimWithFallback(name, cfg, { limit: 1, addressdetails: true, timeout: 8000 });
        if (data && data.length) {
          // addressDetails feeds the short address (Overpass tier has none).
          return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), tier: 'point search', addressDetails: data[0].address || null };
        }
      } catch (err) { /* fall through to the Overpass node attempt */ }

      try {
        const [lonMin, latMin, lonMax, latMax] = cfg.viewbox.split(',').map(Number);
        const query = `[out:json][timeout:15];node["name"="${name}"](${latMin},${lonMin},${latMax},${lonMax});out;`;
        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: `data=${encodeURIComponent(query)}`,
          signal: AbortSignal.timeout(15000)
        });
        if (response.ok) {
          const data = await response.json();
          if (data.elements && data.elements.length) {
            const el = data.elements[0];
            return { lat: el.lat, lng: el.lon, tier: 'Overpass node' };
          }
        }
      } catch (err) { /* genuinely nothing found */ }

      return null;
    }

    async function geocode(address) {
      try {
        const data = await nominatimWithFallback(address, currentSearchCityConfig(), { limit: 1, addressdetails: true });
        if (data && data.length > 0) {
          return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), addressDetails: data[0].address || null };
        }
        return null;
      } catch (err) {
        console.error('Geocoding failed:', err);
        return null;
      }
    }

    // Debounce function to limit API calls
    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    // Autocomplete search function
    // searchSeq drops a response (scoped or widened) once a newer search has
    // started or the Name field no longer holds the query it answers.
    let searchSeq = 0;
    async function searchAddress(query) {
      const seq = ++searchSeq;
      if (query.length < 2) {
        hideAutocomplete();
        return;
      }

      const autocompleteDiv = document.getElementById('addressAutocomplete');
      autocompleteDiv.innerHTML = '<div class="autocomplete-loading">Searching...</div>';
      autocompleteDiv.classList.add('show');

      const isStale = () => seq !== searchSeq || document.getElementById('nameInput').value !== query;
      try {
        const data = await nominatimWithFallback(query, currentSearchCityConfig(), {
          limit: 10,
          addressdetails: true,
          timeout: 5000
        }, isStale);
        if (isStale()) return;

        if (data && data.length > 0) {
          autocompleteDiv.innerHTML = data.map(result => {
            const displayName = result.display_name;
            const addressDetailsJson = escapeAttr(JSON.stringify(result.address || {}));
            return `<div class="autocomplete-item" data-lat="${result.lat}" data-lon="${result.lon}" data-name="${escapeHtml(displayName)}" data-address-details="${addressDetailsJson}">${escapeHtml(displayName)}</div>`;
          }).join('');

          // Add click handlers to autocomplete items
          autocompleteDiv.querySelectorAll('.autocomplete-item').forEach(item => {
            item.onclick = () => selectAddress(item);
          });
        } else {
          autocompleteDiv.innerHTML = '<div class="autocomplete-loading">No results found. Try a different search.</div>';
        }
      } catch (err) {
        console.error('Autocomplete search failed:', err);
        if (isStale()) return;
        if (err.name === 'TimeoutError') {
          autocompleteDiv.innerHTML = '<div class="autocomplete-loading">Search timed out. Try again.</div>';
        } else {
          autocompleteDiv.innerHTML = '<div class="autocomplete-loading">Search failed. Please wait and try again.</div>';
        }
      }
    }

    // Coordinates already returned by the autocomplete, so the submit handler
    // does not have to re-geocode a string that IS a Nominatim display_name.
    // Keyed by the address text, so any manual edit invalidates it naturally.
    let selectedPlace = null;   // { address, lat, lng, addressDetails }

    // Select an address from autocomplete
    function selectAddress(item) {
      const displayName = item.getAttribute('data-name');
      const addressInput = document.getElementById('addressInput');
      const nameInput = document.getElementById('nameInput');

      // Extract just the place name (first part before comma)
      const placeName = displayName.split(',')[0].trim();

      // Set name to the place name
      nameInput.value = placeName;

      // Set address to the full display name
      addressInput.value = displayName;

      const lat = parseFloat(item.getAttribute('data-lat'));
      const lng = parseFloat(item.getAttribute('data-lon'));
      let addressDetails = null;
      try { addressDetails = JSON.parse(item.getAttribute('data-address-details') || 'null'); } catch (e) { /* ignore */ }
      selectedPlace = (isFinite(lat) && isFinite(lng))
        ? { address: displayName, lat, lng, addressDetails }
        : null;

      if (selectedPlace) {
        maybeDetectCity(lat, lng, addressDetails);
      }

      hideAutocomplete();
    }

    // Hide autocomplete dropdown
    function hideAutocomplete() {
      const autocompleteDiv = document.getElementById('addressAutocomplete');
      autocompleteDiv.classList.remove('show');
      autocompleteDiv.innerHTML = '';
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // escapeHtml() is safe for text NODES but not for double-quoted attribute
    // VALUES -- it never escapes `"`, so a JSON blob (which is full of them)
    // embedded via escapeHtml() would break out of the attribute early. Used
    // only for the data-address-details payload stashed on autocomplete rows.
    function escapeAttr(text) {
      return text.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }
    
    // =========================================================================
    // City state engine
    // =========================================================================

    // Never throws: an unknown id (stale localStorage, an unexpected DB row)
    // degrades to the default city rather than blowing up during init.
    // Never called with ALL_CITIES — callers that can see it branch first.
    function cityConfig(cityId) {
      return CITIES[cityId] || CITIES[DEFAULT_CITY];
    }

    function isAllCities() {
      return citySelection === ALL_CITIES;
    }

    function activeCityLabel() {
      return isAllCities() ? 'All cities' : cityConfig(citySelection).label;
    }

    // The filters apply in BOTH views. Plans adds the open plan's stops,
    // whole and whatever the filters say (the chips choose what you can add;
    // they never hide your plan).
    function visibleLocations() {
      const match = locations.filter(loc =>
        filters.categories[loc.category] &&
        (filters.city === null || loc.city === filters.city));
      if (!inPlanView()) return match;
      if (!activePlan()) return [];
      const stops = planMarks().rows.filter(r => r.loc).map(r => r.loc);
      const inPlan = new Set(stops.map(l => l.id));
      return stops.concat(match.filter(l => !inPlan.has(l.id)));
    }

    function persistCitySelection(selection) {
      try {
        localStorage.setItem(CITY_STORAGE_KEY, selection);
      } catch (err) {
        // Private mode / storage disabled — selection simply doesn't persist.
      }
    }

    // → cityId | ALL_CITIES | null. null means "nothing usable stored", and ONLY that.
    function restoreCitySelection() {
      try {
        const stored = localStorage.getItem(CITY_STORAGE_KEY);
        if (stored === ALL_CITIES) return ALL_CITIES;
        if (stored && CITIES[stored]) return stored;
        return null;
      } catch (err) {
        return null;
      }
    }

    // The ONLY writer of citySelection, activeCity and filters.city.
    // NOTE: there is deliberately NO no-op early-return when the selection is
    // unchanged. Re-tapping the already-active city MUST re-frame the map —
    // that is the recovery path for a user who panned into the ocean.
    function setActiveCity(selection, opts = {}) {
      if (selection !== ALL_CITIES && !CITIES[selection]) selection = DEFAULT_CITY;

      citySelection = selection;
      if (selection !== ALL_CITIES) activeCity = selection;   // else keep last real city
      filters.city = (selection === ALL_CITIES) ? null : selection;

      noteInteraction();

      // The highlighted location may belong to the city we are leaving.
      setHighlighted(null);

      // Plans frames the open plan instead (frameActivePlan(): the building
      // fit takes in the new city's places; following, its leg; no stops yet,
      // the city's matching places).
      const framePlan = inPlanView() && !!activePlan();
      if (opts.frame !== false && !framePlan) {
        focusCity(selection, { animate: opts.animate !== false });
      }

      persistCitySelection(selection);
      updateUI();                 // reaches syncMarkers()/syncLocationCards()
      updateCitySelectorUI();
      syncAddFormCity();

      // Preserving scroll across a poll tick is the point of the reconciler;
      // preserving it across a city switch strands the user mid-list.
      document.getElementById('locationsList').scrollTop = 0;
      if (inPlanView()) { showPlanRule(); if (opts.frame !== false && framePlan) frameActivePlan(); }
    }
    // After a filter change in Plans, the list scrolls so the rule sits at the
    // top of the list (the stops are one flick up, or a tap on the plan's name
    // in the header). Nothing moves in Places.
    function showPlanRule() {
      const list = document.getElementById('locationsList');
      const rule = list.querySelector('.plan-rule');
      if (!rule || !planMarks().rows.length) return;
      list.scrollTop += rule.getBoundingClientRect().top - list.getBoundingClientRect().top;
    }

    // ---- viewport ------------------------------------------------------------

    function prefersReducedMotion() {
      return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    // The single wrapper over Leaflet viewport control.
    //   zoom: number → absolute; { atLeast: n } → Math.max(map.getZoom(), n)
    function focusMap(center, zoom, opts = {}) {
      let targetZoom;
      if (zoom && typeof zoom === 'object' && typeof zoom.atLeast === 'number') {
        targetZoom = Math.max(map.getZoom(), zoom.atLeast);
      } else if (typeof zoom === 'number') {
        targetZoom = zoom;
      } else {
        targetZoom = map.getZoom();
      }

      if (opts.animate === false || prefersReducedMotion()) {
        map.setView(center, targetZoom, { animate: false });
        return;
      }

      map.flyTo(center, targetZoom, {
        duration: opts.duration || flyDuration(map.getCenter(), center)
      });
    }

    // The only city-framing entry point.
    function focusCity(selection, opts = {}) {
      if (selection === ALL_CITIES) return fitVisible(opts);
      const cfg = cityConfig(selection);
      return focusMap(cfg.center, cfg.zoom, opts);
    }

    // Frames the currently-visible data (respects the category filters).
    function fitVisible(opts = {}) {
      const pts = visibleLocations().map(l => [l.lat, l.lng]);
      if (pts.length === 0) return focusCity(activeCity, opts);   // concrete fallback
      if (pts.length === 1) return focusMap(pts[0], { atLeast: 13 }, opts);

      const bounds = L.latLngBounds(pts).pad(0.15);
      const animate = opts.animate !== false && !prefersReducedMotion();
      map.fitBounds(bounds, animate
        ? { animate: true, duration: opts.duration || flyDuration(map.getCenter(), bounds.getCenter()) }
        : { animate: false });
    }

    // Leaflet's default easing zooms out to world view on a LA↔Stockholm hop,
    // which looks broken and pulls a large tile set over a traveler's connection.
    function flyDuration(fromLatLng, toLatLng) {
      const from = L.latLng(fromLatLng);
      const to = L.latLng(toLatLng);
      const km = haversineKm([from.lat, from.lng], [to.lat, to.lng]);
      return Math.min(1.6, Math.max(0.8, 0.8 + (km / 9000) * 0.8));
    }

    function haversineKm(a, b) {
      const R = 6371;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(b[0] - a[0]);
      const dLng = toRad(b[1] - a[1]);
      const h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
    }

    // Pure. Returns a RANKED LIST, not a single winner: with Copenhagen and
    // Malmö 30 km apart, ambiguity is the common case, not an edge case.
    // Currently consumed only by defaultFormCity(); no auto-switching.
    function rankCitiesByProximity(latlng, maxKm = 75) {
      return Object.keys(CITIES)
        .map(cityId => ({ cityId, km: haversineKm(latlng, CITIES[cityId].center) }))
        .filter(entry => entry.km <= maxKm)
        .sort((a, b) => a.km - b.km);
    }

    // ---- automatic city detection (Phase 4) ----------------------------------

    // Scopes a Nominatim search BEFORE any result exists. The common case
    // (map already framed on a known city) reproduces today's manually-picked
    // countrycodes/viewbox exactly -- zero regression risk. Only when the
    // viewport isn't near any known city does this fall back to a hard,
    // viewport-bounded search (bounded=1) instead of an unscoped global one --
    // an unscoped search is exactly the failure shape that mismatched "V1
    // Gallery" to Copenhagen Central Station earlier in this project.
    function detectCityContext() {
      const c = map.getCenter();
      const ranked = rankCitiesByProximity([c.lat, c.lng], 75);
      if (ranked.length) {
        const cityId = ranked[0].cityId;
        return { cityId, cfg: cityConfig(cityId), known: true };
      }
      const b = map.getBounds().pad(0.25);
      return {
        cityId: null,
        cfg: { viewbox: `${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()}`, bounded: true },
        known: false
      };
    }

    // The scoping context every search actually uses: detectCityContext()'s
    // live viewport guess before the user has taken control, or their
    // settled/overridden cityInput value once they have (userOverrodeCity) --
    // otherwise a manual correction would get silently re-guessed away on
    // the very next keystroke.
    function currentSearchCityConfig() {
      if (userOverrodeCity) return cityConfig(formCityId());
      const ctx = detectCityContext();
      if (ctx.known && ctx.cityId !== formCityId()) {
        document.getElementById('cityInput').value = ctx.cityId;
      }
      return ctx.cfg;
    }

    function pointInViewbox(lat, lng, viewboxStr, padDeg = 0) {
      const [lonMin, latMin, lonMax, latMax] = viewboxStr.split(',').map(Number);
      return lng >= lonMin - padDeg && lng <= lonMax + padDeg
          && lat >= latMin - padDeg && lat <= latMax + padDeg;
    }

    // Classifies a geocoded point against the EXISTING CITIES set, by
    // bounding-box containment only -- not address text. Copenhagen/Malmö
    // are deliberately configured with overlapping countrycodes ('dk,se' /
    // 'se,dk') for the cross-border travel area, so country alone can't tell
    // them apart; their viewboxes are disjoint by ~12-13km (the Øresund),
    // so containment does. Returns null when no existing city matches --
    // the caller's cue to consider a new-city candidate.
    function matchCity(lat, lng) {
      let hits = Object.keys(CITIES).filter(id => pointInViewbox(lat, lng, CITIES[id].viewbox, 0));
      if (hits.length === 0) hits = Object.keys(CITIES).filter(id => pointInViewbox(lat, lng, CITIES[id].viewbox, 0.05));
      if (hits.length === 0) return null;
      if (hits.length === 1) return hits[0];
      return hits.sort((a, b) =>
        haversineKm([lat, lng], CITIES[a].center) - haversineKm([lat, lng], CITIES[b].center)
      )[0];
    }

    // Reverse-geocodes a point to settlement-level address details, needed
    // to derive a new-city candidate from a fetched SHAPE (unlike a POI
    // search result, Overpass/the polygon fetch return no addressDetails
    // of their own).
    async function nominatimReverse(lat, lng) {
      try {
        const params = new URLSearchParams({ format: 'json', lat: String(lat), lon: String(lng), addressdetails: '1', zoom: '10' });
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?${params}`, { signal: AbortSignal.timeout(8000) });
        if (!response.ok) return null;
        const data = await response.json();
        return data && data.address ? data.address : null;
      } catch (err) {
        return null;
      }
    }

    // Classifies a fetched shape's geometry against CITIES, robust to two
    // distinct failure modes: (a) a shape legitimately straddling two
    // cities' bounds, and (b) a spurious OSM merge dragging in an unrelated
    // cluster of points (e.g. the Klapparstígur bug: a same-named way ~50km
    // away in Keflavík got merged into the Reykjavík street fetch).
    // `segmentLengths`, when given (one entry per Overpass way element, in
    // the same order the points were concatenated), lets a whole outlier
    // SEGMENT get dropped rather than diluting the vote point-by-point --
    // that's what actually catches the Keflavík fragment. Districts (a
    // single connected polygon ring, no segments) just vote point-by-point;
    // there's no sub-shape to drop.
    const SHAPE_CITY_CONFIDENT_SHARE = 0.6;

    function resolveShapeCity(geometry, segmentLengths) {
      const lengths = segmentLengths && segmentLengths.length ? segmentLengths : [geometry.length];
      let offset = 0;
      const segments = lengths.map(len => {
        const pts = geometry.slice(offset, offset + len);
        offset += len;
        const votes = {};
        pts.forEach(([lat, lng]) => {
          const city = matchCity(lat, lng);
          if (city) votes[city] = (votes[city] || 0) + 1;
        });
        const winner = Object.keys(votes).sort((a, b) => votes[b] - votes[a])[0] || null;
        return { pts, winner };
      });

      const tally = {};
      segments.forEach(seg => { if (seg.winner) tally[seg.winner] = (tally[seg.winner] || 0) + seg.pts.length; });
      const ranked = Object.keys(tally).sort((a, b) => tally[b] - tally[a]);
      const winner = ranked[0] || null;
      const winnerShare = winner ? tally[winner] / geometry.length : 0;
      const runnerUp = ranked[1] || null;

      // Keep only segments that agree with the (possibly unconfident)
      // winner -- with no winner at all, there's nothing to compare
      // against yet, so nothing gets dropped.
      const keptSegments = winner ? segments.filter(seg => seg.winner === winner) : segments;
      const cleanedGeometry = keptSegments.length ? [].concat(...keptSegments.map(s => s.pts)) : geometry;
      const droppedPoints = geometry.length - cleanedGeometry.length;

      const centroid = cleanedGeometry
        .reduce((acc, [lat, lng]) => [acc[0] + lat, acc[1] + lng], [0, 0])
        .map(sum => sum / cleanedGeometry.length);

      return {
        winner, winnerShare, runnerUp, cleanedGeometry, droppedPoints, centroid,
        confident: !!winner && winnerShare >= SHAPE_CITY_CONFIDENT_SHARE
      };
    }

    // NFD-decomposing alone doesn't touch Nordic letters that have no
    // canonical base+diacritic decomposition (ø, æ, å, þ, ð aren't
    // "o with a combining mark" in Unicode, they're their own codepoints)
    // -- e.g. "Nørrebro" NFD-stripped to "n-rrebro" instead of "norrebro".
    // Map those explicitly before the generic strip.
    function slugifyCityId(label) {
      return label
        .replace(/[øØ]/g, 'o').replace(/[æÆ]/g, 'ae').replace(/[åÅ]/g, 'a')
        .replace(/[þÞ]/g, 'th').replace(/[ðÐ]/g, 'd')
        .toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    // Two-lookup derivation, not a one-shot guess from the single POI point:
    // re-geocodes the SETTLEMENT itself so the resulting viewbox is sized
    // like the five hand-authored CITIES boxes, not an invented box around
    // one restaurant. Refuses (returns null) rather than guesses when the
    // input data is too thin to be confident -- routes the caller back to
    // the manual cityInput select instead.
    async function deriveNewCityConfig(addressDetails, poiLat, poiLng) {
      const label = addressDetails && (addressDetails.city || addressDetails.town || addressDetails.village);
      const countryCode = addressDetails && addressDetails.country_code;
      if (!label || !countryCode) return null;

      let id = slugifyCityId(label);
      if (CITIES[id]) id = `${id}-${countryCode}`;

      let center = [poiLat, poiLng];
      let viewbox = null;
      try {
        const data = await nominatim(label, { countrycodes: countryCode }, { limit: 1, addressdetails: true, timeout: 8000 });
        if (data && data.length && data[0].boundingbox) {
          const bbox = data[0].boundingbox.map(Number);   // Nominatim order: [south, north, west, east]
          const lonMin = bbox[2], lonMax = bbox[3], latMin = bbox[0], latMax = bbox[1];
          // Sanity guard: wider/taller than ~3 degrees means the settlement
          // lookup likely resolved to a region/country, not a city -- don't
          // trust it.
          if (lonMax - lonMin <= 3 && latMax - latMin <= 3) {
            viewbox = `${lonMin},${latMin},${lonMax},${latMax}`;
            center = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
          }
        }
      } catch (err) { /* falls through to the fixed-box fallback below */ }

      const lowConfidence = !viewbox;
      if (!viewbox) {
        // Settlement lookup failed, returned nothing usable, or failed the
        // sanity guard -- fall back to a fixed, generous box centered on the
        // original point rather than inventing nothing at all.
        viewbox = `${poiLng - 0.15},${poiLat - 0.15},${poiLng + 0.15},${poiLat + 0.15}`;
      }

      return {
        id, label, center, zoom: 12,
        geocodeSuffix: `${label}, ${addressDetails.country || countryCode}`,
        countrycodes: countryCode,
        viewbox,
        lowConfidence
      };
    }

    function mergeCityIntoRuntime(cfg) {
      CITIES[cfg.id] = {
        label: cfg.label, center: cfg.center, zoom: cfg.zoom,
        geocodeSuffix: cfg.geocodeSuffix, countrycodes: cfg.countrycodes, viewbox: cfg.viewbox
      };
      populateCityInput();
      createCitySelector();
      updateCitySelectorUI();   // createCitySelector() rebuilds from scratch -- reapply the active highlight
    }

    async function addCity(cfg) {
      if (!await requireAuth()) return false;
      try {
        const { error } = await supabaseClient.from('cities').insert([{
          id: cfg.id,
          label: cfg.label,
          center_lat: cfg.center[0],
          center_lng: cfg.center[1],
          zoom: cfg.zoom,
          geocode_suffix: cfg.geocodeSuffix,
          countrycodes: cfg.countrycodes,
          viewbox: cfg.viewbox,
          auto_added: true,
          created_by: currentUser ? currentUser.email : null
        }]);
        if (error) throw error;
        mergeCityIntoRuntime(cfg);
        hideError('mutation');
        return true;
      } catch (err) {
        showWriteError(err, 'places');
        return false;
      }
    }

    // Fetches the live cities table and merges it into CITIES (never
    // replaces it) -- the static object stays as an offline-safe bootstrap
    // seed the map can draw from before this fetch ever resolves. On
    // failure, degrades to exactly the 5 static cities, same posture as
    // doFetchLocations()/fetchNeighborhoodShapes().
    async function fetchCities() {
      try {
        const { data, error } = await supabaseClient
          .from('cities')
          .select('id,label,center_lat,center_lng,zoom,geocode_suffix,countrycodes,viewbox');
        if (error) throw error;
        (data || []).forEach(row => {
          CITIES[row.id] = {
            label: row.label, center: [row.center_lat, row.center_lng], zoom: row.zoom,
            geocodeSuffix: row.geocode_suffix, countrycodes: row.countrycodes, viewbox: row.viewbox
          };
        });
        populateCityInput();
        createCitySelector();
        updateCitySelectorUI();
        hideError('cities');
      } catch (err) {
        showReadProblem(err, 'cities');
      }
    }

    // Removes runtime-created cities that nothing references any more --
    // the only "delete a city" path in the app, deliberately never a
    // standing UI. A city can end up orphaned two ways: its one pin/shape
    // gets deleted, or the add-form's city step ran (addCity() writes the
    // row immediately) but the form itself was abandoned before saving.
    // Both are caught here since locations/neighborhoodShapes are always
    // fetched in full (never city-filtered), so membership is checked
    // against local state, not a fresh query. Runs at boot and after every
    // delete; failures are swallowed -- this is best-effort hygiene, never
    // something worth surfacing as an error.
    async function cleanupOrphanCities() {
      const referenced = new Set([
        ...locations.map(loc => loc.city),
        ...neighborhoodShapes.map(shape => shape.city)
      ]);
      const orphanIds = Object.keys(CITIES).filter(id =>
        !SEED_CITY_IDS.has(id) && !referenced.has(id));
      if (orphanIds.length === 0) return;

      try {
        const { error } = await supabaseClient
          .from('cities')
          .delete()
          .in('id', orphanIds)
          .eq('auto_added', true);
        if (error) throw error;
      } catch (err) {
        return;
      }

      const removedLabels = orphanIds.map(id => CITIES[id]?.label).filter(Boolean);
      orphanIds.forEach(id => delete CITIES[id]);

      if (orphanIds.includes(citySelection)) {
        setActiveCity(DEFAULT_CITY);
      } else {
        populateCityInput();
        createCitySelector();
        updateCitySelectorUI();
      }

      if (removedLabels.length) {
        showInfo(
          `Removed unused ${removedLabels.length === 1 ? 'city' : 'cities'}: ${removedLabels.join(', ')}`,
          'cleanup'
        );
      }
    }

    // ---- add-form city detection state ---------------------------------------
    let pendingNewCity = null;
    let userOverrodeCity = false;   // a manual cityInput pick stops further auto-guessing this form session

    async function maybeDetectCity(lat, lng, addressDetails) {
      if (userOverrodeCity) return;
      const matched = matchCity(lat, lng);
      if (matched) {
        document.getElementById('cityInput').value = matched;
        hideNewCityConfirm();
        return;
      }
      if (!addressDetails) return;   // not enough signal to consider a new city
      const derived = await deriveNewCityConfig(addressDetails, lat, lng);
      if (!derived || userOverrodeCity) return;   // re-check: user may have acted while the derivation was in flight
      showNewCityConfirm(derived);
    }

    function showNewCityConfirm(cfg) {
      pendingNewCity = cfg;
      document.getElementById('newCityConfirmText').textContent =
        `"${cfg.label}" isn't in your city list yet. Add it?`;
      document.getElementById('newCityConfirm').style.display = '';
    }

    function hideNewCityConfirm() {
      pendingNewCity = null;
      document.getElementById('newCityConfirm').style.display = 'none';
    }

    // ---- add-form city -------------------------------------------------------

    // Rebuilding innerHTML on a <select> silently resets its selected value
    // to whatever option is now first -- a real problem once this can be
    // called mid-session (fetchCities() resolving after boot, a new city
    // being merged in) rather than only once at cold start. Preserve
    // whatever was selected, when it still exists after the rebuild.
    function populateCityInput() {
      const select = document.getElementById('cityInput');
      const previous = select.value;
      select.innerHTML =
        Object.entries(CITIES)
          .map(([id, c]) => `<option value="${id}">${escapeHtml(c.label)}</option>`)
          .join('');
      if (previous && CITIES[previous]) select.value = previous;
    }

    // The single source of truth for geocoding context and for the inserted row.
    function formCityId() {
      const select = document.getElementById('cityInput');
      const v = select ? select.value : null;
      return CITIES[v] ? v : activeCity;
    }

    function syncAddFormCity() {
      document.getElementById('cityInput').value = defaultFormCity();
    }

    function defaultFormCity() {
      if (!isAllCities()) return activeCity;
      // In all-cities view, guess from what the user is actually looking at,
      // rather than from a stale authoring context.
      const c = map.getCenter();
      const ranked = rankCitiesByProximity([c.lat, c.lng], 150);
      return ranked.length ? ranked[0].cityId : activeCity;
    }

    // ---- poll ----------------------------------------------------------------

    function currentPollMs() {
      return (Date.now() - lastInteractionAt < IDLE_AFTER_MS) ? POLL_ACTIVE_MS : POLL_IDLE_MS;
    }

    function startPoll() {
      if (pollTimer) return;
      pollScheduledMs = currentPollMs();
      pollTimer = setTimeout(pollTick, pollScheduledMs);
    }

    function stopPoll() {
      clearTimeout(pollTimer);
      pollTimer = null;
    }

    function pollTick() {
      pollTimer = null;
      // Phase 2 hook: refreshTodayKey() belongs here, so date-dependent
      // rendering rolls over even in a tab that never fires visibilitychange.
      fetchLocations();
      fetchNeighborhoodShapes();   // visited / starred: the other phone's marks
      fetchPlans();
      startPoll();
    }

    // Any user interaction resets the idle back-off. Only reschedules when the
    // pending wait is longer than the active cadence, so constant interaction
    // can never starve the poll.
    function noteInteraction() {
      lastInteractionAt = Date.now();
      if (pollTimer && pollScheduledMs > POLL_ACTIVE_MS) {
        stopPoll();
        startPoll();
      }
    }

    function centerOnUserLocation() {
      const btn = document.getElementById('centerMeBtn');
      
      if (!navigator.geolocation) {
        showError('Geolocation is not supported by your browser', 'geolocation');
        return;
      }
      
      btn.classList.add('loading');
      
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude } = position.coords;
          takeFix(latitude, longitude);   // the list's Nearest order reuses this fix (no second prompt)
          
          // Remove old user location marker if exists
          if (userLocationMarker) {
            map.removeLayer(userLocationMarker);
          }
          
          // "You are here" is not a category, so it deliberately carries no
          // glyph and no category ink -- a plain navy dot with a paper rim.
          const userIcon = L.divIcon({
            html: `<div style="background: var(--navy); width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--navy), inset 0 0 0 4px var(--paper), 0 1px 0 rgba(0,0,0,0.25);"></div>`,
            className: '',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
          });

          userLocationMarker = L.marker([latitude, longitude], { icon: userIcon }).addTo(map);
          userLocationMarker.bindPopup('<div class="popup-title" style="text-align:center">You are here</div>');
          
          // Center map on user location
          focusMap([latitude, longitude], 14, { animate: true });

          btn.classList.remove('loading');
          hideError('geolocation');
        },
        (error) => {
          btn.classList.remove('loading');
          let errorMsg = 'Unable to get your location';
          
          switch(error.code) {
            case error.PERMISSION_DENIED:
              errorMsg = 'Location permission denied. Enable location access in browser settings.';
              break;
            case error.POSITION_UNAVAILABLE:
              errorMsg = 'Location information unavailable. Check GPS settings.';
              break;
            case error.TIMEOUT:
              errorMsg = 'Location request timed out. Try again.';
              break;
          }
          
          showError(errorMsg, 'geolocation');
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }
    
    // The banner is a single shared DOM element, but errors come from
    // unrelated sources (the locations poll, the shapes fetch, a mutation,
    // geolocation) -- without tracking which one is currently showing, any
    // OTHER source's success would call hideError() and mask a real error
    // before it's read. hideError(source) only clears when it matches
    // whoever's currently showing; the newest showError() always wins the
    // single banner slot outright, since only one message fits at a time.
    let currentErrorSource = null;

    let errorHideTimer = 0;
    function showError(msg, source, opts = {}) {
      clearTimeout(errorHideTimer);
      currentErrorSource = source;
      document.getElementById('errorText').textContent = msg;
      document.getElementById('error').classList.remove('info');
      document.getElementById('error').classList.add('show');
      if (opts.autoHideMs) errorHideTimer = setTimeout(() => hideError(source), opts.autoHideMs);
    }

    // Same banner, navy "info" styling instead of the error color -- for
    // messages that report something that happened, not something that failed.
    function showInfo(msg, source) {
      clearTimeout(errorHideTimer);
      currentErrorSource = source;
      document.getElementById('errorText').textContent = msg;
      document.getElementById('error').classList.add('info', 'show');
    }

    function hideError(source) {
      if (source !== currentErrorSource) return;
      clearTimeout(errorHideTimer);
      currentErrorSource = null;
      document.getElementById('error').classList.remove('show', 'info');
    }
    // Tap to dismiss, whatever it says.
    document.getElementById('error').addEventListener('click', () => hideError(currentErrorSource));
    // ... and from the keyboard: Enter / Space on the focused banner, Escape anywhere while it shows.
    // Focus never trapped: Tab moves on as usual; a dismissed banner hands focus back to the page.
    function dismissErrorByKey() { const el = document.getElementById('error'); const had = el.contains(document.activeElement); hideError(currentErrorSource); if (had) el.blur(); }
    document.getElementById('error').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dismissErrorByKey(); } });
    addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('error').classList.contains('show')) dismissErrorByKey(); });
    // Back online: clear a read-problem band and refetch now rather than at the next poll.
    addEventListener('online', () => {
      if (['locations', 'shapes', 'cities'].includes(currentErrorSource)) hideError(currentErrorSource);
      try { pollTick(); } catch (e) { /* not started yet */ }
    });

    // =========================================================================
    // Rendering — id-keyed reconcilers. Nothing here tears down and rebuilds:
    // a poll tick, a filter tap and a city switch are all just a different
    // result from visibleLocations(), diffed against what is already on screen.
    // =========================================================================

    // Everything that affects a marker's position, icon or popup. loc.city is
    // included because a location moved between cities keeps its id, so only
    // the signature can force the refresh.
    function markerSignature(loc) {
      return [loc.name, loc.address, loc.category, loc.lat, loc.lng,
              loc.notes, loc.visited, loc.city, loc.starred, loc.short_address || ''].join('|');
    }

    // Everything the list card renders.
    // A shape row (shapeRowItem()) adds what only it shows: its own ink and city.
    function cardSignature(loc) {
      const sh = loc.shapeId != null;
      return [loc.name, loc.address, loc.category, loc.visited, loc.starred, distanceLabel(loc), sh ? planMarkKey('shape', loc.shapeId) : planMarkKey('loc', loc.id), listView, inPlanView() ? activePlanId : '']
        .concat(sh ? [loc.color, loc.city] : []).join('|');
    }

    // =========================================================================
    // GLYPHS & BADGES
    // Badge SHAPE encodes the data state, which the list could not previously
    // express at all:
    //   circle             -> a `locations` pin
    //   diamond            -> a `neighborhood_shapes` feature
    //   circle, dashed rim -> an "(approx.)" fallback pin from
    //                         findApproximatePoint() -- indistinguishable
    //                         from a real pin before this.
    // =========================================================================

    // Two size tiers, not one flat number: NEAR is used with the glyph
    // visible (needs interior room), FAR is shape/color only (doesn't) --
    // see GLYPH_MIN_ZOOM below, which gates both. Clustering used to share
    // this same threshold too, but it's now governed separately by
    // SOLO_MIN_ZOOM (see below) -- a solo NEAR-tier marker (glyph visible)
    // can still be absorbed into a cluster badge; that's independent of
    // whether ITS OWN size/glyph would be NEAR or FAR if it were solo.
    // Both values land on the app's own spacing scale (--s6/--s4,
    // index.html ~160) rather than being picked freestanding. Highlighted
    // sizes are a flat +8 (--s2) on top of the active tier, not a
    // multiplier -- that's what makes both bases land back on the scale
    // (24->32, 16->24); it's a property of these two specific values, not
    // a general rule, so a future third tier shouldn't assume it transfers.
    const MARKER_SIZE_NEAR    = 24;   // --s6, glyph visible
    const MARKER_SIZE_FAR     = 16;   // --s4, shape/color only
    const MARKER_HI_DELTA     = 8;    // --s2, additive
    const MARKER_SIZE_NEAR_HI = MARKER_SIZE_NEAR + MARKER_HI_DELTA; // 32, --s8
    const MARKER_SIZE_FAR_HI  = MARKER_SIZE_FAR  + MARKER_HI_DELTA; // 24, --s6

    // Below this zoom pins cluster and 11 pictograms stop being readable, so
    // markers drop to badge SHAPE only -- which still answers the question
    // that matters at that scale ("is that a pin or a district?"). This
    // governs glyph visibility and marker size ONLY -- see SOLO_MIN_ZOOM
    // below for the (separate, higher) zoom where clustering itself ends.
    const GLYPH_MIN_ZOOM = 12;

    // Clustering's own cutoff -- deliberately NOT the same as GLYPH_MIN_ZOOM.
    // It's pinned to highlightMarker()'s focusMap({ atLeast: 14 }) call,
    // which is what every list-item click and every cluster-badge click
    // routes through: as long as this stays <= that atLeast value, a click
    // is GUARANTEED to land at a zoom where the thing it's navigating to is
    // rendered solo, never still hidden inside a cluster bubble -- the same
    // safety property GLYPH_MIN_ZOOM=12 gave clustering before this existed,
    // just at the zoom navigation actually lands on instead of the zoom
    // glyphs happen to turn on. Real density (dense old-town cores) persists
    // well past zoom 12 with real glyphs visible, which GLYPH_MIN_ZOOM alone
    // couldn't address without also hiding glyphs at those zooms -- this
    // constant is what lets clustering extend there independently.
    const SOLO_MIN_ZOOM = 14;

    // Cluster-cell size for mapVisibleLocations()'s grid-snap below
    // SOLO_MIN_ZOOM, banded by zoom rather than one flat number -- a
    // coarser cell far out, finer as you approach the solo cutoff, so a
    // dense cluster gets more chances to split into smaller ones across
    // several zoom ticks instead of jumping straight from "one badge" to
    // "every pin solo" in a single tick. Leaflet's default zoomSnap means
    // map.getZoom() is always an integer, so these band on whole zoom
    // levels cleanly. All five values are 4px multiples continuing the
    // app's own spacing-scale convention (64/48 sit above its --s12=48
    // ceiling; 32/24/16 are --s8/--s6/--s4).
    function clusterCellPxForZoom(zoom) {
      if (zoom <= 9)  return 64;
      if (zoom === 10) return 48;
      if (zoom === 11) return 32;
      if (zoom === 12) return 24;
      return 16; // zoom === 13 (last band before SOLO_MIN_ZOOM's cutoff)
    }

    // The cluster badge's own rendered size, independent of whichever cell
    // size bucketed it -- so the badge always looks like the rest of the
    // app's UI regardless of how coarse the current band's bucketing is,
    // rather than ballooning to ~46px at the 48px band.
    const CLUSTER_BADGE_PX = 24;

    function categoryInk(category) {
      return CATEGORY_COLORS[category] || CATEGORY_COLORS.other;
    }

    // Plain static link, no JS platform detection -- an Apple Maps
    // universal link opens the native app on iOS and degrades to a normal
    // webpage everywhere else, never a dead click. A district/street has no
    // single natural destination, so its row item carries one ON the shape
    // (`dir`, shapeAnchor()).
    function directionsUrl(loc) {
      const [lat, lng] = loc.dir || [loc.lat, loc.lng];
      return `https://maps.apple.com/?daddr=${lat},${lng}&dirflg=d`;
    }

    // An approximate pin records its provenance in the name suffix written by
    // handleAddShapeSubmit(); that is the only marker of its kind on the row.
    function markerKind(loc) {
      if (typeof loc.name === 'string' && loc.name.indexOf('(approx.)') !== -1) return 'dashed';
      return 'circle';
    }

    // Bare glyph, no shell -- chips, popups.
    function glyphHtml(category, size) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><use href="#g-${escapeAttr(category)}"/></svg>`;
    }

    // Stamped-seal badge: paper field, category-ink rim, category-ink glyph.
    // Legible over any tile value, and readable WITHOUT the legend.
    //
    // Defaults are `currentColor` / `var(--badge-field)` so a ROW can flip
    // the whole badge to paper on the reversed highlighted block just by
    // changing its own `color` -- no re-render, and no category ink ever
    // lands on the --figure-deep field. Markers, which live outside that
    // cascade, pass explicit colours instead.
    function badgeHtml(category, kind, size, opts = {}) {
      const ink  = opts.ink  || 'currentColor';
      const fill = opts.fill || 'var(--badge-field, #F2EBDD)';
      const mark = opts.mark || ink;
      const rim  = opts.rim || 2;
      const c    = size / 2;
      const r    = c - rim / 2;

      let shell;
      if (kind === 'diamond') {
        const p = `${c},${rim / 2} ${size - rim / 2},${c} ${c},${size - rim / 2} ${rim / 2},${c}`;
        shell = `<polygon points="${p}" fill="${fill}" stroke="${ink}" stroke-width="${rim}" stroke-linejoin="round"/>`;
      } else if (kind === 'dashed') {
        shell = `<circle cx="${c}" cy="${c}" r="${r}" fill="${fill}" stroke="${ink}" stroke-width="${rim}" stroke-dasharray="3 3"/>`;
      } else {
        shell = `<circle cx="${c}" cy="${c}" r="${r}" fill="${fill}" stroke="${ink}" stroke-width="${rim}"/>`;
      }

      let glyph = '';
      if (opts.glyph !== false) {
        // Size-aware, not a flat fraction of `size` -- a flat ratio shrinks
        // faster than the badge shrinks as tiers get smaller, which can push
        // the glyph below the ~18px floor for telling 11 silhouettes apart.
        // Floored for legibility, capped so it can never exceed the badge's
        // own interior field regardless of how small `size` gets.
        const field = size - rim * 2;
