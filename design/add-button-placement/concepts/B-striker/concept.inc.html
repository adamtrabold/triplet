<!-- ===== CONCEPT B: STRIKER STRIP (structural prototype, systems pass; look is rough, the visual designer's call) =====
     Injected before </body> of a COPY of index.html by render.js. Wires the strip to the app's OWN add flow:
     #floatingAddBtn's handler (auth, playground, draft-preserving toggle) and #submitBtn's handler (pin + shape). -->
<style id="conceptB">
  :root { --strip-h: calc(56px + env(safe-area-inset-bottom, 0px)); --kb: 0px; }
  :root.kb-up { --strip-h: 56px; }                       /* keyboard up: the home-indicator inset is under the keyboard */
  #floatingAddBtn { display: none !important; }
  #accountBtn { right: var(--s4) !important; }           /* the account badge alone in the corner, as with the stub */

  /* the strip: fixed to the bottom edge, above Safari's toolbar in a tab (--chrome-bottom), never moves (except above the keyboard) */
  #strip { position: fixed; left: 0; right: 0; bottom: var(--chrome-bottom); height: var(--strip-h); z-index: 1600;
    display: flex; box-sizing: border-box; padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--brand-orange);
    border-top: 2px solid var(--navy); transform: translateY(calc(-1 * var(--kb))); }
  :root.kb-up #strip { padding-bottom: 0; }
  #strip button { border: 0; margin: 0; font-family: var(--font-ui); font-stretch: 75%; text-transform: uppercase; font-weight: 700;
    font-size: 15px; letter-spacing: 0.08em; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #strip .go { flex: 1; min-width: 0; background: var(--brand-orange); color: var(--navy); display: flex; align-items: center; justify-content: center; gap: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 var(--s4); }
  #strip .go span { overflow: hidden; text-overflow: ellipsis; }
  #strip .go:active { background: var(--brand-orange-deep); color: var(--paper); }
  #strip .x { display: none; width: 56px; flex: none; background: var(--paper); color: var(--navy); align-items: center; justify-content: center; border-right: 2px solid var(--navy); }
  #strip.open .x { display: flex; }
  #strip.open .go[aria-disabled="true"] { background: var(--paper); color: var(--ink-2); cursor: default; }
  #strip.open .go[aria-disabled="true"]:active { background: var(--paper); color: var(--ink-2); }

  /* the sheet keeps its 300px and sits ON the strip; the map gives up the strip's height (B2; B1 = sheet gives it up, see how-it-works) */
  @media (max-width: 899px) {
    #locations { bottom: calc(var(--strip-h) + var(--chrome-bottom)); height: 300px; }
    #locations.collapsed { transform: translateY(240px); }
    #mainContent { height: calc(100lvh - 300px - var(--chrome-bottom) - var(--strip-h) + var(--sheet-lower, 0px)) !important; }
    #mainContent.sheet-collapsed { height: calc(100lvh - 60px - var(--chrome-bottom) - var(--strip-h)) !important; }
    .location-list-spacer { height: 0 !important; }
    #filtersPanel { bottom: calc(300px + var(--chrome-bottom) + var(--strip-h)); }
    #filtersPanel.collapsed-mode { bottom: calc(60px + var(--chrome-bottom) + var(--strip-h)); }
  }
  /* desktop rail: the strip is the rail's foot (it stays on the list's side) */
  @media (min-width: 900px) {
    #strip { right: auto; width: 360px; bottom: 0; border-right: 2px solid var(--navy); }
    #locations { bottom: 56px; }
  }

  /* the form rises FROM the strip: bottom on the strip, grows upward, over the list (the list doesn't move) */
  #controls.show { position: fixed; left: 0; right: 0; top: auto; bottom: calc(var(--strip-h) + var(--chrome-bottom)); z-index: 1550;
    max-height: var(--form-max, 70vh); overflow-y: auto; overscroll-behavior: contain;
    padding-top: var(--s6); padding-bottom: var(--s2); border-bottom: 0; border-top: 2px solid var(--navy);
    transform: translateY(calc(-1 * var(--kb))); box-shadow: 0 -8px 16px rgba(30,40,50,.12); }
  @media (min-width: 900px) { #controls.show { right: auto; width: 360px; bottom: 56px; padding-left: var(--gutter); } }
  #addForm button#submitBtn { display: none !important; }   /* the strip IS the submit */
  body.adding .leaflet-bottom { bottom: var(--credit-lift, 0px); }  /* the OSM credit stays on the visible map */

  /* drawn stand-ins for platform chrome (render only) */
  #fakeKb { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3000; background: #CED2D9; display: flex; align-items: flex-start; justify-content: center;
    font: 600 13px/1 -apple-system, system-ui, sans-serif; color: #6b7280; padding-top: 18px; box-sizing: border-box; }
  #fakeToolbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3000; background: rgba(246,246,246,.98); border-top: .5px solid rgba(0,0,0,.2);
    display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; box-sizing: border-box; font: 500 12px/1 -apple-system, system-ui, sans-serif; color: #555; }
</style>
<script id="conceptBjs">
(function () {
  const $ = id => document.getElementById(id);
  const fab = $('floatingAddBtn'), submit = $('submitBtn'), controls = $('controls'), root = document.documentElement;
  // the form must stack above the sheet: lift it out of #mainContent's stacking context
  document.body.appendChild(controls);
  const PLUS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
  const X = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" aria-hidden="true"><line x1="6.5" y1="6.5" x2="17.5" y2="17.5"/><line x1="17.5" y1="6.5" x2="6.5" y2="17.5"/></svg>';
  const strip = document.createElement('div'); strip.id = 'strip';
  strip.innerHTML = `<button type="button" class="x" aria-label="Close add form">${X}</button><button type="button" class="go"></button>`;
  document.body.appendChild(strip);
  const go = strip.querySelector('.go'), x = strip.querySelector('.x');
  const isOpen = () => fab.classList.contains('active');
  const shape = () => isShapeCategory($('categoryInput').value);
  const ready = () => !!$('nameInput').value.trim() && (shape() || !!$('addressInput').value.trim());
  function paint() {
    const open = isOpen();
    strip.classList.toggle('open', open); document.body.classList.toggle('adding', open);
    requestAnimationFrame(sizeForm);
    if (!open) { go.innerHTML = `${PLUS}<span>Add a place</span>`; go.removeAttribute('aria-disabled'); go.setAttribute('aria-label', 'Add a place'); return; }
    if (submit.disabled) { go.innerHTML = `<span>${submit.textContent}</span>`; go.setAttribute('aria-disabled', 'true'); return; }  // "Adding..."
    if (!ready()) { go.innerHTML = `<span>${shape() ? 'Type a name to trace' : 'Pick a place first'}</span>`; go.setAttribute('aria-disabled', 'true'); go.setAttribute('aria-label', 'Add location (pick a place first)'); return; }
    requestAnimationFrame(sizeForm);
    const n = $('nameInput').value.trim();
    go.innerHTML = `<span>Add ${n.replace(/[<&]/g, '')}</span>`; go.removeAttribute('aria-disabled'); go.setAttribute('aria-label', 'Add ' + n);
    requestAnimationFrame(sizeForm);
  }
  go.addEventListener('click', () => {
    if (!isOpen()) {
      // one overlay at a time: the filters panel and sort menu close first
      if ($('filtersPanel').classList.contains('visible')) $('toggleFiltersBtn').click();
      const sm = $('sortMenu'); if (sm && !sm.hidden && $('sortScrim')) $('sortScrim').click();
      fab.click();                      // the app's own path: requireAuth (sign-in sheet when signed out), playground adds
    } else if (go.getAttribute('aria-disabled') !== 'true') submit.click();   // the same strip finishes the add
  });
  x.addEventListener('click', () => fab.click());   // today's toggle: hides the form, the draft survives
  new MutationObserver(paint).observe(fab, { attributes: true, attributeFilter: ['class'] });
  new MutationObserver(paint).observe(submit, { attributes: true, childList: true, characterData: true, subtree: true });
  ['input', 'change'].forEach(t => ['nameInput', 'addressInput', 'categoryInput'].forEach(id => $(id).addEventListener(t, paint)));
  // selectAddress() sets the values programmatically (no input event): repaint after any autocomplete pick
  $('addressAutocomplete').addEventListener('click', () => setTimeout(paint, 0));

  // the form's height cap and the OSM credit's lift
  function sizeForm() {
    const VV = window.__fakeVV || window.visualViewport;
    const vh = VV ? VV.height : innerHeight, stripH = strip.getBoundingClientRect().height;
    const top = ($('accountBtn').getBoundingClientRect().bottom || 66) + 8;      // never under the account badge, keyboard or not
    root.style.setProperty('--form-max', Math.max(160, Math.round(vh - stripH - top)) + 'px');
    // the OSM credit rides to the form's top edge (it must stay on the visible map)
    const mapB = $('map').getBoundingClientRect().bottom, fT = controls.getBoundingClientRect().top;
    root.style.setProperty('--credit-lift', isOpen() ? Math.max(0, Math.round(mapB - fT)) + 'px' : '0px');
  }
  // KEYBOARD: ride above it with visualViewport (iOS Safari doesn't resize the layout viewport for the keyboard;
  // no interactive-widget support there). --kb = how far the keyboard's top is above the layout bottom.
  function kb() {
    const VV = window.__fakeVV || window.visualViewport; if (!VV) return;
    const k = Math.max(0, Math.round(innerHeight - VV.height - VV.offsetTop));
    root.style.setProperty('--kb', k + 'px'); root.classList.toggle('kb-up', k > 80); sizeForm();
    if (document.activeElement === $('nameInput')) keepSearchTop();
  }
  window.__conceptKb = kb;
  if (window.visualViewport) { visualViewport.addEventListener('resize', kb); visualViewport.addEventListener('scroll', kb); }
  // typing in Search: keep the field at the top of the risen form so results drop into the form's own scroll
  const keepSearchTop = () => { controls.scrollTop = $('addressInputWrapper').offsetTop - 12; };
  $('nameInput').addEventListener('focus', () => setTimeout(keepSearchTop, 50));
  addEventListener('resize', sizeForm);
  paint();
})();
</script>
