<!-- ===== C · THE TAG IS THE BUTTON, round 10 (visual designer, 2026-10-14) =====
     Owner (on round 9c): "i think the tag itself needs to be simplified. i think we could get away by making the tag
     smaller by removing the horizontal lines, so there's just the tag with the + in it, the dotted line, and the "claim
     check" end. then the + would not need to be in any container, so the tag itself becomes the button. explore that -
     don't assume a color for the tag, i think there are many approaches that could work so explore."
     No pin. Layered into a copy of index.html by ../blank-tag-form/stills.js (page key 'T:<variant>[:<w>]').
     Variants (data-tv):
       paper      the shipped tag's paper (--paper-raised), its edge + shadow; a navy + ; --hair perforation
       navy       navy stock (the frame colour, the account's family); a paper + ; paper perforation
       orange     brand-orange stock; a navy + ; navy perforation (NB on a tag orange = starred: shown, flagged)
       twoend     paper body + navy +, the claim-check END in brand orange (the part you tear off is the action colour)
       stubplus   paper body left blank, the + on a navy claim-check end (you take the stub: "take a ticket")
       apptag     the app's own Hanging Tag shape in miniature: chamfers on top, the eyelet, the stub along the bottom
       punch      navy stock, the + PUNCHED through it (a claim-check punch): the map shows through the +
       punchor    the same, brand-orange stock
     data-tilt = deg (the tag dropped at a slight angle) -->
<style id="tCss">
  #tb { position: fixed; z-index: 1500; left: 19.9px; border: 0; padding: 0; background: none; -webkit-tap-highlight-color: transparent; }
  #tb svg { display: block; overflow: visible; }
  #tb .tb-shadow { filter: drop-shadow(0 0 .5px var(--tag-edge)) drop-shadow(0 1px 1px var(--tag-shadow-contact)) drop-shadow(0 4px 6px var(--tag-shadow-lift)); }
  #tb.gone { display: none; }
</style>
<script id="tJs">
(function () {
  const R = document.documentElement; if (R.dataset.k !== 'T') return;
  const C = { paper: 'var(--paper-raised)', navy: 'var(--navy)', orange: 'var(--brand-orange)', hair: 'var(--hair)', ink: 'var(--navy)', cream: 'var(--paper)' };
  function footY() { const S = document.getElementById('locations').getBoundingClientRect().top, c = document.querySelector('.leaflet-control-attribution');
    const r = c && c.getBoundingClientRect(); return Math.min(S - 20, r && r.height ? Math.floor(r.top) - 6 : 1e9); }
  function draw() {
    const v = R.dataset.tv || 'paper', W = +(R.dataset.tw || 104), tilt = +(R.dataset.tilt || 0), pr = document.getElementById('tb').classList.contains('press');
    let svg, w, h;
    const plus = (cx, cy, a, sw, col) => `<path d="M${cx - a} ${cy}H${cx + a}M${cx} ${cy - a}V${cy + a}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/>`;
    if (R.dataset.tp) return drawR11(v, R.dataset.tp, pr);
    if (v === 'apptag') {
      // the app's own tag in miniature: chamfered top corners, the eyelet hole on its patch, a stub along the bottom
      w = W; h = Math.round(W * .74); const CH = Math.round(W * .17), ST = Math.round(h * .3), by = h - ST;
      const path = `M${CH} 0H${w - CH}L${w} ${CH}V${h}H0V${CH}Z`;
      svg = `<defs><mask id="tm"><path d="${path}" fill="white"/><circle cx="${w / 2}" cy="9" r="2.6" fill="black"/><circle cx="0" cy="${by}" r="3.5" fill="black"/><circle cx="${w}" cy="${by}" r="3.5" fill="black"/></mask></defs>
        <g class="tb-shadow"><g mask="url(#tm)"><path d="${path}" fill="${C.paper}"/><rect x="${w / 2 - 12}" y="2" width="24" height="14" rx="2.5" fill="var(--paper)"/>
        <circle cx="${w / 2}" cy="9" r="4.2" fill="none" stroke="var(--hair)" stroke-width="2.2"/>
        <line x1="6" y1="${by}" x2="${w - 6}" y2="${by}" stroke="var(--hair)" stroke-width="1.5" stroke-dasharray="4 3"/>
        ${plus(w / 2, (18 + by) / 2 + 1, 13, 5, C.ink)}</g></g>`;
    } else {
      // a claim-check tag lying across: the left end die-cut (two chamfers), the claim-check end on the right
      w = W; h = Math.round(W * .52); const CH = Math.round(h * .3), STUB = Math.round(W * .24), sx = w - STUB;
      const path = `M${CH} 0H${w}V${h}H${CH}L0 ${h - CH}V${CH}Z`;
      const stock = pr ? (v === 'orange' || v === 'punchor' ? 'var(--brand-orange-deep)' : 'var(--paper)') : { paper: C.paper, navy: C.navy, orange: C.orange, twoend: C.paper, stubplus: C.paper, punch: C.navy, punchor: C.orange }[v];
      const perf = { navy: 'rgba(242,235,221,.7)', orange: 'rgba(18,41,63,.55)', punch: 'rgba(242,235,221,.7)', punchor: 'rgba(18,41,63,.55)' }[v] || C.hair;
      const pc = { paper: C.ink, navy: C.cream, orange: C.ink, twoend: C.ink, stubplus: C.cream }[v];
      const bx = (CH * .6 + sx) / 2, by = h / 2, A = Math.round(h * .27), SW = Math.max(4.5, h * .1);
      const endFill = v === 'twoend' ? `<rect x="${sx}" y="0" width="${STUB}" height="${h}" fill="${pr ? 'var(--brand-orange-deep)' : C.orange}"/>` : v === 'stubplus' ? `<rect x="${sx}" y="0" width="${STUB}" height="${h}" fill="${C.navy}"/>` : '';
      const thePlus = v === 'stubplus' ? plus(sx + STUB / 2, by, Math.round(STUB * .3), 4, C.cream) : (v === 'punch' || v === 'punchor') ? '' : plus(bx, by, A, SW, pc);
      const punch = (v === 'punch' || v === 'punchor') ? `<path d="M${bx - A} ${by}H${bx + A}M${bx} ${by - A}V${by + A}" stroke="black" stroke-width="${SW + 1}" stroke-linecap="round"/>` : '';
      svg = `<defs><mask id="tm"><path d="${path}" fill="white"/><circle cx="${sx}" cy="0" r="3.5" fill="black"/><circle cx="${sx}" cy="${h}" r="3.5" fill="black"/>${punch}</mask></defs>
        <g class="tb-shadow"><g mask="url(#tm)"><path d="${path}" fill="${stock}"/>${endFill}
        <line x1="${sx}" y1="6" x2="${sx}" y2="${h - 6}" stroke="${perf}" stroke-width="1.5" stroke-dasharray="4 3"/>${thePlus}</g></g>`;
    }
    const el = document.getElementById('tb'); const pad = 6;
    el.style.width = (w + pad) + 'px'; el.style.height = (h + pad) + 'px';
    el.innerHTML = `<svg width="${w + pad}" height="${h + pad}" viewBox="0 0 ${w + pad} ${h + pad}" aria-hidden="true"><g transform="translate(0 ${pad / 2}) rotate(${tilt} ${w / 2} ${h / 2})">${svg}</g></svg>`;
    el.style.top = (footY() - h - pad / 2) + 'px';
  }
  // ROUND 11 (owner: "The tag is too wide and the plus is too large. Balance feels off. I feel like both sides could get
  // narrower. Also I miss the hole."): proportion presets; the punched hole (with the tag's grommet ring) at the die-cut
  // end; the + centred between the hole and the perforation, smaller; colourways orange (#7) and twoend (#2).
  const P11 = {      // [W, H, chamfer, stub, plusArm, plusStroke]
    p1: [72, 42, 12, 15, 9, 3.6],      // compact: 1.7 : 1
    p2: [64, 44, 13, 14, 8.5, 3.4],    // squat: nearer a real luggage tag's end-on read, 1.45 : 1
    p3: [80, 36, 11, 15, 8, 3.2],      // slim claim check: 2.2 : 1
    p4: [70, 43, 12, 14, 9, 3.6],      // golden: 1.62 : 1
    p5: [64, 38, 11, 13, 8, 3.4],      // round 11b: a slimmer tag for the upright reading
  };
  function drawR11(v, tp, pr) {
    const [w, h, CH, STUB, A, SW] = P11[tp], sx = w - STUB, hx = CH * .85 + 3, hy = h / 2, HR = Math.max(2.6, h * .065);
    const path = `M${CH} 0H${w}V${h}H${CH}L0 ${h - CH}V${CH}Z`;
    const orange = v === 'orange';
    const stock = pr ? (orange ? 'var(--brand-orange-deep)' : 'var(--paper)') : orange ? 'var(--brand-orange)' : 'var(--paper-raised)';
    const endFill = !orange ? `<rect x="${sx}" y="0" width="${STUB}" height="${h}" fill="${pr ? 'var(--brand-orange-deep)' : 'var(--brand-orange)'}"/>` : '';
    const perf = orange ? 'rgba(18,41,63,.5)' : 'var(--hair)';
    const ring = orange ? 'rgba(242,235,221,.55)' : 'var(--hair)';
    // the + sits in the optical middle of the field between the hole's ring and the perforation
    const fx0 = hx + HR + 3, bx = (fx0 + sx) / 2 + .5, by = h / 2;
    const el = document.getElementById('tb'), pad = 6;
    const svg = `<defs><mask id="tm"><path d="${path}" fill="white"/><circle cx="${hx}" cy="${hy}" r="${HR}" fill="black"/><circle cx="${sx}" cy="0" r="3" fill="black"/><circle cx="${sx}" cy="${h}" r="3" fill="black"/></mask></defs>
      <g class="tb-shadow"><g mask="url(#tm)"><path d="${path}" fill="${stock}"/>${endFill}
      <circle cx="${hx}" cy="${hy}" r="${HR + 1.6}" fill="none" stroke="${ring}" stroke-width="2.2"/>
      <line x1="${sx}" y1="5" x2="${sx}" y2="${h - 5}" stroke="${perf}" stroke-width="1.4" stroke-dasharray="3.5 2.5"/>
      <path d="M${bx - A} ${by}H${bx + A}M${bx} ${by - A}V${by + A}" stroke="var(--navy)" stroke-width="${SW}" stroke-linecap="round"/></g></g>`;
    // round 11b: turned 90 degrees. up = the hole at the top, the claim-check end at the bottom (a hanging tag, like
    // the Hanging Tag's stub); down = the hole at the bottom, the end at the top. The + is symmetric, so it stays.
    const rot = R.dataset.trot;
    if (rot === 'up' || rot === 'down') {
      const W2 = h + pad, H2 = w + pad, t = rot === 'up' ? `translate(${h + pad / 2} 0) rotate(90)` : `translate(${pad / 2} ${w}) rotate(-90)`;
      el.style.width = W2 + 'px'; el.style.height = H2 + 'px';
      el.innerHTML = `<svg width="${W2}" height="${H2}" viewBox="0 0 ${W2} ${H2}" aria-hidden="true"><g transform="${t}">${svg}</g></svg>`;
      el.style.top = (footY() - w - pad / 2) + 'px'; el.style.left = (19.9 - pad / 2) + 'px';
      return;
    }
    el.style.width = (w + pad) + 'px'; el.style.height = (h + pad) + 'px';
    el.innerHTML = `<svg width="${w + pad}" height="${h + pad}" viewBox="0 0 ${w + pad} ${h + pad}" aria-hidden="true"><g transform="translate(0 ${pad / 2})">${svg}</g></svg>`;
    el.style.top = (footY() - h - pad / 2) + 'px';
  }
  function mount() { if (!document.getElementById('tb')) { const b = document.createElement('button'); b.id = 'tb'; b.setAttribute('aria-label', 'Add a place'); document.body.appendChild(b); } draw(); }
  window.__T = { mount, draw };
  addEventListener('load', () => { mount(); setInterval(() => { const el = document.getElementById('tb'); if (el && !el.classList.contains('gone')) draw(); }, 200); });
  if (document.readyState !== 'loading') setTimeout(mount, 0);
})();
</script>
