<!-- ===== C · PIN+TAG BUTTON, round 9 (visual designer, 2026-10-14) =====
     Owner (on round 8b): "Blank pin looks ugly. I wanted to explore the version where the pin+tag was the button and see
     if that could work with tweaks." Director turn 38: the pin at the app's own pin size; the tag reads as the Hanging
     Tag at 1x (die-cut, eyelet patch, stub perforation, side notches); ONE +; orange off the paper, the tag cream.
     Layered into a copy of index.html by ../blank-tag-form/stills.js. Variant dials on <html>:
       data-cpin = fill (orange face, deep-orange rim: the selected-pin grammar, blank: no glyph) | ring (cream face, orange ring)
       data-cstub = cream (the stub printed, perforation only) | navy (the stub's first segment = ADD's navy flood, full width)
       data-cstub = third: the stub in three segments, the first ADD's navy flood (the form's stub in miniature)
       data-cps = big: the + at 34 / 5.5 instead of 28 / 4.5
       data-cplus = tag (a navy + printed on the tag, where you'll write) | pin (the + on the pin's face, where the glyph goes)
     The object: pin 32 (+2 halo) / string 1.5 (the real .tag-string ink) 14 / tag 100 x 84 (62 body + 22 stub),
     chamfers 20, patch 26 x 15 with its grommet, perforation 1.5 dashed --hair, notches r3.5. Bottom-left: the tag's
     left edge on the 19.9 ink line, its foot 20 above the list. -->
<style id="cCss">
  #cp { position: fixed; z-index: 1500; left: 19.9px; width: 100px; height: 125px; border: 0; padding: 0; background: none; -webkit-tap-highlight-color: transparent; }
  #cp svg { display: block; overflow: visible; }
  #cp .cp-tag { filter: drop-shadow(0 0 .5px var(--tag-edge)) drop-shadow(0 1px 1px var(--tag-shadow-contact)) drop-shadow(0 4px 6px var(--tag-shadow-lift)); }
  #cp.press .cp-paper { fill: var(--paper); }
  #cp.press .cp-face { fill: var(--brand-orange-deep); }
  #cp.gone { display: none; }
</style>
<script id="cJs">
(function () {
  /* round 9b dials (on <html>): data-cform = hang | push (the pin pushed through the eyelet: a tag pinned to the map, no string)
       data-cpin = fill | ring | fillplus | ringplus   (ring = the app's own pin grammar: paper face, coloured ring; fill = the selected grammar)
       data-cplus = tag | none ; data-cps = 0 (28/4.5) | 1 (34/5.5) | 2 (38/6.5) ; data-cw = tag width (default 100) */
  const R = document.documentElement;
  function draw() {
    const form = R.dataset.cform || 'hang', pin = R.dataset.cpin || 'fill', plusOn = R.dataset.cplus || 'tag';
    const W = +(R.dataset.cw || 100), TH = Math.round(W * .84), BODY = TH - 22, CH = Math.round(W * .2), PIN = +(R.dataset.cpd || 32), HALO = 2;
    const pw = PIN + 2 * HALO, pc = W / 2;
    let py, top, eyeY;
    if (form === 'hang') { py = pw / 2; eyeY = pw + 14; top = eyeY - 9; }
    else { top = pw / 2 - 2; eyeY = top + 9; py = eyeY; }      // push: the pin's centre on the eyelet
    const tagPath = `M${CH} ${top}H${W - CH}L${W} ${top + CH}V${top + TH}H0V${top + CH}Z`;
    const notch = x => `<circle cx="${x}" cy="${top + BODY}" r="3.5" fill="black"/>`;
    const ring = pin.startsWith('ring');
    const face = `<circle cx="${pc}" cy="${py}" r="${pw / 2}" fill="var(--paper)"/>` + (ring
      ? `<circle class="cp-face" cx="${pc}" cy="${py}" r="${PIN / 2 - 1.5}" fill="#F2EBDD" stroke="var(--brand-orange)" stroke-width="3"/>`
      : `<circle class="cp-face" cx="${pc}" cy="${py}" r="${PIN / 2 - 1.25}" fill="var(--brand-orange)" stroke="var(--brand-orange-deep)" stroke-width="2.5"/>`);
    const pa = PIN * .22, psw = Math.max(3, PIN * .1);
    const pinPlus = /plus/.test(pin) ? `<path d="M${pc - pa} ${py}H${pc + pa}M${pc} ${py - pa}V${py + pa}" stroke="${ring ? 'var(--brand-orange-deep)' : pin === 'fillplusc' ? 'var(--paper)' : 'var(--navy)'}" stroke-width="${psw}" stroke-linecap="round"/>` : '';
    const PS = [[14, 4.5], [17, 5.5], [19, 6.5], [22, 8], [24, 9]][+(R.dataset.cps || 0)];
    const by = form === 'hang' ? top + BODY * .53 : top + 18 + (BODY - 18) / 2;
    const tagPlus = plusOn === 'tag' ? `<path d="M${pc - PS[0]} ${by}H${pc + PS[0]}M${pc} ${by - PS[0]}V${by + PS[0]}" stroke="var(--navy)" stroke-width="${PS[1]}" stroke-linecap="round"/>` : '';
    const el = document.getElementById('cp');
    if (form === 'side') return drawSide(el, pin, plusOn, W);
    el.style.width = W + 'px';
    el.innerHTML = `<svg width="${W}" height="${top + TH}" viewBox="0 0 ${W} ${top + TH}" aria-hidden="true">
      <defs><mask id="cpm"><path d="${tagPath}" fill="white"/><circle cx="${pc}" cy="${eyeY}" r="2.6" fill="black"/>${notch(0)}${notch(W)}</mask></defs>
      <g class="cp-tag"><g mask="url(#cpm)"><path class="cp-paper" d="${tagPath}" fill="var(--paper-raised)"/>
        ${form === 'hang' ? `<rect x="${pc - 13}" y="${top + 1.5}" width="26" height="15" rx="2.5" fill="var(--paper)"/><circle cx="${pc}" cy="${eyeY}" r="4.4" fill="none" stroke="var(--hair)" stroke-width="2.4"/>` : ''}
        <line x1="6" y1="${top + BODY}" x2="${W - 6}" y2="${top + BODY}" stroke="var(--hair)" stroke-width="1.5" stroke-dasharray="4 3"/>
        ${tagPlus}</g></g>
      ${form === 'hang' ? `<rect x="${pc - .75}" y="${pw - 2}" width="1.5" height="${eyeY - pw + 2}" fill="var(--ink-2)"/>` : ''}
      <g ${form === 'push' ? 'style="filter:drop-shadow(0 1.5px 1.5px rgba(26,26,24,.18))"' : ''}>${face}${pinPlus}</g></svg>`;
    el.style.height = (top + TH) + 'px';
    const S = document.getElementById('locations').getBoundingClientRect().top; el.style.top = (S - 20 - (top + TH)) + 'px';
  }
  // SIDE: a shipping tag lying across, pinned to the map through its eyelet at the left end by the app's own pin;
  // the + printed on the tag to the right (never under the pin: a ring over a cross reads as the female sign);
  // the stub is the right end, its perforation upright, the notches top and bottom.
  function drawSide(el, pin, plusOn, W) {
    const H = Math.round(W * .52), CH = Math.round(H * .3), PIN = +(R.dataset.cpd || 32), pw = PIN + 4, STUB = Math.round(W * .2);
    const ex = CH + 2, ey = H / 2;                                   // the eyelet near the left end
    const ox = Math.max(0, pw / 2 - ex), oy = Math.max(0, pw / 2 - ey);   // room for the pin's halo
    const T = (x, y) => `${x + ox} ${y + oy}`;
    const tagPath = `M${T(CH, 0)}L${T(W, 0)}L${T(W, H)}L${T(CH, H)}L${T(0, H - CH)}L${T(0, CH)}Z`;
    const ring = pin.startsWith('ring'), px = ex + ox, py = ey + oy, RW = +(R.dataset.crw || 3);
    const face = `<circle cx="${px}" cy="${py}" r="${pw / 2}" fill="var(--paper)"/>` + (ring
      ? `<circle class="cp-face" cx="${px}" cy="${py}" r="${PIN / 2 - RW / 2}" fill="#F2EBDD" stroke="var(--brand-orange)" stroke-width="${RW}"/>`
      : `<circle class="cp-face" cx="${px}" cy="${py}" r="${PIN / 2 - 1.25}" fill="var(--brand-orange)" stroke="var(--brand-orange-deep)" stroke-width="2.5"/>`);
    const PS = [[13, 4.5], [16, 5.5], [18, 6.5], [21, 7.5], [23, 8.5]][+(R.dataset.cps || 0)];
    const bx = ox + (ex + pw / 2 + (W - STUB)) / 2, by = oy + H / 2;
    // a blank tag's printed write-on lines (the form's rules), when the + is on the pin
    const lx0 = ox + ex + pw / 2 + 8, lx1 = ox + W - STUB - 8;
    const rules = plusOn === 'rules' ? [0.42, 0.68].map(f => `<line x1="${lx0}" y1="${oy + H * f}" x2="${lx1}" y2="${oy + H * f}" stroke="var(--hair)" stroke-width="1.5"/>`).join('') : '';
    const plus = plusOn === 'tag' ? `<path d="M${bx - PS[0]} ${by}H${bx + PS[0]}M${bx} ${by - PS[0]}V${by + PS[0]}" stroke="var(--navy)" stroke-width="${PS[1]}" stroke-linecap="round"/>` : '';
    // the + as the pin's glyph (round 9c): the app's pin grammar -- ring pin: an orange-deep + on the paper face; filled: navy or paper
    const heavy = R.dataset.cg === 'heavy', ga = PIN * (heavy ? .27 : .24), gsw = Math.max(3, PIN * (heavy ? .135 : .11));
    const pinGlyph = /plus/.test(pin) ? `<path d="M${px - ga} ${py}H${px + ga}M${px} ${py - ga}V${py + ga}" stroke="${ring ? 'var(--brand-orange-deep)' : pin === 'fillplusc' ? 'var(--paper)' : 'var(--navy)'}" stroke-width="${gsw}" stroke-linecap="round"/>` : '';
    const sx = ox + W - STUB, Wt = W + ox, Ht = H + oy * 2;
    el.style.width = Wt + 'px';
    el.innerHTML = `<svg width="${Wt}" height="${Ht}" viewBox="0 0 ${Wt} ${Ht}" aria-hidden="true">
      <defs><mask id="cpm"><path d="${tagPath}" fill="white"/><circle cx="${sx}" cy="${oy}" r="3.5" fill="black"/><circle cx="${sx}" cy="${oy + H}" r="3.5" fill="black"/></mask></defs>
      <g class="cp-tag"><g mask="url(#cpm)"><path class="cp-paper" d="${tagPath}" fill="var(--paper-raised)"/>
        <line x1="${sx}" y1="${oy + 6}" x2="${sx}" y2="${oy + H - 6}" stroke="var(--hair)" stroke-width="1.5" stroke-dasharray="4 3"/>${plus}${rules}</g></g>
      <g style="filter:drop-shadow(0 1.5px 1.5px rgba(26,26,24,.18))">${face}${pinGlyph}</g></svg>`;
    el.style.height = Ht + 'px';
    el.style.top = (footY() - Ht) + 'px';
  }
  function footY() { const S = document.getElementById('locations').getBoundingClientRect().top, c = document.querySelector('.leaflet-control-attribution');
    const r = c && c.getBoundingClientRect(); return Math.min(S - 20, r && r.height ? Math.floor(r.top) - 6 : 1e9); }
  function mount() { if (!document.getElementById('cp')) { const b = document.createElement('button'); b.id = 'cp'; b.setAttribute('aria-label', 'Add a place'); document.body.appendChild(b); } draw(); }
  window.__C = { mount, draw };
  if (R.dataset.k === 'C') { mount(); setInterval(() => { const el = document.getElementById('cp'); if (el && !el.classList.contains('gone')) { el.style.top = (footY() - el.offsetHeight) + 'px'; } }, 60); }
})();
</script>
