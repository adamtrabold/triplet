<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Archivo'; src: local('Arial'); }
  html,body{margin:0;padding:0;background:#F2EFE9;font-family:Archivo,Arial,sans-serif;}
  .sheet{padding:24px;}
  h2{font:700 15px/1.3 Archivo,Arial;color:#12293F;margin:28px 0 4px;}
  .sub{font:400 11px/1.4 Archivo,Arial;color:#5A564C;margin:0 0 10px;max-width:680px;}
  .row{display:flex;align-items:center;gap:18px;margin-bottom:6px;flex-wrap:wrap;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .cell .lab{font:600 9px/1 Archivo,Arial;color:#5A564C;text-transform:uppercase;letter-spacing:.03em;}
  .tile{background:#F2EFE9;border:1px solid #D8CEBA;border-radius:4px;display:flex;align-items:center;justify-content:center;}
  svg.marker-star-halo{stroke:#F2EBDD;fill:#1A1A18;}
  svg.marker-star-ink{fill:#1A1A18;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
<symbol id="g-restaurant" viewBox="0 0 24 24"><path fill="currentColor" d="M6 2h2v7h1V2h2v7h1V2h2v8a3 3 0 0 1-2 2.83V22h-4v-9.17A3 3 0 0 1 6 10V2z"/></symbol>
<symbol id="g-cafe" viewBox="0 0 24 24"><path fill="currentColor" d="M3 4h13v7a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V4z"/><path fill="currentColor" d="M17 6h2a3 3 0 0 1 0 6h-2V6z"/><path fill="currentColor" d="M2 19h16v2H2z"/></symbol>
<symbol id="g-bar" viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h18l-8 9v7h4v2H7v-2h4v-7L3 3z"/></symbol>
<symbol id="g-attraction" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l3 6v11H9V8l3-6z"/><path fill="currentColor" d="M7 20h10v2H7z"/></symbol>
<symbol id="g-nature" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l4 6h-2.5l3 5H14l3.5 6h-11L10 13H7.5l3-5H8l4-6z"/><path fill="currentColor" d="M11 18h2v4h-2z"/></symbol>
<symbol id="g-shopping" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1a4 4 0 0 0-4 4v2h2V5a2 2 0 0 1 4 0v2h2V5a4 4 0 0 0-4-4z"/><path fill="currentColor" d="M4 7h16l-1.5 15h-13L4 7z"/></symbol>
<symbol id="g-hotel" viewBox="0 0 24 24"><path fill="currentColor" d="M2 6h3v7h9a5 5 0 0 1 5 5v3h-3v-2H5v2H2V6z"/><circle fill="currentColor" cx="8.5" cy="9.5" r="2.5"/></symbol>
<symbol id="g-star" viewBox="0 0 24 24"><path fill="currentColor" stroke-linejoin="round" d="M10.81 2.74A1.3 1.3 0 0 1 13.19 2.74L15.45 7.81A0.6 0.6 0 0 0 15.93 8.17L21.46 8.75A1.3 1.3 0 0 1 22.19 11.01L18.06 14.73A0.6 0.6 0 0 0 17.88 15.30L19.03 20.73A1.3 1.3 0 0 1 17.11 22.12L12.30 19.35A0.6 0.6 0 0 0 11.70 19.35L6.89 22.12A1.3 1.3 0 0 1 4.97 20.73L6.12 15.30A0.6 0.6 0 0 0 5.94 14.73L1.81 11.01A1.3 1.3 0 0 1 2.54 8.75L8.07 8.17A0.6 0.6 0 0 0 8.55 7.81Z"/></symbol>
</svg>

<div class="sheet" id="app"></div>

<script>
const CATEGORY_COLORS = {
  restaurant: '#AC5019', cafe: '#6E4C22', bar: '#3D5A7A', attraction: '#A68018',
  nature: '#1E3A2B', shopping: '#8A7AA8', hotel: '#2E2433', other: '#4F5450'
};
const PAPER = '#F2EBDD';
const PAPER_FILED = '#E7DFD0';
const INK = '#1A1A18';
const INK2 = '#5A564C';
const NAVY = '#12293F';

function categoryInk(cat){ return CATEGORY_COLORS[cat] || CATEGORY_COLORS.other; }

function badgeHtml(category, size, opts={}) {
  const ink = opts.ink || 'currentColor';
  const fill = opts.fill || PAPER;
  const mark = opts.mark || ink;
  const rim = opts.rim || 2;
  const c = size/2, r = c - rim/2;
  let shell = `<circle cx="${c}" cy="${c}" r="${r}" fill="${fill}" stroke="${ink}" stroke-width="${rim}"/>`;
  let glyph = '';
  if (opts.glyph !== false) {
    const field = size - rim*2;
    const g = Math.min(field-2, Math.max(18, field-4));
    const o = (size-g)/2;
    glyph = `<svg x="${o}" y="${o}" width="${g}" height="${g}" viewBox="0 0 24 24" style="color:${mark};opacity:${opts.glyphOpacity!=null?opts.glyphOpacity:1}"><use href="#g-${category}"/></svg>`;
  }
  let inner = opts.innerRing || '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${shell}${inner}${glyph}</svg>`;
}

function starHtml(size){
  const s = size >= 24 ? size/2 : 10;
  const c = size/2, r = c-1;
  const x = c + r*Math.SQRT1_2 - s/2, y = c - r*Math.SQRT1_2 - s/2;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true" style="position:absolute;left:${x}px;top:${y}px;overflow:visible">`+
    `<use class="marker-star-halo" href="#g-star" stroke-width="${(3*24/s).toFixed(2)}" stroke-linejoin="round"/>`+
    `<use class="marker-star-ink" href="#g-star"/></svg>`;
}
function wrap(inner, size, starred, highlighted){
  return `<div style="position:relative;width:${size}px;height:${size}px;line-height:0;overflow:visible">${inner}${starred?starHtml(size):''}</div>`;
}

// ---- Hybrid 2 (prior round, for direct side-by-side) ----
function muted(hex, amt){
  const h = hex.replace('#',''); const r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
  const tr=90,tg=86,tb=76;
  const mr=Math.round(r+(tr-r)*amt), mg=Math.round(g+(tg-g)*amt), mb=Math.round(b+(tb-b)*amt);
  return `rgb(${mr},${mg},${mb})`;
}
function dottedRimDasharray(size, rim, dots, rOverride){
  const r = rOverride!=null ? rOverride : size/2 - rim/2;
  const C = 2*Math.PI*r;
  const gap = Math.max(0.1, C/dots - 0.02);
  return `0.02 ${gap.toFixed(2)}`;
}
function markerHybrid2(category, size, {visited, starred, highlighted}={}) {
  const ink0 = categoryInk(category);
  const ink = visited ? muted(ink0, 0.42) : ink0;
  const fill = visited ? PAPER_FILED : PAPER;
  const rim = highlighted ? 2.5 : 2;
  const badge = badgeHtmlDash(category, size, {
    ink, fill: highlighted ? ink : fill, mark: highlighted ? fill : ink, rim,
    glyphOpacity: visited && !highlighted ? 0.78 : 1,
    dashRim: (visited && !highlighted) ? dottedRimDasharray(size, rim, 12) : null
  });
  return wrap(badge, size, starred, highlighted);
}
function badgeHtmlDash(category, size, opts={}) {
  const ink = opts.ink, fill = opts.fill, mark = opts.mark, rim = opts.rim || 2;
  const c = size/2, r = c - rim/2;
  let shell;
  if (opts.dashRim) shell = `<circle cx="${c}" cy="${c}" r="${r}" fill="${fill}" stroke="${ink}" stroke-width="${rim}" stroke-dasharray="${opts.dashRim}" stroke-linecap="round"/>`;
  else shell = `<circle cx="${c}" cy="${c}" r="${r}" fill="${fill}" stroke="${ink}" stroke-width="${rim}"/>`;
  const field = size - rim*2;
  const g = Math.min(field-2, Math.max(18, field-4));
  const o = (size-g)/2;
  const glyph = `<svg x="${o}" y="${o}" width="${g}" height="${g}" viewBox="0 0 24 24" style="color:${mark};opacity:${opts.glyphOpacity!=null?opts.glyphOpacity:1}"><use href="#g-${category}"/></svg>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${shell}${glyph}</svg>`;
}

// ---- ROUND 3: "Stamp Ring" -- solid category rim UNCHANGED (identity intact,
// full-strength ink, no muting -- matching the real .is-visited recipe: "every
// ink unchanged, so rows never read disabled"), field recedes paper->paper-filed
// (the real recipe's only ink-adjacent move), PLUS a genuinely separate inner
// navy dotted ring echoing .row-stamp's actual two-part ring+track structure
// and its actual navy ink -- not a muted category hue.
function markerStampRing(category, size, {visited, starred, highlighted, dots=9, navyOpacity=1}={}) {
  const ink = categoryInk(category);
  const fill = visited ? PAPER_FILED : PAPER;
  const rim = highlighted ? 2.5 : 2;
  const c = size/2;
  let innerRing = '';
  if (visited && !highlighted) {
    const rDot = c - rim - 2; // 2px gap inside the solid rim's inner edge
    const dash = dottedRimDasharray(size, 1, dots, rDot);
    innerRing = `<circle cx="${c}" cy="${c}" r="${rDot}" fill="none" stroke="${NAVY}" stroke-opacity="${navyOpacity}" stroke-width="1.4" stroke-dasharray="${dash}" stroke-linecap="round"/>`;
  }
  const badge = badgeHtml(category, size, {
    ink: highlighted ? ink : ink,
    fill: highlighted ? ink : fill,
    mark: highlighted ? fill : ink,
    rim,
    innerRing
  });
  return wrap(badge, size, starred, highlighted);
}

// ---- ROUND 4: "Stamp Ring, outside" -- fixes Round 3's real defect (the
// inner navy dots collided with the glyph -- there is no free radius inside
// the rim once the glyph is drawn at its normal size, confirmed in the
// truesize crop). This flips the geometry to match the REAL .row-stamp
// order: the dotted TRACK sits OUTSIDE the ring (mask covers the whole
// 72x32 box), the solid ring is INSET inside the track -- not the other way
// around. So here: the navy dots ring the OUTSIDE of the solid category rim
// (grows the visible footprint by ~3px radius), leaving the rim and the
// entire glyph field completely untouched -- zero collision risk, and
// zero change to badgeHtml()'s own tuned glyph-floor formula.
function markerStampRingOuter(category, size, {visited, starred, highlighted, dots=10, navyOpacity=1}={}) {
  const ink = categoryInk(category);
  const fill = visited ? PAPER_FILED : PAPER;
  const rim = highlighted ? 2.5 : 2;
  const c = size/2;
  const badge = badgeHtml(category, size, { ink, fill: highlighted ? ink : fill, mark: highlighted ? fill : ink, rim });
  let outerRing = '';
  if (visited && !highlighted) {
    const rOuter = c - rim/2 + 2.6; // ~3px outside the rim's own edge
    const dash = dottedRimDasharray(size, 1, dots, rOuter);
    outerRing = `<circle cx="${c}" cy="${c}" r="${rOuter}" fill="none" stroke="${NAVY}" stroke-opacity="${navyOpacity}" stroke-width="1.5" stroke-dasharray="${dash}" stroke-linecap="round"/>`;
  }
  const svgSize = size + 8;
  const off = 4;
  const badgeInner = badge.replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
  const full = `<svg width="${svgSize}" height="${svgSize}" viewBox="0 0 ${svgSize} ${svgSize}" aria-hidden="true" style="position:absolute;left:-${off}px;top:-${off}px;overflow:visible"><g transform="translate(${off},${off})">${badgeInner}${outerRing}</g></svg>`;
  return `<div style="position:relative;width:${size}px;height:${size}px;line-height:0;overflow:visible">${full}${starred?starHtml(size):''}</div>`;
}

function cell(label, html){
  return `<div class="cell"><div class="lab">${label}</div><div class="tile" style="width:40px;height:40px;">${html}</div></div>`;
}
const CATS = ['restaurant','nature','hotel','shopping'];
const SIZES = [{tag:'FAR 16px', px:16}, {tag:'NEAR 24px', px:24}, {tag:'HI 32px', px:32, hi:true}];

function buildRowSet(title, sub, fn){
  let html = `<h2>${title}</h2><p class="sub">${sub}</p>`;
  SIZES.forEach(s=>{
    html += `<div class="row">`;
    CATS.forEach(cat=>{
      html += cell(`${cat}<br>unvisited ${s.tag}`, fn(cat, s.px, {visited:false, highlighted:s.hi}));
      html += cell(`${cat}<br>VISITED ${s.tag}`, fn(cat, s.px, {visited:true, highlighted:s.hi}));
    });
    if (s.px===24 && !s.hi) html += cell(`restaurant<br>visited+starred`, fn('restaurant', s.px, {visited:true, starred:true}));
    html += `</div>`;
  });
  return html;
}

let out = '';
out += buildRowSet('Hybrid 2 (prior round, reference) — receded field + 12-dot muted-category rim',
  'Shown again here for direct side-by-side comparison.', markerHybrid2);
out += buildRowSet('Round 3 — Stamp Ring: solid category rim intact + separate navy dotted inner ring (9 dots)',
  'Solid rim stays full-strength category ink, unchanged from an unvisited pin (matches the real .is-visited recipe: field recedes, every ink stays put). New: a genuinely separate navy dotted ring inset just inside it -- mirrors .row-stamp\'s real two-part ring+track structure and its actual navy ink, rather than a muted category hue standing in for a stamp.',
  markerStampRing);
out += buildRowSet('Round 3b — same, 7 dots (tighter radius, testing whether 9 crowds at FAR)',
  'Fewer dots at the smaller available radius.', (cat,size,o)=>markerStampRing(cat,size,{...o,dots:7}));
out += buildRowSet('Round 4 — Stamp Ring, OUTSIDE the rim (fixes Round 3\'s glyph collision)',
  'Navy dots ring the outside of the solid category rim instead of the inside -- matches the real .row-stamp\'s actual order (track outside, ring inset inside it), and leaves the rim + entire glyph field byte-for-byte untouched. Costs ~3px of footprint growth on visited pins.',
  markerStampRingOuter);
out += buildRowSet('Round 4b — same, 8 dots, navy at 70% opacity (softer)',
  'Testing a slightly quieter navy so the ring reads as a mark, not a second badge.', (cat,size,o)=>markerStampRingOuter(cat,size,{...o,dots:8,navyOpacity:0.7}));

document.getElementById('app').innerHTML = out;
</script>
</body></html>
