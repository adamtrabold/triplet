<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Icon jam r3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap">
<style>
:root{--paper:#F2EBDD;--raised:#FAF5EA;--hair:#D8CEBA;--ink:#1A1A18;--ink2:#5A564C;--navy:#12293F;--or:#EE7434;--ord:#A8400C}
*{box-sizing:border-box}
body{margin:0;background:#E4DCCB;color:var(--ink);font-family:Archivo,Arial,sans-serif;width:390px}
.card{background:var(--raised);padding:14px 16px 16px;margin:0 0 24px}
.card h2{font-size:17px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.no{font-size:10px;letter-spacing:.12em;color:var(--ink2);font-weight:700;text-transform:uppercase}
.att{font-size:13px;margin:4px 0 6px;line-height:1.35}
.notes{font-size:12px;line-height:1.35;margin:6px 0 4px;padding:0;list-style:none}
.notes li{margin:0 0 4px;display:grid;grid-template-columns:70px 1fr;align-items:baseline}
.notes b{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.sec{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);font-weight:700;margin:16px 0 6px;padding-top:8px;border-top:1px solid var(--hair)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 2px}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px}
.cell svg{width:24px;height:24px;display:block}
.cell span{font-size:8px;letter-spacing:.04em;color:var(--ink2);text-align:center;line-height:1.1;text-transform:uppercase}
.cell.fixed span{color:var(--ord);font-weight:700}
.strip{display:flex;align-items:center;gap:6px;min-height:26px;flex-wrap:wrap}
.strip .lab{font-size:8.5px;letter-spacing:.08em;color:var(--ink2);flex:0 0 100%;text-transform:uppercase;font-weight:700;margin:4px 0 -2px}
.strip svg{display:block;flex:none}
.copy{filter:url(#thr)}
.fx{font-size:7.5px;font-weight:700;letter-spacing:.1em;color:var(--ord);background:#FBE3D3;padding:1px 3px;border-radius:2px}
.bleed{margin:0 -16px}
/* header crop */
.maptop{position:relative;height:74px;background:#E8E4DA}
.zoom{position:absolute;left:12px;top:10px;width:34px;border:2px solid rgba(0,0,0,.2);border-radius:4px;background:#fff;overflow:hidden}
.zoom div{height:30px;display:grid;place-items:center;color:#000}
.zoom div+div{border-top:1px solid #ccc}
.zoom svg{width:18px;height:18px}
.scal{position:absolute;top:12px;width:50px;height:50px;background:var(--navy);display:grid;place-items:center;color:var(--or)}
.lhead{height:56px;background:#EFE7D8;display:flex;align-items:center;padding:0 16px;gap:14px;border-bottom:1px solid var(--hair);color:var(--navy)}
.lhead .t{flex:1;font-size:14.5px;font-weight:700;letter-spacing:.1em;white-space:nowrap}
/* rows */
.row{display:flex;align-items:center;gap:10px;height:56px;background:#F1E9DB;padding:0 16px;border-bottom:1px solid var(--hair)}
.row.v{background:#E7DFD0}
.row.sel{background:var(--navy);color:var(--paper)}
.badge{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid;background:var(--paper);display:grid;place-items:center}
.badge svg{width:18px;height:18px;display:block}
.row.sel .badge{background:var(--navy);border-color:var(--paper)}
.nm{font-size:16px;font-weight:600;line-height:1.15;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;font-size:10.5px;letter-spacing:.08em;font-weight:700;opacity:.72;margin-top:2px}
.stamp{width:72px;flex:none}
/* tag stub */
.stub{display:flex;background:var(--raised);border-top:1.5px dashed var(--hair);height:76px;border-bottom:1px solid var(--hair);position:relative}
.seg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink);position:relative;text-align:center}
.seg+.seg{border-left:1.5px dashed var(--hair)}
.seg img{width:86px}
.seg .fx{position:absolute;top:4px;right:4px}
.stubwrap{background:#E9E1D1;padding:8px 0}
/* map */
.map{position:relative;height:170px;overflow:hidden;background:#E8E4DA}
.map>svg.tiles{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2px solid;width:24px;height:24px}
.pin svg{width:18px;height:18px;display:block}
.pin.approx{border-style:dashed}
.pin.sel{width:32px;height:32px;border-width:2.5px;border-color:var(--paper);box-shadow:0 0 0 1px rgba(0,0,0,.2),0 2px 5px rgba(0,0,0,.2)}
.pin.sel svg{width:23px;height:23px}
.pstar{position:absolute;width:12px;height:12px;right:-6px;top:-6px}
.clu{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--ord);border:2px solid var(--paper);color:var(--paper);font-size:10px;font-weight:700;display:grid;place-items:center}
.stk{position:absolute;width:40px;height:40px}
.maplab{position:absolute;font-size:7.5px;font-weight:700;letter-spacing:.08em;color:var(--ink2);background:rgba(250,245,234,.85);padding:1px 3px;border-radius:2px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;background:var(--raised);border:1px solid var(--hair);border-bottom:2px solid;font-size:11px;font-weight:700;letter-spacing:.08em}
.chip.off{border:1px dashed #C9BEA6;color:var(--ink2)}
.chip svg{width:12px;height:12px}
.proof{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--navy);display:flex;align-items:center;gap:5px;padding:7px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);margin-top:8px;flex-wrap:wrap}
.inset{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--hair);padding:5px 8px;font-size:9.5px;color:var(--ink2);letter-spacing:.06em;margin-top:8px}
.verdict{background:#F3ECDF;border-left:3px solid var(--navy);padding:7px 9px;font-size:12px;line-height:1.35;margin-top:8px}
.sbs h3{font-size:12px;letter-spacing:.1em;color:var(--navy);margin:14px 0 6px;text-transform:uppercase}
.drow{display:flex;gap:10px;align-items:center;font-size:12px;line-height:1.3;margin:8px 0}
.drow svg{width:28px;height:28px;flex:none}
.drow b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.brand .bl{font-size:13px;line-height:1.38;margin:12px 0 0}.brand .bl b{display:block;font-size:15.5px;color:var(--navy);margin-bottom:2px;line-height:1.25}
.brand .bl.last b{font-size:14px}
.pv{display:flex;align-items:center;gap:14px;margin-top:10px;background:#FAF5EA;border:1px solid var(--hair);padding:10px 12px}
.plab{border:1.5px solid var(--navy);padding:6px 9px;font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--navy);display:flex;flex-direction:column;gap:2px}
.plab span,.cap{font-size:7.5px;letter-spacing:.14em;color:var(--ink2);font-weight:700}
.pstamp{position:relative;display:flex;flex-direction:column;align-items:center}.pstamp img{width:104px}.pstamp .fx{position:absolute;top:-6px;right:-8px}
.savoy{display:block;width:100%;height:170px;object-fit:cover;margin-top:10px;border-radius:2px}.src{display:block;font-size:9.5px;color:var(--ink2);margin-top:3px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;padding-top:10px;border-top:1px solid var(--hair)}
.cols h4{margin:0 0 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy)}
.cols ul{margin:0;padding:0;list-style:none;font-size:12px;line-height:1.3}.cols li{margin:0 0 7px;padding-left:10px;position:relative}
.cols li:before{content:"";position:absolute;left:0;top:6px;width:4px;height:4px;background:var(--ink2)}.cols svg{vertical-align:-2px;margin-left:3px}
.drow .strip svg{width:18px;height:18px}</style></head><body>

 district:'<rect x="-1" y="-1" width="26" height="26" fill="currentColor"/>'+`<path fill="none" ${KOS} stroke-width="2" d="M7 -1L13.6 25M-1 8.6L25 16.6M15.4 -1L19.4 11.2"/>`,
 street:'<path fill="none" stroke="currentColor" stroke-width="8.4" d="M3 26C5 15 9.6 12.4 12.4 11.2C15.4 9.9 18.6 7 20.6 -2"/>'+`<path fill="none" ${KOS} stroke-width="1.4" stroke-dasharray="2.6 2.4" d="M3.9 25C5.8 15 10 12.6 12.4 11.6C15 10.4 17.8 7.6 19.6 -1"/>`,
};
let clipN=0;
// a place mark: kind 'p1'|'p2', shell 'circle'|'diamond'|'none', size px (outer), rim px, selected?
const mark=(kind,c,size,o={})=>{const ink=INK[c],sel=o.sel,rimPx=o.rim??2,shell=o.shell||'circle';
 const rimU=rimPx*24/size;const id='k'+(clipN++);
 const fg=sel?'var(--paper)':ink, field=sel?(o.row?'var(--navy)':ink):'var(--paper)', ko=sel?ink:'var(--paper)';
 if(shell==='none')return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" style="display:block;flex:none;color:${ink};--ko:var(--raised)">${(kind==='p2'?P2:P1)[c]}</svg>`;
 let rim,clip;
 if(shell==='diamond'){const r=12-rimU/2;rim=`<path d="M12 ${12-r}L${12+r} 12 12 ${12+r} ${12-r} 12Z" fill="${field}" stroke="${sel?'var(--paper)':ink}" stroke-width="${rimU}" stroke-linejoin="round"/>`;
  const q=r-rimU/2-(kind==='p2'?0.9:0);clip=`<path d="M12 ${12-q}L${12+q} 12 12 ${12+q} ${12-q} 12Z"/>`;}
 else{rim=`<circle cx="12" cy="12" r="${12-rimU/2}" fill="${field}" stroke="${sel?'var(--paper)':ink}" stroke-width="${rimU}"/>`;
  clip=`<circle cx="12" cy="12" r="${12-rimU-(kind==='p2'?0.9*24/size*(size/24):0)}"/>`;}
 const inner=kind==='p2'?`<g clip-path="url(#${id})" style="color:${fg};--ko:${ko}">${P2[c]}</g>`
  :`<g transform="translate(${12-(o.g||0.75)*12} ${12-(o.g||0.75)*12}) scale(${o.g||0.75})" style="color:${fg};--ko:${ko}">${(shell==='diamond'?P1:P1)[c]}</g>`;
 return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" style="display:block;flex:none;overflow:visible${sel?';filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))':''}"><defs><clipPath id="${id}">${clip}</clipPath></defs>${rim}${inner}</svg>`;};
// shell for shapes per variant
const shellFor=(c,v)=>(c==='district'||c==='street')&&v==='dia'?'diamond':'circle';
const row=(kind,c,name,o={})=>`<div class="row${o.v?' v':''}${o.sel?' sel':''}">${mark(kind,c,24,{row:1,sel:o.sel,shell:o.shell,g:o.shell==='diamond'?0.6:0.75})}${o.star?sv(f(STAR),'var(--or)',16):''}<div class="nm">${name}<small>${c.toUpperCase()} · REYKJAVÍK</small></div>${o.v?`<img class="stamp" src="ref-row-stamp${o.sel?'-selected':''}.png" alt="">`:''}${sv(LN('M6.5 6.5l11 11M17.5 6.5l-11 11',14,1.5),o.sel?'rgba(242,235,221,.8)':'var(--ink2)',14)}</div>`;
const mapP=(kind,h=170)=>{const at=(c,x,y,o={})=>`<div style="position:absolute;left:${x}px;top:${y}px">${mark(kind,c,o.sel?32:24,{sel:o.sel,rim:o.sel?2.5:2})}${o.star?`<svg class="pstar" viewBox="0 0 24 24"><path d="${STAR}" fill="#EE7434" stroke="#FAF5EA" stroke-width="6" paint-order="stroke"/><path d="${STAR}" fill="none" stroke="#A8400C" stroke-width="1.5"/></svg>`:''}</div>`;
 return `<div class="map bleed" style="height:${h}px">${tiles(h)}
 ${at('restaurant',36,20)}${at('bar',150,62)}${at('cafe',226,14,{sel:1})}${at('nature',318,82,{star:1})}${at('hotel',58,h-58)}${at('shopping',196,96)}${at('attraction',90,92)}
 <div class="clu" style="left:16px;top:${Math.round(h*.4)}px">4</div>
 <img class="stk" src="ref-sticker-near.png" style="left:248px;top:${h-62}px" alt=""><span class="maplab" style="left:282px;top:${h-40}px">VISITED · FIXED</span></div>`;};
const chipRow=(kind,mode)=>`<div class="chips">${[['restaurant',1],['cafe',1],['bar',0],['district',1],['street',0]].map(([c,on])=>{
 const ink=on?INK[c]:'#9A9282';const g=mode==='bare'?`<svg viewBox="0 0 24 24" width="12" height="12" style="color:${ink};--ko:var(--raised)">${(kind==='p2'?P2:P1)[c]}</svg>`
  :`<span style="filter:${on?'none':'grayscale(1) opacity(.55)'}">${mark(kind,c,16,{rim:1.5})}</span>`;
 return `<div class="chip${on?'':' off'}" style="border-bottom-color:${on?INK[c]:'#C9BEA6'}">${g}${c.toUpperCase()}</div>`}).join('')}</div>`;
const allRow=(kind,size,v)=>`<div class="strip" style="gap:${size>20?7:5}px">${CAT.map(c=>mark(kind,c,size,{shell:shellFor(c,v),g:shellFor(c,v)==='diamond'?0.6:0.75})).join('')}</div>`;

// ---- Weight still
const WROWS=[ // name, size, today px, drawer(px)
 ['+ badge',26.4,'2.00',p=>tool(TB,'plus',26.4,p)],
 ['account',24,'2.00',p=>tool(TB,'account',24,p)],
 ['sort',18,'1.50',p=>tool(TB,'sort',18,p)],
 ['filters',18,'1.50',p=>tool(TB,'filters',18,p)],
 ['locate',20,'2.08',p=>tool(TB,'locate',20,p)],
 ['tag ×',14,'1.28',p=>tool(TB,'close',14,p)],
 ['chevron',16,'1.50',p=>tool(TB,'chevron',16,p)],
 ['directions',20,'1.90',p=>tool(TB,'directions',20,p)],
 ['star off',20,'1.67',p=>starOff(p)],
];
const TODAYW={ '+ badge':sv('<path fill="none" stroke="currentColor" stroke-width="1.8182" stroke-linecap="round" d="M12 5v14M5 12h14"/>',N,26.4),
 account:sv(G.T.account,N,24), sort:sv(G.T.sort,N,18), filters:sv(G.T.filters,N,18), locate:sv(G.T.locate,N,20), 'tag ×':sv(G.T.close,N,14),
 chevron:sv(G.T.chevron,N,16), directions:todayDir, 'star off':todayStar};
const wcell=(x,lab)=>`<div class="wc">${x}</div>`;
const weight=()=>`<div class="wt"><div class="wh"><span></span><span>Today</span><span>One rule: 1.5px</span><span>One rule: 2.0px</span></div>
 ${WROWS.map(([n,s,t,dr])=>`<div class="wr"><span class="wn">${n}<i>${t}px today</i></span>${wcell(TODAYW[n])}${wcell(dr(1.5))}${wcell(dr(2))}</div>`).join('')}
 <div class="wr fixed"><span class="wn">mark visited<i>1.52px · FIXED</i></span>${wcell(CHK(20))}${wcell(CHK(20))}${wcell(CHK(20))}</div>
 <div class="wr"><span class="wn">place rim<i>2.00px today</i></span>${wcell(mark('p1','cafe',24,{rim:2}))}${wcell(mark('p1','cafe',24,{rim:1.5}))}${wcell(mark('p1','cafe',24,{rim:2}))}</div></div>`;

const out=[];
// J1 grammar
out.push(`<div class="card"><div class="no">Jam turn 13 · visual · sketch 1 of 3</div><h2>Only blanks are empty</h2>
<p class="att">One law under every option: <b>the only empty shapes in the app are the blanks you haven't filled</b> (star off, mark visited). Tools may be lines, but anything closed has something solid in it. Strokes all 2.0px on screen; the check is FIXED at 1.52.</p>
<div class="sec">Tag strip: today</div><div class="bleed stubwrap" style="padding:0">${tagStrip(todayDir,todayStar)}</div>
<div class="sec">B · lines with solid hearts (directions = ring + needle)</div><div class="bleed stubwrap" style="padding:0">${tagStrip(tool(TB,'directions',20,2),starOff(2))}</div>
<div class="sec">A · road paint (directions = a solid arrow)</div><div class="bleed stubwrap" style="padding:0">${tagStrip(tool(TA,'directions',20,2),starOff(2))}</div>
<div class="sec">Starred (both): orange fill, same silhouette</div><div class="bleed stubwrap" style="padding:0"><div class="stub">${seg(tool(TB,'directions',20,2),'DIRECTIONS')}${seg(starOn,'STARRED')}${seg('<img src="ref-tag-stamp.png" alt="">','',1)}</div></div>
<div class="sec">B · header</div>${head(TB,2)}
<div class="sec">A · header</div>${head(TA,2)}
<div class="verdict">A and B differ in three icons (account, locate, directions) and the sort heads. Not two concepts: one law, one question, best asked in the tag strip.</div></div>`);
// J2 places
out.push(`<div class="card"><div class="no">Jam turn 13 · visual · sketch 2 of 3</div><h2>Places: Specimen vs Roundel</h2>
<p class="att"><b>Specimen</b>: the solid place floats inside the rim with paper around it (Cut Paper silhouettes; a cream inlay only where the object really has one). <b>Roundel</b>: the circle is the scissors: a close-up, cropped by the rim, like a coin or a porthole.</p>
<div class="sec">Specimen · 24px row badge (district/street in circle, then diamond)</div>${allRow('p1',24,'circ')}<div style="height:6px"></div>${allRow('p1',24,'dia')}
<div class="sec">Roundel · 24px row badge</div>${allRow('p2',24,'circ')}
<div class="sec">Specimen · rows</div><div class="bleed">${row('p1','restaurant','Bæjarins Beztu')}${row('p1','cafe','Café Loki',{v:1})}${row('p1','cafe','Brauð &amp; Co',{v:1,sel:1,star:1})}${row('p1','district','Grandi')}</div>
<div class="sec">Roundel · rows</div><div class="bleed">${row('p2','restaurant','Bæjarins Beztu')}${row('p2','cafe','Café Loki',{v:1})}${row('p2','cafe','Brauð &amp; Co',{v:1,sel:1,star:1})}${row('p2','district','Grandi')}</div>
<div class="sec">Specimen · map</div>${mapP('p1')}
<div class="sec">Roundel · map</div>${mapP('p2')}
<div class="verdict">Roundel is bigger at the same 24px and differs in kind from Specimen, but costs more ink per pin, and some crops turn into other signs (area as a hatched coin, other as a radio button). Specimen is calm and closest to what he picked.</div>
<div class="sec">Chips: Specimen bare 12 / Specimen in rim 16 / Roundel 16</div>${chipRow('p1','bare')}<div style="height:8px"></div>${chipRow('p1','rim')}<div style="height:8px"></div>${chipRow('p2','rim')}
</div>`);
// J3 weight
out.push(`<div class="card"><div class="no">Jam turn 13 · visual · sketch 3 of 3</div><h2>One line weight</h2>
<p class="att">Every line in the app at the size it ships. Today the same "stroke 2" lands anywhere from 1.28 to 2.08px. The fixed check is 1.52px, and it can't move.</p>${weight()}<div class="verdict">Read at phone size: the fixed check (1.52px) is a hollow bar, two edges close together, so it reads as heavy as a 2.0px line, not a 1.5px one. A 2.0px rule sits with it; at 1.5px the star off goes weaker than the check, which is today's "checked stronger than open" again.</div></div>`);
document.getElementById('out').innerHTML=out.join('');
</script>

.wn{font-size:11px;font-weight:700;color:var(--navy)}.wn i{display:block;font-style:normal;font-weight:400;font-size:9px;color:var(--ink2)}
