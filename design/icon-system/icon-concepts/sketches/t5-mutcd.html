<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Icon concepts t5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap">
<style>
:root{--paper:#F2EBDD;--raised:#FAF5EA;--hair:#D8CEBA;--ink:#1A1A18;--ink2:#5A564C;--navy:#12293F;--or:#EE7434;--ord:#A8400C}
*{box-sizing:border-box}body{margin:0;background:#E4DCCB;font-family:Archivo,Arial,sans-serif;width:390px;color:var(--ink)}
.card{background:var(--raised);padding:14px 16px 16px;margin:0 0 24px}
.card h2{font-size:17px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.no{font-size:10px;letter-spacing:.12em;color:var(--ink2);font-weight:700;text-transform:uppercase}
.att{font-size:12.5px;margin:4px 0 4px;line-height:1.35}
.q{font-size:12.5px;line-height:1.35;color:var(--navy);background:#F3ECDF;border-left:3px solid var(--or);padding:7px 10px;margin:8px 0}
.q b{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ord);margin-bottom:2px}
.cat{border-top:1px solid var(--hair);margin-top:12px;padding-top:9px}
.cat h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy)}
.fact{font-size:11.5px;line-height:1.35;color:var(--ink2);margin:3px 0 6px}
.cn{margin:10px 0 0}
.cn h4{margin:0 0 5px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.vis{display:flex;align-items:center;gap:10px;margin-top:6px}
.lines{font-size:11.5px;line-height:1.35;margin-top:6px}
.lines div{display:grid;grid-template-columns:62px 1fr;gap:6px;margin-bottom:3px}
.lines i{font-style:normal;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:700;padding-top:2px}
.bleed{margin:0 -16px}
.row{display:flex;align-items:center;gap:10px;height:56px;background:#F1E9DB;padding:0 16px;border-bottom:1px solid var(--hair)}
.nm{font-size:16px;font-weight:600;line-height:1.15;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;font-size:10.5px;letter-spacing:.08em;font-weight:700;opacity:.72;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;background:var(--raised);border:1px solid var(--hair);border-bottom:2px solid;font-size:11px;font-weight:700;letter-spacing:.08em;flex:none}
.mini{position:relative;height:64px;flex:1;background:#E8E4DA;overflow:hidden;border-radius:2px}
.mini .pn{position:absolute}
.strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lab{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin:10px 0 5px}
.map{position:relative;height:150px;background:#E8E4DA;overflow:hidden}
.map .pn{position:absolute}
.bt{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;align-items:center;border-top:1px solid var(--hair);padding:8px 0}
.bt .ics{display:flex;gap:8px;align-items:center}
.bt span{font-size:11.5px;line-height:1.3}
.bt b{font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.pass{color:#2F6B3A}.fail{color:var(--ord)}
.drop{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;border-top:1px solid var(--hair);padding:6px 0;font-size:11.5px;line-height:1.3}
.drop b{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.menu{background:var(--raised);border:1px solid var(--hair);width:230px;font-size:13px}
.menu div{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-top:1px solid var(--hair)}
.menu div:first-child{border-top:0}.menu .cur{font-weight:700;color:var(--navy)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;background:#F1E9DB;padding:14px;font-size:12px;color:var(--ink2);flex:1}
.scal{display:grid;place-items:center}
.settled{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center}
.settled>div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
</style></head><body>

const badge=(d,ink,size=24,sel)=>`<svg viewBox="0 0 24 24" width="${size}" height="${size}" style="display:block;flex:none;overflow:visible${sel?';filter:drop-shadow(0 1px 2px rgba(0,0,0,.28))':''}"><circle cx="12" cy="12" r="${sel?12:11}" fill="${sel?ink:'var(--paper)'}" stroke="${sel?ink:ink}" stroke-width="${sel?0:2}"/><g transform="translate(12 12) scale(.82) translate(-12 -12)" style="color:${sel?'var(--paper)':ink};--ko:${sel?ink:'var(--paper)'}" filter="url(#soft)">${D[d]}</g><g transform="translate(12 12) scale(.82) translate(-12 -12)" style="color:transparent;--ko:${sel?ink:'var(--paper)'}">${D[d]}</g></svg>`;
const bare=(d,ink,size,bg='var(--raised)')=>`<svg viewBox="0 0 24 24" width="${size}" height="${size}" style="display:block;flex:none;color:${ink};--ko:${bg}"><g filter="url(#soft)">${D[d]}</g><g style="color:transparent">${D[d]}</g></svg>`;
const COMMON={restaurant:'fork',cafe:'cup',bar:'wine',attraction:'camera',nature:'tree',shopping:'bag',area:'blocks',hotel:'bed',other:'asterisk',district:'blocks',street:'walker'};
const NB=['restaurant','cafe','nature','shopping','bar'];
const mini=(d,cat)=>{const others=NB.filter(c=>c!==cat).slice(0,4);const pos=[[14,6],[52,32],[118,8],[150,34]];

 ${others.map((c,i)=>`<div class="pn" style="left:${pos[i][0]}px;top:${pos[i][1]}px">${badge(COMMON[c],INK[c])}</div>`).join('')}<div class="pn" style="left:84px;top:18px">${badge(d,INK[cat])}</div></div>`;};
const row=(d,cat,name,sub)=>`<div class="bleed"><div class="row">${badge(d,INK[cat])}<div class="nm">${name}<small>${sub||cat.toUpperCase()+' · '}</small></div><svg viewBox="0 0 24 24" width="10" height="10" style="color:var(--ink2)">${D.xmark}</svg></div></div>`;
const chip=(d,cat,lab)=>`<span class="chip" style="border-bottom-color:${INK[cat]}">${bare(d,INK[cat],12)}${lab||cat.toUpperCase()}</span>`;
const concept=(letter,title,d,cat,name,sub,shows,mist)=>`<div class="cn"><h4>${letter} · ${title}</h4>${row(d,cat,name,sub)}
 <div class="vis">${badge(d,INK[cat])}${chip(d,cat)}${mini(d,cat)}</div>
 <div class="lines"><div><i>Shows</i><span>${shows}</span></div><div><i>Could be</i><span>${mist}</span></div></div></div>`;
const catBlock=(name,fact,concepts,extra='')=>`<div class="cat"><h3>${name}</h3><div class="fact">${fact}</div>${extra}${concepts.join('')}</div>`;
const head=(no,title,sub)=>`<div class="no">${no} · rough builds, not drawings</div><h2>${title}</h2>${sub?`<p class="att">${sub}</p>`:''}`;

// ---------- BUILD TESTS (for the team, not the owner)
const btRow=(d,cat,label,verdict,cls)=>`<div class="bt"><div class="ics">${badge(d,INK[cat])}${bare(d,INK[cat],18)}${bare(d,INK[cat],12)}</div><span><b class="${cls}">${verdict}</b> ${label}</span></div>`;
