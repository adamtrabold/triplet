<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{--paper:#F2EBDD;--raised:#FAF5EA;--hair:#D8CEBA;--ink:#1A1A18;--ink2:#5A564C;--navy:#12293F}
  body{margin:0;background:var(--paper);font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink);width:390px}
  h1{font-size:15px;margin:14px 12px 2px;letter-spacing:.06em;text-transform:uppercase}
  p.sub{font-size:11px;margin:0 12px 8px;color:var(--ink2);line-height:1.35}
  .t{font-size:12px;font-weight:700;margin:12px 12px 4px}.t span{font-weight:400;color:var(--ink2)}
  .row{height:56px;display:flex;align-items:center;border-top:1px solid var(--hair);background:#F3EADB;padding:0 12px;gap:10px}
  .row:last-child{border-bottom:1px solid var(--hair)}
  .lead{width:28px;display:flex;justify-content:center}
  .main{flex:1;min-width:0}
  .nm{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
  .mt{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--ink2);margin-top:3px}
  .x{color:var(--ink2);font-size:15px;width:16px;text-align:center}
  .stamp{display:inline-flex;align-items:center;gap:4px;border:2px solid currentColor;border-radius:50%;padding:5px 10px;font-size:10px;font-weight:700;letter-spacing:.08em;transform:rotate(-3deg);outline:1.5px dotted currentColor;outline-offset:2px}
</style></head><body>
<script>
const INK={restaurant:'#7A2436',cafe:'#6E4C22',nature:'#1E3A2B'};
const G={restaurant:'<path d="M6 2h2v7h1V2h2v7h1V2h2v8a3 3 0 0 1-2 2.83V22h-4v-9.17A3 3 0 0 1 6 10V2z"/>',
cafe:'<path d="M3 4h13v7a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V4z"/><path d="M17 6h2a3 3 0 0 1 0 6h-2V6z"/><path d="M2 19h16v2H2z"/>',
nature:'<path d="M12 2l4 6h-2.5l3 5H14l3.5 6h-11L10 13H7.5l3-5H8l4-6z"/><path d="M11 18h2v4h-2z"/>'};
const STAR='M10.81 2.74A1.3 1.3 0 0 1 13.19 2.74L15.45 7.81A0.6 0.6 0 0 0 15.93 8.17L21.46 8.75A1.3 1.3 0 0 1 22.19 11.01L18.06 14.73A0.6 0.6 0 0 0 17.88 15.30L19.03 20.73A1.3 1.3 0 0 1 17.11 22.12L12.30 19.35A0.6 0.6 0 0 0 11.70 19.35L6.89 22.12A1.3 1.3 0 0 1 4.97 20.73L6.12 15.30A0.6 0.6 0 0 0 5.94 14.73L1.81 11.01A1.3 1.3 0 0 1 2.54 8.75L8.07 8.17A0.6 0.6 0 0 0 8.55 7.81Z';
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v*(1-t)+B[i]*t).toString(16).padStart(2,'0')).join('')}
const PAPER='#F2EBDD';
const gl=(c,f,g=18)=>`<g transform="translate(${(24-g)/2} ${(24-g)/2}) scale(${g/24})" fill="${f}">${G[c]}</g>`;
function badge(mode,c,vis){const k=INK[c];let b;
  if(mode==='blaze') b= vis?`<circle cx="12" cy="12" r="10.2" fill="${PAPER}" stroke="${k}" stroke-width="1.6"/>`+gl(c,k,15):`<circle cx="12" cy="12" r="11" fill="${k}"/>`+gl(c,PAPER,16);
  else if(mode==='second'&&vis){const t=mix(k,PAPER,.55);b=`<circle cx="12" cy="12" r="10.4" fill="${PAPER}" stroke="${t}" stroke-width="1.2"/>`+gl(c,t)}
  else if(mode==='shell'&&vis) b=gl(c,k,20);
  else b=`<circle cx="12" cy="12" r="10" fill="${PAPER}" stroke="${k}" stroke-width="2"/>`+gl(c,k);
  return `<svg width="24" height="24" viewBox="0 0 24 24">${b}</svg>`}
const star=`<svg width="16" height="16" viewBox="0 0 24 24"><path d="${STAR}" fill="#EE7434"/></svg>`;
function stamp(mode){
  const chk='<svg width="9" height="9" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if(mode==='today'||mode==='blaze') return `<span class="stamp" style="color:rgba(18,41,63,.82)">${chk}VISITED</span>`;
  if(mode==='second') return `<span class="stamp" style="color:rgba(18,41,63,.38);transform:rotate(-3deg) scale(.86)">${chk}VISITED</span>`;
  if(mode==='shell') return `<span style="font-size:10px;font-weight:700;letter-spacing:.1em;color:rgba(18,41,63,.55);transform:rotate(-3deg);display:inline-block;border-bottom:1.5px solid rgba(18,41,63,.45);padding-bottom:1px">${chk} VISITED</span>`;
}
const ROWS=[['restaurant','Bæjarins Beztu',0,0],['cafe','Brauð & Co',1,1],['cafe','Café Loki',1,0],['nature','Hljómskálagarður',0,1]];
const M=[['today','Today','the visited row carries the most furniture'],
 ['blaze','D1 Trail blaze','open badge solid, visited badge hollow; stamp unchanged'],
 ['second','V2 Second run','visited badge + stamp printed at half strength'],
 ['shell','V3 Shell off','visited loses its badge ring; stamp becomes a light struck word']];
let h=`<h1>Row states, real size</h1><p class="sub">Sketch. Rows 2–3 are visited (row 2 also starred); rows 1 and 4 are still to do (row 4 starred).</p>`;
M.forEach(([k,n,d])=>{h+=`<div class="t">${n} <span>· ${d}</span></div>`;
  ROWS.forEach(([c,name,v,s])=>{h+=`<div class="row"><div class="lead">${badge(k,c,v)}</div><div class="main"><div class="nm">${s?star:''}${name}</div><div class="mt">${c.toUpperCase()} · REYKJAVÍK</div></div>${v?stamp(k):''}<div class="x">×</div></div>`});
});
document.body.innerHTML=h+'<div style="height:12px"></div>';
</script></body></html>
