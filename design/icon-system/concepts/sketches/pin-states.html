<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#F2EBDD;font-family:"Helvetica Neue",Arial,sans-serif;color:#1A1A18;width:390px}
  h1{font-size:15px;margin:14px 12px 2px;letter-spacing:.06em;text-transform:uppercase}
  p.sub{font-size:11px;margin:0 12px 10px;color:#5A564C;line-height:1.35}
  .hdr{display:grid;grid-template-columns:repeat(5,1fr);font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#5A564C;padding:0 6px;text-align:center}
  .blk{margin:8px 0 2px}
  .t{font-size:12px;font-weight:700;margin:0 12px 3px}
  .t span{font-weight:400;color:#5A564C}
  .strip{position:relative;width:390px;height:84px}
  .strip svg.tile{position:absolute;inset:0}
  .pin{position:absolute;transform:translate(-50%,-50%)}
  .lab{position:absolute;left:4px;font-size:8px;color:#5A564C;background:rgba(242,235,221,.85);padding:0 2px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 6px}
  .panel{position:relative;height:170px;overflow:hidden;border-radius:2px}
  .panel .cap{position:absolute;left:4px;top:4px;font-size:10px;font-weight:700;background:rgba(250,245,234,.92);padding:1px 4px}
</style></head><body>
<script>
const INK={restaurant:'#7A2436',cafe:'#6E4C22',bar:'#3D5A7A',attraction:'#547326',nature:'#1E3A2B',shopping:'#8A7AA8',hotel:'#2E2433'};
const G={
restaurant:'<path d="M6 2h2v7h1V2h2v7h1V2h2v8a3 3 0 0 1-2 2.83V22h-4v-9.17A3 3 0 0 1 6 10V2z"/>',
cafe:'<path d="M3 4h13v7a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V4z"/><path d="M17 6h2a3 3 0 0 1 0 6h-2V6z"/><path d="M2 19h16v2H2z"/>',
bar:'<path d="M3 3h18l-8 9v7h4v2H7v-2h4v-7L3 3z"/>',
attraction:'<path d="M12 2l3 6v11H9V8l3-6z"/><path d="M7 20h10v2H7z"/>',
nature:'<path d="M12 2l4 6h-2.5l3 5H14l3.5 6h-11L10 13H7.5l3-5H8l4-6z"/><path d="M11 18h2v4h-2z"/>',
shopping:'<path d="M12 1a4 4 0 0 0-4 4v2h2V5a2 2 0 0 1 4 0v2h2V5a4 4 0 0 0-4-4z"/><path d="M4 7h16l-1.5 15h-13L4 7z"/>',
hotel:'<path d="M2 6h3v7h9a5 5 0 0 1 5 5v3h-3v-2H5v2H2V6z"/><circle cx="8.5" cy="9.5" r="2.5"/>'};
const STAR='M10.81 2.74A1.3 1.3 0 0 1 13.19 2.74L15.45 7.81A0.6 0.6 0 0 0 15.93 8.17L21.46 8.75A1.3 1.3 0 0 1 22.19 11.01L18.06 14.73A0.6 0.6 0 0 0 17.88 15.30L19.03 20.73A1.3 1.3 0 0 1 17.11 22.12L12.30 19.35A0.6 0.6 0 0 0 11.70 19.35L6.89 22.12A1.3 1.3 0 0 1 4.97 20.73L6.12 15.30A0.6 0.6 0 0 0 5.94 14.73L1.81 11.01A1.3 1.3 0 0 1 2.54 8.75L8.07 8.17A0.6 0.6 0 0 0 8.55 7.81Z';
const PAPER='#F2EBDD', STK='#3A4C5B', CREAM='#F4ECD8', OR='#EE7434', ORD='#A8400C';
const CHECK='M6.2 12.4l3.6 3.6 8-8.4';
let uid=0;
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v*(1-t)+B[i]*t).toString(16).padStart(2,'0')).join('')}
// glyph in the 24 box, scaled to g px centered
function glyph(cat,fill,g=18){const s=g/24,o=(24-g)/2;return `<g transform="translate(${o} ${o}) scale(${s})" fill="${fill}">${G[cat]}</g>`}
function shoulderStar(){return `<g transform="translate(13.5 -3.5) scale(.5)"><path d="${STAR}" fill="${OR}" stroke="${PAPER}" stroke-width="5" stroke-linejoin="round" paint-order="stroke"/><path d="${STAR}" fill="${OR}" stroke="${ORD}" stroke-width="1.5" stroke-linejoin="round"/></g>`}
function rimStar(){return `<g transform="translate(7.25 -3.6) scale(.396)"><path d="${STAR}" fill="${OR}"/></g>`}
// returns svg string. size = css px of the 24 box. far => no glyph
function pin(c,st,cat,size){
  const ink=INK[cat], far=size<20, id='u'+(uid++);
  const vis=st.includes('v'), sel=st==='sel', star=(st==='s'||st==='vs');
  let body='', defs='', over='';
  const ring=(col=ink,w=2,fill=PAPER)=>`<circle cx="12" cy="12" r="${11-w/2+0.0}" fill="${fill}" stroke="${col}" stroke-width="${w*(far?24/size*0.75:1)}"/>`;
  const g=(f)=>far?'':glyph(cat,f);
  const useRimStar = ['punch','knock','shell','fold'].includes(c);
  if(sel){ // selected: shared for most (inverted), blaze gets halo
    if(c==='blaze'){body=`<circle cx="12" cy="12" r="11.6" fill="${PAPER}"/><circle cx="12" cy="12" r="9.6" fill="${ink}"/>`+glyph(cat,PAPER,15)}
    else body=`<circle cx="12" cy="12" r="11" fill="${ink}" stroke="${ink}" stroke-width="2"/>`+glyph(cat,PAPER,17);
  } else if(c==='today'){
    if(vis){defs=`<filter id="${id}f"><feDropShadow dx=".4" dy=".8" stdDeviation=".7" flood-opacity=".35"/></filter>`;
      body=`<g filter="url(#${id}f)"><path d="M12 1a11 11 0 1 1-10.2 6.9L8.5 4A11 11 0 0 1 12 1z" fill="${STK}"/><path d="M1.8 7.9L8.5 4 3.2 3.6z" fill="#5d6e7c"/></g><path d="${CHECK}" fill="none" stroke="${CREAM}" stroke-width="${far?3:2.4}" stroke-linecap="round" stroke-linejoin="round" transform="${far?'translate(3 3) scale(.75)':'translate(1.8 1.8) scale(.85)'}"/>`}
    else body=ring()+g(ink);
  } else if(c==='blaze'){
    body = vis ? ring(ink,1.6)+ (far?'':glyph(cat,ink,15)) : `<circle cx="12" cy="12" r="11" fill="${ink}"/>`+(far?'':glyph(cat,PAPER,16));
  } else if(c==='emboss'){
    if(vis){const sh=mix(PAPER,'#000000',.28), hi='#FFFDF6';
      body=`<circle cx="12" cy="12" r="11" fill="${PAPER}"/><circle cx="12.5" cy="12.5" r="9.8" fill="none" stroke="${sh}" stroke-width="1"/><circle cx="11.5" cy="11.5" r="9.8" fill="none" stroke="${hi}" stroke-width="1"/>`+(far?'':`<g transform="translate(.5 .5)">${glyph(cat,sh)}</g><g transform="translate(-.4 -.4)">${glyph(cat,hi)}</g>${glyph(cat,PAPER)}`)}
    else body=ring()+g(ink);
  } else if(c==='fold'){
    if(vis){ // dog-ear: lower-left segment folded up over the face
      defs=`<clipPath id="${id}c"><path d="M-1 -1H25V25H-1V16.5L5.5 23L-1 16.5z M-1 -1"/></clipPath><clipPath id="${id}k"><polygon points="-2,10 14,26 -2,26"/></clipPath>`;
      body=`<g clip-path="url(#${id}k)" style="display:none"></g>`+
      `<g><mask id="${id}m"><rect x="-2" y="-2" width="28" height="28" fill="#fff"/><polygon points="-2,11 13,26 -2,26" fill="#000"/></mask><g mask="url(#${id}m)">${ring()}${g(ink)}</g>`+
      `<path d="M2.1 15.6 L8.4 21.9 Q3.9 21.2 2.1 15.6Z" fill="${mix(PAPER,ink,.0)}" stroke="none"/>`+
      `<path d="M2.1 15.6 L8.4 21.9 L5.4 13.2Z" fill="#E3D8C2" stroke="${ink}" stroke-width="${far?1.4:1}" stroke-linejoin="round"/><path d="M2.1 15.6 L8.4 21.9" stroke="${mix(PAPER,'#000',.18)}" stroke-width=".6"/></g>`}
    else body=ring()+g(ink);
  } else if(c==='punch'){
    if(vis){defs=`<mask id="${id}m"><rect x="-4" y="-4" width="32" height="32" fill="#fff"/><circle cx="${far?17:17.6}" cy="${far?17:17.6}" r="${far?4.2:3.9}" fill="#000"/></mask>`;
      body=`<g mask="url(#${id}m)">${ring()}${g(ink)}</g><circle cx="${far?17:17.6}" cy="${far?17:17.6}" r="${far?4.2:3.9}" fill="none" stroke="${mix(PAPER,'#000',.22)}" stroke-width=".5"/>`}
    else body=ring()+g(ink);
  } else if(c==='knock'){
    const t=mix(ink,PAPER,.55);
    body = vis ? `<circle cx="12" cy="12" r="10.4" fill="${PAPER}" stroke="${t}" stroke-width="${far?1.8:1.2}"/>`+g(t) : ring()+g(ink);
  } else if(c==='shell'){
    if(vis){ body = far ? `<circle cx="12" cy="12" r="5" fill="${ink}"/>` : `<g transform="rotate(-6 12 12)">${glyph(cat,PAPER,22).replace('fill="'+PAPER+'"',`fill="${PAPER}" stroke="${PAPER}" stroke-width="3" stroke-linejoin="round"`)}${glyph(cat,ink,20)}</g>`;}
    else body=ring()+g(ink);
  }
  if(star && !sel) over = useRimStar ? rimStar() : (c==='today'&&vis ? `<g transform="translate(14.5 -4.5) scale(.5)"><path d="${STAR}" fill="${OR}" stroke="${PAPER}" stroke-width="3" paint-order="stroke"/></g>` : shoulderStar());
  if(star && sel) over = useRimStar ? rimStar() : shoulderStar();
  // rim-star needs a gap in the rim: draw a paper star halo behind for ring cases
  let gap='';
  if(star && useRimStar){gap=`<g transform="translate(7.25 -3.6) scale(.396)"><path d="${STAR}" fill="none" stroke="${PAPER}" stroke-width="4.5" stroke-linejoin="round"/></g>`; if(c==='shell'&&vis&&!sel) gap='';}
  const S = sel? size*1.33 : size;
  return `<svg class="pin" width="${S}" height="${S}" viewBox="0 0 24 24" overflow="visible"><defs>${defs}</defs>${body}${gap}${over}</svg>`;
}
function tile(w,h,seed=1){
  let r=seed;const rnd=()=>{r=(r*16807)%2147483647;return r/2147483647};
  let s=`<svg class="tile" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="#F2EFE9"/>`;
  for(let i=0;i<14;i++){const x=rnd()*w,y=rnd()*h;s+=`<rect x="${x}" y="${y}" width="${14+rnd()*26}" height="${10+rnd()*18}" fill="#D9D0C9" transform="rotate(${rnd()*20-10} ${x} ${y})"/>`}
  s+=`<path d="M${w*0.55} 0 C ${w*0.6} ${h*.4}, ${w*.75} ${h*.5}, ${w*.8} ${h}" fill="none" stroke="#AAD3DF" stroke-width="14"/>`;
  s+=`<rect x="${w*.08}" y="${h*.45}" width="${w*.2}" height="${h*.5}" fill="#CDEBB0" rx="3"/>`;
  s+=`<path d="M0 ${h*.3} L${w} ${h*.38}" stroke="#D6D0C4" stroke-width="7"/><path d="M0 ${h*.3} L${w} ${h*.38}" stroke="#fff" stroke-width="5"/>`;
  s+=`<path d="M${w*.35} 0 L${w*.42} ${h}" stroke="#D6D0C4" stroke-width="5"/><path d="M${w*.35} 0 L${w*.42} ${h}" stroke="#fff" stroke-width="3.5"/>`;
  s+=`<path d="M0 ${h*.78} L${w} ${h*.7}" stroke="#F6C98A" stroke-width="5"/>`;
  s+=`<text x="${w*.62}" y="${h*.22}" font-size="8" fill="#777" font-family="Arial">Laugavegur</text>`;
  return s+'</svg>';
}
const C=[
 ['today','Today','dark sticker erases the glyph; star on the shoulder with halo + keyline'],
 ['blaze','D1 Trail blaze','open = solid disc; visited = hollow ring (systems)'],
 ['emboss','D2 Blind emboss','visited = paper relief, no ink (systems)'],
 ['fold','D3 Dog-ear','visited = lower-left of the pin folded over (systems) + rim star'],
 ['punch','V1 Conductor’s punch','visited = a hole punched through the pin; the map shows through + rim star'],
 ['knock','V2 Second run','visited = printed again at half strength (screen-print tint) + rim star'],
 ['shell','V3 Shell off','visited = the ticket is gone, only the glyph stays, inked on the map + rim star'],
];
const ST=[['o','Open'],['s','Open ★'],['v','Visited'],['vs','Visited ★'],['sel','Selected']];
const CATS=['restaurant','cafe','nature','bar','shopping'];
let html=`<h1>Pin states, real size, on map tiles</h1><p class="sub">Sketch, not a concept. Top of each strip: near pins (24px). Bottom: far pins (16px, no glyph today). Owner: “the checked items are stronger visually than the open ones.”</p><div class="hdr">${ST.map(s=>`<div>${s[1]}</div>`).join('')}</div>`;
C.forEach(([k,n,d],ci)=>{
  html+=`<div class="blk"><div class="t">${n} <span>· ${d}</span></div><div class="strip">${tile(390,84,ci*97+11)}`;
  ST.forEach(([s],i)=>{const x=39+i*78, cat=CATS[i];
    html+=`<div class="pin" style="left:${x}px;top:28px;position:absolute">${pin(k,s,cat,24)}</div>`;
    if(s!=='sel') html+=`<div class="pin" style="left:${x}px;top:66px;position:absolute">${pin(k,s,cat,16)}</div>`;
  });
  html+=`</div></div>`;
});
// half-done trip panels
const PTS=[[30,40,'restaurant','v'],[70,95,'cafe','o'],[120,35,'nature','s'],[150,120,'bar','v'],[45,140,'shopping','vs'],[100,70,'cafe','v'],[160,60,'restaurant','o'],[95,130,'attraction','v'],[25,95,'hotel','o']];
html+=`<h1 style="margin-top:20px">Half-done trip, near zoom</h1><p class="sub">Same 9 places: 5 visited (1 starred), 4 still to do (1 starred). What should pop is what’s left.</p><div class="grid">`;
[['today','Today'],['blaze','D1 Trail blaze'],['punch','V1 Punch'],['knock','V2 Second run'],['shell','V3 Shell off'],['fold','D3 Dog-ear']].forEach(([k,n],pi)=>{
  html+=`<div class="panel">${tile(189,170,pi*31+5)}`;
  PTS.forEach(([x,y,cat,s])=>{html+=`<div class="pin" style="left:${x}px;top:${y+10}px;position:absolute">${pin(k,s,cat,24)}</div>`});
  html+=`<div class="cap">${n}</div></div>`;
});
html+='</div><div style="height:14px"></div>';
document.body.innerHTML=html;
</script></body></html>
