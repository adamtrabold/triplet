<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="marks.js"></script>
<script>
// Ink coverage of each glyph (fraction of the 24 box), rendered at real px x3.
async function cov(markup, px, f=1){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" viewBox="0 0 24 24"><g fill="#000" color="#000" style="--knock:#fff"><g transform="translate(12 12) scale(${f}) translate(-12 -12)">${markup.replace(/var\(--knock,#F2EBDD\)/g,'#fff')}</g></g></svg>`;
  const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); await img.decode();
  const c=document.createElement('canvas'); c.width=c.height=px; const x=c.getContext('2d'); x.fillStyle='#fff';x.fillRect(0,0,px,px); x.drawImage(img,0,0);
  const d=x.getImageData(0,0,px,px).data; let s=0; for(let i=0;i<d.length;i+=4) s+=(255-d[i])/255; return s/(px*px);
}
(async()=>{
  const out={today:{},raw:{},sized:{},factor:{}};
  for(const k in TM.TODAY_G){ out.today[k]=+(await cov(TM.TODAY_G[k],72)).toFixed(3); out.raw[k]=+(await cov(TM.NEW_G[k],72)).toFixed(3); }
  const vals=Object.values(out.raw).sort((a,b)=>a-b); const med=vals[Math.floor(vals.length/2)];
  for(const k in out.raw){ let f=Math.sqrt(med/out.raw[k]); f=Math.max(.84,Math.min(1.16,f)); out.factor[k]=+f.toFixed(3);
    out.sized[k]={}; for(const px of [12,18,23]) out.sized[k][px]=+(await cov(TM.NEW_G[k],px*3,f)).toFixed(3); }
  out.median=med;
  for(const k in TM.TODAY_G){ out.sized[k].today18=+(await cov(TM.TODAY_G[k],54)).toFixed(3); }
  window.__out=out; document.title='done';
})();
</script></body></html>
