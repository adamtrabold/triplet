<!doctype html><html><head><meta charset="utf-8">
<!-- Concept D (sticker, re-weighted): size strip + last-day map. Draft, not reviewed. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#ddd;font-family:Archivo,Arial,sans-serif;color:#1A1A18}
  .wrap{display:flex;flex-wrap:wrap;gap:20px;padding:20px;align-items:flex-start}
  .sheet{width:390px;background:#F2EBDD;padding-bottom:12px}
  .sheet h1{font-size:15px;margin:0;padding:12px 12px 2px;letter-spacing:.06em;text-transform:uppercase}
  .draft{display:inline-block;margin:4px 12px 0;font-size:9px;font-weight:700;letter-spacing:.1em;color:#A8400C;border:1px solid #A8400C;padding:2px 5px}
  .sub{font-size:10.5px;margin:4px 12px 8px;color:#5A564C;line-height:1.38}
  .strip{display:flex;gap:0;margin:0 8px 6px}
  .cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 4px}
  .cap{font-size:9px;color:#5A564C;text-align:center}
</style></head><body>
<div class="wrap" id="w"></div>
<script src="../lib/fixture-data.js"></script><script src="../lib/marks.js"></script>
<script>
TM.install();
const {INK,C,pin,phone}=TM;
const w=document.getElementById('w');
const add=(id,html)=>{const d=document.createElement('div');d.id=id;d.innerHTML=html;w.appendChild(d);};
const sheet=(t,sub,inner)=>`<div class="sheet"><h1>${t}</h1><span class="draft">DRAFT · NOT REVIEWED</span><p class="sub">${sub}</p>${inner}</div>`;
const q=new URLSearchParams(location.search); const DS=+(q.get('d')||16);
const strip=(bg,seed)=>`<div class="strip" style="background:${bg}">`+[['open 24',pin('D',{cat:'cafe'})],...[12,14,16,18,20].map(d=>[d+'px',pin('D',{cat:'cafe',visited:1,dSize:d,seed})])].map(([l,s])=>`<div class="cell">${s}<span class="cap">${l}</span></div>`).join('')+'</div>';
const today=`<div class="strip" style="background:#F2EFE9"><div class="cell">${pin('today',{cat:'cafe'})}<span class="cap">today open</span></div><div class="cell">${pin('today',{cat:'cafe',visited:1})}<span class="cap">today sticker (24)</span></div><div class="cell">${pin('D',{cat:'cafe',visited:1,dSize:16,seed:3,glyphFace:1})}<span class="cap">16, cream glyph (Q5)</span></div><div class="cell">${pin('D',{cat:'cafe',visited:1,dSize:16,seed:3,starred:1})}<span class="cap">16 + star</span></div></div>`;
add('size',sheet('D · sticker size, set by the peel','Real size (1x on a phone). The sticker at 12 / 14 / 16 / 18 / 20px beside an open 24px pin, on land, on a primary road and on a park, three different seeded flap corners. D\'s size = the smallest where the flap still reads as a peel, not a notch.',
  strip('#F2EFE9',3)+strip('#FCD6A4',11)+strip('#C8FACC',24)+today));
add('near-today-lastDay',phone('today','lastDay',FX,{}));
add('near-D-lastDay',phone('D','lastDay',FX,{dSize:DS}));
add('near-D-halfway',phone('D','halfway',FX,{dSize:DS}));
document.fonts.ready.then(()=>setTimeout(()=>document.title='ready',300));
</script></body></html>
