<!doctype html><html><head><meta charset="utf-8">
<!-- Concept C (rim off, paper disc kept, inked tilted glyph): full set. Draft, not reviewed. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#ddd;font-family:Archivo,Arial,sans-serif;color:#1A1A18}
  .wrap{display:flex;flex-wrap:wrap;gap:20px;padding:20px;align-items:flex-start}
  .sheet{width:390px;background:#F2EBDD;padding-bottom:12px}
  .sheet h1{font-size:15px;margin:0;padding:12px 12px 2px;letter-spacing:.06em;text-transform:uppercase}
  .draft{display:inline-block;margin:4px 12px 0;font-size:9px;font-weight:700;letter-spacing:.1em;color:#A8400C;border:1px solid #A8400C;padding:2px 5px}
  .sub{font-size:10.5px;margin:4px 12px 8px;color:#5A564C;line-height:1.38}
  .frames{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px}
  .fr{background:#FAF5EA;border:1px solid #D8CEBA;border-radius:3px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .fr .n{align-self:flex-start;font-size:10px;font-weight:700;color:#12293F}
  .fr .c{font-size:9.5px;color:#5A564C;text-align:center;line-height:1.3}
  .tilebg{background:#F2EFE9;width:100%;height:64px;display:flex;align-items:center;justify-content:center;border-radius:2px}
  .seg{width:110px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:#FAF5EA;border:1px dashed #D8CEBA}
  .lbl{font:700 11px/1 Archivo;letter-spacing:.1em}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="dry1"><feMorphology operator="erode" radius=".55"/></filter>
  <filter id="dry2"><feMorphology operator="erode" radius="1.1"/></filter>
  <filter id="sdry1"><feMorphology operator="erode" radius=".28"/></filter>
  <filter id="sdry2"><feMorphology operator="erode" radius=".6"/></filter>
  <filter id="bleed"><feGaussianBlur stdDeviation=".45"/></filter>
</defs></svg>
<div class="wrap" id="w"></div>
<script src="../lib/fixture-data.js"></script><script src="../lib/marks.js"></script>
<script>
TM.install();
const {INK,C,use,pin,phone,row,tag,stampHtml,basemap}=TM;
const w=document.getElementById('w');
const add=(id,html)=>{const d=document.createElement('div');d.id=id;d.innerHTML=html;w.appendChild(d);};
const sheet=(t,sub,inner)=>`<div class="sheet"><h1>${t}</h1><span class="draft">FOR REVIEW</span><p class="sub">${sub}</p>${inner}</div>`;
const P=id=>FX.places.find(p=>p.id===id);

// 1. edge check: the visited disc on every surface, real size
(()=>{
  const bgs=[['land','#F2EFE9'],['building','#D9D0C9'],['primary','#FCD6A4'],['trunk','#F9B29C'],['secondary','#F7FABF'],['park','#C8FACC'],['water','#AAD3DF']];
  let cells=bgs.map(([n,c])=>`<div style="display:flex;flex-direction:column;align-items:center;gap:3px"><div style="width:46px;height:46px;background:${c};display:flex;align-items:center;justify-content:center;gap:2px">${pin('C',{cat:'cafe',visited:1,seed:2})}</div><span style="font-size:8.5px;color:#5A564C">${n}</span></div>`).join('');
  let cells2=bgs.map(([n,c])=>`<div style="width:46px;height:30px;background:${c};display:flex;align-items:center;justify-content:center">${pin('C',{cat:'restaurant',visited:1,seed:5,size:16})}</div>`).join('');
  let ref=`<div style="display:flex;gap:10px;align-items:center;padding:0 12px;margin-top:8px"><span style="font-size:9.5px;color:#5A564C;width:90px">open, for scale</span><span style="background:#F2EFE9;padding:4px">${pin('C',{cat:'cafe'})}</span><span style="font-size:9.5px;color:#5A564C;width:90px">visited</span><span style="background:#F2EFE9;padding:4px">${pin('C',{cat:'cafe',visited:1,seed:2})}</span></div>`;
  add('edge',sheet('C · the disc edge, every surface','Visited = the printed rim comes off; the paper disc stays with one warm 1px edge at low alpha (the approved "1px hard edge to add shadow definition"), so the coin reads the same on land, road, park and water. Near (24) above, far (16) below. Must not read as a ring at 1x.',`<div style="display:flex;gap:6px;padding:0 10px;flex-wrap:wrap">${cells}</div><div style="display:flex;gap:6px;padding:6px 10px 0">${cells2}</div>${ref}`));
})();

// 2. near moments
for(const m of ['day0','halfway','lastDay']){ add('near-today-'+m,phone('today',m,FX,{})); add('near-C-'+m,phone('C',m,FX,{stamp:'struck'})); }
// 3. mid halfway (clusters orange vs ink), far lastDay (silhouette vs dot)
add('mid-today-halfway',phone('today','halfway',FX,{frame:'mid'}));
add('mid-C-orange-halfway',phone('C','halfway',FX,{frame:'mid',clusterStyle:'orange',stamp:'struck'}));
add('mid-C-ink-halfway',phone('C','halfway',FX,{frame:'mid',clusterStyle:'ink',stamp:'struck'}));
add('far-today-lastDay',phone('today','lastDay',FX,{frame:'far'}));
add('far-C-orange-lastDay',phone('C','lastDay',FX,{frame:'far',clusterStyle:'orange',stamp:'struck'}));
add('far-C-ink-lastDay',phone('C','lastDay',FX,{frame:'far',clusterStyle:'ink',stamp:'struck'}));
add('far-today-halfway',phone('today','halfway',FX,{frame:'far'}));
add('far-C-ink-halfway',phone('C','halfway',FX,{frame:'far',clusterStyle:'ink',stamp:'struck'}));
add('far-C-orange-halfway',phone('C','halfway',FX,{frame:'far',clusterStyle:'orange',stamp:'struck'}));
add('q3-full',phone('C','lastDay',FX,{stamp:'struck'}));
add('q3-small',phone('C','lastDay',FX,{stamp:'struck',vStar:7}));
// far detail: silhouette vs dot vs you-are-here, real size
add('far-detail',sheet('C · far zoom: silhouette vs dot','16px far pins at 1x. Visited = the paper disc with a 8px tilted silhouette (main) or a 5px dot (alternative; the owner said "dots… absolutely not"). Beside you-are-here and an open far pin.',
 `<div style="display:flex;gap:14px;align-items:flex-end;padding:6px 12px;background:#F2EFE9;margin:0 10px">${[['open','',pin('C',{cat:'bar',size:16})],['visited','silhouette',pin('C',{cat:'bar',size:16,visited:1,seed:9})],['visited','dot',pin('C',{cat:'bar',size:16,visited:1,seed:9,farDot:1})],['visited★','silhouette',pin('C',{cat:'area',size:16,visited:1,seed:4,starred:1})],['you are here','',`<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="#12293F"/><circle cx="8" cy="8" r="4.5" fill="none" stroke="#F2EBDD" stroke-width="2"/></svg>`]].map(([a,b,s])=>`<div style="display:flex;flex-direction:column;align-items:center;gap:4px">${s}<span style="font-size:8.5px;color:#5A564C;text-align:center">${a}<br>${b}</span></div>`).join('')}</div>`));

// 4. list: today / C stamp kept / C struck word, + Plans
function listSheet(model,stamp,title){
  const vis=new Set(FX.moments.halfway); const ids=[1,2,3,8,22];
  let r=ids.map(id=>{const p=P(id);return row(model,p,{visited:vis.has(id),starred:p.starred},{selected:id===2,stamp});}).join('');
  const plan=FX.plan.stops.map((id,i)=>{const p=P(id);let h=row(model,p,{visited:vis.has(id),starred:p.starred},{stamp});return h.replace('<div style="width:28px;','<div style="width:14px;flex:none;text-align:center;font:600 15px/1 Archivo;color:#8C8678">'+(i+1)+'</div><div style="width:28px;');}).join('');
  const hdr=t=>`<div style="height:44px;display:flex;align-items:center;padding:0 18px;background:#F0E7D8;border-top:1px solid #D8CEBA;font:700 14px/1 Archivo;font-stretch:87.5%;letter-spacing:.1em;color:#12293F">${t}</div>`;
  return sheet(title,'Halfway. Rows: Bæjarins (★ done), Brauð &amp; Co (★ done, selected), Café Loki (done), Kaffibarinn (open), Skólavörðustígur (approx street, open). Then the Plans list "Saturday".',hdr('REYKJAVÍK LIST')+r+hdr('SATURDAY · 6 STOPS')+plan);
}
add('list-today',listSheet('today',undefined,'List · today'));
add('list-C-struck',listSheet('C','struck','C · list: the struck word'));
add('list-C-stamp',listSheet('C',undefined,'C · list, stamp kept (Q2 alternative)'));

// 5. tag: Brauð & Co (★ done) and Kaffibarinn (open), today vs C, + 40% swatch
function tagSheet(model,id,title,extra=''){
  const p=P(id), v=new Set(FX.moments.halfway).has(id);
  const pn=pin(model,{cat:p.category,visited:v,starred:p.starred,selected:1,seed:id});
  return sheet(title,(v?'Starred and visited. ':'Open place. ')+'The pin hangs above its tag.'+extra,`<div style="background:#F2EFE9;padding:10px 45px 16px">${tag(p,{starred:p.starred,visited:v,pin:pn,today:model==='today'})}</div>`);
}
add('tag-today-2',tagSheet('today',2,'Tag · today: Brauð &amp; Co'));
add('tag-C-2',tagSheet('C',2,'C · tag: Brauð &amp; Co'));
add('tag-today-8',tagSheet('today',8,'Tag · today: Kaffibarinn'));
add('tag-C-8',tagSheet('C',8,'C · tag: Kaffibarinn',' Open segments are Line icons at full ink.'));
add('tag-C-8-off',sheet('C · open segments vs 40% unavailable','The open Star and Mark visited segments (top) beside the same segments at the app\'s 40% "unavailable" look (bottom). They must never be confused.',`<div style="padding:0 45px 8px">${tag(P(8),{today:false})}</div><div style="padding:0 45px">${tag(P(8),{today:false,segOff:true})}</div>`));


// ---- the peel as a gummed reinforcement ring (steer 2, fix 2) ----
// The printed rim is a paper donut stuck on the pin. It lifts from one seeded side with the
// shipped flap curl (the lifted part folds back over itself, gummed underside up, a soft
// shadow under the lift), then comes off whole and falls away.
function annulus(a0,a1,ro,ri,n=28){const pts=[];for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180;pts.push([12+ro*Math.cos(a),12+ro*Math.sin(a)]);}for(let i=n;i>=0;i--){const a=(a0+(a1-a0)*i/n)*Math.PI/180;pts.push([12+ri*Math.cos(a),12+ri*Math.sin(a)]);}return pts;}
function reflect(pts,A,B){const dx=B[0]-A[0],dy=B[1]-A[1],L=dx*dx+dy*dy;return pts.map(([x,y])=>{const t=((x-A[0])*dx+(y-A[1])*dy)/L;const px=A[0]+t*dx,py=A[1]+t*dy;return [2*px-x,2*py-y];});}
const poly=pts=>'M'+pts.map(p=>p[0].toFixed(2)+' '+p[1].toFixed(2)).join('L')+'Z';
function ringPeel(stage,cat,seed,size=24){
  const k=INK[cat], id='rp'+Math.random().toString(36).slice(2,7), base=150+Math.round(TM.hash(seed+5)*60);
  const ro=11,ri=9;
  const disc=`<circle cx="12" cy="12" r="10.9" fill="#F2EBDD" stroke="${TM.EDGE}" stroke-width="1"/>`;
  const glyph=(rot=0)=>`<g transform="translate(12 12) rotate(${rot}) scale(${16/24}) translate(-12 -12)" style="color:${k}"><use href="#n-${cat}"/></g>`;
  const defs=`<defs><filter id="${id}" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx=".4" dy=".9" stdDeviation=".7" flood-color="#000" flood-opacity=".28"/></filter></defs>`;
  let b='';
  if(stage===0) b=disc+`<path d="${poly(annulus(0,360,ro,ri,60))}" fill="${k}" fill-rule="evenodd"/>`+glyph();
  else if(stage===1||stage===2){
    const span=stage===1?70:150, a0=base-span/2, a1=base+span/2;
    const rest=annulus(a1,a0+360,ro,ri,48);
    const flapSrc=annulus(a0,a1,ro+.6,ri-.6,24);
    const A=[12+ro*Math.cos(a0*Math.PI/180),12+ro*Math.sin(a0*Math.PI/180)],B=[12+ro*Math.cos(a1*Math.PI/180),12+ro*Math.sin(a1*Math.PI/180)];
    const flap=reflect(flapSrc,A,B);
    b=disc+glyph()+`<path d="${poly(rest)}" fill="${k}"/>`+`<g filter="url(#${id})"><path d="${poly(flap)}" fill="#EDE3CC" stroke="${k}" stroke-width=".5" stroke-linejoin="round"/></g>`;
  } else if(stage===3){
    b=disc+glyph(TM.hash(seed)*6-3)+`<g filter="url(#${id})" transform="translate(5.5 -5) rotate(-18 12 12) scale(1.1) translate(-1.1 -1.1)" opacity=".92"><path d="${poly(annulus(0,360,ro,ri-.6,60))}" fill="${k}" fill-rule="evenodd"/><path d="${poly(annulus(base-40,base+40,ro,ri-.6,20))}" fill="#EDE3CC"/></g>`;
  } else b='';
  if(stage===4) return pin('C',{cat,visited:1,seed});
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" overflow="visible">${defs}${b}</svg>`;
}

// 6. storyboards
const tilt=TM.hash(8)*12-6;
function cPin(stage,cat='bar',seed=8){
  const k=INK[cat];
  const g=(rot,f='')=>`<g transform="translate(12 12) rotate(${rot}) scale(${16/24}) translate(-12 -12)" style="color:${k}" ${f}><use href="#n-${cat}"/></g>`;
  if(stage==='open') return pin('C',{cat,selected:1});
  if(stage==='press') return pin('C',{cat,selected:1}).replace('<svg ','<svg style="transform:scale(.94)" ');
  if(stage==='peel') // rim lifting off from a seeded corner, curling away
    return `<svg width="24" height="24" viewBox="0 0 24 24" overflow="visible"><circle cx="12" cy="12" r="10.9" fill="#F2EBDD" stroke="${TM.EDGE}" stroke-width="1"/><path d="M4.2 18.6A10 10 0 1 1 17.8 20.1" fill="none" stroke="#12293F" stroke-width="2.5" stroke-linecap="round" opacity=".9"/><path d="M17.8 20.1Q15 25.5 9.2 24.6Q12.6 22.8 13.4 21.6" fill="#E9E1D2" stroke="#12293F" stroke-width="1.6" stroke-linejoin="round" opacity=".85"/>${g(0)}</svg>`;
  if(stage==='impact') return `<svg width="24" height="24" viewBox="0 0 24 24" overflow="visible"><circle cx="12" cy="12" r="10.9" fill="#F2EBDD" stroke="#12293F" stroke-width="2.5"/>${g(0,'filter="url(#bleed)"')}</svg>`;
  if(stage==='settle') return `<svg width="24" height="24" viewBox="0 0 24 24" overflow="visible"><circle cx="12" cy="12" r="10.9" fill="#F2EBDD" stroke="#12293F" stroke-width="2.5"/>${g(tilt/2,'filter="url(#bleed)"')}</svg>`;
  if(stage==='done') return pin('C',{cat,visited:1,selected:1,seed});
  if(stage==='dry1') return `<svg width="24" height="24" viewBox="0 0 24 24" overflow="visible"><circle cx="12" cy="12" r="10.9" fill="#F2EBDD" stroke="#12293F" stroke-width="2.5"/><g opacity=".35" transform="translate(12 12) scale(${16/24}) translate(-12 -12)" style="color:${k}"><use href="#n-${cat}"/></g>${g(tilt,'filter="url(#dry1)"')}</svg>`;
  if(stage==='dry2') return `<svg width="24" height="24" viewBox="0 0 24 24" overflow="visible"><circle cx="12" cy="12" r="10.9" fill="#F2EBDD" stroke="#12293F" stroke-width="2.5"/><g opacity=".75" transform="translate(12 12) scale(${16/24}) translate(-12 -12)" style="color:${k}"><use href="#n-${cat}"/></g>${g(tilt,'filter="url(#dry2)"')}</svg>`;
}
const big=s=>`<div style="transform:scale(2);transform-origin:center;margin:12px 0">${s}</div>`;
const segOpen=(press)=>`<div class="seg" style="${press?'background:#E6DDCB':''}">${use('l-check',20,'#1A1A18')}<span class="lbl">MARK VISITED</span></div>`;
const segStamp=(css='')=>`<div class="seg"><span style="${css}">${stampHtml(1.05)}</span></div>`;
const frame=(n,html,c)=>`<div class="fr"><span class="n">${n}</span>${html}<span class="c">${c}</span></div>`;
const pinRow=(stage)=>`<div class="tilebg">${big(cPin(stage))}</div>`;
add('sb-tag',sheet('C · storyboard: visit from the tag','Kaffibarinn, selected. Pin shown 2x above its tag\'s Visited segment (1x). Beats per the shipped timings: the stamp comes down (tagStampIn, 420ms) and the pin\'s glyph takes the ink and turns to its tilt. Finding: from the tag the pin is always selected, so the peel of the printed rim is not visible here; it shows from a row swipe (next board) and whenever the pin is not selected.',
 `<div class="frames">${frame('1 · rest, open',pinRow('open')+segOpen(),'Navy rim = selected. Line check, full ink.')}${frame('2 · tap',pinRow('press')+segOpen(true),'Segment press + haptic.')}${frame('3 · impact',pinRow('impact')+segStamp('display:inline-block;transform:scale(1.18);opacity:.7'),'Stamp lands. The pin is selected, so its rim is already navy (selection): no category rim to peel here. The glyph takes the ink.')}${frame('4 · settle',pinRow('settle')+segStamp('display:inline-block;transform:scale(1.03)'),'Glyph turns to its seeded tilt; ink bleeds in a touch.')}${frame('5 · rest, done',pinRow('done')+segStamp(),'Paper disc, inked tilted glyph, navy rim stays (it is selection).')}</div>`));
// row swipe
const rowAt=(id,st,tx=0,extra='')=>{let h=row('C',P(id),st,{});return `<div style="width:374px;overflow:hidden;position:relative;background:#E9E1D2"><div style="transform:translateX(${tx}px)">${h}</div>${extra}</div>`;};
const rowFr=(n,html,c)=>`<div style="margin:0 8px 8px;background:#FAF5EA;border:1px solid #D8CEBA;border-radius:3px;padding:6px 0 6px"><div style="font-size:10px;font-weight:700;color:#12293F;padding:0 8px 4px">${n}</div>${html}<div style="font-size:9.5px;color:#5A564C;padding:4px 8px 0">${c}</div></div>`;
const peelBadge=()=>`<svg width="24" height="24" viewBox="0 0 24 24" overflow="visible"><path d="M4.2 18.6A10 10 0 1 1 17.8 20.1" fill="none" stroke="${INK.cafe}" stroke-width="2" stroke-linecap="round"/><path d="M17.8 20.1Q15 25.5 9.2 24.6Q12.6 22.8 13.4 21.6" fill="#E9E1D2" stroke="${INK.cafe}" stroke-width="1.4"/><g transform="translate(12 12) scale(.708) translate(-12 -12)" style="color:${INK.cafe}"><use href="#n-cafe"/></g></svg>`;
const peelPin=()=>`<svg width="24" height="24" viewBox="0 0 24 24" overflow="visible"><circle cx="12" cy="12" r="10.9" fill="#F2EBDD" stroke="${TM.EDGE}" stroke-width="1"/><path d="M4.2 18.6A10 10 0 1 1 17.8 20.1" fill="none" stroke="${INK.cafe}" stroke-width="2" stroke-linecap="round"/><path d="M17.8 20.1Q15 25.5 9.2 24.6Q12.6 22.8 13.4 21.6" fill="#E9E1D2" stroke="${INK.cafe}" stroke-width="1.4"/><g transform="translate(12 12) scale(.667) translate(-12 -12)" style="color:${INK.cafe}"><use href="#n-cafe"/></g></svg>`;
const r3open=row('C',P(3),{visited:false},{}), r3done=row('C',P(3),{visited:true},{stamp:'struck'});
add('sb-row',sheet('C · storyboard: visit from a row swipe','Café Loki. Beats 1 to 3 are the shipped swipe-left with its stamp, untouched (gesture code is not touched). After the gesture, as a separate step: the badge\'s rim peels off, then the pin\'s.',
 rowFr('1 · rest, open',r3open,'Ringed badge.')+
 rowFr('2 · swipe left (shipped)',`<div style="overflow:hidden">${`<div style="transform:translateX(-38px)">${r3open}</div>`}</div>`,'The stamp is about to come down (shipped hover).')+
 rowFr('3 · past 56px: VISITED lands (shipped stamp motion)',`<div style="overflow:hidden"><div style="transform:translateX(-56px)">${r3done.replace(/<span style="display:inline-flex;align-items:center;justify-content:center;gap:4px;width:66px/,'<span style="transform:scale(1.15);display:inline-flex;align-items:center;justify-content:center;gap:4px;width:66px')}</div></div>`,'The lighter struck word lands with the shipped stamp motion and haptic. (Q2: swapping the big stamp for the word touches the row stamp markup, so the gesture gate runs.)')+
 rowFr('4 · released; badge rim peels (separate step)',r3done.replace(/<div style="width:28px;display:flex;justify-content:center;flex:none">[\s\S]*?<\/svg><\/div>/,'<div style="width:28px;display:flex;justify-content:center;flex:none">'+ringPeel(2,'cafe',3)+'</div>'),'After the gesture, on the state change: the badge\'s printed ring lifts from one side, gummed side up (a sticker, not a line).')+
 rowFr('5 · rest, done; then the pin peels (on the map)',`<div style="display:flex;align-items:center"><div style="flex:1;min-width:0;overflow:hidden"><div style="width:374px">${r3done}</div></div><div style="width:150px;flex:none;height:56px;background:#F2EFE9;display:flex;align-items:center;justify-content:space-around"><span style="transform:scale(1.6)">${ringPeel(2,'cafe',3)}</span><span style="transform:scale(1.6)">${ringPeel(3,'cafe',3)}</span><span style="transform:scale(1.6)">${pin('C',{cat:'cafe',visited:1,seed:3})}</span></div></div>`,'Row: the struck word; bare tilted glyph. Map (1.6x): the printed ring lifts like a reinforcement sticker, comes off whole, the glyph tilts.')));
add('peel',sheet('C · the peel: a reinforcement ring comes off','The printed rim is a gummed paper ring (the donut that patches an eyelet, like the tag\'s grommet patch). It lifts from one seeded side with the shipped flap curl, gummed side up, then comes off whole and falls away. Top: 3x. Bottom: real size, on the stand-in tile.',
 `<div style="display:flex;justify-content:space-around;padding:6px 6px 0">${[0,1,2,3,4].map(st=>`<div style="display:flex;flex-direction:column;align-items:center;gap:22px;width:72px"><div style="transform:scale(3);margin:26px 0">${ringPeel(st,'cafe',3)}</div><span style="font-size:9.5px;color:#5A564C;text-align:center">${['1 · rest, open','2 · one side lifts','3 · folds back','4 · off, falling','5 · rest, done'][st]}</span></div>`).join('')}</div><div style="display:flex;justify-content:space-around;margin:10px 8px 0;padding:10px 0;background:#F2EFE9">${[0,1,2,3,4].map(st=>ringPeel(st,'cafe',3)).join('')}</div><div style="display:flex;justify-content:space-around;margin:4px 8px 0;padding:10px 0;background:#FCD6A4">${[0,1,2,3,4].map(st=>ringPeel(st,'restaurant',11)).join('')}</div>`));
// un-visit dry-up
add('sb-dry',sheet('C · storyboard: un-visit dries up','Kaffibarinn, done, selected. The shipped dry-up by thickness, untouched: thin parts go first, the thickest last, then the final snap. In C the done state is your ink, so the pin\'s inked glyph dries the same way while the printed rim and upright glyph come back underneath. No reversed motion needed.',
