<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List order picker, concept 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap">
<!-- The app's own rules, copied verbatim (extract-css.py). -->
<link rel="stylesheet" href="app.css">
<style>
  /* ---------- presentation only (not proposed UI) ---------- */
  html, body { margin: 0; background: #CFCAC0; font-family: var(--font-ui); color: var(--ink); }
  .board { display: flex; gap: 28px; padding: 24px; align-items: flex-start; flex-wrap: nowrap; width: max-content; }
  .board.grid { display: grid; grid-template-columns: repeat(4, 390px); gap: 20px 28px; }
  .rowlabel { grid-column: 1 / -1; font-stretch: 75%; text-transform: uppercase; font-weight: 700; letter-spacing: .08em; font-size: 13px; color: #3a372f; margin-top: 4px; }
  .cell { width: 390px; }
  .cap { font-stretch: 75%; text-transform: uppercase; font-weight: 700; letter-spacing: .08em; font-size: 13px; line-height: 16px; margin: 0 0 2px; color: #1A1A18; }
  .sub { font-size: 12px; line-height: 16px; margin: 0 0 10px; color: #4a463d; min-height: 32px; }
  .phone { position: relative; width: 390px; height: 560px; overflow: hidden; background: #E6DDC8; border-radius: 4px; }
  .phone .map { position: absolute; inset: 0; }
  .locations { position: absolute; }          /* index.html: absolute in body; here in the frame */
  .hit .hitbox:not(.rubric)::after, .hit .rubric { outline: 2px dashed #D0138A; outline-offset: -2px; background: rgba(208,19,138,.10); z-index: 5; }
  .hitnote { position: absolute; z-index: 3000; font: 700 11px/14px var(--font-ui); color: #fff; background: #D0138A; padding: 2px 6px; border-radius: 2px; white-space: nowrap; }

  /* =====================================================================
     A · BYLINE, rev 2 (CD round 1).
     The header becomes a row: the h2 (untouched text, untouched voice)
     and under it a byline in .row-meta's voice. The NAME IS NOT THE
     BUTTON: the byline alone is the control, and its hit zone starts at
     the name's measured INK bottom (line-top + 18px: the "(8)" parens
     descend 3px under the baseline) and runs to the header's bottom
     edge. 44px of zone below the ink needs a 68px band (was 57):
     6 top pad + 18 to ink bottom + 44 zone. At 57px the same zone is
     only 27px -- measured, so "overlap the name's lower slack" alone
     can't reach 44.
     rev 3 (CD round 2, subtraction): no fist, no colour, no fixed blank.
     The byline is .row-meta exactly (10/12, --ink-2); the only mark is a
     dotted underline hugging the mode word, in the same --ink-2.
     (rev 2 text follows, superseded where it disagrees.)
     The mode word sits on a DOTTED BLANK -- a fill-in blank on a form,
     dots on the stamp track's rhythm -- so the line reads as a choice,
     not a status. "first" is printed; only the blank changes.
     ===================================================================== */
  .dirA .locationsHeader { min-height: 68px; padding-top: 6px; padding-bottom: 0; align-items: stretch; }
  .dirA .locationsHeader > button { align-self: center; }
  .dirA .titleBlock { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }
  .dirA .titleBlock h2 { flex: none; pointer-events: none; }
  .byline {
    all: unset; box-sizing: border-box; position: static;
    display: flex; align-items: center; gap: 5px; margin-top: 7px;
    font-family: var(--font-ui);
    font-stretch: 75%; text-transform: uppercase; font-weight: 700;
    font-size: 10px; line-height: 12px; letter-spacing: 0.1em;
    color: var(--ink-2);
    white-space: nowrap; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  /* The hit zone: name ink bottom (18px into the block) to the band's
     bottom edge, 8px past the title block on the left (into the gap
     after collapseBtn) and 6px on the right (into the gap before the
     filters button) -- never over either button. */
  .byline::after { content: ''; position: absolute; left: -8px; right: -6px; top: 18px; bottom: -1px; z-index: 1; }
  .byline > * { position: relative; z-index: 2; }
  .byline:active::after, .byline.is-pressed::after { background: var(--paper-pressed); z-index: 0; }
  .byline:focus-visible::after, .byline.is-focus::after { outline: 2px solid var(--navy); outline-offset: -2px; }
  .byline .phrase { display: block; color: var(--ink-2); }
  .blank { position: relative; display: inline-grid; height: 12px; perspective: 60px; vertical-align: top; }
  .blank > * { grid-area: 1 / 1; justify-self: start; }
  .blank::after { /* hugs the word: round dots, 3px pitch, --ink-2 (the meta line's own ink) */
    content: ''; position: absolute; left: 0; right: 0; bottom: -3px; height: 2px;
    background: radial-gradient(circle at 1px 1px, var(--ink-2) 0 0.75px, transparent 0.95px) 0 0 / 3px 2px repeat-x;
  }
  .blank .word { display: block; transform-origin: 50% 55%; backface-visibility: hidden; }
  .phone.crop { height: 184px; }
  .phone.collapsed .locations { transform: translateY(232px); }   /* 300 - 68: the band grows, so the offset shrinks */
  .phone.crop .locations { top: 0; bottom: auto; }
  .hdr3 { width: 390px; overflow: hidden; }

  /* =====================================================================
     B · INDEX TABS -- ledger thumb-tabs standing on the sheet's top edge.
     ===================================================================== */
  .tabs { position: absolute; left: 56px; bottom: 300px; display: flex; gap: 3px; z-index: 1001; }
  .tab {
    all: unset; position: relative; height: 30px; padding: 0 12px; display: flex; align-items: center;
    font-family: var(--font-ui); font-stretch: 75%; text-transform: uppercase; font-weight: 700;
    font-size: 11px; letter-spacing: .1em; color: var(--ink-2);
    background: var(--paper-filed); border: 1px solid var(--hair); border-bottom: none;
    border-radius: 5px 5px 0 0; box-sizing: border-box; cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--paper); color: var(--navy); border-color: var(--paper); height: 32px; margin-top: -2px; }
  .tab::after { content: ''; position: absolute; left: -1px; right: -1px; top: -1px; bottom: -14px; }
  .tab[aria-selected="true"]::after { bottom: -13px; }
  .tabsWrap { position: absolute; left: 0; right: 0; bottom: 300px; height: 32px; }

  /* =====================================================================
     C · LABEL -- a luggage tag hung in the header's icon row.
     ===================================================================== */
  .tag {
    all: unset; position: relative; flex-shrink: 0; height: 22px; padding: 0 8px 0 17px;
    display: flex; align-items: center; box-sizing: border-box; cursor: pointer;
    font-family: var(--font-ui); font-stretch: 75%; text-transform: uppercase; font-weight: 700;
    font-size: 10px; letter-spacing: .1em; color: var(--navy);
    border: 1.5px solid var(--navy); border-radius: 7px 3px 3px 7px;
    background: var(--paper-raised);
  }
  .tag::before { /* the punched eyelet */
    content: ''; position: absolute; left: 5px; top: 50%; width: 4px; height: 4px; margin-top: -3.5px;
    border: 1.5px solid var(--navy); border-radius: 50%; background: var(--paper);
  }
  .tag::after { content: ''; position: absolute; left: -10px; right: -6px; top: -12px; bottom: -12px; }

  /* =====================================================================
     D · RUBRIC -- a printed caption at the head of the ledger.
     ===================================================================== */
  .rubric {
    all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px;
    width: 100%; height: 44px; padding: 0 var(--gutter);
    font-family: var(--font-ui); font-stretch: 75%; text-transform: uppercase; font-weight: 700;
    font-size: 10px; letter-spacing: .12em; color: var(--ink-2); cursor: pointer;
    border-bottom: 1px solid var(--hair); background: var(--paper);
  }
  .rubric::before, .rubric::after { content: ''; flex: 1; height: 0; border-top: 1px solid var(--hair); }
  .rubric b { color: var(--navy); font-weight: 700; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Glyph symbols, verbatim from index.html -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="g-restaurant" viewBox="0 0 24 24"><path fill="currentColor" d="M6 2h2v7h1V2h2v7h1V2h2v8a3 3 0 0 1-2 2.83V22h-4v-9.17A3 3 0 0 1 6 10V2z"/></symbol>
  <symbol id="g-cafe" viewBox="0 0 24 24"><path fill="currentColor" d="M3 4h13v7a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V4z"/><path fill="currentColor" d="M17 6h2a3 3 0 0 1 0 6h-2V6z"/><path fill="currentColor" d="M2 19h16v2H2z"/></symbol>
  <symbol id="g-bar" viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h18l-8 9v7h4v2H7v-2h4v-7L3 3z"/></symbol>
  <symbol id="g-attraction" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l3 6v11H9V8l3-6z"/><path fill="currentColor" d="M7 20h10v2H7z"/></symbol>
  <symbol id="g-nature" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l4 6h-2.5l3 5H14l3.5 6h-11L10 13H7.5l3-5H8l4-6z"/><path fill="currentColor" d="M11 18h2v4h-2z"/></symbol>
  <symbol id="g-star" viewBox="0 0 24 24"><path fill="currentColor" stroke-linejoin="round" d="M10.81 2.74A1.3 1.3 0 0 1 13.19 2.74L15.45 7.81A0.6 0.6 0 0 0 15.93 8.17L21.46 8.75A1.3 1.3 0 0 1 22.19 11.01L18.06 14.73A0.6 0.6 0 0 0 17.88 15.30L19.03 20.73A1.3 1.3 0 0 1 17.11 22.12L12.30 19.35A0.6 0.6 0 0 0 11.70 19.35L6.89 22.12A1.3 1.3 0 0 1 4.97 20.73L6.12 15.30A0.6 0.6 0 0 0 5.94 14.73L1.81 11.01A1.3 1.3 0 0 1 2.54 8.75L8.07 8.17A0.6 0.6 0 0 0 8.55 7.81Z"/></symbol>
  <!-- NEW (concept): the printer's fist / manicule -- a guidebook mark,
       same family as the Baedeker star. Points right, at the order. -->
  <symbol id="g-fist" viewBox="0 0 34 20">
    <path fill="currentColor" d="M0 5.2h5.6v11.6H0z"/>
    <path fill="currentColor" d="M7 5.6c1.6-1.9 3.9-3 6.3-3.1l3.4 0.1c0.9 0 1.5 0.5 1.8 1.2L31 3.8c1.5 0 2.6 1.1 2.6 2.4S32.5 8.6 31 8.6H19.6v0.3c0 0.2 0 0 0 0H21c1.3 0 2.3 1 2.3 2.2S22.3 13.3 21 13.3h-0.6c1.1 0.2 1.9 1.1 1.9 2.1 0 1.2-1 2.1-2.2 2.1h-0.4c0.8 0.3 1.3 1 1.3 1.8 0 0.1 0 0.2 0 0.3H11.4C9.3 19.6 7 18 7 15.6z"/>
  </symbol>
</defs></svg>

<script>
/* ---- verbatim-ish ports from index.html (badgeHtml, renderCard) ---- */
const CATEGORY_COLORS = { restaurant:'#AC5019', cafe:'#6E4C22', bar:'#3D5A7A', attraction:'#A68018', nature:'#1E3A2B' };
const STAMP_TILTS = [-5, -3.5, -2, 2, 3.5, 5];
function stampTilt(id){ let h=0; for (const ch of String(id)) h=(h*31+ch.charCodeAt(0))|0; return STAMP_TILTS[Math.abs(h)%STAMP_TILTS.length]; }
function badgeHtml(category, size){
  const ink='currentColor', fill='var(--badge-field, #F2EBDD)', rim=2, c=size/2, r=c-rim/2;
  const shell=`<circle cx="${c}" cy="${c}" r="${r}" fill="${fill}" stroke="${ink}" stroke-width="${rim}"/>`;
  const field=size-rim*2, g=Math.min(field-2, Math.max(18, field-4)), o=(size-g)/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${shell}<svg x="${o}" y="${o}" width="${g}" height="${g}" viewBox="0 0 24 24"><use href="#g-${category}"/></svg></svg>`;
}
function cardHtml(loc){
  const cls=['location-card', loc.visited?'is-visited':'', loc.starred?'is-starred':''].join(' ');
  const stamp = loc.visited ? `<span class="row-stamp" style="--stamp-tilt:${stampTilt(loc.id)}deg" aria-hidden="true"><span class="row-stamp-ring"><span class="row-stamp-word">Visited</span></span></span>` : '';
  return `<div class="${cls}">
    <div class="row-badge" style="--row-ink:${CATEGORY_COLORS[loc.category]}">${badgeHtml(loc.category,24)}</div>
    <div class="row-main">${loc.starred?'<svg class="row-star" viewBox="0 0 24 24" aria-hidden="true"><use href="#g-star"/></svg>':''}
      <h3>${loc.name}</h3>
      <div class="row-meta">${loc.category} &middot; Reykjavík</div>
    </div>
    <div class="location-actions">${stamp}<button class="delete-btn" aria-label="Delete">&times;</button></div>
  </div>`;
}

/* ---- sample list: 8 Reykjavík places; `n` = created order (8 newest) ---- */
const LOCS = [
  { id:'a1', name:'Sky Lagoon',          category:'nature',     starred:true,  visited:false, n:3 },
  { id:'a2', name:'Fish Market',         category:'restaurant', starred:false, visited:false, n:7 },
  { id:'a3', name:'Kaffibarinn',         category:'bar',        starred:false, visited:false, n:6 },
  { id:'a4', name:'Reykjavík Roasters',  category:'cafe',       starred:false, visited:false, n:4 },
  { id:'a5', name:'Slippurinn',          category:'restaurant', starred:false, visited:false, n:8 },
  { id:'a6', name:'Brauð & Co',          category:'cafe',       starred:true,  visited:true,  n:5 },
  { id:'a7', name:'Hallgrímskirkja',     category:'attraction', starred:true,  visited:true,  n:1 },
  { id:'a8', name:'Harpa',               category:'attraction', starred:false, visited:true,  n:2 },
];
/* §6.1 keys: left = (visited, !starred, name); starred = 2b (!starred, visited, name); recent = created desc */
const by = (...ks) => (a,b) => { for (const k of ks){ const d=k(a)-k(b); if (d) return d; } return a.name.localeCompare(b.name); };
const SORTS = {
  left:    by(l=>+l.visited, l=>+!l.starred),
  starred: by(l=>+!l.starred, l=>+l.visited),
  recent:  (a,b)=>b.n-a.n,
};
const MODES = {
  left:    { word:"What’s left", byline:"What’s left first", tab:"What’s left", tag:"What’s left", rubric:"What’s left first" },
  starred: { word:"Starred", byline:"Starred first",     tab:"Starred",     tag:"Starred",     rubric:"Starred first" },
  recent:  { word:"Newest", byline:"Newest first",      tab:"Newest",      tag:"Newest",      rubric:"Newest first" },
};
const listHtml = mode => LOCS.slice().sort(SORTS[mode]).map(cardHtml).join('');

/* ---- header pieces, verbatim markup from index.html ---- */
const COLLAPSE = `<button class="collapseBtn" aria-label="Collapse list">▼</button>`;
const FILTERS = `<button class="toggleFiltersBtn" title="Toggle category filters"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="8" cy="6" r="2" fill="currentColor"/><circle cx="16" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="18" r="2" fill="currentColor"/></svg></button>`;
const CENTER = `<button class="centerMeBtn" aria-label="Center on me"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><line x1="12" y1="1" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="23"/><line x1="1" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="23" y2="12"/></svg></button>`;
const H2 = city => `<h2>${city} list (8)</h2>`;

/* ---- a stand-in basemap (the sandbox can't load tiles): sepia land, water, a few roads + seals ---- */
const MAP = `<svg class="map" viewBox="0 0 390 560" preserveAspectRatio="none" aria-hidden="true">
  <rect width="390" height="560" fill="#E7DECA"/>
  <path d="M0 0H390V70C330 92 290 60 240 84S150 130 90 110 20 120 0 140Z" fill="#C4D2CF"/>
  <g stroke="#F6F1E6" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M-10 190C80 170 160 210 260 180S360 150 400 170"/><path d="M60 120L120 330"/><path d="M200 90C210 160 190 230 230 330"/><path d="M300 110L340 330"/></g>
  <g stroke="#EFE7D6" stroke-width="2.5" fill="none"><path d="M0 240H390"/><path d="M150 100V330"/><path d="M30 290L380 220"/></g>
  ${[[110,160,'#1E3A2B'],[228,150,'#AC5019'],[176,222,'#3D5A7A'],[300,196,'#6E4C22'],[82,236,'#A68018']].map(([x,y,c])=>`<circle cx="${x}" cy="${y}" r="11" fill="#F2EBDD" stroke="${c}" stroke-width="2"/><circle cx="${x}" cy="${y}" r="4" fill="${c}"/>`).join('')}
</svg>`;

function frame(dir, mode, opts={}){
  const m = MODES[mode];
  let header, pre='', extra='', listTop='';
  if (dir==='A'){
    const st = opts.state ? ' is-'+opts.state : '';
    header = `${COLLAPSE}<div class="titleBlock">${H2('Reykjavík')}<button class="byline hitbox${st}" aria-label="List order: ${m.byline}. Tap to change."><span class="phrase"><span class="blank"><span class="word cur">${opts.word||m.word}</span>${opts.next?`<span class="word next">${MODES[opts.next].word}</span>`:''}</span> first</span></button></div>${FILTERS}${CENTER}`;
  } else if (dir==='B'){
    header = `${COLLAPSE}${H2('Reykjavík')}${FILTERS}${CENTER}`;
    pre = `<div class="tabs" role="tablist" aria-label="List order">${['left','starred','recent'].map(k=>`<button class="tab hitbox" role="tab" aria-selected="${k===mode}">${MODES[k].tab}</button>`).join('')}</div>`;
  } else if (dir==='C'){
    header = `${COLLAPSE}${H2(opts.city||'Reykjavík')}<button class="tag hitbox" aria-label="List order: ${m.tag}. Tap to change.">${m.tag}</button>${FILTERS}${CENTER}`;
  } else if (dir==='D'){
    header = `${COLLAPSE}${H2('Reykjavík')}${FILTERS}${CENTER}`;
    listTop = `<button class="rubric hitbox" aria-label="List order: ${m.rubric}. Tap to change."><span>Arranged &middot; <b>${m.rubric}</b></span></button>`;
  }
  return `<div class="phone dir${dir} ${opts.hit?'hit':''} ${opts.crop?'crop':''} ${opts.collapsed?'collapsed':''}">${MAP}${pre}
    <div class="locations"><div class="locationsHeader">${header}</div>
    <div class="locationsList">${listTop}${listHtml(opts.listMode||mode)}</div></div></div>`;
}
function cell(cap, sub, html){ return `<div class="cell"><p class="cap">${cap}</p><p class="sub">${sub}</p>${html}</div>`; }

const DIRS = {
  A: { name:'A · Byline', rest:'Header becomes a row: city name, and under it one quiet meta line; the order word is dotted-underlined. The byline (not the name) cycles.', change:'Tapped once: Starred first. The word flips; the name never changes. Band 68px.' },
  B: { name:'B · Index tabs', rest:'Ledger thumb-tabs standing on the sheet’s top edge, over the map. All three visible; tap picks.', change:'Starred tab picked; it joins the page.' },
  C: { name:'C · Luggage tag', rest:'A tag hung in the header’s icon row, naming the order. Tap cycles.', change:'Tapped once: Starred.' },
  D: { name:'D · Rubric', rest:'A printed caption heading the ledger, inside the list. Scrolls away with it. Tap cycles.', change:'Tapped once: Starred first.' },
};

/* THE FLIP (concept timing). Tap release -> old word folds away on its
   top-bottom axis (110ms, ease-in), the list reorders at the fold, the
   new word unfolds onto the dotted underline (150ms, ease-out). 260ms
   total. rev 3: no fist nudge; the underline takes the new word's width
   at the fold ("first" shifts with it -- smoothing that is execution).
   Reduced motion: 120ms crossfade, no rotation, no nudge. */
const FLIP = { OUT: 110, IN: 150, NUDGE: 260 };
function flip(btn, reduced){
  const cur = btn.querySelector('.word.cur'), nxt = btn.querySelector('.word.next');
  if (reduced) return [
    cur.animate([{opacity:1},{opacity:0}], {duration:120, fill:'forwards'}),
    nxt.animate([{opacity:0},{opacity:1}], {duration:120, fill:'both'}) ];
  return [
    cur.animate([{transform:'rotateX(0deg)', opacity:1},{transform:'rotateX(90deg)', opacity:.35}], {duration:FLIP.OUT, easing:'cubic-bezier(.55,0,.9,.45)', fill:'forwards'}),
    nxt.animate([{transform:'rotateX(-90deg)', opacity:.35},{transform:'rotateX(0deg)', opacity:1}], {duration:FLIP.IN, delay:FLIP.OUT, easing:'cubic-bezier(.15,.75,.3,1)', fill:'both'}) ];
}
window.flipLive = async () => {           // real-time run, sampled per rAF
  const btn = document.querySelector('.live .byline');
  const anims = flip(btn, false), t0 = performance.now(), samples = [];
  setTimeout(() => { btn.querySelector('.word.cur').style.visibility = 'hidden'; }, FLIP.OUT);   // fold: underline takes the new word's width
  let raf; const tick = () => { samples.push([+(performance.now()-t0).toFixed(1), getComputedStyle(btn.querySelector('.word.cur')).transform, getComputedStyle(btn.querySelector('.word.next')).transform]); raf = requestAnimationFrame(tick); };
  tick();
  await Promise.all(anims.map(a => a.finished));
  const end = performance.now() - t0; cancelAnimationFrame(raf);
  return { total_ms: +end.toFixed(1), frames: samples.length, first: samples.slice(0,3), last: samples.slice(-2) };
};

const view = new URLSearchParams(location.search).get('view') || 'film';
const root = document.getElementById('root');
if (DIRS[view]){
  const d = DIRS[view];
  root.innerHTML = `<div class="board">${cell(d.name+' — resting', d.rest, frame(view,'left'))}${cell(d.name+' — changed', d.change, frame(view,'starred'))}${cell(d.name+' — tap targets', 'Dashed magenta = hit area of the new control.', frame(view,'left',{hit:true}))}</div>`;
} else if (view==='film'){
  let h = `<div class="board grid"><div class="rowlabel">Resting · default order (What’s left)</div>`;
  for (const k of 'ABCD') h += cell(DIRS[k].name + (k==='A'?' — PICK':''), DIRS[k].rest, frame(k,'left'));
  h += `<div class="rowlabel">Changed · one tap / pick → Starred</div>`;
  for (const k of 'ABCD') h += cell(DIRS[k].name, DIRS[k].change, frame(k,'starred'));
  root.innerHTML = h + `</div>`;
} else if (view==='pick'){
  root.innerHTML = `<div class="board">
    ${cell('A · What’s left first (default)','Unvisited first, starred leading; done places sink.',frame('A','left'))}
    ${cell('A · tap → Starred first','Starred first, not-yet-done leading within them.',frame('A','starred'))}
    ${cell('A · tap → Newest first','Order added. One more tap returns to What’s left.',frame('A','recent'))}
    ${cell('A · hit zone','Byline only: from the name’s ink bottom to the band’s edge, 44px tall. The name is not the button.',frame('A','left',{hit:true}))}</div>`;
} else if (view==='flip'){
  const T = [0, 55, 100, 135, 180, 260];
  const lab = {0:'0 ms · press', 55:'55 ms · folding', 100:'100 ms · edge-on', 135:'135 ms · list reordered, unfolding', 180:'180 ms', 260:'260 ms · settled'};
  root.innerHTML = `<div class="board">${T.map(t=>cell(lab[t], '', frame('A','left',{crop:true, next:'starred', listMode: t>=FLIP.OUT?'starred':'left', state: t<100?'pressed':''}))).join('')}</div>`;
  document.querySelectorAll('.phone').forEach((ph,i)=>{ flip(ph.querySelector('.byline'), false).forEach(a=>{ a.pause(); a.currentTime = T[i]; }); if (T[i] >= FLIP.OUT) ph.querySelector('.word.cur').style.display = 'none'; });
} else if (view==='flipReduced'){
  const T = [0, 60, 120];
  root.innerHTML = `<div class="board">${T.map(t=>cell('reduced motion · '+t+' ms','',frame('A','left',{crop:true, next:'starred', listMode: t>=60?'starred':'left'}))).join('')}</div>`;
  document.querySelectorAll('.phone').forEach((ph,i)=>{ flip(ph.querySelector('.byline'), true).forEach(a=>{ a.pause(); a.currentTime = T[i]; }); if (T[i] >= 120) ph.querySelector('.word.cur').style.display = 'none'; });
} else if (view==='states'){
  root.innerHTML = `<div class="board">
    ${cell('Resting','',frame('A','left',{crop:true}))}
    ${cell('Pressed','Byline zone only; the name never presses.',frame('A','left',{crop:true, state:'pressed'}))}
    ${cell('Keyboard focus','Ring on the byline zone.',frame('A','left',{crop:true, state:'focus'}))}
    ${cell('Hit zone','From the name’s ink bottom to the band’s edge.',frame('A','left',{crop:true, hit:true}))}</div>`;
} else if (view==='labels'){
  root.innerHTML = `<div class="board">${["What’s left","Unvisited","Still to see"].map(w=>cell('Default label · “'+w+' first”','',frame('A','left',{crop:true, word:w}))).join('')}</div>`;
} else if (view==='collapsed'){
  root.innerHTML = `<div class="board">${cell('A · collapsed sheet','Band 68px on screen; byline visible and tappable (offset 300−68 = 232px).',frame('A','left',{collapsed:true}))}${cell('A · collapsed, hit zone','',frame('A','left',{collapsed:true, hit:true}))}</div>`;
} else if (view==='compare'){
  root.innerHTML = `<div class="board">${cell('A · Byline (pick)','Resting.',frame('A','left'))}${cell('B · Index tabs','Resting.',frame('B','left'))}${cell('D · Rubric','Resting.',frame('D','left'))}</div>`;
} else if (view==='live'){
  root.innerHTML = `<div class="board live">${frame('A','left',{next:'starred'})}</div>`;
} else if (view==='Cwide'){
  root.innerHTML = `<div class="board">${cell('C · longest real city','Copenhagen: the tag squeezes the city name.',frame('C','left',{city:'Copenhagen'}))}${cell('C · All cities','',frame('C','left',{city:'All cities'}))}</div>`;
}
</script>
</body>
</html>
