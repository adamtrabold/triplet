<!doctype html>
<!-- City CRUD v10 throwaway motion prototype (never the product). Swipe a city row LEFT: the row slides
     with your finger and the city's REMOVE board slides in from the right edge, its signpost point
     leading (standard trailing swipe-to-reveal). Past half the board's width it settles open; tap the
     board for the confirm; swipe right or tap elsewhere to close. The signpost above turns that city's
     board over to REMOVE while the row is open. Tokens copied from index.html. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swipe Reveal Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
  :root { --paper:#F2EBDD; --paper-raised:#FAF5EA; --paper-pressed:#DCD3C3; --navy:#12293F; --ink:#1A1A18; --ink-2:#5A564C; --hair:#D8CEBA; --open:132px; }
  html, body { margin:0; background:#C9D6D3; font-family:'Archivo', -apple-system, sans-serif; -webkit-tap-highlight-color:transparent; }
  .wrap { min-height:100vh; display:flex; flex-direction:column; justify-content:space-between; padding:16px; box-sizing:border-box; }
  .note { font-size:13px; line-height:18px; color:var(--navy); margin:0 0 12px; }
  /* the map's signpost: a navy pole, one board per city */
  .post { position:relative; margin:24px 0 0 120px; width:2px; background:var(--navy); padding:0; }
  .post .boards { position:relative; left:2px; display:flex; flex-direction:column; gap:10px; padding:0 0 18px; }
  .post::after { content:''; position:absolute; left:-3px; bottom:-4px; width:8px; height:8px; border-radius:50%; background:var(--navy); }
  .sign { position:relative; height:30px; width:150px; perspective:300px; }
  .sign .s { position:absolute; inset:0; display:flex; align-items:center; padding:0 22px 0 10px; backface-visibility:hidden; transition:transform 260ms cubic-bezier(.2,1.3,.4,1);
    font-stretch:75%; text-transform:uppercase; font-weight:700; font-size:12px; letter-spacing:.08em; color:var(--navy);
    clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); background:var(--navy); }
  .sign .s span { position:absolute; inset:1.5px 1.5px 1.5px 0; clip-path:inherit; background:var(--paper-raised); }
  .sign .s b { position:relative; font-weight:700; }
  .sign .s.back { transform:rotateX(180deg); color:var(--paper); justify-content:center; }
  .sign .s.back span { display:none; }
  .sign.flipped .s.front { transform:rotateX(-180deg); } .sign.flipped .s.back { transform:rotateX(0); }
  .sign.dim .s.front { color:var(--ink-2); }
  /* the menu */
  .menu { background:var(--paper-raised); border:1px solid var(--navy); box-shadow:4px 4px 0 var(--navy); max-width:340px; overflow:hidden; }
  .cap { height:24px; display:flex; align-items:center; padding:0 12px; border-bottom:1px solid var(--navy); font-stretch:75%; text-transform:uppercase; font-weight:700; font-size:10px; letter-spacing:.12em; color:var(--ink-2); }
  .row { position:relative; height:44px; border-bottom:1px solid var(--hair); overflow:hidden; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
  .front { position:absolute; inset:0; z-index:2; display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--paper-raised);
    font-stretch:75%; text-transform:uppercase; font-weight:700; font-size:13px; letter-spacing:.05em; color:var(--navy); will-change:transform; }
  .front small { font-size:11px; color:var(--ink-2); font-weight:600; }
  /* the reveal: the city's own board, point leading, sliding in from the right edge under the row */
  .clip { position:absolute; top:4px; bottom:4px; right:0; width:0; z-index:3; overflow:hidden; filter:drop-shadow(-2px 1px 2px rgba(26,26,24,.12)); }
  /* past the open width the board fills the clip, so only its left (point) edge stretches; never a gap at the right */
  .board { position:absolute; top:0; bottom:0; left:0; width:max(var(--open), 100%); display:flex; align-items:center; justify-content:center; padding-left:12px; box-sizing:border-box;
    background:var(--navy); color:var(--paper); clip-path:polygon(12px 0, 100% 0, 100% 100%, 12px 100%, 0 50%);
    font-stretch:75%; text-transform:uppercase; font-weight:700; font-size:12px; letter-spacing:.12em; border:none; }
  /* SNAP (owner: "the swipe should snap some"): open lands fast with a small overshoot (~6px past the
     detent, back in one beat); close is quicker and plain, no bounce. */
  .row.settle.to-open .front, .row.settle.to-open .clip { transition:transform 240ms cubic-bezier(.25,1.45,.45,1), width 240ms cubic-bezier(.25,1.45,.45,1); }
  .row.settle.to-shut .front, .row.settle.to-shut .clip { transition:transform 160ms cubic-bezier(.4,0,.2,1), width 160ms cubic-bezier(.4,0,.2,1); }
  @media (prefers-reduced-motion: reduce) { .row.settle .front, .row.settle .clip, .sign .s { transition:none; } }
  .confirm { padding:10px 12px 12px; border-bottom:1px solid var(--hair); font-size:14px; line-height:20px; color:var(--ink); }
  .confirm[hidden] { display:none; }
  .acts { display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
  .btn { font-family:inherit; font-stretch:75%; text-transform:uppercase; font-weight:700; font-size:12px; letter-spacing:.1em; padding:9px 12px; border-radius:3px; color:var(--navy); background:none; border:none; }
  .btn.go { box-shadow:inset 0 0 0 1px var(--hair); color:var(--ink-2); }
</style></head>
<body><div class="wrap">
  <div><p class="note">Swipe a city row to the left. Its REMOVE board slides in from the right; the signpost turns too. Tap the board for the confirm; swipe right or tap another row to close.</p>
    <div class="post"><div class="boards" id="boards"></div></div></div>
  <div class="menu" id="menu"><div class="cap">Places</div></div>
</div>
<script>
  const OPEN = 132, cities = [['Reykjavík', 23], ['Stockholm', 23], ['Copenhagen', 23], ['Malmö', 23], ['LA', 23]];
  const menu = document.getElementById('menu'), boards = document.getElementById('boards');
  const signs = {};
  cities.forEach(([n, c]) => {
    const s = document.createElement('div'); s.className = 'sign' + (n === 'Malmö' ? '' : ' dim');
    s.innerHTML = `<div class="s front"><span></span><b>${n} <small style="font-size:10px">${c}</small></b></div><div class="s back"><b>Remove</b></div>`;
    boards.appendChild(s); signs[n] = s;
    const r = document.createElement('div'); r.className = 'row'; r.dataset.name = n;
    r.setAttribute('role', 'button'); r.setAttribute('aria-label', `${n}, ${c}. Actions available: remove ${n}`);
    r.innerHTML = `<div class="clip"><button class="board" aria-label="Remove ${n}">Remove</button></div><div class="front">◉ ${n} <small>${c}</small></div>`;
    menu.appendChild(r);
    const cf = document.createElement('div'); cf.className = 'confirm'; cf.hidden = true;
    cf.innerHTML = `Remove ${n} from your cities? Its ${c} places move to a city you pick, or are removed too.<div class="acts"><button class="btn" data-x>Cancel</button><button class="btn go">Remove</button></div>`;
    menu.appendChild(cf);
    cf.querySelector('[data-x]').onclick = () => setOpen(r, false);
    r.querySelector('.board').onclick = e => { e.stopPropagation(); cf.hidden = false; };
    r.querySelector('.front').onclick = () => { if (r.dataset.open === '1') setOpen(r, false); else closeAll(); };
    let x0 = null, y0 = null, base = 0, locked = null, trail = [];
    r.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; base = r.dataset.open === '1' ? -OPEN : 0; locked = null; trail = []; r.classList.remove('settle', 'to-open', 'to-shut'); }, { passive: true });
    r.addEventListener('touchmove', e => {
      if (x0 == null) return;
      const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
      if (!locked && Math.hypot(dx, dy) > 10) locked = Math.abs(dx) > 2 * Math.abs(dy) ? 'x' : 'y';   // axis lock: the menu still scrolls
      if (locked === 'x') { if (e.cancelable) e.preventDefault(); setDrag(r, base + dx, true); }
      const now = performance.now(); trail.push([now, e.touches[0].clientX]); while (trail.length > 2 && now - trail[0][0] > VEL_WINDOW) trail.shift();
    }, { passive: false });
    r.addEventListener('touchend', () => {
      if (locked === 'x') {
        const cur = parseFloat(r.dataset.dx || 0);
        // velocity over the last VEL_WINDOW ms (px/ms, negative = leftward)
        const v = trail.length > 1 ? (trail[trail.length - 1][1] - trail[0][1]) / Math.max(1, trail[trail.length - 1][0] - trail[0][0]) : 0;
        // a flick decides on its own, from any position; otherwise 40% of the way decides, measured
        // from where the drag began (opening: 40% out; closing from open: 40% back)
        const open = Math.abs(v) >= FLICK_V ? v < 0 : base === 0 ? cur < -OPEN * OPEN_AT : cur < -OPEN * (1 - OPEN_AT);
        r.dataset.lastV = v.toFixed(2); setOpen(r, open);
      }
      x0 = null; locked = null;
    });
  });
  // the row follows the finger; past the board's width it resists (rubber band)
  const FLICK_V = 0.25, VEL_WINDOW = 80, OPEN_AT = 0.4, RUBBER = 0.2;
  function setDrag(r, x, dragging) {
    if (x > 0) x = 0;
    // the detent: past the open width the board resists hard, and a tick marks the moment you reach it
    if (dragging) { const past = x <= -OPEN; if (past && r.dataset.atDetent !== '1' && navigator.vibrate) navigator.vibrate(6); r.dataset.atDetent = past ? '1' : ''; }
    if (x < -OPEN) x = -OPEN - (-x - OPEN) * RUBBER;
    r.dataset.dx = x;
    // the row's name never moves (so you always see which city); only the board slides in over its end
    r.querySelector('.front').style.transform = `translateX(${Math.max(x, -16) * 0.5}px)`;
    r.querySelector('.clip').style.width = `${-x}px`;
    signs[r.dataset.name].classList.toggle('flipped', x < -OPEN * OPEN_AT);   // the signpost turns where the reveal would open
  }
  function setOpen(r, open) {
    if (open) closeAll(r);
    r.classList.remove('to-open', 'to-shut'); r.classList.add('settle', open ? 'to-open' : 'to-shut'); setDrag(r, open ? -OPEN : 0);
    const was = r.dataset.open === '1';
    r.dataset.open = open ? '1' : '';
    if (!open) r.nextElementSibling.hidden = true;
    // the landing tick: when the board lands open (at the settle's end), never on a close
    if (open && !was && navigator.vibrate) setTimeout(() => navigator.vibrate(10), 170);
  }
  function closeAll(except) { menu.querySelectorAll('.row').forEach(o => { if (o !== except && o.dataset.open === '1') setOpen(o, false); }); }
</script></body></html>
