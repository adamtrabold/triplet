<!doctype html>
<!-- City CRUD v9 throwaway motion prototype (never the product): swipe a city row left in the title
     menu; it flaps over like a split-flap departure board to REMOVE {CITY}; tap it for the confirm;
     swipe right or tap elsewhere to flap back. Open on a phone. Tokens copied from index.html. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swipe Flap Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
  :root { --paper:#F2EBDD; --paper-raised:#FAF5EA; --paper-pressed:#DCD3C3; --navy:#12293F; --ink:#1A1A18; --ink-2:#5A564C; --hair:#D8CEBA; }
  html, body { margin:0; background:#C9D6D3; font-family:'Archivo', -apple-system, sans-serif; -webkit-tap-highlight-color:transparent; }
  .wrap { min-height:100vh; display:flex; flex-direction:column; justify-content:flex-end; padding:16px; box-sizing:border-box; }
  .note { font-size:13px; line-height:18px; color:var(--navy); margin-bottom:12px; }
  .menu { background:var(--paper-raised); border:1px solid var(--navy); box-shadow:4px 4px 0 var(--navy); max-width:340px; }
  .cap { height:24px; display:flex; align-items:center; padding:0 12px; border-bottom:1px solid var(--navy); font-stretch:75%; text-transform:uppercase; font-weight:700; font-size:10px; letter-spacing:.12em; color:var(--ink-2); }
  .row { position:relative; height:44px; border-bottom:1px solid var(--hair); perspective:400px; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
  .face { position:absolute; inset:0; display:flex; align-items:center; gap:8px; padding:0 12px; font-stretch:75%; text-transform:uppercase; font-weight:700; font-size:13px; letter-spacing:.05em; color:var(--navy); background:var(--paper-raised); }
  .face small { font-size:11px; color:var(--ink-2); font-weight:600; }
  .back { background:var(--navy); color:var(--paper); justify-content:center; letter-spacing:.12em; }
  /* split-flap: the top half of the front falls forward over the hinge, revealing the back's top half;
     then the back's bottom half falls into place */
  .half { position:absolute; left:0; right:0; height:50%; overflow:hidden; backface-visibility:hidden; }
  .half .face { height:200%; }
  .top { top:0; } .bot { bottom:0; } .bot .face { top:-100%; }
  .flap-a { top:0; transform-origin:50% 100%; }
  .flap-b { bottom:0; transform-origin:50% 0; transform:rotateX(90deg); }
  .row.go .flap-a { animation:fa 180ms ease-in forwards; }
  .row.go .flap-b { animation:fb 200ms 170ms cubic-bezier(.2,1.4,.4,1) forwards; }
  .row.back-go .flap-a { animation:fa 180ms ease-in reverse both; animation-delay:170ms; }
  .row.back-go .flap-b { animation:fb 170ms ease-in reverse both; }
  @keyframes fa { from { transform:rotateX(0) } to { transform:rotateX(-90deg) } }
  @keyframes fb { from { transform:rotateX(90deg) } to { transform:rotateX(0) } }
  .row.on .under-top .face, .row.on .under-bot .face { }
  @media (prefers-reduced-motion: reduce) { .row.go .flap-a, .row.go .flap-b, .row.back-go .flap-a, .row.back-go .flap-b { animation-duration:1ms; animation-delay:0ms; } }
  .confirm { padding:10px 12px 12px; border-bottom:1px solid var(--hair); font-size:14px; line-height:20px; color:var(--ink); }
  .confirm[hidden] { display:none; }
  .acts { display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
  .btn { font-stretch:75%; text-transform:uppercase; font-weight:700; font-size:12px; letter-spacing:.1em; padding:9px 12px; border-radius:3px; color:var(--navy); background:none; border:none; }
  .btn.go { box-shadow:inset 0 0 0 1px var(--hair); color:var(--ink-2); }
</style></head>
<body><div class="wrap">
  <p class="note">Swipe a city row to the left. Tap the flipped row for the confirm; swipe right or tap another row to flip it back.</p>
  <div class="menu" id="menu"><div class="cap">Places</div></div>
</div>
<script>
  const cities = [['LA', 23], ['Reykjavík', 23], ['Copenhagen', 23], ['Malmö', 23], ['Stockholm', 23]];
  const menu = document.getElementById('menu');
  const front = (n, c) => `<div class="face">◉ ${n} <small>${c}</small></div>`;
  const back = n => `<div class="face back">Remove ${n}</div>`;
  cities.forEach(([n, c]) => {
    const r = document.createElement('div'); r.className = 'row'; r.dataset.name = n;
    r.setAttribute('role', 'button'); r.setAttribute('aria-label', `${n}. Actions: remove`);
    // layers: under (the back, both halves), the front's bottom half (static until flap-b covers it),
    // flap-a (the front's top half, falls), flap-b (the back's bottom half, falls into place)
    r.innerHTML = `<div class="half top under-top">${back(n)}</div><div class="half bot front-bot">${front(n, c)}</div>`
      + `<div class="half flap-a">${front(n, c)}</div><div class="half bot flap-b">${back(n)}</div>`;
    menu.appendChild(r);
    const cf = document.createElement('div'); cf.className = 'confirm'; cf.hidden = true;
    cf.innerHTML = `Remove ${n} from your cities? Its ${c} places move to a city you pick, or are removed too.<div class="acts"><button class="btn" data-x>Cancel</button><button class="btn go">Remove</button></div>`;
    menu.appendChild(cf);
    cf.querySelector('[data-x]').onclick = () => { cf.hidden = true; flip(r, false); };
    let x0 = null, y0 = null, locked = null;
    r.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; locked = null; }, { passive: true });
    r.addEventListener('touchmove', e => {
      const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
      if (!locked && Math.hypot(dx, dy) > 10) locked = Math.abs(dx) > 2 * Math.abs(dy) ? 'x' : 'y';   // axis lock: the menu still scrolls
      if (locked === 'x' && Math.abs(dx) > 48) { flip(r, dx < 0); x0 = null; locked = 'done'; }
    }, { passive: true });
    r.addEventListener('click', () => {
      if (r.classList.contains('on')) { cf.hidden = false; }
      else menu.querySelectorAll('.row.on').forEach(o => { flip(o, false); o.nextElementSibling.hidden = true; });
    });
  });
  function flip(r, on) {
    if (on === r.classList.contains('on')) return;
    r.classList.toggle('on', on);
    r.classList.remove('go', 'back-go'); void r.offsetWidth;
    r.classList.add(on ? 'go' : 'back-go');
    if (navigator.vibrate) navigator.vibrate(8);
    if (!on) r.nextElementSibling.hidden = true;
  }
</script></body></html>
